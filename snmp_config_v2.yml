The ansible-network-playbooks repo isn't local — I'll write the playbook directly based on what's already covered. Since `snmp_config.yml` and `snmp_config_v2.yml` exist, I'll write an SNMPv3 auth+priv configuration playbook, which is distinct from basic community-string SNMP.

---
# snmp_v3_config.yml
# Configures SNMPv3 users with SHA authentication and AES-128 encryption on
# Cisco IOS. Distinct from snmp_config.yml (v1/v2c communities) — this enforces
# message integrity, user authentication, and payload privacy per RFC 3414.
#
# Vault usage:
#   ansible-vault encrypt_string 'AuthP@ss!' --name 'vault_snmp_auth_password'
#   ansible-vault encrypt_string 'PrivP@ss!' --name 'vault_snmp_priv_password'
#
# Inventory example:
#   [core_switches]
#   sw-core-01 ansible_host=10.0.1.1
#   sw-core-02 ansible_host=10.0.1.2
#
#   [core_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user=netadmin
#   ansible_password={{ vault_device_password }}
#   ansible_become=yes
#   ansible_become_method=enable

- name: Configure SNMPv3 auth+priv security on Cisco IOS
  hosts: "{{ target_hosts | default('core_switches') }}"
  gather_facts: false
  vars:
    snmp_v3_group: "NETMON_GROUP"
    snmp_v3_user: "netmon_v3"
    snmp_auth_proto: "sha"
    snmp_auth_password: "{{ vault_snmp_auth_password }}"
    snmp_priv_proto: "aes 128"
    snmp_priv_password: "{{ vault_snmp_priv_password }}"
    snmp_trap_host: "10.0.100.50"
    snmp_location: "DC1-Row3-Rack12"
    snmp_contact: "noc@example.com"

  tasks:
    - name: Apply SNMPv3 configuration block
      block:
        - name: Create SNMPv3 group with priv security level
          cisco.ios.ios_config:
            lines:
              - "snmp-server group {{ snmp_v3_group }} v3 priv"
            match: line
          register: group_result
          retries: 2
          delay: 5
          until: group_result is not failed

        - name: Create SNMPv3 user with SHA auth and AES-128 priv
          cisco.ios.ios_config:
            lines:
              - >-
                snmp-server user {{ snmp_v3_user }} {{ snmp_v3_group }} v3
                auth {{ snmp_auth_proto }} {{ snmp_auth_password }}
                priv {{ snmp_priv_proto }} {{ snmp_priv_password }}
            match: line
          no_log: true
          register: user_result
          retries: 2
          delay: 5
          until: user_result is not failed

        - name: Set SNMP system location and contact
          cisco.ios.ios_config:
            lines:
              - "snmp-server location {{ snmp_location }}"
              - "snmp-server contact {{ snmp_contact }}"
            match: line

        - name: Configure SNMPv3 trap destination
          cisco.ios.ios_config:
            lines:
              - "snmp-server host {{ snmp_trap_host }} traps version 3 priv {{ snmp_v3_user }}"
            match: line
          register: trap_result
          retries: 2
          delay: 5
          until: trap_result is not failed

        - name: Enable link-state, config-change, and environment traps
          cisco.ios.ios_config:
            lines:
              - "snmp-server enable traps snmp linkdown linkup authentication"
              - "snmp-server enable traps config"
              - "snmp-server enable traps envmon"
            match: line

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "SNMPv3 config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Halt play on unrecoverable failure
          ansible.builtin.fail:
            msg: "Aborting — SNMPv3 configuration incomplete on {{ inventory_hostname }}"

    - name: Verify SNMPv3 user exists in running config
      cisco.ios.ios_command:
        commands:
          - "show snmp user {{ snmp_v3_user }}"
      register: snmp_verify
      failed_when: snmp_v3_user not in snmp_verify.stdout[0]

    - name: Display SNMPv3 user details
      ansible.builtin.debug:
        msg: "{{ snmp_verify.stdout_lines[0] }}"

    - name: Confirm trap host registration
      cisco.ios.ios_command:
        commands:
          - "show snmp host"
      register: trap_verify
      failed_when: snmp_trap_host not in trap_verify.stdout[0]

    - name: Display active SNMP trap hosts
      ansible.builtin.debug:
        msg: "{{ trap_verify.stdout_lines[0] }}