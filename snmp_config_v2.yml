---
# Ansible Playbook: SNMPv3 Security Configuration
# Configures SNMPv3 users, groups, and views on Cisco IOS/IOS-XE devices.
# Distinct from snmp_config.yml (v1/v2c community strings) and snmp_config_v2.yml.
#
# Credentials: store in Ansible Vault
#   ansible-vault encrypt_string 'password' --name 'ansible_password'
#
# Inventory example:
#   [routers]
#   core-rtr-01 ansible_host=10.0.0.1
#   core-rtr-02 ansible_host=10.0.0.2
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user=admin
#   ansible_password=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     ...
#   ansible_become=yes
#   ansible_become_method=enable

- name: Configure SNMPv3 users, groups, and views
  hosts: routers
  gather_facts: false

  vars:
    snmpv3_view_name: "RESTRICTED_VIEW"
    snmpv3_group_name: "OPS_GROUP"
    snmpv3_user_name: "nms_user"
    snmpv3_auth_protocol: "sha"
    snmpv3_priv_protocol: "aes 128"
    # Vault-encrypted secrets — reference via group_vars/routers/vault.yml
    snmpv3_auth_key: "{{ vault_snmpv3_auth_key }}"
    snmpv3_priv_key: "{{ vault_snmpv3_priv_key }}"
    snmpv3_contact: "netops@example.com"
    snmpv3_location: "DC1-Row3-Rack12"

  tasks:
    - name: Configure SNMP system info and restrict v1/v2c
      cisco.ios.ios_config:
        lines:
          - "snmp-server contact {{ snmpv3_contact }}"
          - "snmp-server location {{ snmpv3_location }}"
          - "no snmp-server community public"
          - "no snmp-server community private"
      register: snmp_system_result
      retries: 2
      delay: 5
      until: snmp_system_result is not failed

    - name: Configure SNMPv3 MIB view
      cisco.ios.ios_config:
        lines:
          - "snmp-server view {{ snmpv3_view_name }} internet included"
          - "snmp-server view {{ snmpv3_view_name }} internet.6.3.15 excluded"
          - "snmp-server view {{ snmpv3_view_name }} internet.6.3.16 excluded"
          - "snmp-server view {{ snmpv3_view_name }} internet.6.3.18 excluded"
      register: snmp_view_result

    - name: Configure SNMPv3 group with auth+priv requirement
      cisco.ios.ios_config:
        lines:
          - "snmp-server group {{ snmpv3_group_name }} v3 priv read {{ snmpv3_view_name }} write {{ snmpv3_view_name }}"
      register: snmp_group_result

    - name: Configure SNMPv3 user with auth and privacy
      cisco.ios.ios_config:
        lines:
          - "snmp-server user {{ snmpv3_user_name }} {{ snmpv3_group_name }} v3 auth {{ snmpv3_auth_protocol }} {{ snmpv3_auth_key }} priv {{ snmpv3_priv_protocol }} {{ snmpv3_priv_key }}"
      no_log: true
      register: snmp_user_result

    - name: Verify SNMPv3 configuration
      cisco.ios.ios_command:
        commands:
          - "show snmp user"
          - "show snmp group"
          - "show snmp view"
      register: snmp_verify
      failed_when: snmpv3_user_name not in snmp_verify.stdout[0]

    - name: Display SNMPv3 verification output
      ansible.builtin.debug:
        msg:
          - "=== SNMP Users ==="
          - "{{ snmp_verify.stdout[0] }}"
          - "=== SNMP Groups ==="
          - "{{ snmp_verify.stdout[1] }}