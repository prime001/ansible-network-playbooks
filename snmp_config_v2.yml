---
# Configures SNMP trap receivers, notification types, and inform reliability settings.
# Complements snmp_config.yml (community strings, contact, location) — does not repeat those.
# Credentials: vault_snmp_trap_community, vault_net_user, vault_net_password, vault_enable_password
#              stored in group_vars/all/vault.yml (ansible-vault encrypted).
#
# Inventory example:
#   [core_switches]
#   sw-core-01  ansible_host=10.0.1.10  ansible_network_os=ios
#   sw-core-02  ansible_host=10.0.1.11  ansible_network_os=ios
#
#   [distribution]
#   dist-sw-01  ansible_host=10.0.2.10  ansible_network_os=ios
#
#   [network:children]
#   core_switches
#   distribution
#
#   [network:vars]
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure SNMP Trap Receivers and Notification Types
  hosts: "{{ target_hosts | default('network') }}"
  gather_facts: false
  connection: network_cli

  vars:
    # vault_snmp_trap_community defined in group_vars/all/vault.yml
    snmp_trap_hosts:
      - host: "10.0.100.50"
        version: "2c"
        community: "{{ vault_snmp_trap_community }}"
      - host: "10.0.100.51"
        version: "2c"
        community: "{{ vault_snmp_trap_community }}"
    snmp_trap_source_iface: "Loopback0"
    snmp_enabled_traps:
      - "snmp authentication linkdown linkup coldstart warmstart"
      - "config"
      - "envmon temperature shutdown"
      - "syslog"
      - "ospf state-change"
    snmp_informs_retries: 3
    snmp_informs_timeout: 15

  tasks:
    - name: Configure SNMP trap source interface and queue depth
      block:
        - name: Set trap source interface and queue length
          cisco.ios.ios_config:
            lines:
              - "snmp-server trap-source {{ snmp_trap_source_iface }}"
              - "snmp-server queue-length 20"
          register: trap_source_cfg

      rescue:
        - name: Report trap source configuration failure
          ansible.builtin.debug:
            msg: "Trap source config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort on trap source failure
          ansible.builtin.fail:
            msg: "Halting: SNMP trap source could not be set on {{ inventory_hostname }}"

    - name: Configure SNMP trap destination hosts
      cisco.ios.ios_config:
        lines:
          - "snmp-server host {{ item.host }} version {{ item.version }} {{ item.community }}"
      loop: "{{ snmp_trap_hosts }}"
      register: trap_dest_result
      retries: 2
      delay: 5
      until: trap_dest_result is not failed

    - name: Enable SNMP notification trap types
      cisco.ios.ios_config:
        lines:
          - "snmp-server enable traps {{ item }}"
      loop: "{{ snmp_enabled_traps }}"

    - name: Configure SNMP inform reliability parameters
      cisco.ios.ios_config:
        lines:
          - "snmp-server informs retries {{ snmp_informs_retries }} timeout {{ snmp_informs_timeout }}"

    - name: Verify SNMP trap receiver configuration
      cisco.ios.ios_command:
        commands:
          - "show snmp host"
          - "show snmp trap"
      register: snmp_verify
      failed_when: >
        snmp_verify.stdout[0] | length == 0 or
        'error' in (snmp_verify.stdout[0] | lower)

    - name: Display trap host and notification type summary
      ansible.builtin.debug:
        msg:
          - "=== SNMP Trap Hosts: {{ inventory_hostname }} ==="
          - "{{ snmp_verify.stdout[0] }}"
          - "=== Active Trap Types: {{ inventory_hostname }} ==="
          - "{{ snmp_verify.stdout[1] }}"

    - name: Persist configuration to NVRAM
      cisco.ios.ios_config:
        save_when: modified
