---
# snmp_v3_hardening.yml
# Deploys SNMPv3 users/groups/views and removes insecure community strings
# Credentials sourced from Ansible Vault (see vault_vars below)
#
# Inventory example:
# [core_switches]
# sw-core-01 ansible_host=10.0.1.11
# sw-core-02 ansible_host=10.0.1.12
#
# [core_switches:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_user }}
# ansible_password={{ vault_net_pass }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_pass }}

- name: Deploy SNMPv3 hardened configuration with view/group restrictions
  hosts: core_switches
  gather_facts: false

  vars:
    snmp_location: "{{ vault_snmp_location | default('DC1-Row3-Rack12') }}"
    snmp_contact: "{{ vault_snmp_contact | default('noc@example.com') }}"
    snmp_v3_group: NOC_RO
    snmp_v3_view: NOC_VIEW
    snmp_trap_host: "{{ vault_snmp_trap_host | default('10.0.1.100') }}"
    snmp_acl_number: 98
    # vault_snmp_v3_user, vault_snmp_v3_auth, vault_snmp_v3_priv must exist in vault

  tasks:
    - name: Apply SNMPv3 configuration block
      block:
        - name: Set SNMP system information
          cisco.ios.ios_config:
            lines:
              - "snmp-server location {{ snmp_location }}"
              - "snmp-server contact {{ snmp_contact }}"
          register: snmp_sysinfo

        - name: Create restricted OID view (exclude credential MIBs)
          cisco.ios.ios_config:
            lines:
              - "snmp-server view {{ snmp_v3_view }} iso included"
              - "snmp-server view {{ snmp_v3_view }} snmpUsmMIB excluded"
              - "snmp-server view {{ snmp_v3_view }} snmpVacmMIB excluded"
              - "snmp-server view {{ snmp_v3_view }} snmpCommunityMIB excluded"
          register: snmp_view

        - name: Create SNMPv3 group enforcing auth and priv
          cisco.ios.ios_config:
            lines:
              - "snmp-server group {{ snmp_v3_group }} v3 priv read {{ snmp_v3_view }} access {{ snmp_acl_number }}"
          register: snmp_group

        - name: Create SNMPv3 user with SHA-256 auth and AES-128 priv
          cisco.ios.ios_config:
            lines:
              - "snmp-server user {{ vault_snmp_v3_user }} {{ snmp_v3_group }} v3 auth sha {{ vault_snmp_v3_auth }} priv aes 128 {{ vault_snmp_v3_priv }}"
          no_log: true
          register: snmp_user

        - name: Configure SNMPv3 trap destination and enable key trap types
          cisco.ios.ios_config:
            lines:
              - "snmp-server host {{ snmp_trap_host }} version 3 priv {{ vault_snmp_v3_user }}"
              - "snmp-server enable traps snmp authentication linkdown linkup coldstart"
              - "snmp-server enable traps config"
              - "snmp-server enable traps syslog"
          register: snmp_traps

        - name: Remove default insecure community strings
          cisco.ios.ios_config:
            lines:
              - "no snmp-server community public RO"
              - "no snmp-server community private RW"
          register: snmp_harden
          failed_when:
            - snmp_harden.failed is defined
            - snmp_harden.failed
            - "'Invalid input' not in (snmp_harden.msg | default(''))"

        - name: Verify SNMPv3 user appears in device config
          cisco.ios.ios_command:
            commands:
              - show snmp user
              - show snmp group
              - show snmp view
          retries: 3
          delay: 5
          register: snmp_verify
          no_log: true
          until: snmp_verify.stdout[0] is search(vault_snmp_v3_user)

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "SNMPv3 configuration failed on {{ inventory_hostname }}. Manual review required."

        - name: Fail play after rescue notification
          ansible.builtin.fail:
            msg: "Halting after SNMPv3 failure on {{ inventory_hostname }}"

    - name: Display configuration change summary
      ansible.builtin.debug:
        msg:
          - "Host          : {{ inventory_hostname }}"
          - "View changed  : {{ snmp_view.changed }}"
          - "Group changed : {{ snmp_group.changed }}"
          - "User changed  : {{ snmp_user.changed }}"
          - "Traps changed : {{ snmp_traps.changed }}"
          - "Hardened      : {{ snmp_harden.changed }}"
          - "SNMP groups   :"
          - "{{ snmp_verify.stdout[1] }}