---
# snmp_trap_config.yml
# Configures SNMP trap destinations, notification types, and trap source interface.
# Complements snmp_config.yml (community strings / polling) by managing the trap/event plane.
# Supports Cisco IOS/IOS-XE and NX-OS.
#
# Credentials are stored in Ansible Vault — encrypt with:
#   ansible-vault encrypt_string 'value' --name 'vault_net_password'
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1 ansible_network_os=ios
#   rtr-core-02 ansible_host=10.0.1.2 ansible_network_os=ios
#
#   [access_switches]
#   sw-access-01 ansible_host=10.0.2.1 ansible_network_os=nxos
#
#   [network_devices:children]
#   core_routers
#   access_switches
#
#   [network_devices:vars]
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable_secret }}

- name: Configure SNMP trap destinations and notification types
  hosts: network_devices
  gather_facts: false

  vars:
    # Vault-encrypted — never store plaintext credentials in playbooks
    snmp_trap_community: "{{ vault_snmp_trap_community }}"
    snmp_trap_version: "2c"
    snmp_trap_host: "10.100.0.50"
    snmp_source_interface: "Loopback0"

    ios_trap_notifications:
      - "bgp"
      - "config"
      - "cpu threshold"
      - "eigrp"
      - "ospf state-change"
      - "snmp linkdown"
      - "snmp linkup"
      - "syslog"

  tasks:
    - name: Confirm device is reachable before making changes
      ansible.netcommon.cli_command:
        command: show version
      register: pre_check
      retries: 3
      delay: 5
      until: pre_check is not failed

    - name: Apply SNMP trap configuration (IOS/IOS-XE)
      block:
        - name: Set trap host and source interface
          cisco.ios.ios_config:
            lines:
              - "snmp-server host {{ snmp_trap_host }} version {{ snmp_trap_version }} {{ snmp_trap_community }}"
              - "snmp-server trap-source {{ snmp_source_interface }}"
              - "snmp-server enable traps {{ item }}"
          loop: "{{ ios_trap_notifications }}"
          register: ios_trap_result

        - name: Verify trap host appears in running config
          cisco.ios.ios_command:
            commands:
              - show snmp host
              - show running-config | include snmp-server enable traps
          register: ios_verify
          failed_when: snmp_trap_host not in ios_verify.stdout[0]

        - name: Display trap configuration summary
          ansible.builtin.debug:
            msg:
              - "Host: {{ inventory_hostname }}"
              - "Trap receiver: {{ snmp_trap_host }}"
              - "Active traps: {{ ios_verify.stdout_lines[1] }}"

      rescue:
        - name: Report failure detail
          ansible.builtin.debug:
            msg: "IOS trap config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('see task output') }}"

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "SNMP trap configuration could not be applied to {{ inventory_hostname }}. Verify reachability and vault credentials."

      when: ansible_network_os == 'ios'

    - name: Apply SNMP trap configuration (NX-OS)
      block:
        - name: Set trap receiver and source interface
          cisco.nxos.nxos_config:
            lines:
              - "snmp-server host {{ snmp_trap_host }} traps version {{ snmp_trap_version }} {{ snmp_trap_community }}"
              - "snmp-server source-interface traps {{ snmp_source_interface }}"
              - "snmp-server enable traps bgp"
              - "snmp-server enable traps config"
              - "snmp-server enable traps link"
            match: exact
          register: nxos_trap_result

        - name: Verify NX-OS trap receiver
          cisco.nxos.nxos_command:
            commands:
              - show snmp host
          register: nxos_verify
          failed_when: snmp_trap_host not in nxos_verify.stdout[0]

        - name: Display NX-OS trap summary
          ansible.builtin.debug:
            msg:
              - "Host: {{ inventory_hostname }}"
              - "Trap receiver: {{ snmp_trap_host }}"
              - "SNMP host output: {{ nxos_verify.stdout_lines[0] }}"

      rescue:
        - name: Report NX-OS failure
          ansible.builtin.debug:
            msg: "NX-OS trap config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('see task output') }}"

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "SNMP trap configuration could not be applied to {{ inventory_hostname }}."

      when: ansible_network_os == 'nxos'