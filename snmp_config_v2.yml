```yaml
---
# BGP Neighbor Configuration and Validation
# Configures iBGP/eBGP peers on Cisco IOS devices and validates adjacency state.
#
# Inventory example (inventory/network.yml):
# ---
# all:
#   children:
#     routers:
#       hosts:
#         core-rtr-01:
#           ansible_host: 10.0.0.1
#           bgp_local_as: 65001
#           bgp_peers:
#             - neighbor_ip: 10.0.0.2
#               remote_as: 65001
#               description: "iBGP to core-rtr-02"
#               update_source: Loopback0
#             - neighbor_ip: 203.0.113.1
#               remote_as: 65100
#               description: "eBGP to upstream-isp"
#               password: "{{ vault_bgp_peer_password }}"
#         core-rtr-02:
#           ansible_host: 10.0.0.2
#           bgp_local_as: 65001
#           bgp_peers:
#             - neighbor_ip: 10.0.0.1
#               remote_as: 65001
#               description: "iBGP to core-rtr-01"
#               update_source: Loopback0
#
# Credentials stored in Ansible Vault — reference with:
#   ansible_user: "{{ vault_net_username }}"
#   ansible_password: "{{ vault_net_password }}"
#   ansible_become_password: "{{ vault_net_enable_password }}"

- name: Configure and validate BGP neighbors on Cisco IOS
  hosts: routers
  gather_facts: false
  connection: network_cli

  vars:
    ansible_network_os: ios
    # Credentials sourced from group_vars/all/vault.yml (ansible-vault encrypted)
    ansible_user: "{{ vault_net_username }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_net_enable_password }}"
    bgp_convergence_wait: 30

  tasks:
    - name: Apply BGP neighbor configuration
      block:
        - name: Configure BGP router process and neighbors
          cisco.ios.ios_config:
            lines:
              - "router bgp {{ bgp_local_as }}"
            parents: []
          register: bgp_process_result

        - name: Configure each BGP peer
          cisco.ios.ios_config:
            lines: "{{ bgp_peer_config_lines }}"
            parents: "router bgp {{ bgp_local_as }}"
          vars:
            bgp_peer_config_lines: >-
              {{
                bgp_peers | map(attribute='neighbor_ip') | map('regex_replace', '^(.*)$',
                  'neighbor \1 remote-as ' ) | zip(bgp_peers | map(attribute='remote_as'))
                | map('join') | list
                + bgp_peers | selectattr('description', 'defined')
                | map('community.general.dict_to_jinja2', 'neighbor {neighbor_ip} description {description}')
                | list
                + bgp_peers | selectattr('update_source', 'defined')
                | map('community.general.dict_to_jinja2', 'neighbor {neighbor_ip} update-source {update_source}')
                | list
                + bgp_peers | selectattr('password', 'defined')
                | map('community.general.dict_to_jinja2', 'neighbor {neighbor_ip} password {password}')
                | list
              }}
          loop: "{{ bgp_peers }}"
          loop_control:
            label: "{{ item.neighbor_ip }} (AS {{ item.remote_as }})"
          register: bgp_peer_results

        - name: Wait for BGP sessions to establish
          ansible.builtin.pause:
            seconds: "{{ bgp_convergence_wait }}"
          when: bgp_peer_results.changed

        - name: Check BGP neighbor summary
          cisco.ios.ios_command:
            commands:
              - show bgp summary
              - show bgp neighbors
            retries: 3
            interval: 10
            wait_for:
              - result[0] contains "Established"
          register: bgp_summary
          failed_when:
            - bgp_summary.failed is defined
            - bgp_summary.failed

        - name: Verify each peer reached Established state
          ansible.builtin.assert:
            that:
              - "'Established' in bgp_summary.stdout[0]"
            fail_msg: "BGP peers have not reached Established state on {{ inventory_hostname }}"
            success_msg: "All BGP peers are Established on {{ inventory_hostname }}"

      rescue:
        - name: Capture current BGP state on failure
          cisco.ios.ios_command:
            commands:
              - show bgp summary
              - show log | include BGP
          register: bgp_failure_state
          ignore_errors: true

        - name: Report BGP configuration failure
          ansible.builtin.debug:
            msg:
              - "BGP configuration failed on {{ inventory_hostname }}"
              - "BGP Summary: {{ bgp_failure_state.stdout[0] | default('unavailable') }}"
              - "Recent BGP log entries: {{ bgp_failure_state.stdout[1] | default('unavailable') }}"

        - name: Fail the play after collecting diagnostics
          ansible.builtin.fail:
            msg: "BGP neighbor configuration failed on {{ inventory_hostname }} — see debug output above"

    - name: Display BGP neighbor summary
      ansible.builtin.debug:
        msg: "{{ bgp_summary.stdout_lines[0] }}"

    - name: Save configuration if changes were made
      cisco.ios.ios_command:
        commands:
          - write memory
      when: bgp_peer_results.changed
      register: save_result

    - name: Confirm running config saved
      ansible.builtin.debug:
        msg: "Configuration saved on {{ inventory_hostname }}: {{ save_result.stdout[0] | default('no save needed') }}"
      when: bgp_peer_results.changed
```