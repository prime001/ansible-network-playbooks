---
# SNMP Trap Receiver and Notification Category Configuration
#
# Configures SNMP trap destinations, source interface, and per-category
# trap enables on Cisco IOS/IOS-XE devices. Designed to complement
# snmp_config.yml (community strings, version negotiation) — this playbook
# manages the trap forwarding pipeline as a separate concern.
#
# Usage:
#   ansible-playbook snmp_trap_config.yml -i inventory/network.yml --ask-vault-pass
#
# Inventory example (inventory/network.yml):
#   all:
#     children:
#       core_routers:
#         hosts:
#           core-rtr-01:
#             ansible_host: 10.0.0.1
#             ansible_network_os: ios
#             ansible_connection: network_cli
#             ansible_user: !vault |
#               $ANSIBLE_VAULT;1.1;AES256
#               ...
#             ansible_password: !vault |
#               $ANSIBLE_VAULT;1.1;AES256
#               ...

- name: Configure SNMP trap receivers and notification categories
  hosts: network_devices
  gather_facts: false

  vars:
    # Credentials stored in Ansible Vault — ansible-vault encrypt_string
    snmp_trap_community: "{{ vault_snmp_trap_community }}"
    snmp_trap_host: "10.0.1.100"
    snmp_trap_version: "2c"
    snmp_source_interface: "Loopback0"
    snmp_trap_categories:
      - config
      - bgp
      - "ospf state-change"
      - link
      - "cpu threshold"
      - memory

  tasks:
    - name: Configure SNMP trap destinations and notification enables
      block:
        - name: Apply trap receiver, source interface, and per-category enables
          cisco.ios.ios_config:
            lines:
              - "snmp-server host {{ snmp_trap_host }} version {{ snmp_trap_version }} {{ snmp_trap_community }}"
              - "snmp-server trap-source {{ snmp_source_interface }}"
              - "snmp-server enable traps {{ item }}"
            save_when: changed
          loop: "{{ snmp_trap_categories }}"
          register: trap_apply
          retries: 3
          delay: 5
          until: trap_apply is not failed

        - name: Verify trap receiver appears in running config
          cisco.ios.ios_command:
            commands:
              - show snmp host
              - show snmp trap
          register: snmp_trap_verify
          failed_when: snmp_trap_verify.stdout[0] is not search(snmp_trap_host)

        - name: Report trap configuration result
          ansible.builtin.debug:
            msg:
              - "Device       : {{ inventory_hostname }}"
              - "Trap receiver: {{ snmp_trap_host }} (SNMPv{{ snmp_trap_version }})"
              - "Source iface : {{ snmp_source_interface }}"
              - "Categories   : {{ snmp_trap_categories | join(', ') }}"
              - "Verification : {{ snmp_trap_verify.stdout[0] }}"

      rescue:
        - name: Log configuration failure details
          ansible.builtin.debug:
            msg: >-
              SNMP trap config failed on {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('see previous task output') }}

        - name: Remove partial trap host entry to prevent misconfiguration
          cisco.ios.ios_config:
            lines:
              - "no snmp-server host {{ snmp_trap_host }}"
          ignore_errors: true

        - name: Fail the host after cleanup
          ansible.builtin.fail:
            msg: "SNMP trap configuration was rolled back on {{ inventory_hostname }}.