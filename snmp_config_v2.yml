---
# snmp_trap_config.yml
# Configures SNMP trap destinations, notification types, and validates delivery
# on Cisco IOS/IOS-XE devices. Complements snmp_config.yml (community/v3 users)
# by focusing exclusively on trap host registration and notification tuning.
#
# Credentials: ansible-vault edit group_vars/all/vault.yml
#   vault_net_username, vault_net_password, vault_enable_password
#   vault_snmp_trap_community
#
# Inventory example:
#   [core]
#   core-sw-01 ansible_host=10.0.1.1
#   core-sw-02 ansible_host=10.0.1.2
#
#   [distribution]
#   dist-01 ansible_host=10.0.2.1
#
#   [network:children]
#   core
#   distribution
#
#   [network:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure SNMP Trap Destinations and Notification Types
  hosts: network
  gather_facts: false

  vars:
    snmp_trap_source_interface: "Loopback0"
    snmp_ifindex_persist: true

    snmp_trap_hosts:
      - host: "10.100.50.10"
        version: "2c"
        community: "{{ vault_snmp_trap_community }}"
      - host: "10.100.50.11"
        version: "2c"
        community: "{{ vault_snmp_trap_community }}"

    snmp_enabled_traps:
      - "snmp authentication"
      - "snmp linkdown"
      - "snmp linkup"
      - "snmp coldstart"
      - "bgp"
      - "ospf state-change"
      - "config"
      - "syslog"

  tasks:
    - name: Capture pre-change SNMP state
      cisco.ios.ios_command:
        commands:
          - show snmp host
          - show snmp
      register: pre_snmp_state
      retries: 2
      delay: 5

    - name: Apply SNMP trap configuration
      block:
        - name: Set trap source interface
          cisco.ios.ios_config:
            lines:
              - "snmp-server trap-source {{ snmp_trap_source_interface }}"
            save_when: never

        - name: Enable ifIndex persistence
          cisco.ios.ios_config:
            lines:
              - snmp-server ifindex persist
            save_when: never
          when: snmp_ifindex_persist

        - name: Register SNMP trap destinations
          cisco.ios.ios_config:
            lines:
              - "snmp-server host {{ item.host }} traps version {{ item.version }} {{ item.community }}"
            save_when: never
          loop: "{{ snmp_trap_hosts }}"
          register: trap_host_results

        - name: Enable SNMP notification types
          cisco.ios.ios_config:
            lines:
              - "snmp-server enable traps {{ item }}"
            save_when: never
          loop: "{{ snmp_enabled_traps }}"

        - name: Write configuration to NVRAM
          cisco.ios.ios_config:
            save_when: always
          register: save_result

      rescue:
        - name: Collect diagnostics on failure
          cisco.ios.ios_command:
            commands:
              - show logging last 30
              - show snmp host
          register: failure_diag
          ignore_errors: true

        - name: Display failure diagnostics
          ansible.builtin.debug:
            var: failure_diag.stdout_lines

        - name: Abort with context
          ansible.builtin.fail:
            msg: "SNMP trap configuration failed on {{ inventory_hostname }} — review diagnostics above"

    - name: Verify trap hosts registered in running config
      cisco.ios.ios_command:
        commands:
          - show snmp host
          - show running-config | include snmp-server host
      register: snmp_verify
      retries: 2
      delay: 3

    - name: Assert each trap host is present
      ansible.builtin.assert:
        that:
          - item.host in snmp_verify.stdout[0]
        fail_msg: "Trap host {{ item.host }} missing from 'show snmp host' on {{ inventory_hostname }}"
        success_msg: "Trap host {{ item.host }} confirmed on {{ inventory_hostname }}"
      loop: "{{ snmp_trap_hosts }}"

    - name: Report SNMP trap configuration summary
      ansible.builtin.debug:
        msg:
          - "Device      : {{ inventory_hostname }}"
          - "Trap source : {{ snmp_trap_source_interface }}"
          - "Trap hosts  : {{ snmp_trap_hosts | map(attribute='host') | list }}"
          - "Config saved: {{ save_result.changed }}