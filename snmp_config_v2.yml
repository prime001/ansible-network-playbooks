---
# Ansible Playbook: SNMPv3 USM Configuration
# Configures SNMPv3 users (USM), views, and groups on Cisco IOS devices.
# Distinct from snmp_config.yml (community strings) and snmp_config_v2.yml.
#
# Inventory example:
#   [core_switches]
#   sw-core-01 ansible_host=10.0.1.1
#   sw-core-02 ansible_host=10.0.1.2
#
#   [core_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}       # ansible-vault encrypted
#   ansible_password={{ vault_net_pass }}   # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_pass }}

- name: Configure SNMPv3 USM users, views, and groups on Cisco IOS
  hosts: core_switches
  gather_facts: false

  vars:
    snmpv3_views:
      - name: MGMT_VIEW
        oid: "1.3.6.1"
        included: true
      - name: MGMT_VIEW
        oid: "1.3.6.1.6.3"
        included: false

    snmpv3_groups:
      - name: NETOPS_GROUP
        security_model: v3
        security_level: priv
        read_view: MGMT_VIEW

    snmpv3_users:
      - name: netops_monitor
        group: NETOPS_GROUP
        auth_proto: sha
        auth_key: "{{ vault_snmp_auth_key }}"   # ansible-vault encrypted
        priv_proto: aes
        priv_key: "{{ vault_snmp_priv_key }}"   # ansible-vault encrypted
        acl: SNMP_ACL

  tasks:
    - name: Configure SNMPv3 MIB views
      cisco.ios.ios_config:
        lines:
          - "snmp-server view {{ item.name }} {{ item.oid }} {{ 'included' if item.included else 'excluded' }}"
      loop: "{{ snmpv3_views }}"
      register: view_result
      retries: 2
      delay: 5
      until: view_result is not failed

    - name: Configure SNMPv3 groups
      cisco.ios.ios_config:
        lines:
          - >-
            snmp-server group {{ item.name }} {{ item.security_model }}
            {{ item.security_level }} read {{ item.read_view }}
      loop: "{{ snmpv3_groups }}"
      register: group_result
      retries: 2
      delay: 5
      until: group_result is not failed

    - name: Configure SNMPv3 users
      block:
        - name: Apply SNMPv3 user config
          cisco.ios.ios_config:
            lines:
              - >-
                snmp-server user {{ item.name }} {{ item.group }} v3
                auth {{ item.auth_proto }} {{ item.auth_key }}
                priv {{ item.priv_proto }} {{ item.priv_key }}
                access {{ item.acl }}
          loop: "{{ snmpv3_users }}"
          register: user_result
          no_log: true

      rescue:
        - name: Log SNMPv3 user config failure
          ansible.builtin.debug:
            msg: "SNMPv3 user configuration failed on {{ inventory_hostname }} — check auth/priv key vault vars"

        - name: Fail with clear message
          ansible.builtin.fail:
            msg: "Aborting: SNMPv3 user config could not be applied on {{ inventory_hostname }}"

    - name: Verify SNMPv3 users are present
      cisco.ios.ios_command:
        commands:
          - show snmp user
          - show snmp group
      register: snmp_verify
      failed_when: >
        snmp_verify.stdout[0] is not search(snmpv3_users[0].name)

    - name: Display SNMPv3 verification output
      ansible.builtin.debug:
        msg:
          - "=== SNMP Users ==="
          - "{{ snmp_verify.stdout[0] }}"
          - "=== SNMP Groups ==="
          - "{{ snmp_verify.stdout[1] }}