---
# SNMP Trap Configuration Playbook
# Configures SNMP trap destinations and notification settings on Cisco IOS devices.
# Complements snmp_config.yml (community/polling) with full trap receiver setup.
#
# Inventory example:
#   [core_routers]
#   core-rtr-01 ansible_host=10.0.0.1
#   core-rtr-02 ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#
# Vault: ansible-vault encrypt_string '<secret>' --name 'vault_net_password'

- name: Configure SNMP trap destinations and notification types
  hosts: core_routers
  gather_facts: false

  vars:
    snmp_trap_version: "2c"
    snmp_trap_community: "{{ vault_snmp_trap_community | default('trap-string') }}"
    snmp_trap_servers:
      - host: "10.0.10.50"
        vrf: "MGMT"
      - host: "10.0.10.51"
        vrf: "MGMT"
    snmp_source_interface: "Loopback0"
    snmp_trap_types:
      - "bgp"
      - "ospf state-change"
      - "config"
      - "cpu threshold"
      - "envmon"
      - "hsrp"
      - "interface"
      - "syslog"

  tasks:
    - name: Apply SNMP trap configuration block
      block:
        - name: Configure trap source interface and global trap settings
          cisco.ios.ios_config:
            lines:
              - "snmp-server trap-source {{ snmp_source_interface }}"
              - "snmp-server enable traps"
            match: line
          register: trap_global_result
          retries: 2
          delay: 5
          until: trap_global_result is not failed

        - name: Configure individual trap notification types
          cisco.ios.ios_config:
            lines:
              - "snmp-server enable traps {{ item }}"
            match: line
          loop: "{{ snmp_trap_types }}"
          register: trap_types_result

        - name: Configure SNMP trap receiver hosts
          cisco.ios.ios_config:
            lines:
              - "snmp-server host {{ item.host }} vrf {{ item.vrf }} version {{ snmp_trap_version }} {{ snmp_trap_community }}"
            match: line
          loop: "{{ snmp_trap_servers }}"
          register: trap_hosts_result
          retries: 2
          delay: 5
          until: trap_hosts_result is not failed

        - name: Verify SNMP trap configuration was applied
          cisco.ios.ios_command:
            commands:
              - "show snmp host"
              - "show snmp trap"
          register: snmp_verify
          failed_when: >
            snmp_verify.stdout[0] | length == 0 or
            'No SNMP' in snmp_verify.stdout[0]

        - name: Display SNMP trap configuration summary
          ansible.builtin.debug:
            msg:
              - "Host: {{ inventory_hostname }}"
              - "Trap hosts configured:"
              - "{{ snmp_verify.stdout[0] }}"

      rescue:
        - name: Log trap configuration failure
          ansible.builtin.debug:
            msg: "SNMP trap configuration failed on {{ inventory_hostname }} — manual review required"

        - name: Capture current SNMP state for diagnostics
          cisco.ios.ios_command:
            commands:
              - "show snmp"
              - "show run | section snmp"
          register: snmp_diag
          ignore_errors: true

        - name: Display diagnostic output
          ansible.builtin.debug:
            var: snmp_diag.stdout_lines

        - name: Fail task after rescue diagnostics
          ansible.builtin.fail:
            msg: "SNMP trap configuration unsuccessful on {{ inventory_hostname }}