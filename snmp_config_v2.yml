---
# snmp_trap_config.yml
# Configures SNMP trap destinations, source-interface binding, and notification
# categories. Complements snmp_config.yml (community strings / views) by handling
# trap delivery separately — avoids re-deploying community config on routine
# trap-receiver changes.
#
# Usage: ansible-playbook snmp_trap_config.yml -i inventory.ini --vault-id @prompt
#
# Inventory example:
# [network_devices]
# core-rtr1  ansible_host=10.0.0.1
# dist-sw1   ansible_host=10.0.0.2
#
# [network_devices:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_user }}
# ansible_password={{ vault_net_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Configure SNMP Trap Destinations and Notification Types
  hosts: network_devices
  gather_facts: false
  vars:
    # Credentials sourced from vault — never store plaintext community strings
    # ansible-vault encrypt_string 'secretstring' --name vault_trap_community
    trap_community: "{{ vault_trap_community | default('public') }}"
    trap_receivers:
      - host: "10.10.50.10"
        version: "2c"
      - host: "10.10.50.11"
        version: "2c"
    trap_source_interface: "Loopback0"
    trap_categories:
      - "snmp linkdown linkup coldstart"
      - "config"
      - "envmon"
      - "syslog"
    config_retries: 3
    config_retry_delay: 5

  tasks:
    - name: Apply SNMP trap configuration
      block:
        - name: Configure SNMP trap receiver hosts
          cisco.ios.ios_config:
            lines:
              - "snmp-server host {{ item.host }} version {{ item.version }} {{ trap_community }}"
            match: line
          loop: "{{ trap_receivers }}"
          register: trap_host_result
          retries: "{{ config_retries }}"
          delay: "{{ config_retry_delay }}"
          until: trap_host_result is not failed

        - name: Bind SNMP traps to source interface
          cisco.ios.ios_config:
            lines:
              - "snmp-server trap-source {{ trap_source_interface }}"
          register: trap_source_result

        - name: Enable SNMP notification categories
          cisco.ios.ios_config:
            lines:
              - "snmp-server enable traps {{ item }}"
          loop: "{{ trap_categories }}"

        - name: Verify SNMP trap configuration
          cisco.ios.ios_command:
            commands:
              - "show snmp host"
              - "show snmp trap"
          register: snmp_verify
          failed_when:
            - snmp_verify.stdout[0] is not defined or snmp_verify.stdout[0] | length == 0

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              SNMP trap config failed on {{ inventory_hostname }}.
              Failed task: {{ ansible_failed_task.name }}.
              Error: {{ ansible_failed_result.msg | default('No error detail available') }}

        - name: Abort play for failed host
          ansible.builtin.fail:
            msg: "SNMP trap configuration incomplete on {{ inventory_hostname }} — manual review required."

    - name: Display SNMP trap verification summary
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} SNMP Trap Summary ==="
          - "Trap receivers : {{ trap_receivers | map(attribute='host') | join(', ') }}"
          - "Source interface: {{ trap_source_interface }}"
          - "--- show snmp host ---"
          - "{{ snmp_verify.stdout[0] }}"
          - "--- show snmp trap ---"
          - "{{ snmp_verify.stdout[1] }}