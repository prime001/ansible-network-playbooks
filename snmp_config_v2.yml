---
# snmp_v3_hardening.yml
#
# Migrates devices from legacy SNMPv1/v2c community strings to SNMPv3
# authPriv (SHA + AES-128). Fills the gap left by snmp_config.yml
# (community-based v1/v2c) and snmp_config_v2.yml (location/contact
# metadata). Targets IOS/IOS-XE; adjust module namespace for NX-OS.
#
# Vault keys expected in group_vars/all/vault.yml:
#   vault_snmp_auth_password  (min 8 chars, SHA auth)
#   vault_snmp_priv_password  (min 8 chars, AES-128 priv)
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.0.1  ansible_network_os=ios
#   rtr-core-02  ansible_host=10.0.0.2  ansible_network_os=ios
#
#   [core_routers:vars]
#   ansible_user=netops
#   ansible_password={{ vault_device_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Harden SNMP - replace legacy communities with SNMPv3 authPriv users
  hosts: "{{ target_hosts | default('core_routers') }}"
  gather_facts: false
  connection: network_cli

  vars:
    snmp_v3_user: "nmsuser"
    snmp_group_name: "MGMT_GROUP"
    snmp_view_name: "MGMT_VIEW"
    snmp_acl_name: "ACL_SNMP_MGMT"
    snmp_auth_algo: sha
    snmp_priv_algo: aes 128
    snmp_auth_password: "{{ vault_snmp_auth_password }}"
    snmp_priv_password: "{{ vault_snmp_priv_password }}"
    legacy_communities:
      - public
      - private
      - community

  tasks:
    - name: Remove legacy SNMPv1/v2c community strings
      block:
        - name: Delete insecure community strings
          cisco.ios.ios_config:
            lines:
              - "no snmp-server community {{ item }} RO"
              - "no snmp-server community {{ item }} RW"
          loop: "{{ legacy_communities }}"
          register: community_removal

        - name: Create SNMPv3 MIB view
          cisco.ios.ios_config:
            lines:
              - "snmp-server view {{ snmp_view_name }} iso included"
          register: view_result

        - name: Create SNMPv3 group with authPriv and ACL
          cisco.ios.ios_config:
            lines:
              - "snmp-server group {{ snmp_group_name }} v3 priv read {{ snmp_view_name }} access {{ snmp_acl_name }}"
          register: group_result
          failed_when:
            - group_result.failed is defined
            - group_result.failed

        - name: Create SNMPv3 user with SHA auth and AES-128 privacy
          cisco.ios.ios_config:
            lines:
              - "snmp-server user {{ snmp_v3_user }} {{ snmp_group_name }} v3 auth {{ snmp_auth_algo }} {{ snmp_auth_password }} priv {{ snmp_priv_algo }} {{ snmp_priv_password }}"
          no_log: true
          register: user_result

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "SNMPv3 hardening FAILED on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "SNMPv3 hardening could not complete on {{ inventory_hostname }}. Manual review required."

    - name: Verify SNMPv3 user and group presence
      cisco.ios.ios_command:
        commands:
          - show snmp user
          - show snmp group
      register: snmp_verify
      retries: 3
      delay: 5
      until: snmp_verify.stdout[0] is search(snmp_v3_user)
      failed_when: snmp_verify.stdout[0] is not search(snmp_v3_user)

    - name: Display SNMPv3 hardening result
      ansible.builtin.debug:
        msg:
          - "Host         : {{ inventory_hostname }}"
          - "SNMPv3 user  : {{ snmp_v3_user }} — {{ 'PRESENT' if snmp_verify.stdout[0] is search(snmp_v3_user) else 'MISSING' }}"
          - "SNMPv3 group : {{ snmp_group_name }} — {{ 'PRESENT' if snmp_verify.stdout[1] is search(snmp_group_name) else 'MISSING' }}"
          - "Legacy communities targeted for removal: {{ legacy_communities | join(', ') }}