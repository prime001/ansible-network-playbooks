---
# snmp_v3_hardening.yml
#
# Hardens SNMP by deploying SNMPv3 auth/priv users and removing insecure
# SNMPv1/v2c community strings. Distinct from snmp_config.yml (community
# string setup) — this playbook enforces USM-based security per CIS/NIST.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_pass }}
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }}
#
# Vault: ansible-vault encrypt group_vars/all/vault.yml

- name: Harden SNMP — deploy SNMPv3 auth/priv and remove community strings
  hosts: "{{ target_hosts | default('network_devices') }}"
  gather_facts: false

  vars:
    snmp_v3_group: NOC_MONITOR
    snmp_v3_view: MGMT_VIEW
    snmp_v3_user: noc_poller
    snmp_auth_proto: sha
    snmp_priv_proto: "aes 128"
    # All four vars below must exist in vault — never set defaults for secrets
    snmp_auth_pass: "{{ vault_snmp_auth_pass }}"
    snmp_priv_pass: "{{ vault_snmp_priv_pass }}"
    legacy_communities:
      - public
      - private

  tasks:
    - name: Configure SNMPv3 view, group, and user
      block:
        - name: Push SNMPv3 MIB view and group
          cisco.ios.ios_config:
            lines:
              - "snmp-server view {{ snmp_v3_view }} iso included"
              - "snmp-server group {{ snmp_v3_group }} v3 priv read {{ snmp_v3_view }}"
          register: snmp_group_result
          retries: 2
          delay: 5
          until: snmp_group_result is not failed

        - name: Create SNMPv3 user with auth and priv
          cisco.ios.ios_config:
            lines:
              - "snmp-server user {{ snmp_v3_user }} {{ snmp_v3_group }} v3 auth {{ snmp_auth_proto }} {{ snmp_auth_pass }} priv {{ snmp_priv_proto }} {{ snmp_priv_pass }}"
          register: snmp_user_result
          no_log: true

        - name: Remove legacy SNMPv1/v2c community strings
          cisco.ios.ios_config:
            lines:
              - "no snmp-server community {{ item }}"
          loop: "{{ legacy_communities }}"
          register: community_removal
          ignore_errors: true

        - name: Verify SNMPv3 group and user presence
          cisco.ios.ios_command:
            commands:
              - show snmp group
              - show snmp user
          register: snmp_verify
          failed_when: snmp_v3_group not in snmp_verify.stdout[0]

        - name: Display SNMPv3 verification output
          ansible.builtin.debug:
            msg:
              - "SNMP group table: {{ snmp_verify.stdout_lines[0] }}"
              - "SNMP user table:  {{ snmp_verify.stdout_lines[1] }}"

      rescue:
        - name: Log failure details
          ansible.builtin.debug:
            msg: >
              SNMPv3 hardening failed on {{ inventory_hostname }}.
              Group config result: {{ snmp_group_result | default('not reached') }}
              Verify stdout: {{ snmp_verify.stdout | default('not reached') }}

        - name: Fail with descriptive message
          ansible.builtin.fail:
            msg: "SNMPv3 hardening failed on {{ inventory_hostname }} — manual review required.