---
# 026_snmp_config.yml
#
# SNMP v3 Hardening and Trap Destination Enforcement
# Configures SNMPv3 users with auth/priv, removes legacy v1/v2c communities,
# and sets trap destinations with retry logic across IOS/IOS-XE devices.
#
# Inventory example:
# [network_devices]
# core-sw-01 ansible_host=10.0.1.1 ansible_network_os=ios
# dist-sw-01 ansible_host=10.0.1.2 ansible_network_os=ios
# edge-rtr-01 ansible_host=10.0.2.1 ansible_network_os=ios
#
# [network_devices:vars]
# ansible_connection=network_cli
# ansible_user={{ vault_net_user }}           # ansible-vault encrypted
# ansible_password={{ vault_net_password }}   # ansible-vault encrypted
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Enforce SNMPv3 hardening and trap destinations on IOS/IOS-XE
  hosts: network_devices
  gather_facts: false
  vars:
    snmp_v3_group: NMS_RO_GROUP
    snmp_v3_user: "{{ vault_snmp_user | default('nms_monitor') }}"
    snmp_v3_auth_pass: "{{ vault_snmp_auth_pass }}"   # ansible-vault required
    snmp_v3_priv_pass: "{{ vault_snmp_priv_pass }}"   # ansible-vault required
    snmp_trap_host: 10.10.1.50
    snmp_trap_port: 162
    snmp_location: "DC1-Row3-Rack5"
    snmp_contact: "noc@example.com"
    legacy_communities:
      - public
      - private
      - community

  tasks:
    - name: Remove legacy SNMPv1/v2c community strings
      cisco.ios.ios_config:
        lines:
          - "no snmp-server community {{ item }} RO"
          - "no snmp-server community {{ item }} RW"
      loop: "{{ legacy_communities }}"
      register: community_removal
      retries: 2
      delay: 5
      until: community_removal is not failed
      ignore_errors: true

    - name: Configure SNMPv3 group with read-only access
      cisco.ios.ios_config:
        lines:
          - "snmp-server group {{ snmp_v3_group }} v3 priv read iso"
        match: exact
      register: snmp_group_result
      failed_when:
        - snmp_group_result is failed
        - "'already exists' not in (snmp_group_result.msg | default(''))"

    - name: Configure SNMPv3 user with SHA auth and AES128 privacy
      cisco.ios.ios_config:
        lines:
          - >-
            snmp-server user {{ snmp_v3_user }} {{ snmp_v3_group }}
            v3 auth sha {{ snmp_v3_auth_pass }}
            priv aes 128 {{ snmp_v3_priv_pass }}
      no_log: true
      register: snmp_user_result
      retries: 2
      delay: 5
      until: snmp_user_result is not failed

    - name: Set SNMP system location and contact
      cisco.ios.ios_config:
        lines:
          - "snmp-server location {{ snmp_location }}"
          - "snmp-server contact {{ snmp_contact }}"

    - name: Configure SNMPv3 trap destination
      cisco.ios.ios_config:
        lines:
          - >-
            snmp-server host {{ snmp_trap_host }} traps version 3
            priv {{ snmp_v3_user }}
      register: trap_dest_result
      retries: 3
      delay: 10
      until: trap_dest_result is not failed

    - name: Enable relevant SNMP trap categories
      cisco.ios.ios_config:
        lines:
          - snmp-server enable traps snmp linkdown linkup
          - snmp-server enable traps config
          - snmp-server enable traps envmon
          - snmp-server enable traps bgp

    - name: Verify SNMP configuration applied
      cisco.ios.ios_command:
        commands:
          - show snmp user
          - show snmp group
          - show snmp host
      register: snmp_verify
      retries: 2
      delay: 5
      until: snmp_verify is not failed

    - name: Display SNMP verification output
      debug:
        msg: "{{ snmp_verify.stdout_lines }}"

    - block:
        - name: Confirm SNMPv3 user is present in output
          assert:
            that:
              - snmp_v3_user in snmp_verify.stdout[0]
            fail_msg: "SNMPv3 user {{ snmp_v3_user }} not found — manual review required"
            success_msg: "SNMPv3 user {{ snmp_v3_user }} confirmed on {{ inventory_hostname }}"
      rescue:
        - name: Log assertion failure for remediation
          debug:
            msg: >
              WARNING: SNMP assertion failed on {{ inventory_hostname }}.
              Review 'show snmp user' output manually.
              Raw output: {{ snmp_verify.stdout[0] }}