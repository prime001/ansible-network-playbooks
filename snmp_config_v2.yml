---
# snmp_config_v3.yml
# Configures SNMPv3 USM (User-Based Security Model) on Cisco IOS devices.
# Covers engine ID, views, groups, users, and trap receivers — distinct from
# the community-string approach in snmp_config.yml / snmp_config_v2.yml.
#
# Credentials: store ansible_user / ansible_password / ansible_become_password
# in an Ansible Vault file and reference with --vault-password-file or
# --ask-vault-pass at runtime.
#
# Inventory example (inventory/network.yml):
# ---
# all:
#   children:
#     ios_devices:
#       hosts:
#         core-sw-01:
#           ansible_host: 10.0.0.1
#         dist-rtr-01:
#           ansible_host: 10.0.0.2
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_net_user }}"
#         ansible_password: "{{ vault_net_password }}"
#         ansible_become: true
#         ansible_become_method: enable
#         ansible_become_password: "{{ vault_enable_password }}"
#         snmpv3_auth_password: "{{ vault_snmpv3_auth }}"
#         snmpv3_priv_password: "{{ vault_snmpv3_priv }}"

- name: Configure SNMPv3 USM — views, groups, users, and trap receivers
  hosts: ios_devices
  gather_facts: false

  vars:
    snmpv3_username: nms_user
    snmpv3_group: NMS_RO_GROUP
    snmpv3_view: NMS_VIEW
    snmpv3_auth_algo: sha
    snmpv3_priv_algo: aes 128
    trap_receiver_host: 10.255.0.10
    trap_receiver_port: 162
    snmp_location: "DC1-Row3-Rack12"
    snmp_contact: "netops@example.com"

  tasks:
    - name: Apply SNMPv3 configuration
      block:
        - name: Push SNMPv3 views, groups, users, and trap settings
          cisco.ios.ios_config:
            lines:
              - "snmp-server view {{ snmpv3_view }} iso included"
              - "snmp-server group {{ snmpv3_group }} v3 priv read {{ snmpv3_view }}"
              - >-
                snmp-server user {{ snmpv3_username }} {{ snmpv3_group }} v3
                auth {{ snmpv3_auth_algo }} {{ snmpv3_auth_password }}
                priv {{ snmpv3_priv_algo }} {{ snmpv3_priv_password }}
              - "snmp-server host {{ trap_receiver_host }} version 3 priv {{ snmpv3_username }}"
              - "snmp-server enable traps"
              - "snmp-server location {{ snmp_location }}"
              - "snmp-server contact {{ snmp_contact }}"
            save_when: changed
          register: snmp_config_result
          retries: 2
          delay: 5
          until: snmp_config_result is not failed

        - name: Verify SNMPv3 user appears in running config
          cisco.ios.ios_command:
            commands:
              - show snmp user
              - show snmp group
          register: snmp_verify
          failed_when: snmpv3_username not in snmp_verify.stdout[0]

        - name: Display SNMPv3 verification output
          ansible.builtin.debug:
            msg: "{{ snmp_verify.stdout_lines }}"

      rescue:
        - name: Log SNMPv3 configuration failure
          ansible.builtin.debug:
            msg: >
              SNMPv3 configuration failed on {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('unknown') }}

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "SNMPv3 setup could not be completed on {{ inventory_hostname }} — manual review required."
```