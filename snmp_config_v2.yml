---
# SNMPv3 User and Secure Access Group Configuration
# Provisions SNMPv3 users with auth/priv for encrypted, authenticated polling.
# Distinct from snmp_config.yml (v2c communities) and snmp_config_v2.yml (trap destinations).
#
# Credentials managed via Ansible Vault:
#   ansible-vault encrypt_string '<password>' --name 'vault_snmp_auth_pass'
#   ansible-vault encrypt_string '<password>' --name 'vault_snmp_priv_pass'
#
# Inventory example:
# [core_switches]
# sw-core-01 ansible_host=10.0.1.1
# sw-core-02 ansible_host=10.0.1.2
#
# [core_switches:vars]
# ansible_network_os=ios
# ansible_user={{ vault_device_user }}
# ansible_password={{ vault_device_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Configure SNMPv3 users with authentication and privacy
  hosts: "{{ target_hosts | default('network_devices') }}"
  gather_facts: false
  connection: network_cli

  vars:
    snmp_v3_view_name: "FULL_MIB_VIEW"
    snmp_v3_group_ro: "NETMON_RO"
    snmp_v3_group_rw: "NETMON_RW"
    # vault_snmp_auth_pass and vault_snmp_priv_pass loaded from Vault
    snmp_v3_users:
      - username: "netmon_ro"
        group: "{{ snmp_v3_group_ro }}"
        auth_proto: sha
        priv_proto: aes 128
      - username: "netmon_rw"
        group: "{{ snmp_v3_group_rw }}"
        auth_proto: sha
        priv_proto: aes 128

  tasks:
    - name: Apply SNMPv3 view, groups, and users
      block:
        - name: Configure MIB view and access groups
          cisco.ios.ios_config:
            lines:
              - "snmp-server view {{ snmp_v3_view_name }} iso included"
              - "snmp-server group {{ snmp_v3_group_ro }} v3 priv read {{ snmp_v3_view_name }}"
              - "snmp-server group {{ snmp_v3_group_rw }} v3 priv read {{ snmp_v3_view_name }} write {{ snmp_v3_view_name }}"
          register: group_config_result
          retries: 2
          delay: 5
          until: group_config_result is not failed

        - name: Create SNMPv3 users with auth and priv
          cisco.ios.ios_config:
            lines:
              - "snmp-server user {{ item.username }} {{ item.group }} v3 auth {{ item.auth_proto }} {{ vault_snmp_auth_pass }} priv {{ item.priv_proto }} {{ vault_snmp_priv_pass }}"
          loop: "{{ snmp_v3_users }}"
          loop_control:
            label: "{{ item.username }}"
          no_log: true
          register: user_config_result

        - name: Retrieve SNMPv3 user table for verification
          cisco.ios.ios_command:
            commands:
              - show snmp user
          register: snmp_user_output
          retries: 2
          delay: 3
          until: snmp_user_output is not failed

        - name: Assert each configured user appears in device output
          ansible.builtin.assert:
            that:
              - item.username in snmp_user_output.stdout[0]
            fail_msg: "SNMPv3 user '{{ item.username }}' not found in 'show snmp user' on {{ inventory_hostname }}"
            success_msg: "SNMPv3 user '{{ item.username }}' confirmed on {{ inventory_hostname }}"
          loop: "{{ snmp_v3_users }}"
          loop_control:
            label: "{{ item.username }}"

      rescue:
        - name: Report configuration failure details
          ansible.builtin.debug:
            msg: >
              SNMPv3 configuration failed on {{ inventory_hostname }}.
              Task: {{ ansible_failed_task.name | default('unknown') }}.
              Error: {{ ansible_failed_result.msg | default('see above') }}

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: "SNMPv3 setup incomplete on {{ inventory_hostname }} — verify Vault variables and device connectivity"

    - name: Summarise SNMPv3 deployment result
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }}: SNMPv3 users
          {{ snmp_v3_users | map(attribute='username') | join(', ') }}
          configured in groups {{ snmp_v3_group_ro }}/{{ snmp_v3_group_rw }}
          under view {{ snmp_v3_view_name }}.