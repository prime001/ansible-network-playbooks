---
# Ansible Playbook: SNMP Trap Host and Notification Configuration
# Configures SNMP trap destinations, notification types, and engineID on Cisco IOS
# Distinct from snmp_config.yml (community/v3 users) — focuses on trap delivery pipeline
#
# Inventory example (inventory/network_devices.ini):
# [core_routers]
# rtr-core-01 ansible_host=10.0.1.1
# rtr-core-02 ansible_host=10.0.1.2
#
# [core_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_user }}
# ansible_password={{ vault_net_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}
#
# Vault: ansible-vault encrypt_string '<secret>' --name 'vault_net_password'

- name: Configure SNMP trap destinations and notification settings
  hosts: core_routers
  gather_facts: false

  vars:
    # Override via host_vars or extra-vars; secrets come from vault
    snmp_trap_hosts:
      - host: "10.100.0.50"
        version: "3"
        security_name: "trap_user"
        priv: "priv"
      - host: "10.100.0.51"
        version: "2c"
        community: "{{ vault_snmp_trap_community }}"
    snmp_trap_source_interface: "Loopback0"
    snmp_engineid: ""
    snmp_notification_types:
      - "bgp"
      - "config"
      - "envmon"
      - "hsrp"
      - "ospf"
      - "syslog"
    max_retries: 2
    retry_delay: 5

  tasks:
    - name: Apply SNMP trap configuration
      block:
        - name: Configure SNMP trap source interface
          cisco.ios.ios_config:
            lines:
              - "snmp-server trap-source {{ snmp_trap_source_interface }}"
          register: trap_source_result
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: trap_source_result is not failed

        - name: Configure SNMP notification types
          cisco.ios.ios_config:
            lines: "{{ ['snmp-server enable traps'] | product(snmp_notification_types) | map('join', ' ') | list }}"
          register: notifications_result
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: notifications_result is not failed

        - name: Configure SNMP trap destinations
          cisco.ios.ios_config:
            lines: >-
              {% if item.version == '3' %}
              snmp-server host {{ item.host }} version 3 {{ item.priv }} {{ item.security_name }}
              {% else %}
              snmp-server host {{ item.host }} version {{ item.version }} {{ item.community }}
              {% endif %}
          loop: "{{ snmp_trap_hosts }}"
          loop_control:
            label: "{{ item.host }}"
          register: trap_hosts_result
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: trap_hosts_result is not failed

        - name: Verify SNMP trap configuration
          cisco.ios.ios_command:
            commands:
              - show snmp host
              - show snmp trap
          register: snmp_verification
          failed_when: snmp_verification.stdout_lines | length == 0

        - name: Display SNMP trap host configuration
          ansible.builtin.debug:
            msg: "{{ snmp_verification.stdout_lines }}"

      rescue:
        - name: Log SNMP trap configuration failure
          ansible.builtin.debug:
            msg: "SNMP trap configuration failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Capture current SNMP state for diagnostics
          cisco.ios.ios_command:
            commands:
              - show snmp
              - show running-config | section snmp
          register: snmp_diag
          ignore_errors: true

        - name: Display diagnostic output
          ansible.builtin.debug:
            msg: "{{ snmp_diag.stdout_lines | default(['No diagnostic output available']) }}"

        - name: Fail with context
          ansible.builtin.fail:
            msg: "SNMP trap configuration failed on {{ inventory_hostname }} — review diagnostic output above