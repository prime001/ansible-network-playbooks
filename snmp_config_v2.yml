---
# snmp_trap_config.yml
# Configures SNMP trap destinations, notification categories, and inform
# tuning on Cisco IOS/IOS-XE devices. Complements snmp_config.yml (community
# strings, views, groups) by managing trap forwarding to NMS collectors.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [distribution]
#   dist-sw-01 ansible_host=10.0.2.1
#
#   [network_devices:children]
#   core_routers
#   distribution
#
#   [network_devices:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure SNMP Trap Destinations and Notification Categories
  hosts: network_devices
  gather_facts: false

  vars:
    # All credentials loaded from Ansible Vault — run with --ask-vault-pass
    snmp_trap_community: "{{ vault_snmp_trap_community | default('CHANGEME') }}"

    trap_receivers:
      - host: "10.100.0.10"
        version: "2c"
        community: "{{ snmp_trap_community }}"
      - host: "10.100.0.11"
        version: "2c"
        community: "{{ snmp_trap_community }}"

    trap_categories:
      - bgp
      - eigrp
      - hsrp
      - ospf state-change
      - snmp linkdown
      - snmp linkup
      - snmp authentication
      - envmon
      - cpu threshold

  tasks:
    - name: Configure SNMP trap receivers and notifications
      block:
        - name: Add trap destination hosts
          cisco.ios.ios_config:
            lines:
              - "snmp-server host {{ item.host }} version {{ item.version }} {{ item.community }}"
          loop: "{{ trap_receivers }}"
          register: trap_host_result
          retries: 2
          delay: 5
          until: trap_host_result is not failed

        - name: Enable SNMP notification categories
          cisco.ios.ios_config:
            lines:
              - "snmp-server enable traps {{ item }}"
          loop: "{{ trap_categories }}"
          register: trap_cat_result

        - name: Bind trap source to loopback interface
          cisco.ios.ios_config:
            lines:
              - "snmp-server trap-source Loopback0"

        - name: Tune inform retry and timeout parameters
          cisco.ios.ios_config:
            lines:
              - "snmp-server informs retries 3 timeout 30"

      rescue:
        - name: Report configuration failure details
          ansible.builtin.debug:
            msg: "Trap config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort with actionable context
          ansible.builtin.fail:
            msg: "SNMP trap configuration incomplete on {{ inventory_hostname }}. Verify reachability and vault credentials."

    - name: Verify trap receivers are registered on device
      cisco.ios.ios_command:
        commands:
          - show snmp host
          - show snmp trap
      register: snmp_verify
      failed_when: snmp_verify.stdout[0] | length == 0

    - name: Display SNMP trap host registration table
      ansible.builtin.debug:
        msg:
          - "Device: {{ inventory_hostname }}"
          - "{{ snmp_verify.stdout[0] }}"

    - name: Display active SNMP notification categories
      ansible.builtin.debug:
        var: snmp_verify.stdout[1]