# ospf_config.yml
# Configures OSPF process, area assignments, passive interfaces, and
# validates adjacency formation on Cisco IOS devices.
#
# Inventory example:
#   [routers]
#   core-rtr-01 ansible_host=10.0.1.1
#   core-rtr-02 ansible_host=10.0.1.2
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure OSPF routing on Cisco IOS devices
  hosts: routers
  gather_facts: false

  vars:
    ospf_process_id: "{{ ospf_process | default(1) }}"
    ospf_router_id: "{{ router_id | default(ansible_host) }}"
    ospf_reference_bandwidth: 1000
    ospf_networks:
      - { prefix: "10.0.0.0", wildcard: "0.0.255.255", area: 0 }
      - { prefix: "192.168.0.0", wildcard: "0.0.255.255", area: 1 }
    ospf_passive_interfaces:
      - Loopback0
      - GigabitEthernet0/2

  tasks:
    - name: Configure OSPF process and validate adjacencies
      block:
        - name: Set OSPF router-id and reference bandwidth
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_base_result

        - name: Advertise networks into OSPF areas
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"
          register: ospf_network_result

        - name: Configure passive interfaces
          cisco.ios.ios_config:
            lines:
              - "passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_passive_interfaces }}"

        - name: Poll for OSPF full adjacency formation
          cisco.ios.ios_command:
            commands:
              - "show ip ospf neighbor"
          register: ospf_neighbors
          retries: 5
          delay: 8
          until: "'FULL' in ospf_neighbors.stdout[0]"
          failed_when: ospf_neighbors.stdout[0] | length == 0

        - name: Collect OSPF process and route summary
          cisco.ios.ios_command:
            commands:
              - "show ip ospf"
              - "show ip route ospf"
          register: ospf_summary

        - name: Display OSPF neighbor table
          ansible.builtin.debug:
            msg: "{{ ospf_neighbors.stdout_lines[0] }}"

        - name: Display OSPF routes installed in RIB
          ansible.builtin.debug:
            msg: "{{ ospf_summary.stdout_lines[1] }}"

      rescue:
        - name: Capture OSPF diagnostic state on failure
          cisco.ios.ios_command:
            commands:
              - "show ip ospf"
              - "show ip ospf neighbor"
              - "show ip route ospf"
          register: ospf_diag
          ignore_errors: true

        - name: Report failure with diagnostic context
          ansible.builtin.debug:
            msg:
              - "OSPF configuration failed on {{ inventory_hostname }}"
              - "Failed task: {{ ansible_failed_task.name }}"
              - "Diagnostic output: {{ ospf_diag.stdout_lines | default(['unavailable']) }}"

        - name: Fail play with actionable message
          ansible.builtin.fail:
            msg: >
              OSPF configuration did not complete on {{ inventory_hostname }}.
              Check router-id conflicts, network statement overlap, and authentication
              mismatch on peer interfaces.