---
# static_routes_deploy.yml
# Deploys and verifies IPv4 static routes on Cisco IOS/IOS-XE devices.
# Supports idempotent merged-state configuration via ios_static_routes.
#
# Credentials managed via Ansible Vault — never store plaintext secrets.
# Run: ansible-playbook static_routes_deploy.yml --ask-vault-pass
#
# Inventory example (inventory/network.yml):
#   all:
#     vars:
#       ansible_network_os: ios
#       ansible_connection: network_cli
#       ansible_user: "{{ vault_net_user }}"
#       ansible_password: "{{ vault_net_password }}"
#       ansible_become: true
#       ansible_become_method: enable
#       ansible_become_password: "{{ vault_enable_password }}"
#     children:
#       routers:
#         hosts:
#           core-rtr-01:
#             ansible_host: 10.0.0.1
#           branch-rtr-01:
#             ansible_host: 10.1.0.1

- name: Deploy static IPv4 routes on IOS/IOS-XE devices
  hosts: "{{ target_hosts | default('routers') }}"
  gather_facts: false
  connection: network_cli

  vars:
    # Vault references — secrets live in vault.yml, never in plaintext
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_enable_password }}"

    static_routes:
      - dest: "10.10.10.0/24"
        next_hop: "192.168.1.254"
        distance: 1
        name: "corp-segment-a"
      - dest: "172.16.0.0/16"
        next_hop: "192.168.1.254"
        distance: 1
        name: "branch-aggregate"
      - dest: "0.0.0.0/0"
        next_hop: "203.0.113.1"
        distance: 254
        name: "isp-default-route"

  tasks:
    - name: Verify device is reachable before making changes
      cisco.ios.ios_command:
        commands:
          - "show version | include uptime"
      register: device_check
      retries: 3
      delay: 5
      until: device_check is not failed

    - name: Capture pre-change static route table
      cisco.ios.ios_command:
        commands:
          - "show ip route static"
      register: routes_before

    - name: Display current static routes
      ansible.builtin.debug:
        msg: "Pre-change routes on {{ inventory_hostname }}: {{ routes_before.stdout_lines[0] }}"

    - name: Deploy static routes
      block:
        - name: Configure static routes via ios_static_routes
          cisco.ios.ios_static_routes:
            config:
              - address_families:
                  - afi: ipv4
                    routes:
                      - dest: "{{ item.dest }}"
                        next_hops:
                          - forward_router_address: "{{ item.next_hop }}"
                            distance_metric: "{{ item.distance }}"
                            name: "{{ item.name }}"
            state: merged
          loop: "{{ static_routes }}"
          register: route_result

        - name: Save running config to startup-config
          cisco.ios.ios_config:
            save_when: modified

      rescue:
        - name: Display failure context
          ansible.builtin.debug:
            msg: >
              Route deployment failed on {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('see task output above') }}

        - name: Capture route table at time of failure
          cisco.ios.ios_command:
            commands:
              - "show ip route static"
          register: routes_on_failure
          ignore_errors: true

        - name: Show route state at time of failure
          ansible.builtin.debug:
            var: routes_on_failure.stdout_lines

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: "Static route deployment failed on {{ inventory_hostname }} — manual review required before retrying"

    - name: Verify configured routes appear in routing table
      cisco.ios.ios_command:
        commands:
          - "show ip route static"
      register: routes_after
      failed_when: routes_after.stdout[0] | length == 0

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Routes applied (changed): {{ route_result.results | selectattr('changed') | list | length }} of {{ static_routes | length }}"
          - "Current static route table:"
          - "{{ routes_after.stdout_lines[0] }}