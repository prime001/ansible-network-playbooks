---
# ospf_config.yml
# Configures OSPF routing protocol on Cisco IOS/IOS-XE devices.
# Manages process ID, router-id, network statements, passive interfaces,
# and per-interface timers. Verifies neighbor adjacency post-deployment.
#
# Credentials: ansible-vault encrypted vars (group_vars/network_devices/vault.yml)
#   vault_network_user:     SSH username
#   vault_network_password: SSH password
#   vault_enable_password:  Enable/become password
#
# Inventory example:
#   [core_routers]
#   core-rtr-01 ansible_host=10.0.1.1 ospf_router_id=10.0.1.1
#   core-rtr-02 ansible_host=10.0.1.2 ospf_router_id=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_user={{ vault_network_user }}
#   ansible_password={{ vault_network_password }}
#   ansible_become_password={{ vault_enable_password }}

- name: Configure OSPF routing on Cisco IOS/IOS-XE
  hosts: core_routers
  gather_facts: false

  vars:
    ospf_process_id: 1
    ospf_reference_bandwidth: 1000
    ospf_networks:
      - prefix: "10.0.0.0"
        wildcard: "0.0.0.255"
        area: 0
      - prefix: "192.168.100.0"
        wildcard: "0.0.0.255"
        area: 1
    ospf_passive_interfaces:
      - Loopback0
      - GigabitEthernet0/2
    ospf_active_interface: GigabitEthernet0/0
    ospf_hello_interval: 10
    ospf_dead_interval: 40
    ospf_neighbor_wait_retries: 4
    ospf_neighbor_wait_delay: 20

  tasks:
    - name: Capture pre-change OSPF state
      cisco.ios.ios_command:
        commands:
          - "show ip ospf {{ ospf_process_id }}"
          - "show ip ospf neighbor"
      register: ospf_pre_state
      failed_when: false

    - name: Display pre-change OSPF state
      ansible.builtin.debug:
        msg: "{{ ospf_pre_state.stdout_lines }}"

    - name: Apply OSPF configuration
      block:
        - name: Configure OSPF process, router-id, and reference bandwidth
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id | default(ansible_host) }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
              - "passive-interface default"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed

        - name: Advertise networks into OSPF
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed
          loop: "{{ ospf_networks }}"
          register: ospf_network_config

        - name: Allow active interfaces through passive-interface default
          cisco.ios.ios_config:
            lines:
              - "no passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed
          loop: "{{ ospf_passive_interfaces | difference([ospf_active_interface]) }}"

        - name: Set OSPF hello/dead timers on WAN-facing interface
          cisco.ios.ios_config:
            lines:
              - "ip ospf hello-interval {{ ospf_hello_interval }}"
              - "ip ospf dead-interval {{ ospf_dead_interval }}"
            parents: "interface {{ ospf_active_interface }}"
            save_when: changed

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              OSPF configuration FAILED on {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('unknown') }}

        - name: Abort with failure
          ansible.builtin.fail:
            msg: "Halting OSPF deploy on {{ inventory_hostname }} — review connectivity and vault credentials."

    - name: Wait for OSPF neighbor adjacency to establish
      cisco.ios.ios_command:
        commands:
          - "show ip ospf neighbor"
      register: ospf_neighbors
      retries: "{{ ospf_neighbor_wait_retries }}"
      delay: "{{ ospf_neighbor_wait_delay }}"
      until: "'FULL' in ospf_neighbors.stdout[0] or 'EXCHANGE' in ospf_neighbors.stdout[0]"
      failed_when: false

    - name: Collect post-change OSPF and route summary
      cisco.ios.ios_command:
        commands:
          - "show ip ospf neighbor detail"
          - "show ip route ospf | include O"
      register: ospf_post_state

    - name: Display OSPF neighbor adjacency and learned routes
      ansible.builtin.debug:
        msg: "{{ ospf_post_state.stdout_lines }}"

    - name: Warn if no OSPF adjacencies formed
      ansible.builtin.debug:
        msg: "WARNING: No FULL/EXCHANGE neighbors detected on {{ inventory_hostname }} after {{ ospf_neighbor_wait_retries * ospf_neighbor_wait_delay }}s"
      when: "'FULL' not in ospf_neighbors.stdout[0] and 'EXCHANGE' not in ospf_neighbors.stdout[0]