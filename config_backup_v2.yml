---
# config_restore.yml
#
# Restores a previously saved configuration backup to Cisco IOS devices.
# Useful for disaster recovery, rollback after a failed change window,
# or provisioning replacement hardware from a known-good baseline.
#
# Credentials must be stored in Ansible Vault:
#   ansible-vault encrypt_string 'mypassword' --name 'ansible_password'
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.0.1
#   rtr-core-02  ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user=netadmin
#   ansible_password=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     6234...
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     8bc4...
#
# Usage:
#   ansible-playbook config_restore.yml -i inventory/network.yml \
#     --ask-vault-pass -e "backup_dir=/opt/backups/network confirm_restore=true"
#
- name: Restore network device configuration from backup
  hosts: "{{ target_hosts | default('core_routers') }}"
  gather_facts: false
  vars:
    backup_dir: "/opt/backups/network"
    confirm_restore: false
    restore_timeout: 60

  tasks:
    - name: Abort unless restore explicitly confirmed
      ansible.builtin.fail:
        msg: "Safety gate: pass -e confirm_restore=true to proceed"
      when: not (confirm_restore | bool)

    - name: Locate backup files for this host
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: "{{ inventory_hostname }}_*.cfg"
      delegate_to: localhost
      register: backup_files

    - name: Fail when no backup exists for this host
      ansible.builtin.fail:
        msg: "No backup found for {{ inventory_hostname }} in {{ backup_dir }}"
      when: backup_files.files | length == 0

    - name: Resolve most recent backup file
      ansible.builtin.set_fact:
        restore_file: "{{ (backup_files.files | sort(attribute='mtime') | last).path }}"

    - name: Capture pre-restore snapshot
      block:
        - name: Pull running config before restore
          cisco.ios.ios_command:
            commands: show running-config
          register: pre_restore_snapshot
          retries: 3
          delay: 5
          until: pre_restore_snapshot is not failed

        - name: Save pre-restore snapshot to controller
          ansible.builtin.copy:
            content: "{{ pre_restore_snapshot.stdout[0] }}"
            dest: "{{ backup_dir }}/{{ inventory_hostname }}_pre_restore_{{ ansible_date_time.epoch }}.cfg"
            mode: "0640"
          delegate_to: localhost

      rescue:
        - name: Warn — pre-restore snapshot failed, continuing
          ansible.builtin.debug:
            msg: "WARNING: could not snapshot {{ inventory_hostname }} before restore"

    - name: Push backup configuration to device
      block:
        - name: Load backup config onto device
          cisco.ios.ios_config:
            src: "{{ restore_file }}"
            save_when: never
          register: restore_result
          timeout: "{{ restore_timeout }}"

        - name: Verify device is responsive after restore
          cisco.ios.ios_command:
            commands: show version
          register: post_restore_check
          retries: 3
          delay: 10
          until: post_restore_check is not failed
          failed_when: post_restore_check.stdout[0] | length < 50

        - name: Write restored config to startup
          cisco.ios.ios_command:
            commands: write memory
          register: write_result
          failed_when: >
            'OK' not in (write_result.stdout[0] | default(''))
            and 'Building configuration' not in (write_result.stdout[0] | default(''))

      rescue:
        - name: Log restore failure details
          ansible.builtin.debug:
            msg:
              - "RESTORE FAILED on {{ inventory_hostname }}"
              - "Source file: {{ restore_file }}"
              - "Manual intervention required"

        - name: Fail play after logging
          ansible.builtin.fail:
            msg: "Configuration restore failed for {{ inventory_hostname }}"

    - name: Display restore summary
      ansible.builtin.debug:
        msg:
          - "Host         : {{ inventory_hostname }}"
          - "Restore file : {{ restore_file }}"
          - "Lines applied: {{ restore_result.updates | default([]) | length }}"
          - "Startup saved: {{ 'yes' if (write_result is defined and write_result is not failed) else 'no' }}