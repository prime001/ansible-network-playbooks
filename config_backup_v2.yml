---
# 014_pre_change_snapshot.yml
# Ansible Playbook: Pre-Change Configuration Snapshot
#
# Purpose: Captures a comprehensive pre-maintenance snapshot of network device
#          state before a change window — running config, routing table, interface
#          status, and ARP/MAC tables. Stores results in a timestamped directory
#          to support rollback comparison post-change.
#
# This playbook complements 004_config_backup.yml (periodic scheduled backups)
# by providing a richer point-in-time capture explicitly tied to change windows.
#
# Supported platforms: Cisco IOS / IOS-XE (ansible_network_os: ios)
#
# Credentials: Stored in Ansible Vault — reference vars/vault.yml
#   ansible-vault create vars/vault.yml
#   vault_net_user, vault_net_pass, vault_enable_pass
#
# Example inventory (inventory/network.yml):
# ---
# all:
#   children:
#     ios_devices:
#       hosts:
#         core-rtr-01:
#           ansible_host: 10.0.1.1
#         dist-sw-01:
#           ansible_host: 10.0.1.10
#   vars:
#     ansible_connection: network_cli
#     ansible_network_os: ios
#     ansible_user: "{{ vault_net_user }}"
#     ansible_password: "{{ vault_net_pass }}"
#     ansible_become: true
#     ansible_become_method: enable
#     ansible_become_password: "{{ vault_enable_pass }}"
#
# Usage:
#   ansible-playbook 014_pre_change_snapshot.yml \
#     -i inventory/network.yml \
#     --vault-password-file ~/.vault_pass \
#     -e "change_id=CHG0042"

- name: Pre-Change Network State Snapshot
  hosts: all
  gather_facts: false

  vars:
    change_id: "UNTRACKED"
    snapshot_root: "{{ playbook_dir }}/snapshots"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    snapshot_dir: "{{ snapshot_root }}/{{ change_id }}/{{ inventory_hostname }}"
    # Commands to capture — extend list as needed per environment
    state_commands:
      - { cmd: "show running-config",       file: "running-config.txt" }
      - { cmd: "show ip route",             file: "ip-route.txt" }
      - { cmd: "show ip interface brief",   file: "ip-int-brief.txt" }
      - { cmd: "show interfaces",           file: "interfaces.txt" }
      - { cmd: "show ip arp",               file: "arp-table.txt" }
      - { cmd: "show version",              file: "version.txt" }
      - { cmd: "show ip bgp summary",       file: "bgp-summary.txt" }
      - { cmd: "show spanning-tree summary", file: "stp-summary.txt" }

  pre_tasks:
    - name: Create per-host snapshot directory
      delegate_to: localhost
      file:
        path: "{{ snapshot_dir }}"
        state: directory
        mode: "0750"

    - name: Write snapshot manifest header
      delegate_to: localhost
      copy:
        content: |
          change_id: {{ change_id }}
          host: {{ inventory_hostname }}
          captured_at: {{ timestamp }}
          ansible_host: {{ ansible_host | default('unknown') }}
        dest: "{{ snapshot_dir }}/manifest.yml"
        mode: "0640"

  tasks:
    - name: Capture device state commands
      block:
        - name: Run state command — {{ item.cmd }}
          cisco.ios.ios_command:
            commands:
              - "{{ item.cmd }}"
          register: cmd_out
          retries: 2
          delay: 4
          until: cmd_out is not failed
          loop: "{{ state_commands }}"
          loop_control:
            label: "{{ item.file }}"

        - name: Write each command output to file
          delegate_to: localhost
          copy:
            content: |
              # Command: {{ item.item.cmd }}
              # Host:    {{ inventory_hostname }}
              # Time:    {{ timestamp }}
              # Change:  {{ change_id }}

              {{ item.stdout[0] }}
            dest: "{{ snapshot_dir }}/{{ item.item.file }}"
            mode: "0640"
          loop: "{{ cmd_out.results }}"
          loop_control:
            label: "{{ item.item.file }}"
          when: item.stdout is defined

        - name: Confirm snapshot complete
          debug:
            msg: >
              [OK] {{ inventory_hostname }} snapshot saved to
              {{ snapshot_dir }}/ ({{ state_commands | length }} files)

      rescue:
        - name: Record snapshot failure
          delegate_to: localhost
          lineinfile:
            path: "{{ snapshot_root }}/{{ change_id }}/snapshot_failures.log"
            line: "{{ timestamp }} FAILED {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"
            create: true
            mode: "0640"

        - name: Alert on failure
          debug:
            msg: >
              [WARN] Snapshot FAILED for {{ inventory_hostname }} during
              change {{ change_id }}. Logged to snapshot_failures.log.
              Review before proceeding with change window.
          failed_when: true

  post_tasks:
    - name: Report snapshot root location
      delegate_to: localhost
      run_once: true
      debug:
        msg: >
          Pre-change snapshots for {{ change_id }} stored in
          {{ snapshot_root }}/{{ change_id }}/
          Compare post-change with: diff -rq {{ snapshot_root }}/{{ change_id }}/ <post_dir>/