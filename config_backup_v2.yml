---
# ospf_config.yml
# Configures OSPFv2 routing process, network advertisements, and passive interfaces
# on Cisco IOS devices. Verifies adjacency formation post-change.
#
# Credentials: encrypt with ansible-vault
#   ansible-vault encrypt_string 'secret' --name 'vault_net_password'
#
# Inventory example:
#   [core_routers]
#   r1 ansible_host=10.0.1.1 ospf_router_id=1.1.1.1
#   r2 ansible_host=10.0.1.2 ospf_router_id=2.2.2.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable_password }}

- name: Deploy OSPFv2 configuration on Cisco IOS core routers
  hosts: core_routers
  gather_facts: false

  vars:
    ansible_user: "{{ vault_net_username }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_net_enable_password }}"
    ospf_process_id: 1
    ospf_reference_bandwidth_mbps: 10000
    ospf_networks:
      - { prefix: "10.0.0.0", wildcard: "0.0.255.255", area: "0" }
      - { prefix: "172.16.0.0", wildcard: "0.0.255.255", area: "1" }
    ospf_active_interfaces:
      - GigabitEthernet0/0
      - GigabitEthernet0/1

  tasks:
    - name: Capture pre-change OSPF neighbor state
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip ospf
      register: pre_change_state
      failed_when: false

    - name: Display pre-change OSPF state
      ansible.builtin.debug:
        var: pre_change_state.stdout_lines

    - name: Apply OSPF configuration
      block:
        - name: Configure OSPF process global settings
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth_mbps }}"
              - "passive-interface default"
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_global_result
          retries: 2
          delay: 5
          until: ospf_global_result is not failed

        - name: Activate OSPF on routed interfaces
          cisco.ios.ios_config:
            lines: "no passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_active_interfaces }}"

        - name: Advertise networks into OSPF
          cisco.ios.ios_config:
            lines: "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"
          register: ospf_network_result

        - name: Persist configuration to NVRAM
          cisco.ios.ios_config:
            save_when: changed

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "OSPF configuration failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort with actionable error
          ansible.builtin.fail:
            msg: "Manual intervention required on {{ inventory_hostname }} — OSPF config did not apply cleanly"

    - name: Wait for OSPF process to initialize
      cisco.ios.ios_command:
        commands: show ip ospf
      register: ospf_process_check
      retries: 4
      delay: 8
      until: "'OSPF Router with ID' in ospf_process_check.stdout[0]"
      failed_when: "'OSPF Router with ID' not in ospf_process_check.stdout[0]"

    - name: Capture post-change OSPF neighbor and route tables
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip route ospf
      register: post_change_state

    - name: Display OSPF adjacency and learned routes
      ansible.builtin.debug:
        var: post_change_state.stdout_lines

    - name: Summarize result
      ansible.builtin.debug:
        msg: >
          OSPFv2 process {{ ospf_process_id }} deployed on {{ inventory_hostname }}
          (router-id {{ ospf_router_id }}) — {{ ospf_networks | length }} network(s) advertised.