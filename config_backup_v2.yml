---
# running_startup_diff.yml
#
# Detects unsaved configuration changes by comparing running-config
# against startup-config on Cisco IOS devices. Flags any device where
# "write memory" has not been executed after changes were made.
#
# Distinct from config_backup.yml — this playbook audits config persistence
# state rather than archiving configs to a backup store.
#
# Inventory example:
#   [ios_routers]
#   core-rtr-01  ansible_host=10.0.0.1
#   core-rtr-02  ansible_host=10.0.0.2
#
#   [ios_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}            # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}        # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }}  # ansible-vault encrypted

- name: Detect running vs startup configuration drift on Cisco IOS
  hosts: ios_routers
  gather_facts: false
  connection: network_cli

  vars:
    report_dir: "/tmp/config_drift"
    # Set enforce_save=true to fail the play when unsaved changes are found
    enforce_save: false

  tasks:
    - name: Create local drift report directory
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0750"

    - name: Collect running and startup configurations
      block:
        - name: Fetch running-config
          cisco.ios.ios_command:
            commands:
              - show running-config
          register: running_cfg
          retries: 3
          delay: 10
          until: running_cfg is not failed

        - name: Fetch startup-config
          cisco.ios.ios_command:
            commands:
              - show startup-config
          register: startup_cfg
          retries: 3
          delay: 10
          until: startup_cfg is not failed

      rescue:
        - name: Log collection failure
          ansible.builtin.debug:
            msg: "Cannot retrieve config from {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort this host
          ansible.builtin.fail:
            msg: "Config fetch failed for {{ inventory_hostname }} after retries — skipping."

    - name: Evaluate configuration drift
      ansible.builtin.set_fact:
        has_drift: "{{ running_cfg.stdout[0] | trim != startup_cfg.stdout[0] | trim }}"
        running_line_count: "{{ running_cfg.stdout[0].splitlines() | length }}"
        startup_line_count: "{{ startup_cfg.stdout[0].splitlines() | length }}"

    - name: Write drift report for devices with unsaved changes
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ report_dir }}/{{ inventory_hostname }}_unsaved_changes.txt"
        mode: "0640"
        content: |
          Device        : {{ inventory_hostname }}
          Status        : UNSAVED CHANGES DETECTED
          Running lines : {{ running_line_count }}
          Startup lines : {{ startup_line_count }}
          Remediation   : Connect to device and run 'write memory'
      when: has_drift | bool

    - name: Display drift status per device
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {% if has_drift | bool %}UNSAVED CHANGES — running-config differs from startup-config
          ({{ running_line_count }} running / {{ startup_line_count }} startup lines).
          Report: {{ report_dir }}/{{ inventory_hostname }}_unsaved_changes.txt
          {% else %}CLEAN — running-config matches startup-config.{% endif %}

    - name: Fail play when unsaved changes detected and enforce_save is enabled
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} has unsaved configuration changes.
          Run 'write memory' on the device, or re-run with -e enforce_save=false to suppress.
      when:
        - has_drift | bool
        - enforce_save | bool