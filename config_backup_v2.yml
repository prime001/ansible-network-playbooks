---
# ospf_config.yml
# Configures OSPF routing process on Cisco IOS/IOS-XE devices.
# Supports per-host router-id, multi-area network statements, and passive interfaces.
#
# Inventory example:
#   [routers]
#   core-rtr-01  ansible_host=10.0.0.1  ospf_router_id=10.255.0.1
#   core-rtr-02  ansible_host=10.0.0.2  ospf_router_id=10.255.0.2
#   dist-rtr-01  ansible_host=10.0.1.1  ospf_router_id=10.255.1.1
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_ssh_user }}
#   ansible_password={{ vault_ssh_pass }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }}

- name: Configure OSPF routing process on Cisco IOS devices
  hosts: routers
  gather_facts: false
  vars:
    # Credentials sourced from Ansible Vault — see group_vars/routers/vault.yml
    ospf_process_id: 1
    ospf_reference_bandwidth: 10000
    ospf_networks:
      - network: "10.0.0.0"
        wildcard: "0.0.255.255"
        area: 0
      - network: "192.168.0.0"
        wildcard: "0.0.0.255"
        area: 1
    ospf_passive_interfaces:
      - Loopback0
      - GigabitEthernet0/2

  tasks:
    - name: Verify device reachability before making changes
      ios_command:
        commands: show version
      register: ver_output
      retries: 3
      delay: 10
      until: ver_output is not failed

    - name: Apply OSPF configuration
      block:
        - name: Configure OSPF process, router-id, and reference bandwidth
          ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
              - log-adjacency-changes detail
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_global_cfg

        - name: Configure OSPF network statements
          ios_config:
            lines:
              - "network {{ item.network }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"
          register: ospf_net_cfg

        - name: Set passive interfaces to suppress hellos on stub segments
          ios_config:
            lines:
              - "passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_passive_interfaces }}"

      rescue:
        - name: Report configuration failure details
          debug:
            msg: >-
              FAILED on {{ inventory_hostname }}:
              task={{ ansible_failed_task.name }}
              error={{ ansible_failed_result.msg | default('see task output') }}
        - name: Abort playbook for this host
          fail:
            msg: "OSPF configuration aborted for {{ inventory_hostname }} — manual review required"

    - name: Verify OSPF process is running
      ios_command:
        commands:
          - "show ip ospf {{ ospf_process_id }}"
          - show ip ospf neighbor
      register: ospf_state
      failed_when: "'Routing Process' not in ospf_state.stdout[0]"

    - name: Display current OSPF neighbor adjacency table
      debug:
        msg: "{{ ospf_state.stdout_lines[1] }}"

    - name: Save running configuration to NVRAM
      ios_command:
        commands:
          - command: write memory
            prompt: '\[confirm\]'
            answer: "\r"
      register: write_result
      failed_when: >-
        'OK' not in write_result.stdout[0] and
        '[OK]' not in write_result.stdout[0]

    - name: Confirm configuration was persisted
      debug:
        msg: "{{ inventory_hostname }}: {{ write_result.stdout[0] | trim }}