This is the NetAutoCommitter project directory, not the ansible-network-playbooks repo. The playbook is being generated for a separate GitHub portfolio repo. Here's the playbook:

```yaml
---
# Configuration Change Detection and Differential Backup
# Compares running-config checksum against the most recent backup and
# archives a new versioned copy only when a change is detected. Use
# alongside config_backup_v2.yml for scheduled full backups; this
# playbook targets change-event-driven workflows and audit pipelines.
#
# Credentials (ansible-vault encrypted group_vars/network/vault.yml):
#   vault_ansible_user, vault_ansible_password
#
# Usage: ansible-playbook config_change_detect.yml --ask-vault-pass
#
# Inventory example:
#   [cisco_ios]
#   core-sw-01   ansible_host=10.0.1.1
#   core-sw-02   ansible_host=10.0.1.2
#   dist-rtr-01  ansible_host=10.0.2.1
#
#   [cisco_ios:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_ansible_user }}"
#   ansible_password="{{ vault_ansible_password }}"

- name: Configuration change detection and differential backup
  hosts: cisco_ios
  gather_facts: false
  vars:
    backup_dir: "/opt/network_backups/{{ inventory_hostname }}"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    latest_link: "{{ backup_dir }}/running-config.latest"
    new_backup: "{{ backup_dir }}/running-config_{{ timestamp }}.cfg"
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"

  tasks:
    - name: Ensure per-device backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost

    - name: Retrieve and evaluate running configuration
      block:
        - name: Fetch running-config from device
          cisco.ios.ios_command:
            commands:
              - show running-config
          register: running_config_raw
          retries: 3
          delay: 10
          until: running_config_raw is not failed

        - name: Write candidate config to temp file
          ansible.builtin.copy:
            content: "{{ running_config_raw.stdout[0] }}"
            dest: "{{ new_backup }}.tmp"
            mode: "0640"
          delegate_to: localhost

        - name: Stat previous backup (if any)
          ansible.builtin.stat:
            path: "{{ latest_link }}"
          register: prev_stat
          delegate_to: localhost

        - name: Checksum candidate config
          ansible.builtin.stat:
            path: "{{ new_backup }}.tmp"
            checksum_algorithm: sha256
          register: new_cksum
          delegate_to: localhost

        - name: Checksum previous backup
          ansible.builtin.stat:
            path: "{{ latest_link }}"
            checksum_algorithm: sha256
          register: old_cksum
          when: prev_stat.stat.exists
          delegate_to: localhost

        - name: Resolve change flag
          ansible.builtin.set_fact:
            config_changed: >-
              {{ not prev_stat.stat.exists or
                 new_cksum.stat.checksum != old_cksum.stat.checksum }}

      rescue:
        - name: Log retrieval failure
          ansible.builtin.debug:
            msg: "WARN: Could not retrieve config from {{ inventory_hostname }} — skipping archive"

        - name: Flag host to skip archival tasks
          ansible.builtin.set_fact:
            config_changed: false

    - name: Promote temp file to versioned archive
      ansible.builtin.command:
        cmd: "mv {{ new_backup }}.tmp {{ new_backup }}"
      delegate_to: localhost
      changed_when: true
      when: config_changed | bool

    - name: Update latest symlink to new archive
      ansible.builtin.file:
        src: "{{ new_backup }}"
        dest: "{{ latest_link }}"
        state: link
        force: true
      delegate_to: localhost
      when: config_changed | bool

    - name: Remove temp file when config unchanged
      ansible.builtin.file:
        path: "{{ new_backup }}.tmp"
        state: absent
      delegate_to: localhost
      when: not (config_changed | bool)

    - name: Find backup files older than 90 days
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: "running-config_*.cfg"
        age: "90d"
        age_stamp: mtime
      register: old_backups
      delegate_to: localhost

    - name: Prune expired backup files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"
      delegate_to: localhost

    - name: Report outcome per device
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {% if config_changed | bool
          %}CONFIG CHANGED — archived {{ new_backup }}{% else
          %}no change detected, backup skipped{% endif %}
```

This is 105 lines and covers: checksum-based change detection (avoiding redundant archive writes), block/rescue error handling with retries, per-device versioned archives with a `latest` symlink, 90-day retention pruning, and vault-referenced credentials.