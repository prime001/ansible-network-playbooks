---
# ospf_config.yml
# Configures OSPFv2 on Cisco IOS routers: process ID, router-ID, network
# advertisements, passive interfaces, and MD5 area authentication.
# Verifies neighbor adjacency and route installation after applying changes.
#
# Inventory example:
#   [core_routers]
#   core-r1  ansible_host=10.0.0.1  ospf_router_id=10.255.0.1
#   core-r2  ansible_host=10.0.0.2  ospf_router_id=10.255.0.2
#
#   [dist_routers]
#   dist-r1  ansible_host=10.0.1.1  ospf_router_id=10.255.1.1
#
#   [routers:children]
#   core_routers
#   dist_routers
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}           # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}    # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure OSPFv2 routing on Cisco IOS routers
  hosts: routers
  gather_facts: false

  vars:
    ospf_process_id: 1
    ospf_area: 0
    ospf_router_id: "{{ hostvars[inventory_hostname]['ospf_router_id'] | default(ansible_host) }}"
    ospf_auth_key: "{{ vault_ospf_md5_key }}"   # ansible-vault encrypted
    ospf_networks:
      - { prefix: "10.0.0.0",   wildcard: "0.0.255.255", area: 0 }
      - { prefix: "192.168.0.0", wildcard: "0.0.0.255",  area: 0 }
    ospf_passive_interfaces:
      - Loopback0
      - GigabitEthernet0/2

  tasks:
    - name: Capture pre-change OSPF neighbor state
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
      register: pre_change_neighbors
      failed_when: false

    - name: Apply OSPFv2 configuration
      block:
        - name: Set OSPF process, router-ID, and reference bandwidth
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth 10000"
          register: ospf_base
          retries: 2
          delay: 5
          until: ospf_base is not failed

        - name: Advertise networks into OSPF
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
          loop: "{{ ospf_networks }}"
          loop_control:
            label: "{{ item.prefix }}/{{ item.wildcard }} area {{ item.area }}"

        - name: Mark stub interfaces as passive
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "passive-interface {{ item }}"
          loop: "{{ ospf_passive_interfaces }}"

        - name: Enable MD5 authentication on backbone area
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "area {{ ospf_area }} authentication message-digest"

        - name: Persist running configuration to NVRAM
          cisco.ios.ios_command:
            commands:
              - write memory
          register: save_result
          failed_when: >-
            'OK' not in save_result.stdout[0] and
            '[OK]' not in save_result.stdout[0]

      rescue:
        - name: Collect diagnostic state on failure
          cisco.ios.ios_command:
            commands:
              - show running-config | section ospf
              - show ip ospf
          register: diag_output
          failed_when: false

        - name: Display diagnostics
          ansible.builtin.debug:
            msg: "OSPF config failed on {{ inventory_hostname }}:\n{{ diag_output.stdout | join('\n') }}"

        - name: Abort after rescue
          ansible.builtin.fail:
            msg: "OSPFv2 configuration failed on {{ inventory_hostname }} — see diagnostics above"

    - name: Wait for OSPF adjacencies to reach FULL state
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
      register: ospf_neighbors
      retries: 4
      delay: 15
      until: "'FULL' in ospf_neighbors.stdout[0]"
      failed_when: false

    - name: Display OSPF neighbor table
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} OSPF neighbors:\n{{ ospf_neighbors.stdout[0] }}"

    - name: Retrieve OSPF routes from routing table
      cisco.ios.ios_command:
        commands:
          - show ip route ospf
      register: ospf_routes

    - name: Assert OSPF routes are installed
      ansible.builtin.assert:
        that:
          - ospf_routes.stdout[0] | length > 0
        fail_msg: "No OSPF routes on {{ inventory_hostname }} — verify neighbor adjacencies and network statements"
        success_msg: "OSPFv2 routing verified on {{ inventory_hostname }}"
```