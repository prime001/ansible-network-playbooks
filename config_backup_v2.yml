```yaml
---
- name: Configure VLANs across network devices
  hosts: network_devices
  gather_facts: no
  connection: network_cli

  vars:
    # Vault reference: edit variables as follows:
    # ansible_user: "{{ vault_network_user }}"
    # ansible_password: "{{ vault_network_password }}"
    vlans:
      - vlan_id: 10
        name: Management
      - vlan_id: 20
        name: Data
      - vlan_id: 30
        name: Voice
      - vlan_id: 40
        name: Guest

  tasks:
    - name: Backup running configuration before changes
      ios_command:
        commands: show running-config
      register: config_backup
      changed_when: false
      failed_when: false

    - name: Store backup to control node
      copy:
        content: "{{ config_backup.stdout[0] }}"
        dest: "backups/{{ inventory_hostname }}_{{ ansible_date_time.iso8601 }}.cfg"
      delegate_to: localhost
      when: config_backup is succeeded

    - name: Configure VLANs on Cisco IOS
      ios_vlan:
        vlan_id: "{{ item.vlan_id }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ vlans }}"
      register: ios_vlan_config
      retries: 3
      delay: 5
      until: ios_vlan_config is succeeded
      when: ansible_network_os == 'ios'

    - name: Configure VLANs on IOS-XR
      iosxr_vlan:
        vlan_id: "{{ item.vlan_id }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ vlans }}"
      register: iosxr_vlan_config
      retries: 3
      delay: 5
      until: iosxr_vlan_config is succeeded
      when: ansible_network_os == 'iosxr'

    - name: Configure VLANs on Nexus
      nxos_vlan:
        vlan_id: "{{ item.vlan_id }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ vlans }}"
      register: nxos_vlan_config
      retries: 3
      delay: 5
      until: nxos_vlan_config is succeeded
      when: ansible_network_os == 'nxos'

    - name: Verify VLAN creation on IOS
      ios_command:
        commands: show vlan brief
      register: vlan_status_ios
      failed_when: "'Management' not in vlan_status_ios.stdout[0]"
      changed_when: false
      when: ansible_network_os == 'ios'

    - name: Display VLAN configuration results
      debug:
        msg: |
          Device: {{ inventory_hostname }}
          OS: {{ ansible_network_os }}
          Configuration Status: SUCCESS
          VLANs Configured:
          {{ vlan_status_ios.stdout[0] | default('Verification skipped') }}

  rescue:
    - name: Report configuration failure
      debug:
        msg: "VLAN configuration failed on {{ inventory_hostname }}. Review backups/{{ inventory_hostname }}_*.cfg for rollback."
      when: config_backup is succeeded

# Inventory file (inventory/network_devices.ini):
# [network_devices]
# switch01.example.com ansible_network_os=ios ansible_host=192.168.1.1
# switch02.example.com ansible_network_os=iosxr ansible_host=192.168.1.2
# switch03.example.com ansible_network_os=nxos ansible_host=192.168.1.3
#
# [network_devices:vars]
# ansible_connection=network_cli
# ansible_become=yes
# ansible_become_method=enable
```