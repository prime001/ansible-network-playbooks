---
# 024_config_backup.yml
# Multi-vendor network configuration backup with rotation and integrity verification
#
# Inventory example:
#   [ios_devices]
#   router1 ansible_host=10.0.1.1 ansible_network_os=ios
#   router2 ansible_host=10.0.1.2 ansible_network_os=ios
#
#   [nxos_devices]
#   switch1 ansible_host=10.0.2.1 ansible_network_os=nxos
#
#   [junos_devices]
#   fw1 ansible_host=10.0.3.1 ansible_network_os=junos
#
#   [network:children]
#   ios_devices
#   nxos_devices
#   junos_devices
#
#   [network:vars]
#   ansible_user={{ vault_net_user }}       # store in ansible-vault
#   ansible_password={{ vault_net_pass }}   # store in ansible-vault
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_connection=network_cli

- name: Multi-vendor Config Backup with Rotation and Integrity Check
  hosts: network
  gather_facts: false

  vars:
    backup_root: "/opt/net-backups"
    backup_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"
    backup_keep_days: 30
    backup_dir: "{{ backup_root }}/{{ inventory_hostname }}/{{ backup_date }}"
    latest_link: "{{ backup_root }}/{{ inventory_hostname }}/latest.cfg"

  tasks:
    - name: Ensure per-device backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost

    - name: Capture running config — IOS/IOS-XE
      cisco.ios.ios_command:
        commands: show running-config
      register: ios_config
      retries: 3
      delay: 5
      until: ios_config is not failed
      when: ansible_network_os == "ios"

    - name: Capture running config — NX-OS
      cisco.nxos.nxos_command:
        commands: show running-config
      register: nxos_config
      retries: 3
      delay: 5
      until: nxos_config is not failed
      when: ansible_network_os == "nxos"

    - name: Capture running config — Junos
      junipernetworks.junos.junos_command:
        commands: show configuration
        display: text
      register: junos_config
      retries: 3
      delay: 5
      until: junos_config is not failed
      when: ansible_network_os == "junos"

    - name: Normalize config output into single variable
      ansible.builtin.set_fact:
        raw_config: >-
          {{
            (ios_config.stdout[0]   if ansible_network_os == 'ios'   else
             nxos_config.stdout[0]  if ansible_network_os == 'nxos'  else
             junos_config.stdout[0] if ansible_network_os == 'junos' else '')
          }}

    - name: Write config to timestamped file
      ansible.builtin.copy:
        content: "{{ raw_config }}\n"
        dest: "{{ backup_dir }}/running.cfg"
        mode: "0640"
      delegate_to: localhost
      register: write_result

    - name: Update 'latest' symlink to current backup
      ansible.builtin.file:
        src: "{{ backup_dir }}/running.cfg"
        dest: "{{ latest_link }}"
        state: link
        force: true
      delegate_to: localhost

    - name: Compute SHA256 checksum of saved config
      ansible.builtin.stat:
        path: "{{ backup_dir }}/running.cfg"
        checksum_algorithm: sha256
        get_checksum: true
      register: config_stat
      delegate_to: localhost
      failed_when: not config_stat.stat.exists

    - name: Write checksum manifest alongside backup
      ansible.builtin.copy:
        content: "{{ config_stat.stat.checksum }}  running.cfg\n"
        dest: "{{ backup_dir }}/running.cfg.sha256"
        mode: "0640"
      delegate_to: localhost

    - name: Remove backups older than {{ backup_keep_days }} days
      ansible.builtin.find:
        paths: "{{ backup_root }}/{{ inventory_hostname }}"
        file_type: directory
        age: "{{ backup_keep_days }}d"
      register: old_dirs
      delegate_to: localhost

    - name: Delete stale backup directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_dirs.files }}"
      loop_control:
        label: "{{ item.path }}"
      delegate_to: localhost

    - name: Report backup summary
      ansible.builtin.debug:
        msg:
          - "Host      : {{ inventory_hostname }} ({{ ansible_network_os }})"
          - "Saved to  : {{ backup_dir }}/running.cfg"
          - "SHA256    : {{ config_stat.stat.checksum }}"
          - "Config KB : {{ (raw_config | length / 1024) | round(1) }}"
          - "Purged    : {{ old_dirs.files | length }} old backup(s)"