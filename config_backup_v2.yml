---
# ospf_config.yml
# Deploys and validates OSPF routing process configuration on Cisco IOS routers.
# Manages router-id, reference bandwidth, network statements, and passive interfaces.
#
# Inventory example:
#   [routers]
#   core-rtr-01   ansible_host=10.0.1.1  ospf_pid=1
#   branch-rtr-01 ansible_host=10.0.2.1  ospf_pid=1
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_username }}"          # ansible-vault encrypted
#   ansible_password="{{ vault_net_password }}"      # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password="{{ vault_enable_password }}"  # ansible-vault encrypted

- name: Configure OSPF routing process on Cisco IOS routers
  hosts: routers
  gather_facts: false

  vars:
    ospf_process_id: "{{ ospf_pid | default(1) }}"
    ospf_router_id: "{{ ansible_host }}"
    ospf_reference_bandwidth: 10000
    ospf_log_adjacency: true
    ospf_networks:
      - prefix: "10.0.0.0"
        wildcard: "0.255.255.255"
        area: 0
      - prefix: "192.168.100.0"
        wildcard: "0.0.0.255"
        area: 1
    ospf_passive_interfaces:
      - Loopback0

  tasks:
    - name: Confirm device reachability before changes
      cisco.ios.ios_command:
        commands:
          - show version
      register: device_check
      retries: 3
      delay: 10
      until: device_check is not failed

    - name: Deploy OSPF configuration
      block:
        - name: Configure OSPF process parameters
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
              - "{{ 'log-adjacency-changes' if ospf_log_adjacency else 'no log-adjacency-changes' }}"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: modified

        - name: Add OSPF network statements
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"
          loop_control:
            label: "{{ item.prefix }} area {{ item.area }}"

        - name: Configure passive interfaces
          cisco.ios.ios_config:
            lines:
              - "passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_passive_interfaces }}"

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "OSPF config failed on {{ inventory_hostname }} at task: {{ ansible_failed_task.name }}"

        - name: Abort with failure
          ansible.builtin.fail:
            msg: "OSPF deployment aborted for {{ inventory_hostname }} — review device logs"

    - name: Verify OSPF process is running
      cisco.ios.ios_command:
        commands:
          - "show ip ospf {{ ospf_process_id }}"
          - show ip ospf neighbor
      register: ospf_state
      failed_when: "'OSPF Router with ID' not in ospf_state.stdout[0]"

    - name: Show OSPF neighbor summary
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} OSPF neighbors:\n{{ ospf_state.stdout[1] }}