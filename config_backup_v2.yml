---
# routing_protocol_verify.yml
#
# Verifies OSPF neighbor adjacencies, BGP peer states, and route table
# counts on Cisco IOS/IOS-XE devices. Run before/after maintenance windows
# to confirm routing plane health. Saves per-device text reports locally.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.1.1
#   rtr-core-02  ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}        # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}    # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Verify Routing Protocol Adjacencies and Prefix Counts
  hosts: core_routers
  gather_facts: false
  vars:
    report_dir: "./routing_reports"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Ensure local report directory exists
      delegate_to: localhost
      run_once: true
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: Collect OSPF and route data
      block:
        - name: Gather OSPF neighbor table and process info
          cisco.ios.ios_command:
            commands:
              - show ip ospf neighbor
              - show ip ospf
              - show ip route summary
          register: ospf_data
          retries: 3
          delay: 5
          until: ospf_data is not failed

        - name: Gather BGP summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
          register: bgp_data
          retries: 3
          delay: 5
          until: bgp_data is not failed
          ignore_errors: true

      rescue:
        - name: Report collection failure
          debug:
            msg: >-
              Failed to collect routing data from {{ inventory_hostname }}
              after retries. Verify SSH and enable credentials.

        - name: Abort play for this host
          fail:
            msg: "Routing data collection aborted for {{ inventory_hostname }}"

    - name: Assert at least one OSPF neighbor is FULL
      assert:
        that:
          - "'FULL' in ospf_data.stdout[0] or 'Full' in ospf_data.stdout[0]"
        fail_msg: "WARNING: No OSPF neighbors in FULL state on {{ inventory_hostname }}"
        success_msg: "OSPF adjacencies healthy on {{ inventory_hostname }}"
      when: "'OSPF Routing Process' in ospf_data.stdout[1] or 'ospf' in ospf_data.stdout[1]"
      register: ospf_health
      failed_when: false

    - name: Display OSPF neighbor and route summary
      debug:
        msg:
          - "=== {{ inventory_hostname }} — OSPF Neighbors ==="
          - "{{ ospf_data.stdout[0] }}"
          - "=== Route Summary ==="
          - "{{ ospf_data.stdout[2] }}"

    - name: Display BGP summary when available
      debug:
        msg:
          - "=== {{ inventory_hostname }} — BGP Summary ==="
          - "{{ bgp_data.stdout[0] }}"
      when:
        - bgp_data is defined
        - not bgp_data.failed

    - name: Save routing health report to local disk
      delegate_to: localhost
      copy:
        content: |
          Routing Health Report
          Host      : {{ inventory_hostname }}
          Timestamp : {{ timestamp }}

          === OSPF Neighbor Table ===
          {{ ospf_data.stdout[0] }}

          === OSPF Process ===
          {{ ospf_data.stdout[1] }}

          === Route Table Summary ===
          {{ ospf_data.stdout[2] }}

          {% if bgp_data is defined and not bgp_data.failed %}
          === BGP Summary ===
          {{ bgp_data.stdout[0] }}
          {% endif %}

          === OSPF Health Assert ===
          {{ ospf_health.msg | default('OSPF check skipped — process not active') }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_routing_{{ timestamp }}.txt