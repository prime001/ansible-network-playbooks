---
# vlan_management.yml
#
# Provisions and verifies VLAN configuration across Cisco IOS/IOS-XE switching
# infrastructure. Credentials stored in Ansible Vault — see vars/vault.yml.
#
# Inventory example:
#   [access_switches]
#   sw-access-01  ansible_host=10.0.1.11
#   sw-access-02  ansible_host=10.0.1.12
#
#   [distribution_switches]
#   sw-dist-01    ansible_host=10.0.1.1
#
#   [switches:children]
#   access_switches
#   distribution_switches
#
#   [switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_user }}"
#   ansible_password="{{ vault_net_password }}"
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password="{{ vault_enable_password }}"

- name: VLAN Provisioning - Create and verify VLANs across switching infrastructure
  hosts: "{{ target_hosts | default('switches') }}"
  gather_facts: false

  vars:
    vlans_to_provision:
      - vlan_id: 10
        name: MANAGEMENT
      - vlan_id: 20
        name: SERVERS_PROD
      - vlan_id: 30
        name: SERVERS_DEV
      - vlan_id: 40
        name: USERS_CORP
      - vlan_id: 99
        name: NATIVE_UNUSED

  tasks:
    - name: Capture pre-change VLAN table
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: pre_change_vlans
      retries: 2
      delay: 5

    - name: Display current VLAN state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} existing VLANs:\n{{ pre_change_vlans.stdout[0] }}"

    - block:
        - name: Configure each VLAN
          cisco.ios.ios_vlans:
            config:
              - vlan_id: "{{ item.vlan_id }}"
                name: "{{ item.name }}"
                state: active
            state: merged
          loop: "{{ vlans_to_provision }}"
          loop_control:
            label: "VLAN {{ item.vlan_id }} ({{ item.name }})"
          register: vlan_config_result

        - name: Verify VLAN is active in database
          cisco.ios.ios_command:
            commands:
              - "show vlan id {{ item.vlan_id }}"
          register: vlan_verify
          failed_when: "'active' not in vlan_verify.stdout[0]"
          loop: "{{ vlans_to_provision }}"
          loop_control:
            label: "Verify VLAN {{ item.vlan_id }}"

        - name: Write running configuration to startup
          cisco.ios.ios_command:
            commands:
              - write memory
          register: save_result
          failed_when: >
            '[OK]' not in save_result.stdout[0] and
            'Building configuration' not in save_result.stdout[0]

      rescue:
        - name: Gather diagnostic information after failure
          cisco.ios.ios_command:
            commands:
              - show vlan brief
              - show running-config | section ^vlan
          register: failure_diag
          ignore_errors: true

        - name: Display failure diagnostics
          ansible.builtin.debug:
            msg:
              - "VLAN provisioning failed on {{ inventory_hostname }}"
              - "Failed task: {{ ansible_failed_task.name }}"
              - "Error: {{ ansible_failed_result.msg | default('see task output') }}"
              - "VLAN state at failure: {{ failure_diag.stdout | default(['unavailable']) }}"

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "VLAN provisioning failed on {{ inventory_hostname }} — manual review required"

    - name: Capture post-change VLAN table
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: post_change_vlans

    - name: Report provisioning summary
      ansible.builtin.debug:
        msg:
          - "Provisioning complete on {{ inventory_hostname }}"
          - "VLANs deployed: {{ vlans_to_provision | map(attribute='vlan_id') | list }}"
          - "Post-change VLAN table:\n{{ post_change_vlans.stdout[0] }}