---
# ospf_config.yml
# Configures OSPF process, area assignments, and network advertisements on
# Cisco IOS/IOS-XE routers, then polls for and verifies neighbor adjacencies.
#
# Inventory example:
#   [core_routers]
#   core-rtr-01  ansible_host=10.0.1.1
#   core-rtr-02  ansible_host=10.0.1.2
#
#   [edge_routers]
#   edge-rtr-01  ansible_host=10.0.2.1
#
#   [routers:children]
#   core_routers
#   edge_routers
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}            # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}        # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_secret }}  # ansible-vault encrypted

- name: Configure OSPF and verify neighbor adjacencies on IOS routers
  hosts: routers
  gather_facts: false
  vars:
    ospf_process_id: 1
    ospf_areas:
      - area_id: 0
        networks:
          - { prefix: "10.0.0.0", wildcard: "0.0.255.255" }
      - area_id: 10
        networks:
          - { prefix: "192.168.10.0", wildcard: "0.0.0.255" }
    ospf_passive_interfaces:
      - Loopback0
    # reference-bandwidth must reflect fastest link speed in the domain (Mbps)
    ospf_reference_bandwidth: 10000
    expected_full_neighbors: 1

  tasks:
    - name: Apply OSPF process configuration
      block:
        - name: Configure OSPF process and global settings
          cisco.ios.ios_config:
            lines:
              - "router ospf {{ ospf_process_id }}"
              - " auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
              - " log-adjacency-changes detail"
          register: ospf_base_result
          retries: 2
          delay: 5
          until: ospf_base_result is not failed

        - name: Advertise networks into OSPF areas
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "network {{ item.1.prefix }} {{ item.1.wildcard }} area {{ item.0.area_id }}"
          loop: "{{ ospf_areas | subelements('networks') }}"
          register: ospf_networks_result

        - name: Suppress OSPF hellos on stub-facing interfaces
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "passive-interface {{ item }}"
          loop: "{{ ospf_passive_interfaces }}"

        - name: Persist configuration to NVRAM
          cisco.ios.ios_command:
            commands:
              - command: write memory
                prompt: '\[confirm\]'
                answer: "\r"
          register: save_result
          failed_when: >
            'OK' not in save_result.stdout[0] and
            'Building' not in save_result.stdout[0]

      rescue:
        - name: Report OSPF configuration failure
          ansible.builtin.debug:
            msg: >-
              OSPF configuration failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see task output above') }}

        - name: Halt for this host — manual intervention required
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }}: OSPF could not be applied. Aborting."

    - name: Verify OSPF neighbor adjacencies are fully established
      block:
        - name: Poll show ip ospf neighbor until FULL state is present
          cisco.ios.ios_command:
            commands: show ip ospf neighbor
          register: ospf_neighbors
          retries: 6
          delay: 10
          until: ospf_neighbors.stdout[0] | regex_findall('FULL') | length >= expected_full_neighbors

        - name: Display OSPF neighbor table
          ansible.builtin.debug:
            msg: "{{ ospf_neighbors.stdout_lines[0] }}"

        - name: Assert minimum FULL adjacency count is met
          ansible.builtin.assert:
            that:
              - ospf_neighbors.stdout[0] | regex_findall('FULL') | length >= expected_full_neighbors
            fail_msg: >-
              {{ inventory_hostname }} has
              {{ ospf_neighbors.stdout[0] | regex_findall('FULL') | length }} FULL adjacency(ies);
              expected >= {{ expected_full_neighbors }}.
            success_msg: "{{ inventory_hostname }}: OSPF adjacency check passed."

      rescue:
        - name: Warn on adjacency verification failure
          ansible.builtin.debug:
            msg: >-
              WARNING: Could not confirm {{ expected_full_neighbors }} FULL OSPF neighbor(s) on
              {{ inventory_hostname }} after retries. Verify reachability and OSPF parameters.