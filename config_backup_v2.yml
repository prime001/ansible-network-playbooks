The content is ready. Here's the playbook I've written — a `qos_policy_deploy.yml` covering DSCP-based QoS classification and egress queuing, which is distinct from all existing playbooks in the repo:

```yaml
---
# qos_policy_deploy.yml
# Deploys DSCP-based QoS classification and egress queuing policies to Cisco IOS/IOS-XE WAN routers.
# Credentials sourced from Ansible Vault — run with: ansible-playbook qos_policy_deploy.yml --ask-vault-pass
#
# Inventory example:
#   [wan_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [wan_routers:vars]
#   ansible_network_os=ios
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_pass }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_pass }}

- name: Deploy DSCP QoS Classification and Egress Queuing Policies
  hosts: wan_routers
  gather_facts: false
  connection: network_cli

  vars:
    # Store all credentials in Ansible Vault (vault_net_user, vault_net_pass, vault_enable_pass)
    qos_policy_name: WAN_EGRESS_QOS
    wan_interfaces: "{{ target_interfaces | default(['GigabitEthernet0/0/0']) }}"
    qos_classes:
      - name: VOICE
        dscp: ef
        queue_type: priority
        percent: 30
      - name: VIDEO
        dscp: af41
        queue_type: bandwidth
        percent: 20
      - name: CRITICAL_DATA
        dscp: af21
        queue_type: bandwidth
        percent: 25
      - name: SCAVENGER
        dscp: cs1
        queue_type: bandwidth
        percent: 5

  tasks:
    - name: Verify device is reachable before making changes
      cisco.ios.ios_command:
        commands: show version
      register: version_output
      retries: 3
      delay: 10
      until: version_output is not failed

    - name: Capture pre-change QoS state for audit trail
      cisco.ios.ios_command:
        commands:
          - show class-map
          - show policy-map
      register: pre_qos_state

    - name: Deploy QoS class-maps and policy-map
      block:
        - name: Configure DSCP match class-maps
          cisco.ios.ios_config:
            lines:
              - "match dscp {{ item.dscp }}"
            parents: "class-map match-any {{ item.name }}"
            save_when: never
          loop: "{{ qos_classes }}"
          register: classmap_result

        - name: Configure policy-map with per-class bandwidth allocations
          cisco.ios.ios_config:
            lines:
              - "class VOICE"
              - " priority percent 30"
              - "class VIDEO"
              - " bandwidth percent 20"
              - "class CRITICAL_DATA"
              - " bandwidth percent 25"
              - "class SCAVENGER"
              - " bandwidth percent 5"
              - "class class-default"
              - " fair-queue"
              - " bandwidth percent 20"
            parents: "policy-map {{ qos_policy_name }}"
            save_when: never
          register: policymap_result

        - name: Bind service-policy outbound to each WAN interface
          cisco.ios.ios_config:
            lines:
              - "service-policy output {{ qos_policy_name }}"
            parents: "interface {{ item }}"
            save_when: never
          loop: "{{ wan_interfaces }}"
          register: interface_policy_result

        - name: Write configuration to NVRAM
          cisco.ios.ios_config:
            save_when: always

      rescue:
        - name: Attempt rollback — remove partially applied policy-map
          cisco.ios.ios_config:
            lines:
              - "no policy-map {{ qos_policy_name }}"
          ignore_errors: true

        - name: Abort with actionable failure message
          ansible.builtin.fail:
            msg: >
              QoS deployment failed on {{ inventory_hostname }}.
              Check class-map DSCP values, policy-map bandwidth totals (must not exceed 100%),
              and verify interface is not already bound to a conflicting service-policy.

    - name: Verify policy-map is active on each WAN interface
      cisco.ios.ios_command:
        commands:
          - "show policy-map interface {{ item }}"
      loop: "{{ wan_interfaces }}"
      register: policy_verify
      failed_when: qos_policy_name not in policy_verify.stdout[0]

    - name: Display per-interface QoS queue statistics
      ansible.builtin.debug:
        msg: "{{ item.stdout[0] }}"
      loop: "{{ policy_verify.results }}"
      loop_control:
        label: "{{ item.item }}"
```

**What it covers (not duplicated by any existing playbook):**
- DSCP class-map creation for Voice (EF), Video (AF41), Critical Data (AF21), and Scavenger (CS1) traffic
- LLQ policy-map with `priority percent` for voice and `bandwidth percent` for other classes
- `service-policy output` binding to configurable WAN interface list
- Pre-change state capture, 3-retry reachability check, rescue block with rollback, and post-deploy verification against active `show policy-map interface` output