---
# bgp_neighbor_config.yml
#
# Configures BGP routing process and peer neighbors on Cisco IOS/IOS-XE devices.
# Supports iBGP (with update-source and next-hop-self) and eBGP sessions.
# Verifies neighbor state after applying changes.
#
# Credentials — encrypt with Ansible Vault, never store in plaintext:
#   ansible_user:             "{{ vault_network_user }}"
#   ansible_password:         "{{ vault_network_password }}"
#   ansible_become_password:  "{{ vault_enable_password }}"
#
# Inventory example (inventory/routers.yml):
# ---
# all:
#   children:
#     bgp_routers:
#       vars:
#         ansible_network_os: cisco.ios.ios
#         ansible_connection: network_cli
#         ansible_become: true
#         ansible_become_method: enable
#         bgp_keepalive: 30
#         bgp_holdtime: 90
#       hosts:
#         core-rtr-01:
#           ansible_host: 10.0.1.1
#           bgp_asn: 65001
#           bgp_router_id: 1.1.1.1
#           bgp_neighbors:
#             - peer_ip: 10.0.0.2
#               peer_asn: 65002
#               description: eBGP-to-ISP-A
#             - peer_ip: 1.1.1.2
#               peer_asn: 65001
#               description: iBGP-to-core-rtr-02
#               update_source: Loopback0
#               next_hop_self: true

- name: Configure BGP Neighbors on Cisco IOS/IOS-XE
  hosts: bgp_routers
  gather_facts: false

  tasks:

    - name: Capture pre-change BGP summary
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
      register: bgp_pre_state
      failed_when: false

    - name: Display current BGP state
      ansible.builtin.debug:
        msg: "{{ bgp_pre_state.stdout_lines[0] | default(['BGP not yet configured on ' + inventory_hostname]) }}"

    - name: Configure BGP process and neighbors
      block:

        - name: Set BGP router-id, log changes, and global timers
          cisco.ios.ios_config:
            parents: "router bgp {{ bgp_asn }}"
            lines:
              - "bgp router-id {{ bgp_router_id }}"
              - "bgp log-neighbor-changes"
              - "timers bgp {{ bgp_keepalive | default(30) }} {{ bgp_holdtime | default(90) }}"
          register: bgp_global_result

        - name: Configure base neighbor remote-as and description
          cisco.ios.ios_config:
            parents: "router bgp {{ bgp_asn }}"
            lines:
              - "neighbor {{ item.peer_ip }} remote-as {{ item.peer_asn }}"
              - "neighbor {{ item.peer_ip }} description {{ item.description | default('BGP-peer') }}"
          loop: "{{ bgp_neighbors }}"
          loop_control:
            label: "peer {{ item.peer_ip }} AS{{ item.peer_asn }}"

        - name: Configure update-source for iBGP neighbors using loopback
          cisco.ios.ios_config:
            parents: "router bgp {{ bgp_asn }}"
            lines:
              - "neighbor {{ item.peer_ip }} update-source {{ item.update_source }}"
          loop: "{{ bgp_neighbors }}"
          when: item.update_source is defined
          loop_control:
            label: "peer {{ item.peer_ip }}"

        - name: Configure next-hop-self on iBGP neighbors
          cisco.ios.ios_config:
            parents: "router bgp {{ bgp_asn }}"
            lines:
              - "neighbor {{ item.peer_ip }} next-hop-self"
          loop: "{{ bgp_neighbors }}"
          when: item.next_hop_self | default(false)
          loop_control:
            label: "peer {{ item.peer_ip }}"

        - name: Activate neighbors in IPv4 unicast address-family
          cisco.ios.ios_config:
            parents:
              - "router bgp {{ bgp_asn }}"
              - "address-family ipv4"
            lines:
              - "neighbor {{ item.peer_ip }} activate"
          loop: "{{ bgp_neighbors }}"
          loop_control:
            label: "peer {{ item.peer_ip }}"

        - name: Save running configuration to NVRAM
          cisco.ios.ios_command:
            commands:
              - write memory
          register: save_result
          retries: 3
          delay: 5
          until: "'OK' in save_result.stdout[0] or '[OK]' in save_result.stdout[0]"

      rescue:

        - name: Alert on BGP configuration failure
          ansible.builtin.debug:
            msg: >-
              BGP configuration failed on {{ inventory_hostname }}.
              ASN: {{ bgp_asn }}. Verify neighbor IPs and ASNs are reachable.
              No automatic rollback performed — review 'show ip bgp summary' manually.

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "BGP configuration aborted on {{ inventory_hostname }} — manual review required."

    - name: Verify BGP summary post-configuration
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
      register: bgp_post_state
      retries: 3
      delay: 10
      until: bgp_post_state is not failed

    - name: Display post-change BGP neighbor table
      ansible.builtin.debug:
        msg: "{{ bgp_post_state.stdout_lines[0] }}