---
# bgp_peer_config.yml
# Configures eBGP peer sessions on Cisco IOS/IOS-XE edge routers.
# Verifies session establishment and captures neighbor state before and after.
#
# Credentials: ansible-vault encrypted variables
#   ansible-vault encrypt_string 'mypassword' --name 'vault_net_password'
#
# Inventory example:
#   [edge_routers]
#   core-rtr-01 ansible_host=192.168.1.1 local_as=65100
#   core-rtr-02 ansible_host=192.168.1.2 local_as=65100
#
#   [edge_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable

- name: Configure eBGP peer sessions on Cisco IOS/IOS-XE
  hosts: edge_routers
  gather_facts: false
  vars:
    net_username: "{{ vault_net_username }}"
    net_password: "{{ vault_net_password }}"
    bgp_peers:
      - neighbor: "203.0.113.1"
        remote_as: 65001
        description: "UPSTREAM-PROVIDER-A"
        password: "{{ vault_bgp_peer_a_password }}"
        soft_reconfiguration: true
        send_community: true
      - neighbor: "198.51.100.1"
        remote_as: 65002
        description: "UPSTREAM-PROVIDER-B"
        password: "{{ vault_bgp_peer_b_password }}"
        soft_reconfiguration: true
        send_community: true

  tasks:
    - name: Capture pre-change BGP summary
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
          - show ip bgp neighbors | include BGP neighbor|BGP state
      register: bgp_pre_state
      retries: 2
      delay: 5

    - name: Display pre-change BGP state
      ansible.builtin.debug:
        msg: "{{ bgp_pre_state.stdout_lines }}"

    - name: Configure BGP peer sessions
      block:
        - name: Apply BGP neighbor statements
          cisco.ios.ios_config:
            lines:
              - "neighbor {{ item.neighbor }} remote-as {{ item.remote_as }}"
              - "neighbor {{ item.neighbor }} description {{ item.description }}"
              - "neighbor {{ item.neighbor }} password {{ item.password }}"
              - "neighbor {{ item.neighbor }} soft-reconfiguration inbound"
              - "neighbor {{ item.neighbor }} send-community"
            parents: "router bgp {{ local_as }}"
          loop: "{{ bgp_peers }}"
          register: bgp_config_result
          notify: Save running config

      rescue:
        - name: Log BGP configuration failure
          ansible.builtin.debug:
            msg: >
              BGP configuration failed on {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Abort with descriptive message
          ansible.builtin.fail:
            msg: "BGP peer config failed on {{ inventory_hostname }}. Manual intervention required."

    - name: Wait for BGP sessions to reach Established state
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
        wait_for:
          - "result[0] contains 'Established'"
      register: bgp_session_check
      retries: 6
      delay: 10
      failed_when: false

    - name: Capture post-change BGP neighbor state
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
          - show ip bgp neighbors | include BGP neighbor|BGP state|Up/Down|Prefixes
      register: bgp_post_state

    - name: Display post-change BGP neighbor status
      ansible.builtin.debug:
        msg: "{{ bgp_post_state.stdout_lines }}"

    - name: Assert at least one BGP session is Established
      ansible.builtin.assert:
        that:
          - "'Established' in bgp_post_state.stdout[0]"
        fail_msg: "No BGP sessions in Established state on {{ inventory_hostname }}"
        success_msg: "BGP peers verified successfully on {{ inventory_hostname }}"

  handlers:
    - name: Save running config
      cisco.ios.ios_command:
        commands:
          - write memory