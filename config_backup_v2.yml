---
# Playbook: VLAN Configuration Management
# Description: Deploy and manage VLAN configurations across network infrastructure
# Supported devices: Cisco IOS/IOS-XE
#
# Inventory Example:
# [network_devices]
# switch1.example.com ansible_host=10.1.1.1 device_type=ios
# switch2.example.com ansible_host=10.1.1.2 device_type=ios
#
# Vault reference: ansible-vault encrypt group_vars/network_devices.yml
# Contains: ansible_user, ansible_password, ansible_network_os

- name: Configure and Manage VLANs Across Network Infrastructure
  hosts: network_devices
  gather_facts: no

  vars:
    ansible_connection: network_cli
    ansible_network_os: ios
    # Credentials reference - stored in vault for production
    # ansible_user: "{{ vault_network_user }}"
    # ansible_password: "{{ vault_network_password }}"

    vlan_configurations:
      - vlan_id: 10
        name: Management
      - vlan_id: 20
        name: DataVLAN
      - vlan_id: 30
        name: VoiceVLAN

  tasks:
    - name: Gather current VLAN information from network device
      ios_facts:
        gather_network_resources: vlans
      register: current_vlans
      retries: 3
      delay: 5
      until: current_vlans is not failed
      tags: [gather, vlans]

    - name: Display current VLAN status before deployment
      debug:
        msg: |
          Current VLANs on {{ inventory_hostname }}:
          {{ current_vlans.ansible_facts.ansible_network_resources.vlans | default([]) | to_nice_yaml }}
      tags: [display]

    - name: Deploy VLAN configurations to network device
      ios_vlans:
        config: "{{ vlan_configurations }}"
        state: merged
      register: vlan_deployment
      retries: 2
      delay: 10
      until: vlan_deployment is not failed
      tags: [deploy, vlans]

      rescue:
        - name: Handle VLAN deployment failure
          debug:
            msg: |
              VLAN deployment failed on {{ inventory_hostname }}:
              Error: {{ vlan_deployment.msg | default('Unknown error') }}
          failed_when: true

    - name: Verify VLAN configuration post-deployment
      ios_facts:
        gather_network_resources: vlans
      register: post_deployment_vlans
      retries: 2
      delay: 5
      until: post_deployment_vlans is not failed
      tags: [verify, vlans]

    - name: Validate VLAN deployment results
      assert:
        that:
          - post_deployment_vlans.ansible_facts.ansible_network_resources.vlans is defined
          - post_deployment_vlans.ansible_facts.ansible_network_resources.vlans | length >= vlan_configurations | length
        fail_msg: "VLAN deployment validation failed - required VLANs not found"
        success_msg: "VLAN validation successful - all VLANs deployed correctly"
      tags: [validate]

    - name: Display final deployment summary
      debug:
        msg: |
          ===========================================
          VLAN Deployment Summary for {{ inventory_hostname }}
          ===========================================
          Target VLANs: {{ vlan_configurations | length }}
          Current VLANs: {{ post_deployment_vlans.ansible_facts.ansible_network_resources.vlans | length }}
          Deployment Status: {{ 'CHANGED' if vlan_deployment is changed else 'UNCHANGED' }}
          Timestamp: {{ ansible_date_time.iso8601 | default('N/A') }}
      tags: [summary]

    - name: Save running configuration to startup
      ios_command:
        commands:
          - command: "write memory"
            prompt: "\[OK\]|[OK]"
      register: save_result
      failed_when: false
      tags: [save]

    - name: Display configuration save status
      debug:
        msg: |
          Configuration save result:
          {{ save_result.stdout_lines | default(['Save operation completed']) }}
      tags: [save]