The ansible-network-playbooks repo isn't local — generating the playbook content directly.

---
# ios_archive_config.yml
#
# Configure IOS on-device config archive feature for automatic local versioning.
# Each 'write memory' event snapshots the running config to flash, retaining up
# to archive_max_versions timestamped copies on the device itself.
#
# Complements external backup playbooks (config_backup.yml) by adding device-side
# version history without requiring controller reachability at backup time.
#
# Requirements: ansible-galaxy collection install cisco.ios
# Credentials:  vault_net_user / vault_net_pass — encrypt with:
#               ansible-vault encrypt_string 'password' --name 'vault_net_pass'
#
# Inventory example:
#   [ios_routers]
#   rtr-core-01  ansible_host=10.0.1.1
#   rtr-edge-01  ansible_host=10.0.1.2
#   [ios_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user=!vault | <see group_vars/all/vault.yml>
#   ansible_password=!vault | <see group_vars/all/vault.yml>

- name: Configure IOS on-device config archive
  hosts: ios_routers
  gather_facts: false
  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_pass }}"
    archive_path: "flash:/archive/cfg"
    archive_max_versions: 14
    archive_time_period: 1440

  tasks:
    - name: Verify device is reachable and running IOS
      cisco.ios.ios_command:
        commands:
          - show version | include Cisco IOS
      register: ios_check
      retries: 3
      delay: 10
      until: ios_check is not failed

    - name: Apply archive configuration
      block:
        - name: Configure archive stanza
          cisco.ios.ios_config:
            lines:
              - "path {{ archive_path }}"
              - "maximum {{ archive_max_versions }}"
              - "time-period {{ archive_time_period }}"
              - "write-memory"
            parents: archive
          register: archive_result

        - name: Write to startup config when changed
          cisco.ios.ios_config:
            save_when: changed
          when: archive_result.changed

      rescue:
        - name: Log failure details
          ansible.builtin.debug:
            msg: "Archive setup failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "Archive configuration failed on {{ inventory_hostname }} — check flash space and privilege level"

    - name: Confirm archive stanza present in running config
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^archive
      register: archive_verify
      failed_when: "'path' not in archive_verify.stdout[0]"

    - name: Trigger immediate archive snapshot
      cisco.ios.ios_command:
        commands:
          - archive config
      register: snapshot
      ignore_errors: true

    - name: Retrieve archive file list from device
      cisco.ios.ios_command:
        commands:
          - show archive
      register: archive_log
      ignore_errors: true

    - name: Report outcome per device
      ansible.builtin.debug:
        msg:
          - "Host         : {{ inventory_hostname }}"
          - "Archive path : {{ archive_path }}"
          - "Max versions : {{ archive_max_versions }}"
          - "Time period  : {{ archive_time_period }} min"
          - "Config saved : {{ archive_result.changed }}"
          - "Snapshot     : {{ 'created' if snapshot is not failed else 'failed — check flash space' }}"
          - "Archive list :"
          - "{{ archive_log.stdout[0] | default('unavailable') }}