---
# prefix_list_route_map_deploy.yml
#
# Deploys BGP prefix lists and route maps for routing policy control.
# Distinct from traffic ACLs (acl_deploy.yml): these filters operate at the
# routing layer to control which prefixes are accepted/advertised via BGP.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.1.1
#   rtr-core-02  ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_user }}"        # ansible-vault: group_vars/all/vault.yml
#   ansible_password="{{ vault_net_pass }}"
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_pass="{{ vault_enable_pass }}"

- name: Deploy BGP prefix lists and route maps for routing policy
  hosts: core_routers
  gather_facts: false

  tasks:
    - name: Apply routing policy configuration
      block:
        - name: Deploy inbound customer prefix list
          cisco.ios.ios_config:
            lines:
              - ip prefix-list PL_CUSTOMER_IN description Accepted customer inbound prefixes
              - ip prefix-list PL_CUSTOMER_IN seq 10 permit 192.168.0.0/24 le 32
              - ip prefix-list PL_CUSTOMER_IN seq 20 permit 10.100.0.0/16 le 24
              - ip prefix-list PL_CUSTOMER_IN seq 100 deny 0.0.0.0/0 le 32
          register: customer_pl_result
          retries: 2
          delay: 5
          until: customer_pl_result is not failed

        - name: Deploy outbound upstream prefix list
          cisco.ios.ios_config:
            lines:
              - ip prefix-list PL_UPSTREAM_OUT description Prefixes advertised to upstream ISP
              - ip prefix-list PL_UPSTREAM_OUT seq 10 permit 203.0.113.0/24
              - ip prefix-list PL_UPSTREAM_OUT seq 100 deny 0.0.0.0/0 le 32
          register: upstream_pl_result
          retries: 2
          delay: 5
          until: upstream_pl_result is not failed

        - name: Deploy inbound route map with local-preference
          cisco.ios.ios_config:
            parents: route-map RM_CUSTOMER_IN permit 10
            lines:
              - match ip address prefix-list PL_CUSTOMER_IN
              - set local-preference 200
          register: rm_in_result
          retries: 2
          delay: 5
          until: rm_in_result is not failed

        - name: Deploy outbound route map with community tagging
          cisco.ios.ios_config:
            parents: route-map RM_UPSTREAM_OUT permit 10
            lines:
              - match ip address prefix-list PL_UPSTREAM_OUT
              - set community 65000:100 additive
          register: rm_out_result
          retries: 2
          delay: 5
          until: rm_out_result is not failed

        - name: Verify prefix lists exist on device
          cisco.ios.ios_command:
            commands:
              - show ip prefix-list PL_CUSTOMER_IN
              - show ip prefix-list PL_UPSTREAM_OUT
          register: prefix_verify
          failed_when: >
            'PL_CUSTOMER_IN' not in prefix_verify.stdout[0] or
            'PL_UPSTREAM_OUT' not in prefix_verify.stdout[1]

        - name: Verify route maps exist on device
          cisco.ios.ios_command:
            commands:
              - show route-map RM_CUSTOMER_IN
              - show route-map RM_UPSTREAM_OUT
          register: routemap_verify
          failed_when: >
            'RM_CUSTOMER_IN' not in routemap_verify.stdout[0] or
            'RM_UPSTREAM_OUT' not in routemap_verify.stdout[1]

        - name: Save running configuration
          cisco.ios.ios_command:
            commands:
              - write memory
          register: save_result
          failed_when: >
            'OK' not in save_result.stdout[0] and
            'Building configuration' not in save_result.stdout[0]

      rescue:
        - name: Report deployment failure
          ansible.builtin.debug:
            msg: >
              Routing policy deployment failed on {{ inventory_hostname }}.
              Task: {{ ansible_failed_task.name | default('unknown') }}.
              Error: {{ ansible_failed_result.msg | default('check device connectivity and privilege level') }}

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: "BGP routing policy deployment failed on {{ inventory_hostname }}. Resolve errors before retrying."

    - name: Display prefix list verification output
      ansible.builtin.debug:
        var: prefix_verify.stdout_lines

    - name: Display route map verification output
      ansible.builtin.debug:
        var: routemap_verify.stdout_lines

    - name: Confirm successful deployment
      ansible.builtin.debug:
        msg: "BGP routing policy (prefix lists + route maps) deployed successfully on {{ inventory_hostname }}