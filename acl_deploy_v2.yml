---
# qos_policy_deploy.yml
# Deploys QoS class-maps, policy-maps, and service-policy bindings to IOS/IOS-XE devices.
# Covers traffic classification (DSCP), bandwidth guarantees, and interface application.
# Distinct from acl_deploy: QoS operates on traffic shaping/scheduling, not permit/deny filtering.
#
# Inventory example (inventory/network.yml):
# ---
# all:
#   children:
#     core_switches:
#       hosts:
#         core-sw-01:
#           ansible_host: 192.168.1.1
#           ansible_network_os: ios
#           ansible_user: "{{ vault_net_user }}"
#           ansible_password: "{{ vault_net_pass }}"
#           ansible_become: true
#           ansible_become_method: enable
#           ansible_become_pass: "{{ vault_enable_pass }}"
#
# Usage:
#   ansible-playbook qos_policy_deploy.yml -i inventory/network.yml --ask-vault-pass
#   ansible-playbook qos_policy_deploy.yml -i inventory/network.yml --vault-password-file ~/.vault_pass
#   ansible-playbook qos_policy_deploy.yml -i inventory/network.yml -e "target_hosts=dist_switches"

- name: Deploy QoS Classification and Queuing Policies
  hosts: "{{ target_hosts | default('core_switches') }}"
  gather_facts: false
  connection: network_cli

  vars:
    # Credentials must be defined in an Ansible Vault-encrypted file
    # e.g.: ansible-vault create group_vars/all/vault.yml
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_pass }}"
    ansible_become_pass: "{{ vault_enable_pass }}"

    policy_map_name: WAN-EDGE-EGRESS

    class_definitions:
      - name: VOIP-RTP
        match_dscp: ef
        priority_percent: 20
      - name: VIDEO-CONF
        match_dscp: af41
        bandwidth_percent: 20
      - name: BUSINESS-DATA
        match_dscp: af21
        bandwidth_percent: 25
      - name: BULK-TRANSFER
        match_dscp: af11
        bandwidth_percent: 10

    qos_interfaces:
      - name: GigabitEthernet0/0/1
        direction: output
      - name: GigabitEthernet0/0/2
        direction: output

  tasks:
    - name: Verify device connectivity before making changes
      cisco.ios.ios_command:
        commands:
          - show version
      register: platform_info
      retries: 3
      delay: 5
      until: platform_info is not failed

    - name: Display target platform
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ready |
          {{ platform_info.stdout[0] | regex_search('Version [\\d.()A-Za-z]+') | default('version unknown') }}

    - name: Apply QoS configuration
      block:
        - name: Configure DSCP-based class-maps
          cisco.ios.ios_config:
            lines:
              - "class-map match-all {{ item.name }}"
              - "  match ip dscp {{ item.match_dscp }}"
          loop: "{{ class_definitions }}"
          loop_control:
            label: "{{ item.name }}"
          register: classmap_result

        - name: Build policy-map with per-class treatment
          cisco.ios.ios_config:
            lines: >-
              {{
                ['policy-map ' + policy_map_name,
                 '  class ' + item.name] +
                (['    priority percent ' + (item.priority_percent | string)]
                  if item.priority_percent is defined else
                  ['    bandwidth percent ' + (item.bandwidth_percent | string)])
              }}
          loop: "{{ class_definitions }}"
          loop_control:
            label: "{{ item.name }}"
          register: policymap_result

        - name: Bind service-policy to WAN interfaces
          cisco.ios.ios_config:
            lines:
              - "service-policy {{ item.direction }} {{ policy_map_name }}"
            parents: "interface {{ item.name }}"
          loop: "{{ qos_interfaces }}"
          loop_control:
            label: "{{ item.name }}"
          register: interface_result

      rescue:
        - name: Capture device state for troubleshooting
          cisco.ios.ios_command:
            commands:
              - show policy-map
              - show class-map
          register: failure_state
          ignore_errors: true

        - name: Display failure context
          ansible.builtin.debug:
            msg:
              - "QoS deployment failed on {{ inventory_hostname }}"
              - "Failed task: {{ ansible_failed_task.name }}"
              - "Error: {{ ansible_failed_result.msg | default('check failure_state below') }}"
              - "{{ failure_state.stdout_lines | default([]) }}"

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "Halted QoS deployment on {{ inventory_hostname }} — no partial config was saved."

    - name: Verify policy-map is active on interfaces
      cisco.ios.ios_command:
        commands:
          - "show policy-map interface {{ item.name }}"
      loop: "{{ qos_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      register: qos_verification
      failed_when: policy_map_name not in qos_verification.stdout | join

    - name: Display per-interface QoS statistics
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ qos_verification.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Persist configuration to NVRAM
      cisco.ios.ios_config:
        save_when: modified