---
# acl_deploy_v3.yml
# Deploys named IP ACLs with pre/post verification and automatic rollback on failure.
# Credentials stored in Ansible Vault -- see group_vars/all/vault.yml.
#
# Inventory example:
#   [core_routers]
#   core-rtr-01 ansible_host=10.0.1.1
#   core-rtr-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   acl_interface=GigabitEthernet0/0/0
#   acl_direction=in
#
# Usage: ansible-playbook acl_deploy_v3.yml -i inventory/prod --ask-vault-pass
#        ansible-playbook acl_deploy_v3.yml -i inventory/prod -e "target_hosts=core-rtr-01"

- name: Stateful ACL deployment with pre/post verification and rollback
  hosts: "{{ target_hosts | default('core_routers') }}"
  gather_facts: false
  connection: network_cli

  vars:
    ansible_network_os: ios
    ansible_user: "{{ vault_net_username }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_pass: "{{ vault_enable_password }}"

    acl_name: "{{ acl_name | default('PERIMETER-INBOUND-v3') }}"
    acl_interface: "{{ acl_interface | default('GigabitEthernet0/0') }}"
    acl_direction: "{{ acl_direction | default('in') }}"

  tasks:
    - name: Capture pre-deployment ACL and interface state
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
          - "show running-config | section interface {{ acl_interface }}"
      register: pre_state
      retries: 2
      delay: 5

    - name: Deploy ACL entries and bind to interface
      block:
        - name: Configure named IP access list via resource module
          cisco.ios.ios_acls:
            config:
              - afi: ipv4
                acls:
                  - name: "{{ acl_name }}"
                    aces:
                      - sequence: 10
                        grant: permit
                        protocol_options:
                          tcp: {}
                        source:
                          address: 10.0.0.0
                          wildcard_bits: 0.255.255.255
                        destination:
                          address: 172.16.0.0
                          wildcard_bits: 0.0.255.255
                          port_protocol:
                            eq: "443"
                        log:
                          set: true
                      - sequence: 20
                        grant: permit
                        protocol_options:
                          tcp: {}
                        source:
                          address: 10.0.0.0
                          wildcard_bits: 0.255.255.255
                        destination:
                          address: 172.16.0.0
                          wildcard_bits: 0.0.255.255
                          port_protocol:
                            eq: "80"
                      - sequence: 30
                        grant: permit
                        protocol_options:
                          icmp: {}
                        source:
                          address: 10.0.0.0
                          wildcard_bits: 0.255.255.255
                        destination:
                          any: true
                      - sequence: 100
                        grant: deny
                        protocol_options:
                          ip: {}
                        source:
                          any: true
                        destination:
                          any: true
                        log:
                          set: true
            state: replaced
          register: acl_result

        - name: Bind ACL to interface
          cisco.ios.ios_config:
            lines:
              - "ip access-group {{ acl_name }} {{ acl_direction }}"
            parents: "interface {{ acl_interface }}"
          register: iface_result

        - name: Persist configuration
          cisco.ios.ios_config:
            save_when: modified

      rescue:
        - name: Announce rollback
          ansible.builtin.debug:
            msg: "Deployment failed on {{ inventory_hostname }} -- rolling back"

        - name: Remove ACL binding from interface
          cisco.ios.ios_config:
            lines:
              - "no ip access-group {{ acl_name }} {{ acl_direction }}"
            parents: "interface {{ acl_interface }}"
          ignore_errors: true

        - name: Delete partially deployed ACL
          cisco.ios.ios_acls:
            config:
              - afi: ipv4
                acls:
                  - name: "{{ acl_name }}"
            state: deleted
          ignore_errors: true

        - name: Fail after rollback
          ansible.builtin.fail:
            msg: "ACL deployment failed and was rolled back on {{ inventory_hostname }}"

    - name: Verify ACL is present and bound post-deployment
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
          - "show ip interface {{ acl_interface }} | include access list"
      register: post_state
      failed_when: acl_name not in post_state.stdout[0]
      retries: 2
      delay: 3

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "Host        : {{ inventory_hostname }}"
          - "ACL         : {{ acl_name }}"
          - "Interface   : {{ acl_interface }} ({{ acl_direction }}bound)"
          - "Changed     : {{ acl_result.changed or iface_result.changed }}"
          - "Interface   : {{ post_state.stdout[1] | default('no acl binding output') }}"
          - "Match counts: {{ post_state.stdout[0] | regex_findall('(\\d+) matches') }}