```yaml
---
- name: Configure Spanning Tree Protocol (STP) on Network Devices
  hosts: network_devices
  gather_facts: no
  
  # Device credentials stored in ansible-vault for security
  # Create vault password: ansible-vault encrypt_string 'password' --name 'ansible_password'
  vars:
    ansible_connection: network_cli
    ansible_port: 22
    ansible_command_timeout: 30
    
    # STP configuration parameters
    stp_mode: "rapid"
    stp_bridge_priority: 4096
    stp_forward_delay: 15
    stp_hello_time: 2
    stp_max_age: 20
    
    # Interface-level STP priority configuration
    stp_priority_interfaces:
      - interface: "GigabitEthernet0/0/1"
        priority: 128
        port_fast: yes
        bpdu_guard: yes
      - interface: "GigabitEthernet0/0/2"
        priority: 128
        port_fast: yes
        bpdu_guard: yes
  
  tasks:
    - name: Gather current spanning tree configuration
      ansible.netcommon.cli_command:
        command: "show spanning-tree detail"
      register: stp_current_config
      retries: 3
      delay: 5
      until: stp_current_config is succeeded
    
    - name: Configure global STP settings on Cisco IOS
      cisco.ios.ios_config:
        lines:
          - "spanning-tree mode {{ stp_mode }}"
          - "spanning-tree bridge priority {{ stp_bridge_priority }}"
          - "spanning-tree forward-time {{ stp_forward_delay }}"
          - "spanning-tree hello-time {{ stp_hello_time }}"
          - "spanning-tree max-age {{ stp_max_age }}"
      when: ansible_network_os == 'ios'
      register: ios_stp_config
      failed_when: "'error' in ios_stp_config.stdout | lower"
    
    - name: Configure STP interface priorities and protection
      cisco.ios.ios_config:
        lines:
          - "spanning-tree port-priority {{ item.priority }}"
          - "spanning-tree portfast"
          - "spanning-tree bpdu-guard enable"
        parents: "interface {{ item.interface }}"
      loop: "{{ stp_priority_interfaces }}"
      when: ansible_network_os == 'ios'
      register: stp_interface_config
    
    - name: Verify STP configuration deployment
      ansible.netcommon.cli_command:
        command: "show spanning-tree brief"
      register: stp_verification
      failed_when: stp_verification.stdout is not defined
    
    - name: Display STP configuration report
      ansible.builtin.debug:
        msg: |
          Spanning Tree Protocol Configuration Report
          ============================================
          Device: {{ inventory_hostname }}
          STP Mode: {{ stp_mode | upper }}
          Bridge Priority: {{ stp_bridge_priority }}
          Hello Time: {{ stp_hello_time }}s
          Forward Delay: {{ stp_forward_delay }}s
          Max Age: {{ stp_max_age }}s
          
          Interfaces Configured: {{ stp_priority_interfaces | length }}
          Configuration Status: SUCCESS
    
    - name: Persist configuration to startup-config
      ansible.netcommon.cli_command:
        command: "copy running-config startup-config"
      when: ansible_network_os in ['ios', 'nxos', 'iosxr']
      ignore_errors: yes
  
  rescue:
    - name: Log configuration deployment failure
      ansible.builtin.debug:
        msg: "STP configuration failed on {{ inventory_hostname }}: {{ ansible_failed_result | default('Unknown error') }}"
    
    - name: Attempt configuration rollback
      ansible.netcommon.cli_command:
        command: "reload"
      ignore_errors: yes

# Inventory Example:
# [network_devices]
# core-switch-01 ansible_host=192.168.1.10 ansible_user=admin ansible_network_os=ios
# core-switch-02 ansible_host=192.168.1.11 ansible_user=admin ansible_network_os=ios
# [network_devices:vars]
# ansible_password={{ vault_ansible_password }}
# ansible_become=yes
# ansible_become_method=enable
```