---
# =============================================================================
# Playbook: BGP Prefix-List and Route-Map Deployment
# Purpose:  Deploy inbound/outbound prefix-lists and route-maps on IOS/IOS-XE
#           routers to control BGP route advertisement and acceptance.
#           Complements acl_deploy (002/012) — prefix-lists target routing
#           policy; ACLs target packet filtering.
#
# Credentials: Stored in Ansible Vault — ansible-vault edit group_vars/all/vault.yml
#   vault_ansible_user, vault_ansible_password, vault_ansible_become_password
#
# Inventory example:
#   [bgp_routers]
#   rtr-core-01  ansible_host=10.0.0.1
#   rtr-core-02  ansible_host=10.0.0.2
#   rtr-edge-01  ansible_host=10.0.0.3
#
#   [bgp_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_ansible_user }}
#   ansible_password={{ vault_ansible_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_ansible_become_password }}
# =============================================================================

- name: Deploy BGP Prefix-Lists and Route-Maps
  hosts: bgp_routers
  gather_facts: false

  vars:
    # Override per host or group in inventory / group_vars
    bgp_prefix_lists:
      - name: PL_ALLOW_INTERNAL
        action: permit
        entries:
          - { seq: 10, prefix: "10.0.0.0/8",    le: 24 }
          - { seq: 20, prefix: "172.16.0.0/12",  le: 28 }
      - name: PL_DENY_DEFAULT
        action: deny
        entries:
          - { seq: 5,  prefix: "0.0.0.0/0" }

    bgp_route_maps:
      - name: RM_IN_PEER
        seq: 10
        action: permit
        match: "ip address prefix-list PL_ALLOW_INTERNAL"
        set:   "local-preference 150"
      - name: RM_OUT_PEER
        seq: 10
        action: permit
        match: "ip address prefix-list PL_DENY_DEFAULT"

    config_save_timeout: 30
    retry_count: 3
    retry_delay: 5

  tasks:

    - name: Verify device reachability
      cisco.ios.ios_command:
        commands: show version
      register: ver_output
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      until: ver_output is not failed

    - name: Display platform info
      ansible.builtin.debug:
        msg: "Connected to {{ inventory_hostname }} — {{ ver_output.stdout[0] | regex_search('Cisco IOS.+') }}"

    - name: Build and apply prefix-lists
      block:

        - name: Deploy prefix-lists via ios_config
          cisco.ios.ios_config:
            lines:
              - "ip prefix-list {{ item.0.name }} seq {{ item.1.seq }} {{ item.0.action }} {{ item.1.prefix }}\
                 {% if item.1.le is defined %} le {{ item.1.le }}{% endif %}"
            save_when: never
          loop: "{{ bgp_prefix_lists | subelements('entries') }}"
          loop_control:
            label: "{{ item.0.name }} seq {{ item.1.seq }}"
          register: pfx_result
          failed_when:
            - pfx_result.failed is defined
            - pfx_result.failed

      rescue:

        - name: Log prefix-list deployment failure
          ansible.builtin.debug:
            msg: "FAILED deploying prefix-lists on {{ inventory_hostname }}: {{ pfx_result | default('unknown error') }}"

        - name: Abort play for this host on prefix-list failure
          ansible.builtin.fail:
            msg: "Halting {{ inventory_hostname }} — prefix-list config failed. Review and retry."

    - name: Build and apply route-maps
      block:

        - name: Deploy route-map entries with set clause
          cisco.ios.ios_config:
            lines:
              - "match {{ item.match }}"
              - "set {{ item.set }}"
            parents:
              - "route-map {{ item.name }} {{ item.action }} {{ item.seq }}"
            save_when: never
          loop: "{{ bgp_route_maps | selectattr('set', 'defined') | list }}"
          loop_control:
            label: "{{ item.name }} {{ item.seq }}"
          register: rm_result

        - name: Deploy permit-only route-map entries (no set clause)
          cisco.ios.ios_config:
            lines:
              - "match {{ item.match }}"
            parents:
              - "route-map {{ item.name }} {{ item.action }} {{ item.seq }}"
            save_when: never
          loop: "{{ bgp_route_maps | rejectattr('set', 'defined') | list }}"
          loop_control:
            label: "{{ item.name }} {{ item.seq }}"

      rescue:

        - name: Log route-map deployment failure
          ansible.builtin.debug:
            msg: "FAILED deploying route-maps on {{ inventory_hostname }}: {{ rm_result | default('unknown error') }}"

        - name: Abort play for this host on route-map failure
          ansible.builtin.fail:
            msg: "Halting {{ inventory_hostname }} — route-map config failed. Review and retry."

    - name: Verify deployed prefix-lists
      cisco.ios.ios_command:
        commands:
          - show ip prefix-list
      register: pfx_verify

    - name: Verify deployed route-maps
      cisco.ios.ios_command:
        commands:
          - show route-map
      register: rm_verify

    - name: Display prefix-list verification output
      ansible.builtin.debug:
        var: pfx_verify.stdout_lines

    - name: Display route-map verification output
      ansible.builtin.debug:
        var: rm_verify.stdout_lines

    - name: Save running configuration
      cisco.ios.ios_config:
        save_when: always
      async: "{{ config_save_timeout }}"
      poll: 5
      register: save_result

    - name: Confirm configuration saved
      ansible.builtin.debug:
        msg: "Configuration saved on {{ inventory_hostname }}"
      when: save_result is succeeded