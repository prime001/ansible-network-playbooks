---
# ACL Deployment with Validation and Pre-Flight Checks
# Deploys access control lists to Cisco IOS devices with comprehensive
# pre-deployment validation, backup, and post-deployment verification.
#
# Example Inventory:
# [ios_devices]
# router-core-01 ansible_host=10.0.1.1 ansible_network_os=ios
# router-edge-01 ansible_host=10.0.2.1 ansible_network_os=ios
#
# [iosxr_devices]
# router-pe-01 ansible_host=10.0.3.1 ansible_network_os=iosxr

- name: Deploy ACLs with Pre-Validation and Verification
  hosts: network_devices
  gather_facts: false
  connection: network_cli
  
  vars:
    # Credentials - reference vault for production
    ansible_user: "{{ vault_network_user | default('admin') }}"
    ansible_password: "{{ vault_network_password }}"
    ansible_network_os: "{{ device_os | default('ios') }}"
    backup_dir: "/tmp/acl_backups"
    acl_deploy_timeout: 30
    
  pre_tasks:
    - name: Validate device connectivity
      ios_command:
        commands: "show version | include Device ID"
      register: device_check
      retries: 3
      delay: 5
      failed_when: device_check is failed
      when: ansible_network_os == 'ios'
  
  tasks:
    - name: Create local backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true
    
    - name: Backup current running configuration
      ios_config:
        backup: yes
        backup_options:
          filename: "acl_pre_deploy_{{ inventory_hostname }}_{{ ansible_date_time.date }}.cfg"
          dir_path: "{{ backup_dir }}"
      when: ansible_network_os == 'ios'
      register: config_backup
      retries: 2
      delay: 3
    
    - name: Deploy ACL to device
      ios_acls:
        config:
          - afi: ipv4
            acls:
              - name: INBOUND_FILTER
                aces:
                  - sequence: 10
                    grant: permit
                    protocol: tcp
                    source:
                      address: 10.0.0.0
                      netmask: 255.255.0.0
                    destination:
                      any: true
                  - sequence: 20
                    grant: deny
                    protocol: ip
                    source:
                      any: true
                    destination:
                      any: true
        state: merged
      register: acl_deploy
      failed_when: acl_deploy is failed
      when: ansible_network_os == 'ios'
      rescue:
        - name: Deployment failed - restore backup
          debug:
            msg: "ACL deployment failed on {{ inventory_hostname }}. Backup preserved at {{ config_backup.backup_path }}"
        - name: Fail the play
          fail:
            msg: "ACL deployment failed - manual intervention required"
    
    - name: Verify ACL deployment
      ios_command:
        commands: "show ip access-lists INBOUND_FILTER"
      register: acl_verify
      failed_when: '"INBOUND_FILTER" not in acl_verify.stdout[0]'
      retries: 2
      delay: 5
      when: ansible_network_os == 'ios'
    
    - name: Display deployment results
      debug:
        msg: |
          ===== ACL Deployment Summary =====
          Host: {{ inventory_hostname }}
          Status: {{ 'DEPLOYED' if acl_deploy.changed else 'NO_CHANGES' }}
          Backup: {{ config_backup.backup_path | default('N/A') }}
          Verification: PASSED
  
  post_tasks:
    - name: Log deployment event
      lineinfile:
        path: "/tmp/acl_deploy_log.txt"
        line: "{{ ansible_date_time.iso8601 }} - {{ inventory_hostname }} - {{ acl_deploy.changed | ternary('SUCCESS', 'NO_CHANGE') }}"
        create: yes
      delegate_to: localhost
      when: acl_deploy is defined