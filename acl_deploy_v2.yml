---
# bgp_routing_config.yml
# Playbook: Configure BGP routing protocol on Cisco IOS devices
# Purpose: Establish eBGP/iBGP neighbor sessions, advertise prefixes, set BGP attributes
#
# Inventory example:
#   [bgp_routers]
#   core-rtr-01 ansible_host=10.0.1.1
#   core-rtr-02 ansible_host=10.0.1.2
#
#   [bgp_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_network_user }}
#   ansible_password={{ vault_network_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure BGP routing on Cisco IOS routers
  hosts: bgp_routers
  gather_facts: false

  vars:
    # Sensitive values stored in Ansible Vault (ansible-vault encrypt group_vars/bgp_routers/vault.yml)
    bgp_local_as: "{{ vault_bgp_local_as | default('65001') }}"
    bgp_router_id: "{{ vault_bgp_router_id | default(ansible_host) }}"
    bgp_neighbors:
      - peer_ip: "10.255.0.2"
        remote_as: "65002"
        description: "PEER-DC-EAST"
        update_source: "Loopback0"
      - peer_ip: "10.255.0.6"
        remote_as: "65003"
        description: "PEER-DC-WEST"
        update_source: "Loopback0"
    bgp_networks:
      - prefix: "192.168.100.0"
        mask: "255.255.255.0"
      - prefix: "192.168.200.0"
        mask: "255.255.255.0"

  tasks:
    - name: Verify device is reachable and IOS version is readable
      cisco.ios.ios_command:
        commands:
          - show version | include IOS
      register: ios_version_check
      retries: 3
      delay: 5
      until: ios_version_check is not failed

    - name: Display device software version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ ios_version_check.stdout[0] | trim }}"

    - block:
        - name: Configure BGP process, router-id, and global attributes
          cisco.ios.ios_config:
            lines:
              - "router bgp {{ bgp_local_as }}"
              - " bgp router-id {{ bgp_router_id }}"
              - " bgp log-neighbor-changes"
              - " no auto-summary"

        - name: Configure BGP neighbor relationships
          cisco.ios.ios_config:
            parents: "router bgp {{ bgp_local_as }}"
            lines:
              - "neighbor {{ item.peer_ip }} remote-as {{ item.remote_as }}"
              - "neighbor {{ item.peer_ip }} description {{ item.description }}"
              - "neighbor {{ item.peer_ip }} update-source {{ item.update_source }}"
              - "neighbor {{ item.peer_ip }} send-community both"
          loop: "{{ bgp_neighbors }}"
          loop_control:
            label: "{{ item.peer_ip }} AS{{ item.remote_as }}"

        - name: Advertise local networks into BGP
          cisco.ios.ios_config:
            parents: "router bgp {{ bgp_local_as }}"
            lines:
              - "network {{ item.prefix }} mask {{ item.mask }}"
          loop: "{{ bgp_networks }}"
          loop_control:
            label: "{{ item.prefix }}"

        - name: Save running configuration to NVRAM
          cisco.ios.ios_config:
            save_when: changed

      rescue:
        - name: Report BGP configuration failure
          ansible.builtin.debug:
            msg: >
              BGP config failed on {{ inventory_hostname }}.
              Review with: show run | section router bgp

        - name: Abort play with descriptive message
          ansible.builtin.fail:
            msg: "BGP configuration on {{ inventory_hostname }} failed — manual remediation required."

    - name: Verify BGP neighbor sessions are established
      cisco.ios.ios_command:
        commands:
          - show bgp summary
        wait_for:
          - result[0] contains "Neighbor"
      register: bgp_summary
      retries: 2
      delay: 15
      failed_when: bgp_summary.failed and bgp_summary.attempts == 2

    - name: Display BGP neighbor summary
      ansible.builtin.debug:
        var: bgp_summary.stdout_lines