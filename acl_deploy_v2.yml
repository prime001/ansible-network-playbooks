---
# acl_deploy_v3.yml
#
# Deploys named IPv4 ACLs to Cisco IOS distribution switches with automatic
# rollback if post-deployment verification fails. Captures pre-change state
# for audit trail and saves config only after successful verification.
#
# Credentials: ansible-vault encrypted (vars/vault.yml)
#   vault_net_user, vault_net_pass, vault_net_enable
#
# Inventory example:
#   [distribution]
#   dist-sw-01 ansible_host=10.10.1.11
#   dist-sw-02 ansible_host=10.10.1.12
#
#   [distribution:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable
#
# Usage:
#   ansible-playbook acl_deploy_v3.yml -i inventory/prod.yml \
#     --vault-password-file ~/.vault_pass \
#     -e "acl_name=RESTRICT_MGMT_IN acl_interface=GigabitEthernet0/1"

- name: Deploy named ACL with rollback on verification failure
  hosts: distribution
  gather_facts: false

  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_pass }}"
    ansible_become_password: "{{ vault_net_enable }}"
    acl_name: "RESTRICT_MGMT_IN"
    acl_interface: "GigabitEthernet0/1"
    acl_direction: "in"
    acl_entries:
      - "10 permit tcp 10.0.10.0 0.0.0.255 any eq 22"
      - "20 permit tcp 10.0.10.0 0.0.0.255 any eq 443"
      - "30 permit icmp 10.0.0.0 0.255.255.255 any"
      - "100 deny ip any any log"

  tasks:
    - name: Capture pre-change ACL and interface state
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
          - "show running-config interface {{ acl_interface }}"
      register: pre_state
      retries: 2
      delay: 5
      until: not pre_state.failed

    - name: Store pre-change snapshot for rollback reference
      set_fact:
        pre_acl_output: "{{ pre_state.stdout[0] }}"
        pre_intf_output: "{{ pre_state.stdout[1] }}"

    - name: Deploy ACL and apply to interface
      block:
        - name: Configure named extended ACL entries
          cisco.ios.ios_config:
            lines: "{{ acl_entries }}"
            parents: "ip access-list extended {{ acl_name }}"
            save_when: never

        - name: Bind ACL to interface
          cisco.ios.ios_config:
            lines:
              - "ip access-group {{ acl_name }} {{ acl_direction }}"
            parents: "interface {{ acl_interface }}"
            save_when: never

        - name: Verify ACL is present in running config
          cisco.ios.ios_command:
            commands: "show ip access-lists {{ acl_name }}"
          register: post_verify
          failed_when: acl_name not in post_verify.stdout[0]
          retries: 3
          delay: 3
          until: not post_verify.failed

        - name: Verify ACL bound to correct interface
          cisco.ios.ios_command:
            commands: "show running-config interface {{ acl_interface }}"
          register: intf_verify
          failed_when: acl_name not in intf_verify.stdout[0]

        - name: Save verified configuration to startup-config
          cisco.ios.ios_command:
            commands: write memory
          register: save_result
          failed_when: "'OK' not in save_result.stdout[0]"

      rescue:
        - name: "ROLLBACK: Remove ACL binding from {{ acl_interface }}"
          cisco.ios.ios_config:
            lines:
              - "no ip access-group {{ acl_name }} {{ acl_direction }}"
            parents: "interface {{ acl_interface }}"
          ignore_errors: true

        - name: "ROLLBACK: Delete ACL {{ acl_name }}"
          cisco.ios.ios_config:
            lines:
              - "no ip access-list extended {{ acl_name }}"
          ignore_errors: true

        - name: "ROLLBACK: Persist cleanup to startup-config"
          cisco.ios.ios_command:
            commands: write memory
          ignore_errors: true

        - name: Fail with rollback audit trail
          fail:
            msg: >
              Deployment of {{ acl_name }} failed on {{ inventory_hostname }}.
              Rollback completed. Pre-change interface state was:
              {{ pre_intf_output | default('empty — ACL was not previously configured') }}

    - name: Display post-deployment ACL hit counters
      cisco.ios.ios_command:
        commands: "show ip access-lists {{ acl_name }}"
      register: final_state

    - name: Report deployment result
      debug:
        msg:
          - "Host        : {{ inventory_hostname }}"
          - "ACL         : {{ acl_name }}"
          - "Interface   : {{ acl_interface }} {{ acl_direction }}"
          - "Entries     : {{ acl_entries | length }}"
          - "Save result : {{ save_result.stdout[0] | trim }}"
          - "ACL counters: {{ final_state.stdout[0] }}