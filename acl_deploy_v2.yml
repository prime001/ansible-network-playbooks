---
- name: Configure HSRP Gateway Redundancy on Network Devices
  hosts: network_devices
  gather_facts: no

  vars:
    hsrp_interface: "{{ hsrp_if | default('GigabitEthernet0/0/1') }}"
    hsrp_group: "{{ hsrp_grp | default(1) }}"
    hsrp_virtual_ip: "{{ hsrp_vip | default('10.0.0.254') }}"
    hsrp_timers_hello: 3
    hsrp_timers_hold: 10
    # Credentials stored in vault: ansible-vault view group_vars/network_devices/credentials.yml
    ansible_user: "{{ vault_network_user }}"
    ansible_password: "{{ vault_network_password }}"
    ansible_network_os: ios
    ansible_connection: network_cli

  tasks:
    - name: Gather device facts for configuration context
      ios_facts:
      register: device_info
      retries: 2
      delay: 5
      until: device_info is succeeded

    - name: Configure HSRP protocol parameters on interface
      ios_config:
        lines:
          - "standby {{ hsrp_group }} ip {{ hsrp_virtual_ip }}"
          - "standby {{ hsrp_group }} priority {{ hsrp_priority }}"
          - "standby {{ hsrp_group }} preempt delay minimum 30"
          - "standby {{ hsrp_group }} timers {{ hsrp_timers_hello }} {{ hsrp_timers_hold }}"
        parents: "interface {{ hsrp_interface }}"
        save_when: changed
        backup: yes
      register: hsrp_config
      retries: 3
      delay: 10
      until: hsrp_config is succeeded

    - name: Verify HSRP configuration was applied
      ios_command:
        commands: "show standby brief"
      register: hsrp_status
      failed_when:
        - hsrp_status.stdout[0] | length == 0

    - name: Retrieve detailed HSRP group information
      ios_command:
        commands:
          - "show standby {{ hsrp_group }}"
      register: hsrp_details

    - name: Display HSRP configuration summary
      debug:
        msg: |
          ========== HSRP Configuration Report ==========
          Device: {{ inventory_hostname }}
          Model: {{ device_info.ansible_net_model }}
          Serial: {{ device_info.ansible_net_serialnum }}
          
          HSRP Parameters:
          - Group: {{ hsrp_group }}
          - Virtual IP: {{ hsrp_virtual_ip }}
          - Interface: {{ hsrp_interface }}
          - Priority: {{ hsrp_priority }}
          
          Current Status:
          {{ hsrp_details.stdout[0] }}

  rescue:
    - name: Log configuration failure with details
      debug:
        msg: |
          HSRP configuration failed on {{ inventory_hostname }}
          Error: {{ ansible_failed_result.msg }}
          Failed Task: {{ ansible_failed_task.name }}

    - name: Rollback HSRP configuration on failure
      ios_config:
        lines:
          - "no standby {{ hsrp_group }}"
        parents: "interface {{ hsrp_interface }}"
      when: hsrp_config is defined and hsrp_config.failed

# Inventory Example:
# [network_devices]
# core-switch-1 ansible_host=10.1.1.10 hsrp_priority=110
# core-switch-2 ansible_host=10.1.1.11 hsrp_priority=100
#
# [network_devices:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# hsrp_group=1
# hsrp_virtual_ip=10.0.0.254
# hsrp_interface=GigabitEthernet0/0/1