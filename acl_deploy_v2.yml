---
# 032_acl_deploy.yml
#
# Purpose: Deploy and verify extended ACLs on Cisco IOS-XR devices
#          using structured ACL data from host_vars/group_vars.
#
# Targets: iosxr_routers group (IOS-XR platform)
#
# Prerequisites:
#   - ansible-galaxy collection install cisco.iosxr
#   - Vault-encrypted credentials in group_vars/all/vault.yml
#
# Inventory example:
#   [iosxr_routers]
#   xr-core-01  ansible_host=10.0.0.1
#   xr-core-02  ansible_host=10.0.0.2
#
#   [iosxr_routers:vars]
#   ansible_network_os=cisco.iosxr.iosxr
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}        # ansible-vault encrypted
#   ansible_password={{ vault_net_pass }}    # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#
# Usage:
#   ansible-playbook 032_acl_deploy.yml --vault-id @prompt -l xr-core-01
#   ansible-playbook 032_acl_deploy.yml --vault-id @prompt --check   # dry-run
#
# Variables (define in host_vars/<host>.yml or group_vars/iosxr_routers.yml):
#   acl_entries: list of ACL definitions (see variable block below)
#   acl_apply_interfaces: list of interfaces with direction for binding
##############################################################################

- name: Deploy and verify extended IPv4 ACLs on Cisco IOS-XR routers
  hosts: iosxr_routers
  gather_facts: false

  vars:
    # Override in host_vars or group_vars as needed
    acl_entries:
      - name: MGMT_ACCESS_IN
        afi: ipv4
        acls:
          - name: MGMT_ACCESS_IN
            aces:
              - sequence: 10
                grant: permit
                protocol: tcp
                source:
                  network: 10.10.0.0
                  wildcard_bits: 0.0.0.255
                destination:
                  any: true
                port:
                  destination:
                    eq: 22
              - sequence: 20
                grant: permit
                protocol: icmp
                source:
                  network: 10.0.0.0
                  wildcard_bits: 0.255.255.255
                destination:
                  any: true
              - sequence: 9999
                grant: deny
                protocol: ip
                source:
                  any: true
                destination:
                  any: true
                log: true

    acl_apply_interfaces:
      - name: GigabitEthernet0/0/0/0
        direction: in
        acl_name: MGMT_ACCESS_IN

  tasks:
    - name: Checkpoint — capture running ACL config before changes
      cisco.iosxr.iosxr_command:
        commands:
          - show access-lists ipv4
      register: acl_before
      retries: 2
      delay: 5

    - name: Display pre-change ACL state
      ansible.builtin.debug:
        msg: "{{ acl_before.stdout_lines }}"

    - name: Deploy IPv4 ACL definitions
      block:
        - name: Push ACL config via iosxr_acls module
          cisco.iosxr.iosxr_acls:
            config: "{{ acl_entries }}"
            state: merged
          register: acl_deploy_result
          notify: Save running config

        - name: Bind ACLs to interfaces
          cisco.iosxr.iosxr_acl_interfaces:
            config:
              - name: "{{ item.name }}"
                access_groups:
                  - afi: ipv4
                    acls:
                      - name: "{{ item.acl_name }}"
                        direction: "{{ item.direction }}"
            state: merged
          loop: "{{ acl_apply_interfaces }}"
          register: acl_bind_result

      rescue:
        - name: Log deploy failure
          ansible.builtin.debug:
            msg: "ACL deploy failed on {{ inventory_hostname }}. Rolling back."

        - name: Rollback — remove ACLs pushed in this run
          cisco.iosxr.iosxr_acls:
            config: "{{ acl_entries }}"
            state: deleted
          ignore_errors: true

        - name: Fail with clear message after rollback
          ansible.builtin.fail:
            msg: "ACL deployment failed on {{ inventory_hostname }}. Config rolled back."

    - name: Verify — capture ACL config after changes
      cisco.iosxr.iosxr_command:
        commands:
          - show access-lists ipv4
          - show running-config interface
      register: acl_after
      failed_when: acl_after.stdout | length == 0

    - name: Assert target ACL exists in running config
      ansible.builtin.assert:
        that:
          - "'MGMT_ACCESS_IN' in acl_after.stdout[0]"
        fail_msg: "ACL MGMT_ACCESS_IN not found in running config after deploy"
        success_msg: "ACL MGMT_ACCESS_IN confirmed present on {{ inventory_hostname }}"

    - name: Display deploy change summary
      ansible.builtin.debug:
        msg:
          - "Host       : {{ inventory_hostname }}"
          - "Changed    : {{ acl_deploy_result.changed }}"
          - "Commands   : {{ acl_deploy_result.commands | default([]) }}"

  handlers:
    - name: Save running config
      cisco.iosxr.iosxr_command:
        commands:
          - commit label "ansible-acl-deploy-{{ ansible_date_time.date }}"