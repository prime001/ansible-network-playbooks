---
# qos_policy_deploy.yml
#
# Deploys QoS class-maps, policy-maps, and service-policy bindings
# on Cisco IOS/IOS-XE devices. Verifies policy attachment after deploy.
#
# Inventory example:
#   [routers]
#   core-rtr-01 ansible_host=192.168.1.1
#   core-rtr-02 ansible_host=192.168.1.2
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}          # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}       # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }} # ansible-vault encrypted

- name: Deploy QoS policy-maps and service-policy to network devices
  hosts: routers
  gather_facts: false

  vars:
    qos_dscp_classes:
      - name: VOICE
        dscp_values: [ef]
        bandwidth_percent: 30
        priority: true
      - name: VIDEO
        dscp_values: [af41, af42, af43]
        bandwidth_percent: 20
        priority: false
      - name: BUSINESS_CRITICAL
        dscp_values: [af31, af32, af33]
        bandwidth_percent: 15
        priority: false
    policy_map_name: WAN-EGRESS-POLICY
    target_interfaces:
      - GigabitEthernet0/0/1
      - GigabitEthernet0/0/2
    qos_verify_retries: 3
    qos_verify_delay: 5

  tasks:
    - name: Build and apply QoS class-maps
      block:
        - name: Configure DSCP-based class-maps
          cisco.ios.ios_config:
            lines:
              - "class-map match-any {{ item.name }}"
              - "{% for dscp in item.dscp_values %} match dscp {{ dscp }}{% endfor %}"
          loop: "{{ qos_dscp_classes }}"
          loop_control:
            label: "{{ item.name }}"
          register: classmap_result
          retries: 2
          delay: 3
          until: classmap_result is not failed

        - name: Build policy-map with bandwidth allocations
          cisco.ios.ios_config:
            parents: "policy-map {{ policy_map_name }}"
            lines: >-
              {% set lines = [] %}
              {% for cls in qos_dscp_classes %}
              {% set _ = lines.append('class ' + cls.name) %}
              {% if cls.priority %}
              {% set _ = lines.append(' priority percent ' + cls.bandwidth_percent | string) %}
              {% else %}
              {% set _ = lines.append(' bandwidth percent ' + cls.bandwidth_percent | string) %}
              {% endif %}
              {% endfor %}
              {{ lines }}
          register: policymap_result

        - name: Apply service-policy to WAN-facing interfaces
          cisco.ios.ios_config:
            parents: "interface {{ item }}"
            lines:
              - "service-policy output {{ policy_map_name }}"
          loop: "{{ target_interfaces }}"
          register: service_policy_result
          retries: 2
          delay: 3
          until: service_policy_result is not failed

      rescue:
        - name: Log QoS deployment failure
          ansible.builtin.debug:
            msg: >
              QoS deployment failed on {{ inventory_hostname }}.
              Class-map result: {{ classmap_result | default('not reached') }}.
              Policy-map result: {{ policymap_result | default('not reached') }}.
          failed_when: true

    - name: Verify policy-map is active on interfaces
      cisco.ios.ios_command:
        commands:
          - "show policy-map interface {{ item }}"
      loop: "{{ target_interfaces }}"
      register: verify_output
      retries: "{{ qos_verify_retries }}"
      delay: "{{ qos_verify_delay }}"
      until: verify_output.stdout[0] is search(policy_map_name)
      failed_when: >
        verify_output.stdout[0] is not search(policy_map_name)

    - name: Display QoS counters per interface
      ansible.builtin.debug:
        msg: |
          Interface: {{ item.item }}
          Policy output:
          {{ item.stdout[0] }}
      loop: "{{ verify_output.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Capture running QoS config for audit
      cisco.ios.ios_command:
        commands:
          - "show running-config | section policy-map|class-map|service-policy"
      register: qos_audit_output

    - name: Display QoS audit summary
      ansible.builtin.debug:
        msg: "QoS config on {{ inventory_hostname }}:\n{{ qos_audit_output.stdout[0] }}