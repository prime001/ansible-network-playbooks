# 006_acl_deploy.yml
# Deploy IPv4 extended ACLs on Cisco IOS/IOS-XE routers.
# Captures pre-deployment state, pushes named ACL entries, verifies
# deployment with retries, and rolls back configuration on failure.
#
# Credentials: store in group_vars/routers/vault.yml (ansible-vault encrypted)
#   vault_net_username: <router_user>
#   vault_net_password: <router_password>
#   vault_net_enable:   <enable_secret>
#
# Inventory example:
#   [routers]
#   rtr-edge-01  ansible_host=10.0.1.1
#   rtr-edge-02  ansible_host=10.0.1.2
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable }}

- name: Deploy IPv4 Extended ACL with Pre-flight Check and Rollback
  hosts: routers
  gather_facts: false
  connection: network_cli

  vars:
    net_username: "{{ vault_net_username }}"
    net_password: "{{ vault_net_password }}"
    net_enable: "{{ vault_net_enable }}"
    acl_name: "EDGE_INBOUND"
    acl_lines:
      - "ip access-list extended {{ acl_name }}"
      - " remark --- Trusted Management Access ---"
      - " 10 permit tcp 10.0.0.0 0.0.255.255 any eq 22"
      - " 20 permit tcp 10.0.0.0 0.0.255.255 any eq 443"
      - " remark --- ICMP for Monitoring ---"
      - " 30 permit icmp 10.0.0.0 0.0.255.255 any echo"
      - " 40 permit icmp any any echo-reply"
      - " remark --- Default Deny with Logging ---"
      - " 100 deny ip any any log"

  tasks:
    - name: Capture pre-deployment ACL state
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
      register: acl_pre_state
      retries: 2
      delay: 5

    - name: Record whether ACL existed before push
      ansible.builtin.set_fact:
        acl_existed_pre: "{{ acl_name in acl_pre_state.stdout[0] }}"

    - name: Show pre-deployment state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — ACL '{{ acl_name }}' pre-exists: {{ acl_existed_pre }}"

    - name: Deploy ACL with automatic rollback on failure
      block:
        - name: Push ACL configuration lines
          cisco.ios.ios_config:
            lines: "{{ acl_lines }}"
          register: acl_push

        - name: Verify ACL is present after push
          cisco.ios.ios_command:
            commands:
              - "show ip access-lists {{ acl_name }}"
          register: acl_post_state
          retries: 3
          delay: 3
          failed_when: acl_name not in acl_post_state.stdout[0]

        - name: Display deployed ACL entry count and detail
          ansible.builtin.debug:
            msg: "{{ acl_post_state.stdout[0] }}"

        - name: Save running configuration to NVRAM
          cisco.ios.ios_command:
            commands:
              - write memory
          register: save_result
          failed_when: >
            'OK' not in save_result.stdout[0] and
            'Building configuration' not in save_result.stdout[0]

      rescue:
        - name: Deployment failed — initiating rollback
          ansible.builtin.debug:
            msg: "Push failed on {{ inventory_hostname }}. Removing partial ACL configuration."

        - name: Remove ACL on failure
          cisco.ios.ios_config:
            lines:
              - "no ip access-list extended {{ acl_name }}"
          ignore_errors: true

        - name: Verify ACL was removed
          cisco.ios.ios_command:
            commands:
              - "show ip access-lists {{ acl_name }}"
          register: rollback_verify

        - name: Report rollback outcome
          ansible.builtin.debug:
            msg: >-
              Rollback {{ 'succeeded' if acl_name not in rollback_verify.stdout[0]
              else 'INCOMPLETE — manual cleanup required' }} on {{ inventory_hostname }}

        - name: Fail play after rollback
          ansible.builtin.fail:
            msg: "ACL '{{ acl_name }}' deployment failed on {{ inventory_hostname }}. See rollback status above.