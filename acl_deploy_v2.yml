---
- name: Configure VLANs on Network Devices
  hosts: network_devices
  gather_facts: no
  
  vars:
    # VLAN configuration - customize per environment
    vlans:
      - vlan_id: 10
        name: Management
        state: present
      - vlan_id: 20
        name: Production
        state: present
      - vlan_id: 30
        name: Guest
        state: present
    
    ansible_network_os: ios
    ansible_connection: network_cli
    # Credentials stored in vault: ansible-vault encrypt_string 'password' --name ansible_password
  
  tasks:
    - name: Display VLAN management task
      debug:
        msg: "Managing VLANs on {{ inventory_hostname }}"
    
    - name: Configure VLANs on Cisco IOS devices
      ios_vlan:
        vlan_id: "{{ item.vlan_id }}"
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop: "{{ vlans }}"
      register: vlan_config_result
      retries: 3
      delay: 2
      until: vlan_config_result is not failed
      when: "'ios' in ansible_network_os"
    
    - name: Configure VLANs on Nexus devices
      nxos_vlan:
        vlan_id: "{{ item.vlan_id }}"
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop: "{{ vlans }}"
      register: nxos_vlan_result
      retries: 3
      delay: 2
      until: nxos_vlan_result is not failed
      when: "'nexus' in ansible_network_os"
    
    - name: Validate VLAN configuration with show command
      ios_command:
        commands:
          - "show vlan brief"
      register: vlan_show_output
      when: "'ios' in ansible_network_os"
    
    - name: Parse and display VLAN configuration results
      debug:
        msg: |
          VLAN Configuration Summary for {{ inventory_hostname }}:
          Total VLANs configured: {{ vlans | length }}
          {% for vlan in vlans %}
          - VLAN {{ vlan.vlan_id }}: {{ vlan.name }} ({{ vlan.state }})
          {% endfor %}
    
    - name: Display command output
      debug:
        msg: "{{ vlan_show_output.stdout[0] }}"
      when: vlan_show_output is defined and vlan_show_output.stdout is defined
    
    - name: Register configuration status
      set_fact:
        vlan_deployment_status: "Success"
        vlan_deployment_time: "{{ ansible_date_time.iso8601 }}"
  
  rescue:
    - name: Handle configuration error
      debug:
        msg: "Failed to configure VLANs on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"
    
    - name: Attempt rollback on failure
      ios_vlan:
        vlan_id: "{{ item.vlan_id }}"
        state: absent
      loop: "{{ vlans }}"
      when: inventory_hostname in groups.get('ios_devices', [])
      ignore_errors: yes

# Inventory example for testing:
# [network_devices]
# switch1 ansible_host=192.168.1.10 ansible_user=admin ansible_network_os=ios
# switch2 ansible_host=192.168.1.11 ansible_user=admin ansible_network_os=nexus
#
# [ios_devices]
# switch1
#
# [nxos_devices]
# switch2