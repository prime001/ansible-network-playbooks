```yaml
---
# acl_deploy_v3.yml — Deploy named ACLs and bind to interfaces on Cisco IOS
# Credentials stored in Ansible Vault: group_vars/all/vault.yml
#
# Inventory example:
#   [distribution_switches]
#   dist-sw1 ansible_host=10.10.1.1
#   dist-sw2 ansible_host=10.10.1.2
#
#   [distribution_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_network_user }}
#   ansible_password={{ vault_network_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Deploy named extended ACLs and apply to interfaces on Cisco IOS
  hosts: distribution_switches
  gather_facts: false

  vars:
    acl_name: MGMT_ACCESS
    acl_direction: in
    acl_interface: GigabitEthernet0/1
    mgmt_permitted_hosts:
      - 10.100.0.10
      - 10.100.0.11
      - 10.100.0.20
    mgmt_network: 10.100.0.0
    mgmt_wildcard: 0.0.0.255

  tasks:
    - name: Confirm connectivity before making changes
      cisco.ios.ios_command:
        commands: show clock
      register: connectivity_check
      retries: 3
      delay: 5
      until: not connectivity_check.failed

    - name: Snapshot existing ACL and interface state
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
          - "show ip interface {{ acl_interface }}"
      register: pre_state

    - name: Deploy and bind ACL
      block:
        - name: Build named extended ACL
          cisco.ios.ios_config:
            lines:
              - "ip access-list extended {{ acl_name }}"
              - " remark === Managed by Ansible — do not edit manually ==="
              - " 10 permit tcp {{ mgmt_network }} {{ mgmt_wildcard }} any eq 22"
              - " 20 permit tcp {{ mgmt_network }} {{ mgmt_wildcard }} any eq 443"
              - " 30 permit icmp {{ mgmt_network }} {{ mgmt_wildcard }} any"
              - " 100 deny ip any any log"
            match: exact
          register: acl_config_result

        - name: Apply ACL to interface
          cisco.ios.ios_config:
            parents: "interface {{ acl_interface }}"
            lines:
              - "ip access-group {{ acl_name }} {{ acl_direction }}"
          register: interface_bind_result

      rescue:
        - name: Report failure and remove partial ACL binding
          cisco.ios.ios_config:
            parents: "interface {{ acl_interface }}"
            lines:
              - "no ip access-group {{ acl_name }} {{ acl_direction }}"
          ignore_errors: true

        - name: Fail with rollback notice
          ansible.builtin.fail:
            msg: "ACL deployment failed on {{ inventory_hostname }} — interface binding removed. Review logs."

    - name: Verify ACL was created with correct entry count
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
      register: acl_verify
      failed_when: acl_name not in acl_verify.stdout[0]

    - name: Verify ACL is bound to the target interface
      cisco.ios.ios_command:
        commands:
          - "show ip interface {{ acl_interface }}"
      register: interface_verify
      failed_when: acl_name not in interface_verify.stdout[0]

    - name: Save configuration
      cisco.ios.ios_command:
        commands:
          - write memory
      when: acl_config_result.changed or interface_bind_result.changed
      register: save_result

    - name: Display final ACL state
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "ACL deployed: {{ acl_config_result.changed }}"
          - "Interface bound: {{ interface_bind_result.changed }}"
          - "ACL detail: {{ acl_verify.stdout[0] }}"
```