---
# acl_deploy_v3.yml
# Deploys named extended/standard ACLs to Cisco IOS devices with a
# pre-change snapshot, post-deployment verification, and auto-rollback.
# Distinct from acl_deploy_v2 in that it atomically replaces ACLs,
# retries verification, and rolls back on assertion failure.
#
# Inventory example:
# [network_devices]
# core-rtr-01 ansible_host=10.0.1.1
# dist-sw-01  ansible_host=10.0.2.1
#
# [network_devices:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_user }}           # ansible-vault encrypted
# ansible_password={{ vault_net_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Deploy named ACLs with snapshot, verification, and rollback
  hosts: network_devices
  gather_facts: false

  vars:
    # Vault reference: ansible-vault encrypt_string '<password>' --name vault_net_user
    rollback_on_failure: true

    acl_config:
      - name: PERMIT_TRUSTED_MGMT
        type: extended
        lines:
          - "10 permit tcp 10.100.0.0 0.0.255.255 any eq 22"
          - "20 permit tcp 10.100.0.0 0.0.255.255 any eq 443"
          - "30 permit icmp 10.100.0.0 0.0.255.255 any"
          - "100 deny ip any any log"
      - name: DENY_RFC1918_INGRESS
        type: extended
        lines:
          - "10 deny ip 10.0.0.0 0.255.255.255 any log"
          - "20 deny ip 172.16.0.0 0.15.255.255 any log"
          - "30 deny ip 192.168.0.0 0.0.255.255 any log"
          - "100 permit ip any any"

  tasks:
    - name: Capture pre-change ACL state
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists"
      register: pre_change_acls

    - name: Save pre-change snapshot to control node
      ansible.builtin.copy:
        content: "{{ inventory_hostname }} pre-change {{ now(utc=true, fmt='%Y%m%d_%H%M%S') }}\n{{ pre_change_acls.stdout[0] }}"
        dest: "/tmp/acl_pre_{{ inventory_hostname }}.txt"
        mode: '0600'
      delegate_to: localhost

    - name: Deploy and verify ACLs
      block:
        - name: Atomically replace each ACL
          cisco.ios.ios_config:
            before: "no ip access-list {{ item.type }} {{ item.name }}"
            parents: "ip access-list {{ item.type }} {{ item.name }}"
            lines: "{{ item.lines }}"
          loop: "{{ acl_config }}"
          loop_control:
            label: "{{ item.name }}"
          register: acl_apply_result

        - name: Poll for post-deployment ACL state
          cisco.ios.ios_command:
            commands:
              - "show ip access-lists"
          register: post_deploy_acls
          retries: 3
          delay: 5
          until: post_deploy_acls.stdout[0] | length > 0

        - name: Assert all target ACLs are present
          ansible.builtin.assert:
            that: "item.name in post_deploy_acls.stdout[0]"
            fail_msg: "ACL {{ item.name }} missing on {{ inventory_hostname }} after deployment"
            success_msg: "ACL {{ item.name }} verified on {{ inventory_hostname }}"
          loop: "{{ acl_config }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Persist verified configuration to NVRAM
          cisco.ios.ios_config:
            save_when: modified

      rescue:
        - name: Log failure
          ansible.builtin.debug:
            msg: "Deployment failed on {{ inventory_hostname }} — rollback={{ rollback_on_failure }}"

        - name: Remove newly pushed ACLs
          cisco.ios.ios_config:
            lines: "no ip access-list {{ item.type }} {{ item.name }}"
          loop: "{{ acl_config }}"
          loop_control:
            label: "{{ item.name }}"
          when: rollback_on_failure | bool

        - name: Save rolled-back state to NVRAM
          cisco.ios.ios_config:
            save_when: always
          when: rollback_on_failure | bool

        - name: Abort with rollback context
          ansible.builtin.fail:
            msg: "ACL deployment rolled back on {{ inventory_hostname }}. Pre-change state: /tmp/acl_pre_{{ inventory_hostname }}.txt"

    - name: Report deployment outcome
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "ACLs configured: {{ acl_config | map(attribute='name') | join(', ') }}"
          - "Modified: {{ acl_apply_result.results | selectattr('changed') | list | length }} of {{ acl_config | length }} ACL(s)