```yaml
---
# VLAN Configuration and Management Playbook
# Purpose: Deploy and validate VLAN configurations across Cisco network devices
# Platforms: Cisco IOS, IOS-XE, NX-OS
#
# Inventory Example:
# [network_switches]
# core_switch_1 ansible_host=192.168.1.10 ansible_network_os=ios
# dist_switch_1 ansible_host=192.168.1.20 ansible_network_os=nxos
#
# Group Variables (group_vars/network_switches.yml):
# ansible_user: "{{ vault_network_username }}"
# ansible_password: "{{ vault_network_password }}"
# ansible_become_password: "{{ vault_enable_secret }}"
# ansible_connection: network_cli
# ansible_become: yes
# ansible_become_method: enable

- name: VLAN Configuration and Management
  hosts: network_switches
  gather_facts: no

  vars:
    vlans_config:
      - vlan_id: 10
        name: Management
        description: Device Management VLAN
      - vlan_id: 20
        name: Production
        description: Production Workloads VLAN
      - vlan_id: 30
        name: Guest
        description: Guest Access VLAN
      - vlan_id: 99
        name: Native
        description: Native VLAN

  tasks:
    - name: Gather device capabilities and version
      cisco.ios.ios_facts:
        gather_subset:
          - min
          - hardware
      register: device_facts
      retries: 3
      delay: 10
      until: device_facts is succeeded
      when: ansible_network_os == 'ios'

    - name: Display target device information
      debug:
        msg: "Device {{ inventory_hostname }} | OS: {{ device_facts.ansible_facts.ansible_net_version }} | Model: {{ device_facts.ansible_facts.ansible_net_model }}"
      when: device_facts is succeeded

    - name: Configure VLANs on IOS/IOS-XE devices
      cisco.ios.ios_vlans:
        state: merged
        config:
          - vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
      loop: "{{ vlans_config }}"
      register: ios_vlan_changes
      retries: 2
      delay: 5
      when: ansible_network_os in ['ios', 'iosxe']

    - name: Configure VLANs on NX-OS devices
      cisco.nxos.nxos_vlans:
        state: merged
        config:
          - vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
      loop: "{{ vlans_config }}"
      register: nxos_vlan_changes
      retries: 2
      delay: 5
      when: ansible_network_os == 'nxos'

    - name: Verify VLAN creation on IOS
      cisco.ios.ios_command:
        commands:
          - "show vlan id {{ item.vlan_id }} | include {{ item.name }}"
      loop: "{{ vlans_config }}"
      register: vlan_verification
      changed_when: false
      failed_when:
        - vlan_verification is failed
        - "'not found' in vlan_verification.stdout_lines[0] | default('')"
      when: ansible_network_os in ['ios', 'iosxe']

    - name: Display VLAN configuration results
      debug:
        msg: |
          Device: {{ inventory_hostname }}
          VLAN ID: {{ item.item.vlan_id }}
          VLAN Name: {{ item.item.name }}
          Verification Status: {{ 'OK' if item is succeeded else 'FAILED' }}
      loop: "{{ vlan_verification.results }}"
      when: vlan_verification.results is defined

    - name: Save running configuration
      cisco.ios.ios_config:
        save_when: always
      when: ios_vlan_changes is changed and ansible_network_os in ['ios', 'iosxe']

  rescue:
    - name: Log configuration error
      debug:
        msg: "Error on {{ inventory_hostname }} - {{ ansible_failed_task.name }}: {{ ansible_failed_result.msg }}"

    - name: Verify device connectivity after failure
      cisco.ios.ios_command:
        commands: "show ip interface brief | include up"
      register: connectivity_check
      ignore_errors: yes
      when: ansible_network_os in ['ios', 'iosxe']

    - name: Display device status
      debug:
        msg: "{{ connectivity_check.stdout_lines }}"
      when: connectivity_check is succeeded
```