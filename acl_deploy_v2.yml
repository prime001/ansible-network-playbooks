---
# Ansible Playbook: ACL Deploy with Automated Rollback
# Deploys named extended ACLs to Cisco IOS devices with pre/post
# verification and automatic rollback on validation failure.
#
# Credentials: store in Ansible Vault
#   ansible-vault encrypt_string 'password' --name 'ansible_password'
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.0.1
#   rtr-core-02 ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=cisco.ios.ios
#   ansible_connection=ansible.netcommon.network_cli
#   ansible_user=netops
#   ansible_password=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     ...

- name: Deploy ACLs with pre-check and automatic rollback on IOS devices
  hosts: core_routers
  gather_facts: false
  vars:
    # Credentials — source from vault in production
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_pass }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_pass: "{{ vault_enable_pass }}"

    acls_to_deploy:
      - name: ACL_MGMT_IN
        acl_type: extended
        entries:
          - sequence: 10
            grant: permit
            protocol: tcp
            source:
              address: 10.10.0.0
              wildcard_bits: 0.0.0.255
            destination:
              any: true
            port_protocol:
              eq: "22"
          - sequence: 20
            grant: permit
            protocol: icmp
            source:
              address: 10.0.0.0
              wildcard_bits: 0.255.255.255
            destination:
              any: true
          - sequence: 100
            grant: deny
            protocol: ip
            source:
              any: true
            destination:
              any: true
            log: true

  tasks:
    - name: Capture pre-deploy ACL snapshot
      cisco.ios.ios_command:
        commands:
          - show ip access-lists
      register: acl_snapshot_before
      retries: 2
      delay: 5

    - name: Deploy ACLs
      block:
        - name: Apply ACL configuration
          cisco.ios.ios_acls:
            config:
              - afi: ipv4
                acls: "{{ acls_to_deploy }}"
            state: replaced
          register: acl_deploy_result

        - name: Save configuration after successful deploy
          cisco.ios.ios_command:
            commands:
              - write memory
          register: save_result
          failed_when: "'OK' not in save_result.stdout[0] and '[OK]' not in save_result.stdout[0]"

        - name: Verify deployed ACLs are present
          cisco.ios.ios_command:
            commands:
              - "show ip access-lists {{ item.name }}"
          register: acl_verify
          failed_when: item.name not in acl_verify.stdout[0]
          loop: "{{ acls_to_deploy }}"

      rescue:
        - name: Rollback — restore ACLs from pre-deploy snapshot
          cisco.ios.ios_config:
            lines:
              - "no ip access-list extended {{ item.name }}"
          loop: "{{ acls_to_deploy }}"

        - name: Fail with rollback notice
          ansible.builtin.fail:
            msg: "ACL deployment failed on {{ inventory_hostname }}. Rolled back to pre-deploy state."

    - name: Display deploy change summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Changed: {{ acl_deploy_result.changed }}"
          - "Commands sent: {{ acl_deploy_result.commands | default([]) }}"

    - name: Display post-deploy ACL state
      cisco.ios.ios_command:
        commands:
          - show ip access-lists
      register: acl_snapshot_after

    - name: Show ACL state diff summary
      ansible.builtin.debug:
        msg: "Post-deploy ACL output for {{ inventory_hostname }}: {{ acl_snapshot_after.stdout[0] }}