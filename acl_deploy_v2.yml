---
# acl_deploy_v3.yml
# Deploy named IPv4 ACLs via the ios_acls resource module with pre-change
# snapshot and automatic rollback on post-deployment verification failure.
# Uses "replaced" state for idempotent, diff-aware reconciliation vs the
# additive ios_config approach used in v1/v2.
#
# Vault: encrypt ansible_password in group_vars/
#   ansible-vault encrypt_string 'secret' --name 'ansible_password'
#
# Inventory example:
#   [edge_routers]
#   edge-01  ansible_host=10.0.1.1  ansible_network_os=ios
#   edge-02  ansible_host=10.0.1.2  ansible_network_os=ios
#
#   [edge_routers:vars]
#   ansible_connection=network_cli
#   ansible_user=netops
#   ansible_password=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     ...
#   ansible_become=yes
#   ansible_become_method=enable

- name: Deploy edge ACLs with resource module and automatic rollback
  hosts: edge_routers
  gather_facts: false

  vars:
    acl_policy:
      - name: EDGE_INBOUND
        acl_type: extended
        aces:
          - sequence: 10
            grant: permit
            protocol_options:
              tcp: true
            source:
              any: true
            destination:
              address: 203.0.113.0
              wildcard_bits: 0.0.0.255
              port_protocol:
                eq: www
          - sequence: 20
            grant: permit
            protocol_options:
              tcp: true
            source:
              any: true
            destination:
              address: 203.0.113.0
              wildcard_bits: 0.0.0.255
              port_protocol:
                eq: 443
          - sequence: 30
            grant: permit
            protocol_options:
              icmp: true
            source:
              address: 10.0.0.0
              wildcard_bits: 0.255.255.255
            destination:
              any: true
          - sequence: 900
            grant: deny
            protocol_options:
              ip: true
            source:
              any: true
            destination:
              any: true
            log: true

  tasks:
    - name: Snapshot ACL state before changes
      cisco.ios.ios_command:
        commands:
          - show ip access-lists
      register: acl_before
      retries: 2
      delay: 3

    - name: Deploy ACL policy with rollback on failure
      block:
        - name: Push ACLs via resource module (replaced state)
          cisco.ios.ios_acls:
            config:
              - afi: ipv4
                acls: "{{ acl_policy }}"
            state: replaced
          register: acl_push_result

        - name: Verify each ACL is present after deployment
          cisco.ios.ios_command:
            commands:
              - "show ip access-lists {{ item }}"
          register: acl_verify
          failed_when: >
            'Extended IP access list ' + item not in acl_verify.stdout[0]
          loop: "{{ acl_policy | map(attribute='name') | list }}"
          retries: 2
          delay: 3

        - name: Report deployment summary
          ansible.builtin.debug:
            msg:
              host: "{{ inventory_hostname }}"
              changed: "{{ acl_push_result.changed }}"
              acls_managed: "{{ acl_policy | map(attribute='name') | list }}"

      rescue:
        - name: Log rollback trigger
          ansible.builtin.debug:
            msg: "ACL deploy failed on {{ inventory_hostname }}, removing pushed ACLs"

        - name: Remove deployed ACLs to restore prior state
          cisco.ios.ios_acls:
            config:
              - afi: ipv4
                acls: "{{ acl_policy }}"
            state: deleted
          ignore_errors: true

        - name: Fail after rollback attempt
          ansible.builtin.fail:
            msg: "Deployment rolled back on {{ inventory_hostname }}"

    - name: Save configuration to NVRAM
      cisco.ios.ios_command:
        commands:
          - write memory
      when: acl_push_result.changed | default(false)
