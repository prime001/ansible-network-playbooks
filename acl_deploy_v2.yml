```yaml
---
# Ansible Playbook: Named Extended ACL with Object-Group Deployment
# Manages scalable inbound ACL policies using network object-groups on IOS devices.
# Provides pre-deployment snapshot, automatic rollback on failure, and post-deploy verification.
# Requires: ansible-galaxy collection install cisco.ios
#
# Inventory example:
#   [distribution_switches]
#   dsw-01 ansible_host=10.0.2.1
#   dsw-02 ansible_host=10.0.2.2
#
#   [distribution_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}            # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}        # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}  # ansible-vault encrypted

- name: Deploy Named Extended ACL with Object-Groups on IOS Devices
  hosts: distribution_switches
  gather_facts: false
  vars:
    acl_name: "{{ acl_policy_name | default('CORP-INBOUND') }}"
    trusted_group: "TRUSTED-NETS"
    blocked_group: "BLOCKED-NETS"
    trusted_networks:
      - "network 10.100.0.0 0.0.255.255"
      - "network 172.16.0.0 0.0.255.255"
    blocked_networks:
      - "network 10.200.99.0 0.0.0.255"
      - "network 203.0.113.0 0.0.0.255"
    apply_interface: "{{ target_interface | default('GigabitEthernet1/0/1') }}"
    acl_direction: "{{ direction | default('in') }}"

  tasks:
    - name: Capture pre-deployment ACL and interface state
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
          - "show ip interface {{ apply_interface }} | include access list"
      register: pre_state
      failed_when: false

    - name: Display pre-deployment state
      ansible.builtin.debug:
        msg: "{{ pre_state.stdout_lines }}"

    - name: Deploy object-groups and ACL policy
      block:
        - name: Configure trusted-source network object-group
          cisco.ios.ios_config:
            lines: "{{ trusted_networks }}"
            parents: "object-group network {{ trusted_group }}"

        - name: Configure blocked-source network object-group
          cisco.ios.ios_config:
            lines: "{{ blocked_networks }}"
            parents: "object-group network {{ blocked_group }}"

        - name: Configure named extended ACL with object-group references
          cisco.ios.ios_config:
            lines:
              - "10 deny   ip object-group {{ blocked_group }} any log"
              - "20 permit ip object-group {{ trusted_group }} any"
              - "30 permit ip any any"
            parents: "ip access-list extended {{ acl_name }}"

        - name: Apply ACL to interface
          cisco.ios.ios_config:
            lines:
              - "ip access-group {{ acl_name }} {{ acl_direction }}"
            parents: "interface {{ apply_interface }}"
          register: interface_bind
          retries: 2
          delay: 5
          until: interface_bind is not failed

        - name: Save running configuration to startup
          cisco.ios.ios_config:
            save_when: changed

      rescue:
        - name: Report failure and begin rollback
          ansible.builtin.debug:
            msg: "ACL deployment failed on {{ inventory_hostname }}. Removing interface binding."

        - name: Remove ACL interface binding to restore traffic flow
          cisco.ios.ios_config:
            lines:
              - "no ip access-group {{ acl_name }} {{ acl_direction }}"
            parents: "interface {{ apply_interface }}"
          failed_when: false

        - name: Fail task after rollback completes
          ansible.builtin.fail:
            msg: "Deployment on {{ inventory_hostname }} rolled back. Review errors above."

    - name: Verify ACL binding is active on interface
      cisco.ios.ios_command:
        commands:
          - "show ip interface {{ apply_interface }} | include access list"
      register: verify_bind
      failed_when: acl_name not in verify_bind.stdout[0]

    - name: Capture post-deployment ACL hit counters
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
      register: post_state

    - name: Display final ACL configuration and hit counters
      ansible.builtin.debug:
        msg: "{{ post_state.stdout_lines }}"
```