---
# Prefix-List Deployment Playbook
# Manages BGP route-filter prefix lists on Cisco IOS/IOS-XE devices
#
# Inventory example:
#   [routers]
#   r1 ansible_host=10.0.1.1
#   r2 ansible_host=10.0.1.2
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable }}
#   # Store credentials with: ansible-vault encrypt_string

- name: Deploy BGP prefix lists for route filtering
  hosts: routers
  gather_facts: false

  vars:
    # Credentials sourced from ansible-vault encrypted group_vars
    net_user: "{{ vault_net_user }}"
    net_password: "{{ vault_net_password }}"

    prefix_lists:
      - name: ALLOWED_PREFIXES_IN
        description: "Inbound BGP routes accepted from peers"
        entries:
          - sequence: 10
            action: permit
            prefix: 10.0.0.0/8
            ge: 16
            le: 24
          - sequence: 20
            action: permit
            prefix: 172.16.0.0/12
            ge: 20
            le: 28
          - sequence: 999
            action: deny
            prefix: 0.0.0.0/0
            le: 32

      - name: ALLOWED_PREFIXES_OUT
        description: "Outbound prefixes advertised to BGP peers"
        entries:
          - sequence: 10
            action: permit
            prefix: 192.168.100.0/24
          - sequence: 20
            action: permit
            prefix: 192.168.200.0/24
          - sequence: 999
            action: deny
            prefix: 0.0.0.0/0
            le: 32

  tasks:
    - name: Push prefix lists to device
      block:
        - name: Configure prefix list entries
          cisco.ios.ios_prefix_lists:
            config:
              - afi: ipv4
                prefix_lists:
                  - name: "{{ item.0.name }}"
                    description: "{{ item.0.description }}"
                    entries:
                      - sequence: "{{ item.1.sequence }}"
                        action: "{{ item.1.action }}"
                        prefix: "{{ item.1.prefix }}"
                        ge: "{{ item.1.ge | default(omit) }}"
                        le: "{{ item.1.le | default(omit) }}"
            state: merged
          loop: "{{ prefix_lists | subelements('entries') }}"
          loop_control:
            label: "{{ item.0.name }} seq {{ item.1.sequence }}"
          register: prefix_result
          retries: 2
          delay: 5
          until: prefix_result is not failed

        - name: Verify prefix lists are present
          cisco.ios.ios_command:
            commands:
              - "show ip prefix-list summary"
          register: verify_output
          failed_when: >
            'ALLOWED_PREFIXES_IN' not in verify_output.stdout[0] or
            'ALLOWED_PREFIXES_OUT' not in verify_output.stdout[0]

        - name: Display prefix list summary
          ansible.builtin.debug:
            msg: "{{ verify_output.stdout_lines[0] }}"

      rescue:
        - name: Log failure details
          ansible.builtin.debug:
            msg: "Prefix list deployment failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "Prefix list deployment could not complete on {{ inventory_hostname }}. Review device connectivity and BGP config.