---
# acl_deploy_v3.yml — Named ACL deployment with pre-change snapshot and automatic rollback
#
# Deploys a named extended ACL to Cisco IOS routers, captures pre-change state,
# validates the deployed config, and rolls back cleanly if any step fails.
# This extends v1/v2 by adding block/rescue rollback and interface binding verification.
#
# Credentials via Ansible Vault:
#   ansible_password: !vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     ...
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.1.1
#   rtr-core-02  ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_user=netops
#   ansible_password: !vault |...
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable

- name: Deploy named ACL with snapshot and rollback on failure — Cisco IOS
  hosts: core_routers
  gather_facts: false

  vars:
    acl_name: "MGMT_RESTRICT_IN"
    apply_interface: "GigabitEthernet0/1"
    apply_direction: "in"
    acl_lines:
      - "10 permit tcp 10.10.0.0 0.0.0.255 any eq 22"
      - "20 permit tcp 10.10.0.0 0.0.0.255 any eq 443"
      - "30 permit icmp 10.10.0.0 0.0.0.255 any"
      - "100 deny ip any any log"

  tasks:
    - name: Capture pre-change ACL and interface snapshot
      cisco.ios.ios_command:
        commands:
          - "show ip access-lists {{ acl_name }}"
          - "show ip interface {{ apply_interface }} | include access list"
      register: pre_change_snapshot
      retries: 2
      delay: 5
      failed_when: false

    - name: Log pre-change state
      ansible.builtin.debug:
        msg: "Pre-change snapshot on {{ inventory_hostname }}: {{ pre_change_snapshot.stdout }}"

    - name: Deploy ACL and bind to interface
      block:
        - name: Push named ACL entries — exact replace to avoid stale sequences
          cisco.ios.ios_config:
            lines: "{{ acl_lines }}"
            parents: "ip access-list extended {{ acl_name }}"
            match: exact
            replace: block
          register: acl_push_result

        - name: Bind ACL to interface
          cisco.ios.ios_config:
            lines:
              - "ip access-group {{ acl_name }} {{ apply_direction }}"
            parents: "interface {{ apply_interface }}"
          register: intf_bind_result

        - name: Verify ACL is present with expected entries
          cisco.ios.ios_command:
            commands:
              - "show ip access-lists {{ acl_name }}"
          register: acl_verify
          retries: 3
          delay: 3
          failed_when: >
            acl_name not in acl_verify.stdout[0] or
            acl_verify.stdout[0] == ''

        - name: Confirm ACL is bound on interface
          cisco.ios.ios_command:
            commands:
              - "show ip interface {{ apply_interface }} | include inbound"
          register: intf_verify
          failed_when: acl_name not in intf_verify.stdout[0]

        - name: Save running config to startup
          cisco.ios.ios_command:
            commands:
              - write memory

        - name: Display deployed ACL with hit counters
          ansible.builtin.debug:
            msg: "{{ acl_verify.stdout[0] }}"

      rescue:
        - name: Deployment failed — initiating rollback
          ansible.builtin.debug:
            msg: "ACL deployment failed on {{ inventory_hostname }}. Removing binding and definition."

        - name: Remove ACL from interface
          cisco.ios.ios_config:
            lines:
              - "no ip access-group {{ acl_name }} {{ apply_direction }}"
            parents: "interface {{ apply_interface }}"
          ignore_errors: true

        - name: Remove ACL definition
          cisco.ios.ios_config:
            lines:
              - "no ip access-list extended {{ acl_name }}"
          ignore_errors: true

        - name: Abort with rollback notice
          ansible.builtin.fail:
            msg: "ACL deploy rolled back on {{ inventory_hostname }}. Review errors above."

      always:
        - name: Capture final ACL state
          cisco.ios.ios_command:
            commands:
              - "show ip access-lists {{ acl_name }}"
          register: post_state
          failed_when: false

        - name: Report final state
          ansible.builtin.debug:
            msg: >
              Final state on {{ inventory_hostname }}:
              {{ post_state.stdout[0] | default('ACL not present — rollback succeeded') }}