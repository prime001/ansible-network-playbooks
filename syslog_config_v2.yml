---
# vlan_management.yml
#
# Manages the VLAN database on Cisco IOS/IOS-XE switches:
# creates VLANs, assigns names, and verifies active state.
#
# Inventory example:
#   [switches]
#   sw-core-01  ansible_host=10.0.1.1
#   sw-access-01 ansible_host=10.0.1.2
#
#   [switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_network_user }}
#   ansible_password={{ vault_network_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#
# Vault usage: ansible-vault encrypt_string 'secret' --name 'vault_network_password'
# Run: ansible-playbook vlan_management.yml -i inventory/switches.ini --ask-vault-pass

- name: VLAN Database Management on Cisco IOS Switches
  hosts: switches
  gather_facts: false

  vars:
    ansible_user: "{{ vault_network_user }}"
    ansible_password: "{{ vault_network_password }}"
    ansible_become_password: "{{ vault_enable_password }}"
    vlans:
      - vlan_id: 10
        name: CORP_USERS
      - vlan_id: 20
        name: CORP_SERVERS
      - vlan_id: 30
        name: MANAGEMENT
      - vlan_id: 40
        name: GUEST_WIFI
      - vlan_id: 99
        name: NATIVE_UNUSED

  tasks:
    - name: Capture VLAN database before changes
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_before
      retries: 3
      delay: 5
      until: vlan_before is not failed

    - name: Display pre-change VLAN state
      ansible.builtin.debug:
        var: vlan_before.stdout_lines

    - name: Apply VLAN configuration
      block:
        - name: Create and name VLANs
          cisco.ios.ios_vlans:
            config: "{{ vlans }}"
            state: merged
          register: vlan_result

        - name: Verify each VLAN reached active state
          cisco.ios.ios_command:
            commands:
              - "show vlan id {{ item.vlan_id }}"
          loop: "{{ vlans }}"
          register: vlan_verify
          failed_when: "'active' not in vlan_verify.stdout[0]"
          loop_control:
            label: "VLAN {{ item.vlan_id }} - {{ item.name }}"

        - name: Report configuration outcome
          ansible.builtin.debug:
            msg: "VLAN {{ item.item.vlan_id }} ({{ item.item.name }}) verified active on {{ inventory_hostname }}"
          loop: "{{ vlan_verify.results }}"
          loop_control:
            label: "VLAN {{ item.item.vlan_id }}"

      rescue:
        - name: Collect diagnostic state after failure
          cisco.ios.ios_command:
            commands:
              - show vlan brief
              - show interfaces trunk
          register: rescue_diag

        - name: Display failure diagnostics
          ansible.builtin.debug:
            msg:
              - "VLAN config failed on {{ inventory_hostname }}"
              - "{{ rescue_diag.stdout_lines }}"

        - name: Abort with descriptive message
          ansible.builtin.fail:
            msg: >
              VLAN deployment failed on {{ inventory_hostname }}.
              Failed task: {{ ansible_failed_task.name }}.
              Error: {{ ansible_failed_result.msg | default('see diagnostics above') }}

      always:
        - name: Capture VLAN database after changes
          cisco.ios.ios_command:
            commands:
              - show vlan brief
          register: vlan_after

        - name: Save running config to startup
          cisco.ios.ios_command:
            commands:
              - write memory
          register: save_result
          failed_when:
            - "'OK' not in save_result.stdout[0]"
            - "'Building configuration' not in save_result.stdout[0]"

        - name: Confirm save succeeded
          ansible.builtin.debug:
            msg: "Configuration saved on {{ inventory_hostname }}: {{ save_result.stdout[0] | trim }}