---
# ip_sla_config.yml
# Configures IP SLA probes (ICMP echo and UDP jitter) for end-to-end path monitoring.
# Schedules probes, verifies operational status, and reports RTT/jitter baselines.
#
# Credentials sourced from Ansible Vault — see group_vars/all/vault.yml:
#   vault_net_user, vault_net_password, vault_net_enable
#
# Inventory example:
#   [wan_routers]
#   rtr-wan-01  ansible_host=10.0.1.1
#   rtr-wan-02  ansible_host=10.0.1.2
#
#   [wan_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_user }}"
#   ansible_password="{{ vault_net_password }}"
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password="{{ vault_net_enable }}"

- name: Deploy and verify IP SLA probes on IOS/IOS-XE WAN routers
  hosts: wan_routers
  gather_facts: false

  vars:
    sla_icmp_id: 10
    sla_jitter_id: 20
    sla_icmp_target: "8.8.8.8"
    sla_jitter_target: "10.0.255.1"
    sla_jitter_port: 5000
    sla_frequency: 60
    sla_threshold: 500
    sla_owner: "ansible-noc"

  tasks:
    - name: Configure IP SLA probes
      block:
        - name: Apply ICMP echo and UDP jitter SLA probes
          cisco.ios.ios_config:
            lines:
              - "ip sla {{ sla_icmp_id }}"
              - " icmp-echo {{ sla_icmp_target }}"
              - " frequency {{ sla_frequency }}"
              - " threshold {{ sla_threshold }}"
              - " owner {{ sla_owner }}"
              - "ip sla schedule {{ sla_icmp_id }} life forever start-time now"
              - "ip sla {{ sla_jitter_id }}"
              - " udp-jitter {{ sla_jitter_target }} {{ sla_jitter_port }}"
              - " frequency {{ sla_frequency }}"
              - " threshold {{ sla_threshold }}"
              - " owner {{ sla_owner }}"
              - "ip sla schedule {{ sla_jitter_id }} life forever start-time now"
          register: sla_config_result
          retries: 2
          delay: 5
          until: sla_config_result is not failed

      rescue:
        - name: Report SLA configuration failure
          ansible.builtin.debug:
            msg: "IP SLA config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort play for failed host
          ansible.builtin.fail:
            msg: "IP SLA deployment failed on {{ inventory_hostname }}. Manual review required."

    - name: Pause to allow initial probe cycles to complete
      ansible.builtin.pause:
        seconds: 10

    - name: Collect IP SLA operational statistics
      cisco.ios.ios_command:
        commands:
          - "show ip sla statistics {{ sla_icmp_id }}"
          - "show ip sla statistics {{ sla_jitter_id }}"
          - "show ip sla summary"
      register: sla_stats
      failed_when: >
        'Latest RTT' not in sla_stats.stdout[0] or
        'No Such Entry' in sla_stats.stdout[0]

    - name: Display ICMP echo probe results
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "ICMP Echo SLA (ID {{ sla_icmp_id }}) -> Target: {{ sla_icmp_target }}"
          - "{{ sla_stats.stdout[0] }}"

    - name: Display UDP jitter probe results
      ansible.builtin.debug:
        msg:
          - "UDP Jitter SLA (ID {{ sla_jitter_id }}) -> Target: {{ sla_jitter_target }}:{{ sla_jitter_port }}"
          - "{{ sla_stats.stdout[1] }}"

    - name: Save running configuration
      cisco.ios.ios_command:
        commands:
          - write memory
      register: save_result

    - name: Confirm save status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} config saved: {{ save_result.stdout[0] | trim }}