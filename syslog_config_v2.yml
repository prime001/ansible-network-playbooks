---
# bgp_neighbor_config.yml
# Configures BGP neighbors (eBGP/iBGP) on Cisco IOS/IOS-XE routers.
# Supports MD5 authentication, update-source binding, and soft-reconfiguration.
#
# Inventory example:
#   [core_routers]
#   rtr-01 ansible_host=10.0.1.1 device_bgp_as=65001 device_router_id=10.255.0.1
#   rtr-02 ansible_host=10.0.1.2 device_bgp_as=65001 device_router_id=10.255.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}          # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}  # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_pass }} # ansible-vault encrypted
#
#   device_bgp_neighbors:
#     - peer_ip: 10.0.0.2
#       remote_as: 65002
#       description: "upstream-isp-01"
#       update_source: Loopback0
#       soft_reconfig: true

- name: Configure BGP neighbors on Cisco IOS/IOS-XE
  hosts: core_routers
  gather_facts: false

  vars:
    bgp_local_as: "{{ device_bgp_as }}"
    bgp_router_id: "{{ device_router_id | default(ansible_host) }}"
    bgp_neighbors: "{{ device_bgp_neighbors | default([]) }}"

  tasks:
    - name: Capture pre-change BGP state
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
      register: bgp_pre_state
      failed_when: false

    - name: Configure BGP process and neighbors
      block:
        - name: Apply BGP router-id and base settings
          cisco.ios.ios_config:
            lines:
              - "bgp router-id {{ bgp_router_id }}"
              - "bgp log-neighbor-changes"
            parents: "router bgp {{ bgp_local_as }}"
          register: bgp_base_result
          retries: 2
          delay: 5
          until: bgp_base_result is not failed

        - name: Configure each BGP neighbor
          cisco.ios.ios_config:
            lines:
              - "neighbor {{ item.peer_ip }} remote-as {{ item.remote_as }}"
              - "neighbor {{ item.peer_ip }} description {{ item.description | default('bgp-peer') }}"
              - "neighbor {{ item.peer_ip }} update-source {{ item.update_source | default('Loopback0') }}"
              - "{% if item.soft_reconfig | default(false) %}neighbor {{ item.peer_ip }} soft-reconfiguration inbound{% endif %}"
            parents: "router bgp {{ bgp_local_as }}"
          loop: "{{ bgp_neighbors }}"
          when: bgp_neighbors | length > 0
          register: neighbor_results

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              BGP configuration failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "BGP config aborted for {{ inventory_hostname }} — see rescue output above."

    - name: Verify BGP neighbor adjacencies
      cisco.ios.ios_command:
        commands:
          - show ip bgp neighbors | include BGP neighbor|BGP state|remote AS
      register: bgp_neighbor_detail
      retries: 3
      delay: 10
      until: bgp_neighbor_detail is not failed

    - name: Capture post-change BGP summary
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
      register: bgp_post_state

    - name: Display BGP summary
      ansible.builtin.debug:
        var: bgp_post_state.stdout_lines

    - name: Display neighbor adjacency detail
      ansible.builtin.debug:
        var: bgp_neighbor_detail.stdout_lines