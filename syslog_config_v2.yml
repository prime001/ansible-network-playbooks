---
# Ansible Playbook: Advanced Syslog Configuration
# Configures syslog buffering, source-interface binding, and rate-limiting
# on Cisco IOS/IOS-XE devices. Verifies log host reachability after apply.
#
# Credentials: stored in Ansible Vault (ansible-vault encrypt_string)
#   ansible_user: "{{ vault_net_user }}"
#   ansible_password: "{{ vault_net_pass }}"
#   ansible_become_password: "{{ vault_enable_pass }}"
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable

- name: Configure advanced syslog parameters on IOS/IOS-XE devices
  hosts: core_routers
  gather_facts: false

  vars:
    syslog_servers:
      - host: "10.100.0.50"
        facility: local6
        severity: informational
      - host: "10.100.0.51"
        facility: local6
        severity: warnings
    syslog_source_interface: Loopback0
    syslog_buffer_size: 32768
    syslog_buffer_severity: debugging
    syslog_rate_limit: 10000
    syslog_origin_id: hostname

  tasks:
    - name: Apply syslog buffer, rate-limit, and source-interface config
      block:
        - name: Push syslog buffer and source settings
          cisco.ios.ios_config:
            lines:
              - "logging buffered {{ syslog_buffer_size }} {{ syslog_buffer_severity }}"
              - "logging source-interface {{ syslog_source_interface }}"
              - "logging origin-id {{ syslog_origin_id }}"
              - "logging rate-limit {{ syslog_rate_limit }} except warnings"
            save_when: changed
          register: buffer_result
          retries: 2
          delay: 5
          until: buffer_result is not failed

        - name: Configure each syslog server with facility and severity
          cisco.ios.ios_config:
            lines:
              - "logging host {{ item.host }} transport udp port 514"
              - "logging facility {{ item.facility }}"
            save_when: changed
          loop: "{{ syslog_servers }}"
          loop_control:
            label: "{{ item.host }}"
          register: server_result
          retries: 2
          delay: 5
          until: server_result is not failed

        - name: Verify syslog server reachability via ping
          cisco.ios.ios_command:
            commands:
              - "ping {{ item.host }} source {{ syslog_source_interface }} repeat 3"
          loop: "{{ syslog_servers }}"
          loop_control:
            label: "{{ item.host }}"
          register: ping_result
          failed_when: "'Success rate is 0' in ping_result.stdout[0]"

        - name: Capture current logging state
          cisco.ios.ios_command:
            commands:
              - show logging
          register: logging_state

        - name: Display logging summary
          ansible.builtin.debug:
            msg: "{{ logging_state.stdout_lines[0][:20] }}"

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              Syslog config failed on {{ inventory_hostname }}.
              Buffer result: {{ buffer_result | default('not reached') }}.
              Check connectivity to syslog servers and source interface state.

        - name: Fail play after rescue reporting
          ansible.builtin.fail:
            msg: "Syslog configuration did not complete cleanly on {{ inventory_hostname }}