---
# logging_optimization.yml
#
# Tunes IOS logging buffer, applies rate-limits and discriminators to reduce
# noise, then verifies configured syslog servers are reachable from each device.
# Distinct from syslog_config.yml (server destinations) — this playbook handles
# logging subsystem performance and connectivity validation.
#
# Credentials: ansible-vault encrypted vars in group_vars/network/vault.yml
#   vault_ansible_user, vault_ansible_password, vault_ansible_become_password
#
# Inventory example:
#   [core_switches]
#   core-sw-01  ansible_host=10.0.0.1
#   core-sw-02  ansible_host=10.0.0.2
#
#   [distribution_routers]
#   dist-rtr-01  ansible_host=10.0.1.1
#
#   [network:children]
#   core_switches
#   distribution_routers
#
#   [network:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli

- name: IOS Logging Optimization - Buffer Tuning, Rate-Limits, and Reachability Audit
  hosts: network
  gather_facts: false
  vars:
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_ansible_become_password }}"

    logging_buffer_size: 1048576
    logging_rate_limit_per_sec: 500
    logging_rate_limit_except_severity: 3
    syslog_servers:
      - host: 10.255.0.10
        vrf: MGMT
      - host: 10.255.0.11
        vrf: MGMT

  tasks:
    - name: Apply logging buffer and rate-limit tuning
      block:
        - name: Configure buffer size, rate-limit, and debug discriminator
          cisco.ios.ios_config:
            lines:
              - "logging buffered {{ logging_buffer_size }} informational"
              - "logging rate-limit {{ logging_rate_limit_per_sec }} except {{ logging_rate_limit_except_severity }}"
              - "logging discriminator DROP_DEBUG severity drops 7"
              - "logging buffered discriminator DROP_DEBUG"
            match: line
          register: buffer_config
          retries: 2
          delay: 5
          until: buffer_config is not failed

        - name: Report buffer configuration outcome
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }}: logging buffer/rate-limit applied (changed={{ buffer_config.changed }})"

      rescue:
        - name: Alert on configuration failure
          ansible.builtin.debug:
            msg: "ERROR on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Fail host after rescue logging
          ansible.builtin.fail:
            msg: "Logging optimization failed on {{ inventory_hostname }} — manual review required"

    - name: Ping each syslog server from device
      cisco.ios.ios_command:
        commands:
          - "ping vrf {{ item.vrf }} {{ item.host }} repeat 5 timeout 2"
      loop: "{{ syslog_servers }}"
      register: syslog_ping
      failed_when: false

    - name: Report syslog server reachability
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} -> {{ item.item.host }} (VRF={{ item.item.vrf }}):
          {{ 'REACHABLE' if ('!!!!' in item.stdout[0] or 'Success rate is 100' in item.stdout[0])
          else 'UNREACHABLE - verify routing and VRF assignment' }}
      loop: "{{ syslog_ping.results }}"
      loop_control:
        label: "{{ item.item.host }}"

    - name: Collect logging drop and rate-limit counters
      cisco.ios.ios_command:
        commands:
          - "show logging | include dropped|rate-limited|Buffer logging"
      register: logging_stats
      failed_when:
        - logging_stats.failed is defined
        - logging_stats.failed

    - name: Display logging subsystem statistics
      ansible.builtin.debug:
        var: logging_stats.stdout_lines