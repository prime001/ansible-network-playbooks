# Ansible Playbook: IOS Local Logging Buffer and Severity Configuration
#
# Configures local logging parameters on Cisco IOS devices:
#   - Log buffer size and message severity threshold
#   - Console and VTY monitor severity levels
#   - Logging synchronous on console and VTY lines (prevents CLI interleaving)
#   - Rate-limit guard to reduce console flooding in production
#
# Complements syslog_config.yml (remote server destinations) with
# local buffer and session logging controls — does not reconfigure
# remote syslog hosts.
#
# Credentials (ansible-vault encrypted in group_vars/network/vault.yml):
#   ansible_user:            "{{ vault_net_username }}"
#   ansible_password:        "{{ vault_net_password }}"
#   ansible_become_password: "{{ vault_enable_password }}"
#
# Inventory example:
# ---
# all:
#   children:
#     routers:
#       hosts:
#         rtr-core-01:
#           ansible_host: 10.0.1.1
#         rtr-core-02:
#           ansible_host: 10.0.1.2
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_become: true
#         ansible_become_method: enable
#
# Usage:
#   ansible-playbook logging_local_config.yml -i inventory/prod.yml \
#     --ask-vault-pass

- name: Configure IOS local logging buffer, severity, and session settings
  hosts: routers
  gather_facts: false

  vars:
    log_buffer_size: 51200
    log_buffer_severity: informational
    log_console_severity: critical
    log_monitor_severity: warnings
    log_rate_limit: 100
    enable_log_sync: true

  tasks:

    - name: Confirm device is reachable
      cisco.ios.ios_command:
        commands:
          - show version | include IOS-XE|IOS Software
      register: ios_version
      retries: 3
      delay: 5
      until: ios_version is not failed

    - name: Apply local logging configuration
      block:

        - name: Set logging buffer size and severity
          cisco.ios.ios_config:
            lines:
              - "logging buffered {{ log_buffer_size }} {{ log_buffer_severity }}"
              - "logging console {{ log_console_severity }}"
              - "logging monitor {{ log_monitor_severity }}"
              - "logging rate-limit {{ log_rate_limit }}"
              - "no logging on"
              - "logging on"
            save_when: changed

        - name: Enable logging synchronous on console line
          cisco.ios.ios_config:
            parents: line con 0
            lines:
              - logging synchronous
            save_when: changed
          when: enable_log_sync | bool

        - name: Enable logging synchronous on VTY lines
          cisco.ios.ios_config:
            parents: line vty 0 15
            lines:
              - logging synchronous
            save_when: changed
          when: enable_log_sync | bool

      rescue:

        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              Configuration FAILED on {{ inventory_hostname }}:
              {{ ansible_failed_task.name }} — {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Abort play after rescue
          ansible.builtin.fail:
            msg: "Local logging config failed on {{ inventory_hostname }}. Review and retry."

    - name: Verify applied logging configuration
      cisco.ios.ios_command:
        commands:
          - show logging | include Syslog|Buffer|Console|Monitor|rate
      register: logging_status
      failed_when: "'Syslog logging: enabled' not in logging_status.stdout[0]"

    - name: Display logging status for each device
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — Logging status:\n{{ logging_status.stdout[0] }}