---
# ospf_config.yml
# Deploys OSPFv2: process, router-id, network statements, passive interfaces,
# and area 0 MD5 authentication on Cisco IOS/IOS-XE routers.
#
# Credentials sourced from group_vars/all/vault.yml (ansible-vault encrypted):
#   vault_net_user, vault_net_pass, vault_ospf_md5_key
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.1.1  ospf_router_id=1.1.1.1
#   rtr-core-02  ansible_host=10.0.1.2  ospf_router_id=2.2.2.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_pass }}
#   ansible_become=yes
#   ansible_become_method=enable

- name: Configure OSPFv2 on Cisco IOS/IOS-XE core routers
  hosts: core_routers
  gather_facts: false

  vars:
    ospf_process_id: 1
    ospf_reference_bandwidth: 10000
    ospf_networks:
      - { prefix: "10.0.0.0", wildcard: "0.0.255.255", area: 0 }
      - { prefix: "192.168.100.0", wildcard: "0.0.0.255", area: 1 }
    ospf_passive_interfaces:
      - Loopback0
      - GigabitEthernet0/2
    ospf_backbone_auth: true
    ospf_md5_key_id: 1
    ospf_md5_key: "{{ vault_ospf_md5_key }}"  # ansible-vault encrypted

  tasks:

    - name: Verify device is reachable before making changes
      cisco.ios.ios_command:
        commands:
          - show version | include Software
      register: pre_check
      retries: 3
      delay: 5
      until: not pre_check.failed

    - name: Deploy OSPFv2 configuration
      block:

        - name: Configure OSPF process, router-id, and reference bandwidth
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_base_result

        - name: Advertise networks into OSPF areas
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"

        - name: Suppress OSPF hellos on stub and loopback interfaces
          cisco.ios.ios_config:
            lines:
              - "passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_passive_interfaces }}"

        - name: Enable MD5 authentication on backbone area
          cisco.ios.ios_config:
            lines:
              - "area 0 authentication message-digest"
            parents: "router ospf {{ ospf_process_id }}"
          when: ospf_backbone_auth | bool

        - name: Persist configuration to NVRAM
          cisco.ios.ios_config:
            save_when: modified

        - name: Wait for OSPF adjacencies to converge
          cisco.ios.ios_command:
            commands:
              - show ip ospf neighbor
          register: ospf_neighbor_output
          retries: 6
          delay: 10
          until: "'FULL' in ospf_neighbor_output.stdout[0] or not ospf_neighbor_output.failed"
          failed_when: false

        - name: Collect OSPF process summary
          cisco.ios.ios_command:
            commands:
              - show ip ospf
              - show ip ospf neighbor
          register: ospf_summary

        - name: Display OSPF state post-deployment
          debug:
            msg: "{{ ospf_summary.stdout_lines }}"

      rescue:
        - name: Capture diagnostics on configuration failure
          cisco.ios.ios_command:
            commands:
              - show ip ospf
              - show ip route ospf
              - show logging | last 30
          register: failure_diag
          ignore_errors: true

        - name: Display failure diagnostics
          debug:
            var: failure_diag.stdout_lines

        - name: Fail with actionable context
          fail:
            msg: >
              OSPFv2 deployment failed on {{ inventory_hostname }}.
              Failed task: {{ ansible_failed_task.name }}.
              Error: {{ ansible_failed_result.msg | default('review diagnostics above') }}