---
# syslog_filtering.yml
# Configures advanced syslog filtering, discriminators, and rate-limiting on IOS/IOS-XE.
# Complements syslog_config.yml (server targeting) with per-severity filtering and
# buffer tuning — useful when basic syslog is already deployed but noise needs taming.
#
# Inventory example:
#   [core_routers]
#   r1 ansible_host=10.0.1.1
#   r2 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}        # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable }}

- name: Configure syslog filtering, discriminators, and buffer tuning
  hosts: core_routers
  gather_facts: false

  vars:
    syslog_buffer_size: 65536
    syslog_buffer_severity: informational
    syslog_rate_limit: 10000        # messages per second, console
    syslog_source_interface: Loopback0
    discriminator_name: NOSEC
    discriminator_drop_pattern: "^%SEC-6-IPACCESSLOG"   # drop ACL hit noise

  tasks:
    - name: Apply syslog buffer size and severity
      cisco.ios.ios_config:
        lines:
          - "logging buffered {{ syslog_buffer_size }} {{ syslog_buffer_severity }}"
        replace: line
      register: buffer_result
      retries: 2
      delay: 5
      until: buffer_result is not failed

    - name: Set syslog source interface
      cisco.ios.ios_config:
        lines:
          - "logging source-interface {{ syslog_source_interface }}"
      register: src_iface_result
      failed_when:
        - src_iface_result.failed
        - "'Invalid' not in (src_iface_result.msg | default(''))"

    - name: Configure console rate-limiting to prevent storm
      cisco.ios.ios_config:
        lines:
          - "logging rate-limit {{ syslog_rate_limit }}"

    - name: Create message discriminator to drop ACL noise
      cisco.ios.ios_config:
        lines:
          - "logging discriminator {{ discriminator_name }} mnemonics drops {{ discriminator_drop_pattern }}"
          - "logging buffered discriminator {{ discriminator_name }}"

    - name: Verify syslog configuration on device
      cisco.ios.ios_command:
        commands:
          - show logging | include Logging to|Buffered|rate-limit|discriminator|Source
      register: syslog_verify
      failed_when: "'Logging to' not in syslog_verify.stdout[0]"

    - name: Display syslog verification output
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} syslog state:\n{{ syslog_verify.stdout[0] }}"

    - name: Save running config after changes
      cisco.ios.ios_command:
        commands:
          - write memory
      register: save_result
      when:
        - buffer_result.changed or src_iface_result.changed

    - name: Report save status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: config saved — {{ save_result.stdout[0] | default('no save needed') }}"
```