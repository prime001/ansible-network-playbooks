---
# ospf_config.yml
# Deploys and validates OSPF (Open Shortest Path First) on Cisco IOS routers.
# Sets process ID, router-ID, network statements, passive interfaces,
# and confirms adjacency formation after applying.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.10.0.1
#   rtr-core-02 ansible_host=10.10.0.2
#
#   [branch_routers]
#   rtr-branch-01 ansible_host=10.10.1.1
#
#   [all:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_network_user }}           # ansible-vault encrypted
#   ansible_password={{ vault_network_password }}   # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure OSPF routing on Cisco IOS routers
  hosts: core_routers:branch_routers
  gather_facts: false

  vars:
    ospf_process_id: 1
    ospf_reference_bandwidth: 1000  # Mbps — normalizes cost for GigE/10GigE links
    ospf_networks:
      - prefix: "10.10.0.0"
        wildcard: "0.0.0.255"
        area: 0
      - prefix: "10.10.1.0"
        wildcard: "0.0.0.255"
        area: 1
    ospf_passive_interfaces:
      - Loopback0

  tasks:
    - name: Capture pre-change OSPF state
      cisco.ios.ios_command:
        commands:
          - show run | section router ospf
      register: ospf_before

    - name: Display existing OSPF configuration
      ansible.builtin.debug:
        var: ospf_before.stdout_lines[0]

    - name: Apply OSPF configuration
      block:
        - name: Set OSPF global parameters
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id | default(ansible_host) }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
              - "log-adjacency-changes detail"
              - "max-lsa 12000 75 warning-only"
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_global
          retries: 2
          delay: 5
          until: ospf_global is not failed

        - name: Advertise networks into OSPF
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"

        - name: Suppress hellos on stub interfaces
          cisco.ios.ios_config:
            lines:
              - "passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_passive_interfaces }}"

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              OSPF config failed on {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('see task output') }}

        - name: Halt play for this host
          ansible.builtin.fail:
            msg: "OSPF configuration error — manual review required on {{ inventory_hostname }}"

    - name: Allow time for adjacencies to establish
      ansible.builtin.pause:
        seconds: 15

    - name: Verify OSPF neighbor adjacencies
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
        wait_for:
          - "result[0] contains FULL"
        retries: 4
        interval: 10
      register: ospf_neighbors
      failed_when: false

    - name: Collect OSPF route table
      cisco.ios.ios_command:
        commands:
          - show ip route ospf
      register: ospf_routes

    - name: Display OSPF neighbor table
      ansible.builtin.debug:
        msg: "{{ ospf_neighbors.stdout_lines[0] }}"

    - name: Display OSPF-learned routes
      ansible.builtin.debug:
        msg: "{{ ospf_routes.stdout_lines[0] }}"

    - name: Persist configuration to NVRAM
      cisco.ios.ios_config:
        save_when: modified