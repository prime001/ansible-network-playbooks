---
# syslog_audit.yml
#
# Syslog Audit and Verification Playbook
# Verifies syslog server reachability, validates active logging config,
# and generates a test event to confirm end-to-end log delivery.
# Complements syslog_config.yml (deployment) — this playbook audits, not configures.
#
# Inventory example:
# [ios_routers]
# rtr-core-01 ansible_host=10.0.1.1
# rtr-edge-02 ansible_host=10.0.1.2
#
# [ios_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_user }}          # ansible-vault encrypted
# ansible_password={{ vault_net_password }}  # ansible-vault encrypted
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}
#
# Required vars (define in group_vars or pass -e):
#   syslog_servers: ["10.0.50.10", "10.0.50.11"]
#   expected_severity: informational
#   expected_facility: local6

- name: Syslog Audit — Verify Configuration and End-to-End Delivery
  hosts: ios_routers
  gather_facts: false

  vars:
    syslog_servers:
      - "10.0.50.10"
      - "10.0.50.11"
    expected_severity: informational
    expected_facility: local6
    ping_count: 3
    audit_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Collect current logging configuration
      cisco.ios.ios_command:
        commands:
          - show logging
          - show running-config | section logging
      register: logging_output
      retries: 2
      delay: 5
      until: logging_output is not failed

    - name: Assert syslog hosts are present in running config
      ansible.builtin.assert:
        that:
          - "'logging host ' ~ item in logging_output.stdout[1]"
        fail_msg: "Syslog server {{ item }} is NOT configured on {{ inventory_hostname }}"
        success_msg: "Syslog server {{ item }} confirmed on {{ inventory_hostname }}"
      loop: "{{ syslog_servers }}"

    - name: Assert expected severity level is configured
      ansible.builtin.assert:
        that:
          - "expected_severity in logging_output.stdout[1]"
        fail_msg: "Expected severity '{{ expected_severity }}' not found in logging config"
        success_msg: "Severity level '{{ expected_severity }}' confirmed"

    - name: Verify reachability of each syslog server
      cisco.ios.ios_command:
        commands:
          - "ping {{ item }} repeat {{ ping_count }} source Loopback0"
      register: ping_results
      loop: "{{ syslog_servers }}"
      failed_when: "'!!!' not in ping_results.stdout[0] and 'Success' not in ping_results.stdout[0]"

    - name: Generate test syslog message to confirm delivery
      cisco.ios.ios_command:
        commands:
          - "send log {{ expected_facility }} {{ expected_severity }} ANSIBLE_AUDIT: syslog verification {{ audit_timestamp }} from {{ inventory_hostname }}"
      register: test_log_result
      ignore_errors: true

    - name: Display syslog status summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Logging buffer status: {{ logging_output.stdout[0] | regex_search('Syslog logging: (\\S+)', '\\1') | first | default('unknown') }}"
          - "Configured syslog hosts verified: {{ syslog_servers | join(', ') }}"
          - "Reachability check: {{ 'PASS' if ping_results.results | selectattr('failed', 'equalto', false) | list | length == syslog_servers | length else 'PARTIAL/FAIL' }}"
          - "Test event sent at: {{ audit_timestamp }}"

    - name: Flag devices with logging disabled
      ansible.builtin.fail:
        msg: "CRITICAL: Logging is disabled on {{ inventory_hostname }} — run syslog_config.yml to remediate"
      when: "'Syslog logging: disabled' in logging_output.stdout[0]