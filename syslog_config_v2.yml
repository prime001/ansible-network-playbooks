---
# Inventory example:
# [routers]
# core-rtr-01 ansible_host=10.0.1.1
# core-rtr-02 ansible_host=10.0.1.2
#
# [routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_username }}      # store in ansible-vault encrypted vars
# ansible_password={{ vault_net_password }}  # ansible-vault encrypt_string 'secret'
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Deploy OSPF routing configuration to Cisco IOS devices
  hosts: routers
  gather_facts: false

  vars:
    ospf_process_id: 1
    ospf_router_id: "{{ ansible_host }}"
    ospf_areas:
      - area: 0
        networks:
          - prefix: "10.0.0.0"
            wildcard: "0.0.255.255"
      - area: 10
        networks:
          - prefix: "192.168.10.0"
            wildcard: "0.0.0.255"
    ospf_passive_interfaces:
      - Loopback0
    ospf_timers:
      hello: 10
      dead: 40
    max_retries: 3
    retry_delay: 5

  tasks:
    - name: Verify device reachability before OSPF changes
      cisco.ios.ios_command:
        commands: show version
      register: pre_check
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      until: pre_check.failed is false

    - name: Deploy OSPF process and network statements
      block:
        - name: Configure OSPF process, router-id, and network advertisements
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth 10000"
              - "{% for area in ospf_areas %}{% for net in area.networks %}network {{ net.prefix }} {{ net.wildcard }} area {{ area.area }}\n{% endfor %}{% endfor %}"
              - "{% for iface in ospf_passive_interfaces %}passive-interface {{ iface }}\n{% endfor %}"
              - "timers throttle spf 50 200 5000"
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_config_result
          notify: Save running config

        - name: Set OSPF hello/dead timers per area network interface
          cisco.ios.ios_command:
            commands:
              - "show ip ospf neighbor"
              - "show ip ospf"
          register: ospf_verify
          failed_when: >
            ospf_verify.stdout[1] is not search('Routing Process') or
            ospf_verify.failed

      rescue:
        - name: Log OSPF configuration failure
          ansible.builtin.debug:
            msg: >
              OSPF deployment failed on {{ inventory_hostname }} ({{ ansible_host }}).
              Error: {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Attempt OSPF rollback by removing process
          cisco.ios.ios_config:
            lines:
              - "no router ospf {{ ospf_process_id }}"
          ignore_errors: true

        - name: Abort play for failed host
          ansible.builtin.fail:
            msg: "OSPF deployment failed and was rolled back on {{ inventory_hostname }}"

    - name: Display OSPF neighbor adjacencies
      ansible.builtin.debug:
        msg: "{{ ospf_verify.stdout[0] }}"

    - name: Display OSPF process summary
      ansible.builtin.debug:
        msg: "{{ ospf_verify.stdout[1] }}"

    - name: Confirm OSPF neighbors formed (warn if none)
      ansible.builtin.assert:
        that:
          - ospf_verify.stdout[0] is defined
        fail_msg: "No OSPF output returned from {{ inventory_hostname }}"
        success_msg: "OSPF verified on {{ inventory_hostname }}"

  handlers:
    - name: Save running config
      cisco.ios.ios_command:
        commands:
          - write memory
      register: save_result
      failed_when: "'[OK]' not in save_result.stdout[0] and 'Building configuration' not in save_result.stdout[0]