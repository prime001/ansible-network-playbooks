---
# syslog_audit.yml
# Audits existing syslog configuration on Cisco IOS devices — verifies
# expected servers are present, buffer size meets policy, and severity
# level is set correctly. Read-only: no config changes are made.
#
# Credentials: ansible-vault encrypted group_vars/network/vault.yml
#   vault_net_username, vault_net_password, vault_net_enable
#
# Inventory example:
#   [core_switches]
#   sw-core-01 ansible_host=10.0.1.1
#   sw-core-02 ansible_host=10.0.1.2
#
#   [distribution]
#   dist-01 ansible_host=10.0.2.1
#
#   [core_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli

- name: Syslog Configuration Audit — Verify servers, buffer, and severity
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  vars:
    # Override at runtime: -e required_syslog_servers='["10.100.1.50","10.100.1.51"]'
    required_syslog_servers:
      - "10.100.1.50"
      - "10.100.1.51"
    required_buffer_size: 16384
    required_severity: "informational"
    ansible_user: "{{ vault_net_username }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_net_enable }}"

  tasks:
    - name: Gather current logging configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | section logging
          - show logging
      register: syslog_output
      retries: 2
      delay: 5
      until: syslog_output is not failed

    - name: Parse configured syslog server lines
      ansible.builtin.set_fact:
        configured_servers: >-
          {{
            syslog_output.stdout[0]
            | regex_findall('logging host (\S+)')
          }}
        buffer_line: >-
          {{
            syslog_output.stdout[0]
            | regex_search('logging buffered (\d+)', '\1')
            | first | default('0')
          }}
        severity_line: >-
          {{
            syslog_output.stdout[0]
            | regex_search('logging trap (\S+)', '\1')
            | first | default('unset')
          }}

    - name: Verify required syslog servers are configured
      ansible.builtin.assert:
        that:
          - item in configured_servers
        fail_msg: "AUDIT FAIL: syslog server {{ item }} missing on {{ inventory_hostname }}"
        success_msg: "OK: syslog server {{ item }} present on {{ inventory_hostname }}"
      loop: "{{ required_syslog_servers }}"
      ignore_errors: true
      register: server_audit

    - name: Verify logging buffer meets minimum size policy
      ansible.builtin.assert:
        that:
          - buffer_line | int >= required_buffer_size
        fail_msg: >-
          AUDIT FAIL: buffer {{ buffer_line }} bytes on {{ inventory_hostname }}
          is below required {{ required_buffer_size }}
        success_msg: "OK: buffer size {{ buffer_line }} meets policy on {{ inventory_hostname }}"
      ignore_errors: true
      register: buffer_audit

    - name: Verify logging severity level
      ansible.builtin.assert:
        that:
          - severity_line == required_severity
        fail_msg: >-
          AUDIT FAIL: trap severity '{{ severity_line }}' on {{ inventory_hostname }}
          should be '{{ required_severity }}'
        success_msg: "OK: severity level correct on {{ inventory_hostname }}"
      ignore_errors: true
      register: severity_audit

    - name: Display full audit summary
      ansible.builtin.debug:
        msg:
          - "Host          : {{ inventory_hostname }}"
          - "Servers found : {{ configured_servers }}"
          - "Buffer size   : {{ buffer_line }} bytes"
          - "Trap severity : {{ severity_line }}"
          - "Server check  : {{ 'PASS' if server_audit is not failed else 'FAIL' }}"
          - "Buffer check  : {{ 'PASS' if buffer_audit is not failed else 'FAIL' }}"
          - "Severity check: {{ 'PASS' if severity_audit is not failed else 'FAIL' }}"

    - name: Fail play if any audit check did not pass
      ansible.builtin.fail:
        msg: "One or more syslog audit checks failed on {{ inventory_hostname }} — review output above."
      when: >
        (server_audit is failed) or
        (buffer_audit is failed) or
        (severity_audit is failed)