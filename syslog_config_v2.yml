---
# Ansible Playbook: Advanced Syslog Hardening and Validation
# Configures syslog rate-limiting, source-interface binding, buffered logging,
# and validates log connectivity — distinct from basic syslog_config.yml setup.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_pass }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }}
#
# Vault: ansible-vault encrypt_string '<secret>' --name 'vault_net_pass'

- name: Advanced syslog hardening — rate-limit, source-interface, buffer tuning, and validation
  hosts: core_routers
  gather_facts: false
  vars:
    syslog_servers:
      - host: 10.10.10.50
        vrf: MGMT
      - host: 10.10.10.51
        vrf: MGMT
    syslog_source_interface: Loopback0
    syslog_buffer_size: 16384
    syslog_rate_limit_all: 10000
    syslog_rate_limit_console: 100
    syslog_facility: local6
    expected_log_host_count: 2

  tasks:
    - name: Capture pre-change syslog state
      cisco.ios.ios_command:
        commands:
          - show logging
          - show running-config | section logging
      register: pre_change_state
      retries: 2
      delay: 5

    - name: Display current logging configuration
      ansible.builtin.debug:
        msg: "{{ pre_change_state.stdout[1].splitlines() }}"

    - name: Apply syslog hardening configuration
      block:
        - name: Configure buffered logging size and level
          cisco.ios.ios_config:
            lines:
              - "logging buffered {{ syslog_buffer_size }} informational"
              - "logging trap informational"
              - "logging facility {{ syslog_facility }}"
              - "logging source-interface {{ syslog_source_interface }}"
              - "logging rate-limit all {{ syslog_rate_limit_all }}"
              - "logging rate-limit console {{ syslog_rate_limit_console }}"
            save_when: changed
          register: config_result

        - name: Configure syslog servers with VRF
          cisco.ios.ios_config:
            lines:
              - "logging host {{ item.host }} vrf {{ item.vrf }}"
            save_when: changed
          loop: "{{ syslog_servers }}"
          register: server_config_result

        - name: Validate syslog configuration was applied
          cisco.ios.ios_command:
            commands:
              - show logging | include host
          register: log_host_check
          failed_when: >
            (log_host_check.stdout[0] | regex_findall('logging host') | length) < expected_log_host_count

      rescue:
        - name: Log failure and attempt rollback notice
          ansible.builtin.debug:
            msg: "FAILED on {{ inventory_hostname }} — syslog config did not apply cleanly. Manual review required."

        - name: Fail task with clear message after rescue
          ansible.builtin.fail:
            msg: "Syslog hardening failed on {{ inventory_hostname }}. Pre-change state preserved in pre_change_state var."

    - name: Capture post-change syslog state
      cisco.ios.ios_command:
        commands:
          - show logging
      register: post_change_state

    - name: Report logging buffer and server summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Config changed: {{ config_result.changed }}"
          - "Log servers configured: {{ log_host_check.stdout[0] | regex_findall('logging host') | length }}"
          - "Buffer line: {{ post_change_state.stdout[0] | regex_search('Log Buffer.*') }}"
Human: Hi