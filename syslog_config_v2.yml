---
# ospf_config.yml
# Configures OSPF routing protocol on Cisco IOS devices
# Supports single/multi-area deployments with MD5 authentication and
# post-convergence neighbor verification.
#
# Inventory example:
#   [core_routers]
#   r1 ansible_host=10.0.0.1
#   r2 ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}         # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}     # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_password }}

- name: Configure OSPF routing on Cisco IOS devices
  hosts: core_routers
  gather_facts: false

  vars:
    ospf_process_id: 1
    ospf_router_id: "{{ ansible_host }}"
    ospf_reference_bandwidth_mbps: 10000
    ospf_area_auth_enabled: true
    ospf_auth_key: "{{ vault_ospf_md5_key }}"    # ansible-vault encrypted
    ospf_networks:
      - prefix: "10.0.0.0"
        wildcard: "0.0.0.255"
        area: 0
      - prefix: "192.168.100.0"
        wildcard: "0.0.0.255"
        area: 1
    ospf_active_interfaces:
      - GigabitEthernet0/0
      - GigabitEthernet0/1

  tasks:
    - name: Capture pre-change OSPF state
      cisco.ios.ios_command:
        commands:
          - show ip ospf
          - show ip ospf neighbor
          - show ip route ospf summary
      register: ospf_prechange
      failed_when: false

    - name: Display pre-change OSPF state
      ansible.builtin.debug:
        var: ospf_prechange.stdout_lines

    - name: Apply OSPF configuration
      block:
        - name: Configure OSPF process, router-id, and reference bandwidth
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth_mbps }}"
              - "passive-interface default"
              - "log-adjacency-changes detail"
            parents: "router ospf {{ ospf_process_id }}"

        - name: Activate OSPF on routed interfaces
          cisco.ios.ios_config:
            lines:
              - "no passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_active_interfaces }}"

        - name: Advertise networks into OSPF
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"

        - name: Enable MD5 authentication on backbone area
          cisco.ios.ios_config:
            lines:
              - "area 0 authentication message-digest"
            parents: "router ospf {{ ospf_process_id }}"
          when: ospf_area_auth_enabled | bool

        - name: Set MD5 key on active interfaces
          cisco.ios.ios_config:
            lines:
              - "ip ospf message-digest-key 1 md5 {{ ospf_auth_key }}"
              - "ip ospf network point-to-point"
            parents: "interface {{ item }}"
          loop: "{{ ospf_active_interfaces }}"
          when: ospf_area_auth_enabled | bool
          no_log: true

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              OSPF config failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('check device logs') }}

        - name: Abort with failure
          ansible.builtin.fail:
            msg: "OSPF configuration did not apply cleanly on {{ inventory_hostname }}"

    - name: Persist configuration
      cisco.ios.ios_config:
        save_when: modified

    - name: Wait for OSPF adjacencies to form
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
      register: ospf_neighbors
      retries: 4
      delay: 15
      until: "'FULL' in ospf_neighbors.stdout[0]"
      failed_when: false

    - name: Verify OSPF routes installed
      cisco.ios.ios_command:
        commands:
          - show ip route ospf
      register: ospf_routes
      failed_when: >
        ospf_routes.stdout[0] is defined and
        ospf_routes.stdout[0] | length == 0 and
        ospf_networks | length > 1

    - name: Display post-change neighbor and route state
      ansible.builtin.debug:
        msg:
          - "Neighbors: {{ ospf_neighbors.stdout_lines }}"
          - "OSPF routes: {{ ospf_routes.stdout_lines }}"
```