---
# Playbook: VLAN Configuration Management
# Description: Deploy and manage VLANs across network infrastructure
# Supports: Cisco IOS, IOS-XR, NXOS
#
# INVENTORY EXAMPLE:
# [ios_devices]
# switch-1 ansible_host=192.168.1.10
#
# [iosxr_devices]
# router-1 ansible_host=192.168.2.10
#
# [nxos_devices]
# switch-nx-1 ansible_host=192.168.3.10
#
# VARIABLES (use ansible-vault for credentials):
# ansible_user: admin
# ansible_password: password123
# vlans:
#   - vlan_id: 10
#     name: Management
#   - vlan_id: 20
#     name: Production

- name: Deploy VLAN Configuration
  hosts: network_devices
  gather_facts: no
  vars:
    # Vault reference for credentials in production
    # ansible_user: "{{ vault_username }}"
    # ansible_password: "{{ vault_password }}"
    vlans:
      - vlan_id: 10
        name: Management
      - vlan_id: 20
        name: Production
      - vlan_id: 30
        name: Guest

  tasks:
    - name: Configure VLANs on Cisco IOS
      block:
        - name: Create VLANs
          ios_vlan:
            vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
            state: present
          loop: "{{ vlans }}"
          register: ios_result
          retries: 3
          delay: 5
          until: ios_result is succeeded
        
        - name: Show VLAN Configuration Results
          debug:
            msg: "Created VLAN {{ item.vlan_id }}: {{ item.name }}"
          loop: "{{ vlans }}"
      
      rescue:
        - name: Handle VLAN Configuration Error
          debug:
            msg: "Error configuring VLANs on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"
      
      when: inventory_hostname in groups.get('ios_devices', [])

    - name: Configure VLANs on Cisco IOS-XR
      block:
        - name: Create VLANs
          iosxr_vlan:
            vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
            state: present
          loop: "{{ vlans }}"
          register: iosxr_result
          retries: 3
          delay: 5
          until: iosxr_result is succeeded
        
        - name: Show VLAN Configuration Results
          debug:
            msg: "Created VLAN {{ item.vlan_id }}: {{ item.name }} on IOS-XR"
          loop: "{{ vlans }}"
      
      rescue:
        - name: Handle VLAN Configuration Error
          debug:
            msg: "Error configuring VLANs on IOS-XR {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"
      
      when: inventory_hostname in groups.get('iosxr_devices', [])

    - name: Configure VLANs on Cisco NXOS
      block:
        - name: Create VLANs
          nxos_vlan:
            vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
            state: present
          loop: "{{ vlans }}"
          register: nxos_result
          retries: 3
          delay: 5
          until: nxos_result is succeeded
        
        - name: Show VLAN Configuration Results
          debug:
            msg: "Created VLAN {{ item.vlan_id }}: {{ item.name }} on NXOS"
          loop: "{{ vlans }}"
      
      rescue:
        - name: Handle VLAN Configuration Error
          debug:
            msg: "Error configuring VLANs on NXOS {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"
      
      when: inventory_hostname in groups.get('nxos_devices', [])

    - name: Verify VLAN Configuration
      ios_command:
        commands: "show vlan brief"
      register: vlan_check
      failed_when: vlan_check.rc != 0
      when: inventory_hostname in groups.get('ios_devices', [])

    - name: Display VLAN Verification
      debug:
        var: vlan_check.stdout_lines
      when: vlan_check is defined and vlan_check.stdout_lines is defined