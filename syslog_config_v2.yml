---
# Ansible Playbook: Syslog Server Configuration (Multi-Vendor)
# Purpose: Configure remote syslog logging on IOS, NX-OS, and JunOS devices
#          with facility/severity filtering and source-interface binding.
#
# Vault usage:
#   ansible-vault encrypt_string 'secret' --name 'ansible_password'
#   Reference: ansible_password and ansible_become_pass stored in group_vars/all/vault.yml
#
# Inventory example:
#   [core_routers]
#   core-rtr-01 ansible_host=10.0.0.1 ansible_network_os=ios
#   core-rtr-02 ansible_host=10.0.0.2 ansible_network_os=ios
#
#   [datacenter_switches]
#   dc-sw-01 ansible_host=10.0.1.1 ansible_network_os=nxos
#
#   [edge_firewalls]
#   edge-fw-01 ansible_host=10.0.2.1 ansible_network_os=junos
#
#   [network:children]
#   core_routers
#   datacenter_switches
#   edge_firewalls
#
#   [network:vars]
#   ansible_user=netadmin
#   ansible_password={{ vault_ansible_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_ansible_become_pass }}
#   ansible_connection=network_cli

- name: Configure Remote Syslog Logging on Network Devices
  hosts: network
  gather_facts: false

  vars:
    syslog_servers:
      - host: 10.100.0.50
        facility: local6
        severity: informational
      - host: 10.100.0.51
        facility: local6
        severity: warnings
    syslog_source_interface: Loopback0
    syslog_buffer_size: 16384
    syslog_buffer_severity: debugging

  tasks:
    - name: Apply syslog configuration (IOS)
      when: ansible_network_os == 'ios'
      block:
        - name: Configure IOS syslog settings
          cisco.ios.ios_logging_global:
            config:
              buffered:
                size: "{{ syslog_buffer_size }}"
                severity: "{{ syslog_buffer_severity }}"
              hosts:
                - hostname: "{{ item.host }}"
                  severity: "{{ item.severity }}"
                  facility: "{{ item.facility }}"
              source_interface: "{{ syslog_source_interface }}"
              on: true
            state: merged
          loop: "{{ syslog_servers }}"
          register: ios_syslog_result
          retries: 2
          delay: 5
          until: ios_syslog_result is not failed

        - name: Verify IOS syslog config applied
          cisco.ios.ios_command:
            commands: show logging | include Logging to
          register: ios_syslog_verify
          failed_when: "'Logging to' not in ios_syslog_verify.stdout[0]"

        - name: Display IOS syslog verification
          ansible.builtin.debug:
            msg: "{{ ios_syslog_verify.stdout_lines }}"

      rescue:
        - name: Log IOS syslog failure
          ansible.builtin.debug:
            msg: "FAILED to apply syslog config on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

    - name: Apply syslog configuration (NX-OS)
      when: ansible_network_os == 'nxos'
      block:
        - name: Configure NX-OS syslog servers
          cisco.nxos.nxos_logging_global:
            config:
              hosts:
                - host: "{{ item.host }}"
                  severity: "{{ item.severity }}"
                  facility: "{{ item.facility }}"
              source_interface: "{{ syslog_source_interface }}"
            state: merged
          loop: "{{ syslog_servers }}"
          register: nxos_syslog_result
          retries: 2
          delay: 5
          until: nxos_syslog_result is not failed

        - name: Verify NX-OS syslog configuration
          cisco.nxos.nxos_command:
            commands: show logging server
          register: nxos_syslog_verify

        - name: Display NX-OS syslog output
          ansible.builtin.debug:
            msg: "{{ nxos_syslog_verify.stdout_lines }}"

      rescue:
        - name: Log NX-OS syslog failure
          ansible.builtin.debug:
            msg: "FAILED on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

    - name: Apply syslog configuration (JunOS)
      when: ansible_network_os == 'junos'
      block:
        - name: Configure JunOS syslog via set commands
          junipernetworks.junos.junos_config:
            lines:
              - "set system syslog host {{ item.host }} {{ item.facility }} {{ item.severity }}"
              - "set system syslog host {{ item.host }} log-prefix {{ inventory_hostname }}"
              - "set system syslog source-address {{ syslog_source_interface }}"
          loop: "{{ syslog_servers }}"
          register: junos_syslog_result
          retries: 2
          delay: 5
          until: junos_syslog_result is not failed

        - name: Verify JunOS syslog configuration
          junipernetworks.junos.junos_command:
            commands: show system syslog
          register: junos_syslog_verify

        - name: Display JunOS syslog output
          ansible.builtin.debug:
            msg: "{{ junos_syslog_verify.stdout_lines }}"

      rescue:
        - name: Log JunOS syslog failure
          ansible.builtin.debug:
            msg: "FAILED on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

    - name: Summarize syslog deployment results
      ansible.builtin.debug:
        msg: >
          Host: {{ inventory_hostname }} |
          Platform: {{ ansible_network_os }} |
          Servers configured: {{ syslog_servers | map(attribute='host') | list | join(', ') }}