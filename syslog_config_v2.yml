---
# Inventory example:
# [network_devices]
# core-rtr-01   ansible_host=10.0.1.1  ansible_network_os=ios
# dist-sw-01    ansible_host=10.0.1.2  ansible_network_os=nxos
#
# [network_devices:vars]
# ansible_user="{{ vault_net_user }}"        # ansible-vault encrypted
# ansible_password="{{ vault_net_password }}" # ansible-vault encrypted
# ansible_become=true
# ansible_become_method=enable
# ansible_connection=network_cli

- name: Harden logging buffer, timestamps, rate-limiting, and source-interface on network devices
  hosts: network_devices
  gather_facts: false

  vars:
    # Load credentials from vault: ansible-playbook site.yml --vault-password-file ~/.vault_pass
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    log_buffer_size: 131072
    log_severity: informational
    log_rate_limit: 30
    log_source_intf: Loopback0

  tasks:

    - name: Capture pre-change logging state (IOS)
      cisco.ios.ios_command:
        commands:
          - show logging | include Syslog|Buffer|rate-limit|Source
      register: pre_log_state
      retries: 2
      delay: 5
      when: ansible_network_os == 'ios'

    - name: Display pre-change logging state
      ansible.builtin.debug:
        var: pre_log_state.stdout_lines
      when: pre_log_state is not skipped

    - name: Apply logging hardening (IOS / IOS-XE)
      block:

        - name: Configure buffer size, timestamps, rate-limit, and source-interface
          cisco.ios.ios_config:
            lines:
              - "logging buffered {{ log_buffer_size }} {{ log_severity }}"
              - logging timestamps log datetime msec
              - no logging console
              - "logging monitor {{ log_severity }}"
              - "logging rate-limit {{ log_rate_limit }}"
              - "logging source-interface {{ log_source_intf }}"
            save_when: changed
          register: ios_result

        - name: Verify buffer size was applied
          cisco.ios.ios_command:
            commands:
              - show logging | include Buffer logging
          register: verify_buffer
          failed_when: log_buffer_size | string not in verify_buffer.stdout[0]

      rescue:

        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "Logging hardening FAILED on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "Manual review required for {{ inventory_hostname }}"

      when: ansible_network_os == 'ios'

    - name: Apply logging hardening (NX-OS)
      block:

        - name: Configure buffer logging and timestamps (NX-OS)
          cisco.nxos.nxos_config:
            lines:
              - "logging level all {{ log_severity }}"
              - logging timestamp milliseconds
              - no logging console
          register: nxos_result

      rescue:

        - name: Report NX-OS configuration failure
          ansible.builtin.debug:
            msg: "Logging hardening FAILED on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "Manual review required for {{ inventory_hostname }}"

      when: ansible_network_os == 'nxos'

    - name: Summarize result per host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: logging hardening
          {{ 'applied — config changed'
             if (ios_result.changed | default(false) or nxos_result.changed | default(false))
             else 'already compliant — no change' }}