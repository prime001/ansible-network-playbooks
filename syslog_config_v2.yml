---
# qos_deploy.yml
# Deploys QoS class-maps, policy-maps, and egress service-policy on Cisco IOS/IOS-XE.
# Credentials sourced from Ansible Vault — see group_vars/all/vault.yml
#
# Inventory example:
#   [wan_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [wan_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_user }}"
#   ansible_password="{{ vault_net_pass }}"
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass="{{ vault_net_enable }}"

- name: Deploy QoS class-maps, policy-map, and service-policy on WAN interfaces
  hosts: wan_routers
  gather_facts: false
  connection: network_cli

  vars:
    net_user: "{{ vault_net_user }}"
    net_pass: "{{ vault_net_pass }}"
    net_enable: "{{ vault_net_enable }}"

    qos_classes:
      - name: VOICE
        dscp: ef
        priority_pct: 20
      - name: VIDEO
        dscp: af41
        bandwidth_pct: 30
      - name: CRITICAL_DATA
        dscp: af31
        bandwidth_pct: 25

    policy_name: WAN_EGRESS_POLICY
    wan_interface: GigabitEthernet0/0/1

  tasks:
    - name: Configure QoS class-maps and policy-map
      block:
        - name: Apply dscp-matched class-maps
          cisco.ios.ios_config:
            lines:
              - "match dscp {{ item.dscp }}"
            parents: "class-map match-any {{ item.name }}"
          loop: "{{ qos_classes }}"
          register: classmap_result
          retries: 2
          delay: 5
          until: classmap_result is not failed

        - name: Build policy-map queuing entries
          cisco.ios.ios_config:
            lines: >-
              {{
                ['class ' + item.name,
                 '  priority percent ' + (item.priority_pct | string)]
                if item.priority_pct is defined else
                ['class ' + item.name,
                 '  bandwidth percent ' + (item.bandwidth_pct | string)]
              }}
            parents: "policy-map {{ policy_name }}"
          loop: "{{ qos_classes }}"
          register: policymap_result
          retries: 2
          delay: 5
          until: policymap_result is not failed

        - name: Attach egress service-policy to WAN interface
          cisco.ios.ios_config:
            lines:
              - "service-policy output {{ policy_name }}"
            parents: "interface {{ wan_interface }}"
          register: attach_result
          failed_when:
            - attach_result.failed
            - "'already' not in (attach_result.msg | default(''))"

      rescue:
        - name: Report QoS deployment failure
          ansible.builtin.debug:
            msg: "QoS deployment failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "Halting — manual QoS remediation required on {{ inventory_hostname }}"

    - name: Verify service-policy is active on interface
      cisco.ios.ios_command:
        commands:
          - "show policy-map interface {{ wan_interface }}"
          - "show class-map"
        wait_for:
          - "result[0] contains '{{ policy_name }}'"
      register: qos_verify
      retries: 3
      delay: 10

    - name: Display QoS verification output
      ansible.builtin.debug:
        var: qos_verify.stdout_lines