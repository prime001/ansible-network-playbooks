---
# Ansible Playbook: QoS Policy Deployment
# Purpose: Deploy DiffServ classification, marking, and queuing policies on IOS WAN edge routers
# Modules: cisco.ios.ios_config, cisco.ios.ios_command, cisco.ios.ios_facts
#
# Inventory example:
# [wan_edges]
# core-r1 ansible_host=10.0.0.1 wan_interface=GigabitEthernet0/0/0
# core-r2 ansible_host=10.0.0.2 wan_interface=GigabitEthernet0/0/1
#
# [wan_edges:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_username }}
# ansible_password={{ vault_net_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Deploy DiffServ QoS policies on WAN edge routers
  hosts: wan_edges
  gather_facts: false
  vars:
    # Credentials loaded from Ansible Vault — ansible-vault encrypt_string 'value' --name 'vault_net_password'
    qos_policy_name: "WAN-EDGE-OUT"
    wan_interface: "{{ hostvars[inventory_hostname]['wan_interface'] | default('GigabitEthernet0/0/0') }}"

  tasks:
    - name: Collect interface and running-config facts
      cisco.ios.ios_facts:
        gather_subset:
          - config
          - interfaces
      register: device_facts

    - name: Deploy QoS class maps and policy map
      block:
        - name: Configure DSCP-based class maps
          cisco.ios.ios_config:
            lines:
              - "class-map match-any QOS-VOICE"
              - " match dscp ef"
              - " match dscp cs5"
              - "class-map match-any QOS-VIDEO"
              - " match dscp af41"
              - " match dscp cs4"
              - "class-map match-any QOS-CRITICAL"
              - " match dscp af31"
              - " match dscp af32"
              - " match dscp cs3"
              - "class-map match-any QOS-BULK"
              - " match dscp af11"
              - " match dscp af12"
            match: exact
          register: classmap_result
          retries: 2
          delay: 5
          until: classmap_result is not failed

        - name: Configure hierarchical QoS policy map
          cisco.ios.ios_config:
            lines:
              - "policy-map {{ qos_policy_name }}"
              - " class QOS-VOICE"
              - "  priority percent 20"
              - "  police rate percent 20 conform-action transmit exceed-action drop"
              - " class QOS-VIDEO"
              - "  bandwidth percent 25"
              - "  random-detect dscp-based"
              - " class QOS-CRITICAL"
              - "  bandwidth percent 20"
              - " class QOS-BULK"
              - "  bandwidth percent 10"
              - "  shape average percent 10"
              - " class class-default"
              - "  fair-queue"
              - "  bandwidth percent 25"
            match: exact
          register: policymap_result
          retries: 2
          delay: 5
          until: policymap_result is not failed

        - name: Apply service policy to WAN egress interface
          cisco.ios.ios_config:
            lines:
              - "service-policy output {{ qos_policy_name }}"
            parents: "interface {{ wan_interface }}"
          register: servicepolicy_result

        - name: Persist configuration to NVRAM
          cisco.ios.ios_config:
            save_when: changed

      rescue:
        - name: Report deployment failure details
          ansible.builtin.debug:
            msg: "QoS deployment failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Remove partial QoS policy on rollback
          cisco.ios.ios_config:
            lines:
              - "no policy-map {{ qos_policy_name }}"
            match: line
          ignore_errors: true

        - name: Abort with rollback notice
          ansible.builtin.fail:
            msg: "QoS config rolled back on {{ inventory_hostname }} — investigate before retrying."

    - name: Verify service policy is active on WAN interface
      cisco.ios.ios_command:
        commands:
          - "show policy-map interface {{ wan_interface }} output"
          - "show class-map"
      register: qos_verify
      failed_when: >
        'Policy not installed' in qos_verify.stdout[0] or
        qos_policy_name not in qos_verify.stdout[0]

    - name: Display QoS verification output
      ansible.builtin.debug:
        msg: |
          === QoS Status: {{ inventory_hostname }} / {{ wan_interface }} ===
          {{ qos_verify.stdout[0] }}