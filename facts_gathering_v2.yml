---
# Playbook: cdp_lldp_discovery.yml
# Purpose: Discover Layer 2 adjacencies via CDP and LLDP to map physical network topology.
#          Targets neighbor/peering data specifically — complements generic facts_gathering.yml
#          which collects device-level platform and interface facts.
#
# Vault: store credentials in group_vars/all/vault.yml (ansible-vault encrypted)
#   vault_net_user: "netadmin"
#   vault_net_password: "S3cureP@ss"
#   vault_enable_password: "En@bleP@ss"
#
# Inventory example:
#   [core_switches]
#   core-sw-01  ansible_host=10.0.1.1  ansible_network_os=ios
#   core-sw-02  ansible_host=10.0.1.2  ansible_network_os=nxos
#   dist-sw-01  ansible_host=10.0.2.1  ansible_network_os=iosxe
#
#   [all:vars]
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_user }}"
#   ansible_password="{{ vault_net_password }}"
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password="{{ vault_enable_password }}"

- name: CDP and LLDP Neighbor Topology Discovery
  hosts: network_devices
  gather_facts: false
  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    report_dir: "/tmp/topology_reports"

  tasks:
    - name: Create local topology report directory
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    - name: Collect IOS/IOS-XE neighbor tables
      when: ansible_network_os in ['ios', 'iosxe']
      block:
        - name: Run CDP and LLDP show commands on IOS
          cisco.ios.ios_command:
            commands:
              - show cdp neighbors detail
              - show lldp neighbors detail
            retries: 3
            interval: 10
          register: ios_neighbors
          failed_when: >
            ios_neighbors.failed | default(false) and
            'not enabled' not in (ios_neighbors.stdout | join(' '))

        - name: Display IOS neighbor summary
          ansible.builtin.debug:
            msg:
              - "=== {{ inventory_hostname }} CDP Neighbors ==="
              - "{{ ios_neighbors.stdout[0] | default('CDP not enabled or no neighbors found') }}"
              - "=== {{ inventory_hostname }} LLDP Neighbors ==="
              - "{{ ios_neighbors.stdout[1] | default('LLDP not enabled or no neighbors found') }}"

      rescue:
        - name: Warn on IOS neighbor collection failure
          ansible.builtin.debug:
            msg: "WARNING: Neighbor discovery failed on {{ inventory_hostname }} — host will be skipped in report"

        - name: Stub neighbor data so report task does not fail
          ansible.builtin.set_fact:
            ios_neighbors:
              stdout:
                - "ERROR: collection failed"
                - "ERROR: collection failed"

    - name: Collect NX-OS neighbor tables
      when: ansible_network_os == 'nxos'
      block:
        - name: Run CDP and LLDP show commands on NX-OS
          cisco.nxos.nxos_command:
            commands:
              - show cdp neighbors detail
              - show lldp neighbors detail
            retries: 3
            interval: 10
          register: nxos_neighbors

        - name: Display NX-OS neighbor summary
          ansible.builtin.debug:
            msg:
              - "=== {{ inventory_hostname }} CDP Neighbors ==="
              - "{{ nxos_neighbors.stdout[0] | default('No CDP neighbors detected') }}"
              - "=== {{ inventory_hostname }} LLDP Neighbors ==="
              - "{{ nxos_neighbors.stdout[1] | default('No LLDP neighbors detected') }}"

      rescue:
        - name: Warn on NX-OS neighbor collection failure
          ansible.builtin.debug:
            msg: "WARNING: NX-OS neighbor discovery failed on {{ inventory_hostname }}"

        - name: Stub NX-OS neighbor data on failure
          ansible.builtin.set_fact:
            nxos_neighbors:
              stdout:
                - "ERROR: collection failed"
                - "ERROR: collection failed"

    - name: Persist topology report to Ansible controller
      delegate_to: localhost
      vars:
        cdp_out: >-
          {{ (ios_neighbors | default(nxos_neighbors | default({'stdout': ['N/A', 'N/A']}))).stdout[0] }}
        lldp_out: >-
          {{ (ios_neighbors | default(nxos_neighbors | default({'stdout': ['N/A', 'N/A']}))).stdout[1] }}
      ansible.builtin.copy:
        content: |
          Topology Discovery Report
          Host     : {{ inventory_hostname }}
          Platform : {{ ansible_network_os }}
          ============================================================
          CDP NEIGHBORS:
          {{ cdp_out }}

          LLDP NEIGHBORS:
          {{ lldp_out }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_topology.txt"
        mode: '0644'

    - name: Print report path
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "Topology report saved to {{ report_dir }}/{{ inventory_hostname }}_topology.txt