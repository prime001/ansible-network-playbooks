---
# routing_facts.yml
#
# Collects BGP neighbor state, OSPF adjacencies, and routing-table summary
# across IOS, IOS-XR, NX-OS, and Junos devices.
#
# Complements facts_gathering.yml (device inventory) and facts_gathering_v2.yml
# (interface counters). This playbook focuses on Layer 3 routing protocol state.
#
# Credentials: store in Ansible Vault — group_vars/all/vault.yml
#   vault_net_user: admin
#   vault_net_password: <secret>
#   vault_net_enable: <secret>
#
# Inventory example (inventory/hosts.yml):
#   all:
#     children:
#       routers:
#         hosts:
#           core-rtr-01:
#             ansible_host: 192.168.1.1
#             ansible_network_os: ios
#           dc-spine-01:
#             ansible_host: 192.168.1.2
#             ansible_network_os: nxos
#           pe-router-01:
#             ansible_host: 192.168.1.3
#             ansible_network_os: iosxr

- name: Gather routing protocol facts — BGP, OSPF, routing table
  hosts: routers
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_net_enable }}"
    report_dir: "{{ playbook_dir }}/reports/routing_facts"
    timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    cmd_bgp:
      ios: "show ip bgp summary"
      iosxe: "show ip bgp summary"
      iosxr: "show bgp ipv4 unicast summary"
      nxos: "show bgp ipv4 unicast summary"
      junos: "show bgp summary"

    cmd_ospf:
      ios: "show ip ospf neighbor"
      iosxe: "show ip ospf neighbor"
      iosxr: "show ospf neighbor"
      nxos: "show ip ospf neighbors"
      junos: "show ospf neighbor"

    cmd_routes:
      ios: "show ip route summary"
      iosxe: "show ip route summary"
      iosxr: "show route summary"
      nxos: "show ip route summary"
      junos: "show route summary"

  tasks:
    - name: Create report directory
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Collect routing protocol state
      block:
        - name: BGP neighbor summary
          cli_command:
            command: "{{ cmd_bgp[ansible_network_os] | default('show ip bgp summary') }}"
          register: bgp_out
          failed_when: false
          retries: 2
          delay: 5

        - name: OSPF neighbor state
          cli_command:
            command: "{{ cmd_ospf[ansible_network_os] | default('show ip ospf neighbor') }}"
          register: ospf_out
          failed_when: false
          retries: 2
          delay: 5

        - name: Routing table summary
          cli_command:
            command: "{{ cmd_routes[ansible_network_os] | default('show ip route summary') }}"
          register: routes_out
          retries: 2
          delay: 5

        - name: Display collected facts
          debug:
            msg:
              - "=== {{ inventory_hostname }} ({{ ansible_network_os }}) ==="
              - "--- BGP ---"
              - "{{ bgp_out.stdout_lines | default(['not configured']) }}"
              - "--- OSPF ---"
              - "{{ ospf_out.stdout_lines | default(['not configured']) }}"
              - "--- Routes ---"
              - "{{ routes_out.stdout_lines }}"

        - name: Write per-host routing fact report
          copy:
            content: |
              Host      : {{ inventory_hostname }}
              Platform  : {{ ansible_network_os }}
              Collected : {{ timestamp }}

              [BGP Summary]
              {{ bgp_out.stdout | default('Not configured') }}

              [OSPF Neighbors]
              {{ ospf_out.stdout | default('Not configured') }}

              [Route Summary]
              {{ routes_out.stdout }}
            dest: "{{ report_dir }}/{{ inventory_hostname }}_routing.txt"
          delegate_to: localhost

      rescue:
        - name: Report collection failure
          debug:
            msg: "FAILED: {{ inventory_hostname }} — {{ ansible_failed_result.msg | default('connection or command error') }}"

        - name: Log failed host
          lineinfile:
            path: "{{ report_dir }}/failed_hosts.log"
            line: "{{ inventory_hostname }} failed at {{ timestamp }}"
            create: true
          delegate_to: localhost