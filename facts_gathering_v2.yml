---
# neighbor_discovery.yml
#
# Gathers CDP and LLDP neighbor information from network devices.
# Useful for validating topology, auditing unexpected adjacencies,
# and building network diagrams programmatically.
#
# Credentials: set ansible_user / ansible_password / ansible_become_password
# in group_vars/all/vault.yml (ansible-vault encrypted).
#
# Inventory example:
#   [core_switches]
#   core-sw-01 ansible_host=10.0.1.1
#   core-sw-02 ansible_host=10.0.1.2
#
#   [distribution]
#   dist-sw-01 ansible_host=10.0.2.1
#
#   [all:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable

- name: Gather CDP and LLDP neighbor topology data
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_enable_password }}"
    output_dir: "./neighbor_reports"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Ensure local report directory exists
      delegate_to: localhost
      run_once: true
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0750"

    - name: Collect CDP neighbor detail
      block:
        - name: Run show cdp neighbors detail
          cisco.ios.ios_command:
            commands:
              - show cdp neighbors detail
              - show cdp interface
          register: cdp_output
          retries: 2
          delay: 5
          until: cdp_output is not failed

        - name: Collect LLDP neighbors
          cisco.ios.ios_command:
            commands:
              - show lldp neighbors detail
          register: lldp_output
          failed_when: >
            lldp_output.failed and
            'Invalid input' not in lldp_output.msg | default('')
          retries: 2
          delay: 5
          until: lldp_output is not failed

      rescue:
        - name: Log collection failure
          debug:
            msg: "Failed to collect neighbor data from {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Mark host as failed and continue
          set_fact:
            neighbor_collection_failed: true

    - name: Display CDP neighbors
      debug:
        msg: "{{ cdp_output.stdout[0] }}"
      when:
        - cdp_output is defined
        - cdp_output.stdout is defined
        - neighbor_collection_failed is not defined

    - name: Display LLDP neighbors
      debug:
        msg: "{{ lldp_output.stdout[0] }}"
      when:
        - lldp_output is defined
        - lldp_output.stdout is defined
        - not lldp_output.failed
        - neighbor_collection_failed is not defined

    - name: Save neighbor report to file
      delegate_to: localhost
      copy:
        content: |
          === CDP Neighbors ({{ inventory_hostname }} - {{ timestamp }}) ===
          {{ cdp_output.stdout[0] | default('No CDP data') }}

          === LLDP Neighbors ({{ inventory_hostname }} - {{ timestamp }}) ===
          {{ lldp_output.stdout[0] | default('LLDP not available or not enabled') }}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_neighbors_{{ timestamp }}.txt"
        mode: "0640"
      when:
        - neighbor_collection_failed is not defined
        - cdp_output is defined

    - name: Summarize collection results
      debug:
        msg: >
          {{ inventory_hostname }}: neighbor collection
          {{ 'FAILED' if neighbor_collection_failed is defined else 'SUCCESS' }}
```