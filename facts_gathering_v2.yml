---
# bgp_neighbor_audit.yml
#
# Collects BGP neighbor states, session uptime, and received prefix counts
# across IOS/IOS-XE, NX-OS, and IOS-XR platforms. Designed for pre/post
# change-window validation and daily BGP health checks.
#
# Inventory example:
#   [core_routers]
#   rtr-01 ansible_host=10.0.0.1 ansible_network_os=ios
#   rtr-02 ansible_host=10.0.0.2 ansible_network_os=iosxr
#
#   [dc_spine]
#   spine-01 ansible_host=10.1.0.1 ansible_network_os=nxos
#
#   [all:vars]
#   ansible_connection=network_cli
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_user={{ vault_net_user }}       # ansible-vault encrypted
#   ansible_password={{ vault_net_pass }}   # ansible-vault encrypted
#   ansible_ssh_common_args='-o StrictHostKeyChecking=no'

- name: BGP Neighbor State Audit
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  vars:
    bgp_down_pattern: "Idle|Active|Connect|OpenSent|OpenConfirm"

  tasks:

    - name: Collect BGP data - IOS / IOS-XE
      block:
        - name: Run show ip bgp summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
              - show ip bgp neighbors | include BGP neighbor is|BGP state|Prefixes received
          register: ios_bgp
          retries: 2
          delay: 5
          until: ios_bgp is not failed

        - name: Display IOS BGP neighbor table
          ansible.builtin.debug:
            var: ios_bgp.stdout_lines[0]

        - name: Display IOS BGP neighbor detail
          ansible.builtin.debug:
            var: ios_bgp.stdout_lines[1]

        - name: Flag non-Established sessions on IOS
          ansible.builtin.debug:
            msg: "WARN: Non-Established BGP session on {{ inventory_hostname }} -- investigate before change window"
          when: ios_bgp.stdout[0] is search(bgp_down_pattern)

      rescue:
        - name: Log IOS collection failure
          ansible.builtin.debug:
            msg: "ERROR: BGP collection failed on {{ inventory_hostname }} -- {{ ansible_failed_result.msg | default('check SSH/credentials') }}"

      when: ansible_network_os in ['ios', 'iosxe']

    - name: Collect BGP data - NX-OS
      block:
        - name: Run show bgp all summary
          cisco.nxos.nxos_command:
            commands:
              - show bgp all summary
              - show bgp all neighbors | include BGP neighbor|BGP state|Prefixes received
          register: nxos_bgp
          retries: 2
          delay: 5
          until: nxos_bgp is not failed

        - name: Display NX-OS BGP neighbor table
          ansible.builtin.debug:
            var: nxos_bgp.stdout_lines[0]

        - name: Flag non-Established sessions on NX-OS
          ansible.builtin.debug:
            msg: "WARN: Non-Established BGP session on {{ inventory_hostname }}"
          when: nxos_bgp.stdout[0] is search(bgp_down_pattern)

      rescue:
        - name: Log NX-OS collection failure
          ansible.builtin.debug:
            msg: "ERROR: BGP collection failed on {{ inventory_hostname }} -- {{ ansible_failed_result.msg | default('check SSH/credentials') }}"

      when: ansible_network_os == 'nxos'

    - name: Collect BGP data - IOS-XR
      block:
        - name: Run show bgp summary
          cisco.iosxr.iosxr_command:
            commands:
              - show bgp summary
              - show bgp neighbors | include Neighbor|BGP state|Prefixes received
          register: iosxr_bgp
          retries: 2
          delay: 5
          until: iosxr_bgp is not failed
          failed_when: iosxr_bgp.stdout[0] is search('% BGP not active')

        - name: Display IOS-XR BGP neighbor table
          ansible.builtin.debug:
            var: iosxr_bgp.stdout_lines[0]

        - name: Flag non-Established sessions on IOS-XR
          ansible.builtin.debug:
            msg: "WARN: Non-Established BGP session on {{ inventory_hostname }}"
          when: iosxr_bgp.stdout[0] is search(bgp_down_pattern)

      rescue:
        - name: Log IOS-XR collection failure
          ansible.builtin.debug:
            msg: "ERROR: BGP collection failed on {{ inventory_hostname }} -- {{ ansible_failed_result.msg | default('check SSH/credentials') }}"

      when: ansible_network_os == 'iosxr'

    - name: Unsupported platform notice
      ansible.builtin.debug:
        msg: "SKIP: {{ inventory_hostname }} has unsupported network_os '{{ ansible_network_os }}' -- add a task block to extend coverage"
      when: ansible_network_os not in ['ios', 'iosxe', 'nxos', 'iosxr']