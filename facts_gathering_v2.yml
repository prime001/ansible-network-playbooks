---
# BGP Neighbor Health Check and Route Table Snapshot
#
# Collects BGP neighbor states, advertised/received prefix counts, and
# routing table summary across IOS/IOS-XE devices. Fails the play if any
# BGP session is not in Established state so that monitoring catches flaps.
#
# Credentials: ansible-vault encrypted group_vars/network/vault.yml
#   vault_ansible_user: "{{ vault_ansible_user }}"
#   vault_ansible_password: "{{ vault_ansible_password }}"
#   vault_ansible_become_password: "{{ vault_ansible_become_password }}"
#
# Inventory example (inventory/hosts.yml):
# ---
# all:
#   children:
#     bgp_routers:
#       hosts:
#         core-rtr-01:
#           ansible_host: 192.168.1.1
#           bgp_expected_neighbor_count: 4
#         core-rtr-02:
#           ansible_host: 192.168.1.2
#           bgp_expected_neighbor_count: 4
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_ansible_user }}"
#         ansible_password: "{{ vault_ansible_password }}"
#         ansible_become: true
#         ansible_become_method: enable
#         ansible_become_password: "{{ vault_ansible_become_password }}"
#         bgp_expected_neighbor_count: 2

- name: BGP Neighbor Health Check and Route Table Snapshot
  hosts: bgp_routers
  gather_facts: false

  vars:
    bgp_expected_neighbor_count: "{{ bgp_expected_neighbor_count | default(1) }}"
    bgp_session_state_pattern: "Established"

  tasks:
    - name: Collect BGP neighbor summary
      block:
        - name: Run show ip bgp summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
          register: bgp_summary_output
          retries: 3
          delay: 5
          until: bgp_summary_output.failed == false

        - name: Run show ip route summary
          cisco.ios.ios_command:
            commands:
              - show ip route summary
          register: route_summary_output
          retries: 2
          delay: 5
          until: route_summary_output.failed == false

        - name: Run show ip bgp neighbors (state detail)
          cisco.ios.ios_command:
            commands:
              - show ip bgp neighbors | include BGP neighbor|BGP state
          register: bgp_neighbors_output
          retries: 2
          delay: 5
          until: bgp_neighbors_output.failed == false

        - name: Assert all BGP sessions are Established
          ansible.builtin.assert:
            that:
              - bgp_neighbors_output.stdout[0] | regex_findall('BGP state = Established') | length | int >= bgp_expected_neighbor_count | int
            fail_msg: >
              {{ inventory_hostname }}: Expected {{ bgp_expected_neighbor_count }}
              Established BGP session(s), found
              {{ bgp_neighbors_output.stdout[0] | regex_findall('BGP state = Established') | length }}.
              Check for flapping peers.
            success_msg: "{{ inventory_hostname }}: All {{ bgp_expected_neighbor_count }} BGP session(s) Established."

      rescue:
        - name: Log BGP collection failure
          ansible.builtin.debug:
            msg: >
              ALERT: BGP health check failed on {{ inventory_hostname }}.
              Error: {{ bgp_summary_output.msg | default(bgp_neighbors_output.msg | default('unknown')) }}

        - name: Fail explicitly so the play is marked failed
          ansible.builtin.fail:
            msg: "BGP neighbor check did not complete successfully on {{ inventory_hostname }}."

    - name: Display BGP summary output
      ansible.builtin.debug:
        msg: "{{ bgp_summary_output.stdout_lines[0] }}"

    - name: Display route table summary
      ansible.builtin.debug:
        msg: "{{ route_summary_output.stdout_lines[0] }}"

    - name: Report BGP neighbor states
      ansible.builtin.debug:
        msg: "{{ bgp_neighbors_output.stdout_lines[0] }}