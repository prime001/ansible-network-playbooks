---
# bgp_neighbor_status.yml
#
# Collects BGP session state, prefix counts, and uptime across
# multi-vendor routers. Flags any non-Established sessions so
# operators can triage peering issues quickly.
#
# Credentials: ansible-vault encrypted at group_vars/network/vault.yml
#   vault_ansible_user, vault_ansible_password, vault_ansible_become_password
#
# Inventory example:
#   [ios_routers]
#   core-rtr-01  ansible_host=10.0.1.1  ansible_network_os=ios
#   core-rtr-02  ansible_host=10.0.1.2  ansible_network_os=ios
#
#   [iosxr_routers]
#   pe-rtr-01  ansible_host=10.0.2.1  ansible_network_os=iosxr
#
#   [nxos_switches]
#   dc-spine-01  ansible_host=10.0.3.1  ansible_network_os=nxos
#
#   [network:children]
#   ios_routers
#   iosxr_routers
#   nxos_switches

- name: Collect BGP neighbor state and prefix counts across multi-vendor devices
  hosts: network
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_ansible_become_password }}"
    bgp_report_dir: "./bgp_reports"
    run_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Create local BGP report directory
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ bgp_report_dir }}"
        state: directory
        mode: '0755'

    - name: Gather BGP summary — IOS / IOS-XE
      when: ansible_network_os == 'ios'
      block:
        - name: Run show ip bgp summary (IOS)
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
              - show ip bgp neighbors | include BGP neighbor|BGP state|Prefixes Current
          register: ios_bgp
          retries: 3
          delay: 5
          until: ios_bgp is not failed

        - name: Flag non-Established IOS BGP sessions
          ansible.builtin.debug:
            msg: "WARNING — non-Established session detected on {{ inventory_hostname }}"
          when: "'Idle' in ios_bgp.stdout[0] or 'Active' in ios_bgp.stdout[0]"
      rescue:
        - name: Record IOS collection failure
          ansible.builtin.debug:
            msg: "BGP collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Gather BGP summary — IOS-XR
      when: ansible_network_os == 'iosxr'
      block:
        - name: Run show bgp summary (IOS-XR)
          cisco.iosxr.iosxr_command:
            commands:
              - show bgp summary
              - show bgp neighbors brief
          register: iosxr_bgp
          retries: 3
          delay: 5
          until: iosxr_bgp is not failed

        - name: Flag non-Established IOS-XR BGP sessions
          ansible.builtin.debug:
            msg: "WARNING — non-Established session detected on {{ inventory_hostname }}"
          when: "'Idle' in iosxr_bgp.stdout[0] or 'Active' in iosxr_bgp.stdout[0]"
      rescue:
        - name: Record IOS-XR collection failure
          ansible.builtin.debug:
            msg: "BGP collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Gather BGP summary — NX-OS
      when: ansible_network_os == 'nxos'
      block:
        - name: Run show bgp all summary (NX-OS)
          cisco.nxos.nxos_command:
            commands:
              - show bgp all summary
          register: nxos_bgp
          retries: 3
          delay: 5
          until: nxos_bgp is not failed

        - name: Flag non-Established NX-OS BGP sessions
          ansible.builtin.debug:
            msg: "WARNING — non-Established session detected on {{ inventory_hostname }}"
          when: "'Idle' in nxos_bgp.stdout[0] or 'Active' in nxos_bgp.stdout[0]"
      rescue:
        - name: Record NX-OS collection failure
          ansible.builtin.debug:
            msg: "BGP collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Write per-device BGP report
      delegate_to: localhost
      ansible.builtin.copy:
        content: |
          Device    : {{ inventory_hostname }}
          Timestamp : {{ run_timestamp }}
          Platform  : {{ ansible_network_os }}
          ============================================================
          {% if ansible_network_os == 'ios' and ios_bgp is defined and ios_bgp is not failed %}
          {{ ios_bgp.stdout | join('\n---\n') }}
          {% elif ansible_network_os == 'iosxr' and iosxr_bgp is defined and iosxr_bgp is not failed %}
          {{ iosxr_bgp.stdout | join('\n---\n') }}
          {% elif ansible_network_os == 'nxos' and nxos_bgp is defined and nxos_bgp is not failed %}
          {{ nxos_bgp.stdout | join('\n---\n') }}
          {% else %}
          No BGP data collected — check rescue task output.
          {% endif %}
        dest: "{{ bgp_report_dir }}/{{ inventory_hostname }}_bgp_{{ run_timestamp }}.txt"
        mode: '0644'