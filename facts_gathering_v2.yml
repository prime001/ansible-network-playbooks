---
# routing_state_gather.yml
# Collects BGP peer states, OSPF adjacencies, and IP route summary from IOS/IOS-XE devices.
# Complements facts_gathering*.yml (device/interface facts) with live routing protocol state.
#
# Credentials sourced from Ansible Vault — group_vars/network/vault.yml must define:
#   vault_net_user, vault_net_pass, vault_net_enable
#
# Inventory example:
#   [core_routers]
#   core-rtr-01  ansible_host=10.0.1.1
#   core-rtr-02  ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_pass }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_net_enable }}
#
# Usage: ansible-playbook routing_state_gather.yml -i inventory/hosts --ask-vault-pass

- name: Gather routing protocol state from core routers
  hosts: core_routers
  gather_facts: false
  vars:
    output_dir: "./routing_state_reports"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Ensure local report directory exists
      delegate_to: localhost
      run_once: true
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'

    - name: Collect routing protocol state
      block:
        - name: Retrieve BGP summary
          ios_command:
            commands:
              - show ip bgp summary
            retries: 3
            interval: 5
          register: bgp_summary
          failed_when: >
            bgp_summary.failed and
            'BGP not active' not in (bgp_summary.stdout[0] | default(''))

        - name: Retrieve OSPF neighbor table
          ios_command:
            commands:
              - show ip ospf neighbor
            retries: 3
            interval: 5
          register: ospf_neighbors

        - name: Retrieve IP route summary
          ios_command:
            commands:
              - show ip route summary
            retries: 2
            interval: 3
          register: route_summary

        - name: Display BGP peer state
          debug:
            msg: "{{ bgp_summary.stdout_lines[0] }}"
          when: bgp_summary.stdout[0] | default('') | length > 0

        - name: Display OSPF adjacencies
          debug:
            msg: "{{ ospf_neighbors.stdout_lines[0] }}"
          when: ospf_neighbors.stdout[0] | default('') | length > 0

        - name: Display route count summary
          debug:
            msg: "{{ route_summary.stdout_lines[0] }}"
          when: route_summary.stdout[0] | default('') | length > 0

        - name: Write per-device routing state report
          delegate_to: localhost
          copy:
            content: |
              === Routing State Report: {{ inventory_hostname }} ===
              Collected: {{ timestamp }}

              --- BGP Summary ---
              {{ bgp_summary.stdout[0] | default('BGP not configured or not active') }}

              --- OSPF Neighbors ---
              {{ ospf_neighbors.stdout[0] | default('OSPF not configured') }}

              --- IP Route Summary ---
              {{ route_summary.stdout[0] | default('No routing table data') }}
            dest: "{{ output_dir }}/{{ inventory_hostname }}_routing_{{ timestamp }}.txt"

      rescue:
        - name: Report collection failure
          debug:
            msg: >
              Routing state collection failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Write failure marker for downstream processing
          delegate_to: localhost
          copy:
            content: "FAILED {{ timestamp }}: {{ ansible_failed_result.msg | default('unknown') }}\n"
            dest: "{{ output_dir }}/{{ inventory_hostname }}_FAILED_{{ timestamp }}.txt