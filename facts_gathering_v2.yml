---
# bgp_neighbor_facts.yml
#
# Collects BGP neighbor state, session uptime, prefix counts, and route
# table summary from IOS/IOS-XE devices. Saves per-host output locally
# for auditing, trending, or feeding into a CMDB.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.1.1
#   rtr-core-02  ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_password }}
#   # Encrypt secrets: ansible-vault encrypt_string '<value>' --name 'vault_net_password'

- name: Gather BGP neighbor state and routing table facts from IOS/IOS-XE
  hosts: core_routers
  gather_facts: false
  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_pass: "{{ vault_enable_password }}"
    output_dir: "./bgp_facts"

  tasks:
    - name: Create local output directory
      run_once: true
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Collect BGP and routing facts
      block:
        - name: Fetch BGP summary and neighbor detail
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
              - show ip bgp neighbors
              - show ip route summary
          register: bgp_raw
          retries: 3
          delay: 5
          until: bgp_raw is not failed

        - name: Fetch IPv6 BGP summary when present
          cisco.ios.ios_command:
            commands:
              - show bgp ipv6 unicast summary
          register: bgp_v6_raw
          failed_when: false

      rescue:
        - name: Report collection failure
          ansible.builtin.debug:
            msg: "BGP fact collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('connection error') }}"

        - name: Flag host so downstream tasks skip cleanly
          ansible.builtin.set_fact:
            bgp_failed: true

    - name: Assert at least one established BGP session exists
      when: bgp_failed is not defined
      ansible.builtin.assert:
        that:
          - >-
            'Established' in bgp_raw.stdout[0] or
            'established' in bgp_raw.stdout[0]
        fail_msg: "No established BGP sessions on {{ inventory_hostname }}"
        success_msg: "Established BGP sessions confirmed on {{ inventory_hostname }}"
      ignore_errors: true
      register: bgp_session_check

    - name: Display BGP summary
      when: bgp_failed is not defined
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} — BGP Summary ==="
          - "{{ bgp_raw.stdout[0] }}"

    - name: Display route table summary
      when: bgp_failed is not defined
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} — Route Summary ==="
          - "{{ bgp_raw.stdout[2] }}"

    - name: Save BGP facts to file
      when: bgp_failed is not defined
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ inventory_hostname }}_bgp_facts.txt"
        mode: "0644"
        content: |
          Host: {{ inventory_hostname }}
          Collected: {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
          BGP session healthy: {{ bgp_session_check.failed is not defined or not bgp_session_check.failed }}

          === BGP Summary ===
          {{ bgp_raw.stdout[0] }}

          === BGP Neighbors ===
          {{ bgp_raw.stdout[1] }}

          === Route Summary ===
          {{ bgp_raw.stdout[2] }}

          === IPv6 BGP Summary ===
          {{ bgp_v6_raw.stdout[0] | default('IPv6 BGP not configured') }}

    - name: Final status per host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{
            'COLLECTION FAILED' if bgp_failed is defined else
            ('SESSION DOWN' if bgp_session_check is defined and bgp_session_check.failed else
            'OK — facts saved to ' + output_dir + '/' + inventory_hostname + '_bgp_facts.txt')
          }}