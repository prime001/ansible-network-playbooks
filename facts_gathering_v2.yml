---
# Routing Protocol Facts Gathering
# Collects OSPF/BGP neighbor states and routing table summaries
# for topology documentation and operational awareness.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=cisco.ios.ios
#   ansible_connection=ansible.netcommon.network_cli
#   ansible_user={{ vault_network_user }}           # ansible-vault encrypted
#   ansible_password={{ vault_network_password }}   # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Gather routing protocol neighbor and table facts
  hosts: core_routers
  gather_facts: false
  vars:
    report_dir: "{{ playbook_dir }}/routing_reports"

  tasks:

    - name: Create report output directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Gather OSPF neighbor and process facts
      block:
        - name: Show OSPF neighbor table
          cisco.ios.ios_command:
            commands:
              - show ip ospf neighbor
              - show ip ospf
          register: ospf_facts
          retries: 3
          delay: 10
          until: ospf_facts is not failed

      rescue:
        - name: Note OSPF data unavailable
          ansible.builtin.debug:
            msg: "OSPF gather failed on {{ inventory_hostname }} — may not be running OSPF"

        - name: Set empty OSPF placeholder
          ansible.builtin.set_fact:
            ospf_facts:
              stdout:
                - "OSPF not available on this device"
                - "OSPF not available on this device"

    - name: Gather BGP neighbor summary
      block:
        - name: Show BGP neighbor summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
              - show ip bgp neighbors | include BGP neighbor|BGP state
          register: bgp_facts
          retries: 3
          delay: 10
          until: bgp_facts is not failed

      rescue:
        - name: Note BGP data unavailable
          ansible.builtin.debug:
            msg: "BGP gather failed on {{ inventory_hostname }} — may not be running BGP"

        - name: Set empty BGP placeholder
          ansible.builtin.set_fact:
            bgp_facts:
              stdout:
                - "BGP not available on this device"
                - "BGP not available on this device"

    - name: Gather route table summary
      cisco.ios.ios_command:
        commands:
          - show ip route summary
          - show ip route
      register: route_table_facts
      failed_when: >
        route_table_facts.failed and
        'Invalid input' not in (route_table_facts.msg | default(''))

    - name: Display OSPF neighbor summary
      ansible.builtin.debug:
        msg: "{{ ospf_facts.stdout[0].splitlines() }}"

    - name: Display BGP peer summary
      ansible.builtin.debug:
        msg: "{{ bgp_facts.stdout[0].splitlines() }}"

    - name: Display route table summary
      ansible.builtin.debug:
        msg: "{{ route_table_facts.stdout[0].splitlines() }}"

    - name: Save routing facts report
      ansible.builtin.copy:
        content: |
          ============================================================
          Routing Facts Report: {{ inventory_hostname }}
          ============================================================

          --- OSPF Neighbors ---
          {{ ospf_facts.stdout[0] }}

          --- OSPF Process Info ---
          {{ ospf_facts.stdout[1] }}

          --- BGP Summary ---
          {{ bgp_facts.stdout[0] }}

          --- BGP Neighbor States ---
          {{ bgp_facts.stdout[1] }}

          --- Route Table Summary ---
          {{ route_table_facts.stdout[0] | default('Not available') }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_routing_facts.txt"
        mode: '0644'
      delegate_to: localhost