# BGP Neighbor State and Prefix Count Audit
# Collects BGP summary, per-neighbor adjacency state, and received prefix counts
# from Cisco IOS/IOS-XE routers. Run after topology changes or for periodic health checks.
#
# Inventory example:
#   [core_routers]
#   core-r1  ansible_host=10.0.0.1
#   core-r2  ansible_host=10.0.0.2
#
#   [edge_routers]
#   edge-r1  ansible_host=10.0.1.1
#
#   [bgp_devices:children]
#   core_routers
#   edge_routers
#
#   [bgp_devices:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: BGP Neighbor State and Prefix Count Audit
  hosts: bgp_devices
  gather_facts: false

  vars:
    # Defined in group_vars/all/vault.yml — encrypt with: ansible-vault encrypt vault.yml
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_enable_password }}"

  tasks:
    - name: Collect BGP neighbor data
      block:
        - name: Retrieve BGP IPv4 unicast summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
          register: bgp_ipv4_summary
          retries: 3
          delay: 5
          until: bgp_ipv4_summary is not failed

        - name: Retrieve BGP IPv4 neighbor detail (state and prefix counts)
          cisco.ios.ios_command:
            commands:
              - show ip bgp neighbors | include BGP neighbor|BGP state|Prefixes current|Up/Down
          register: bgp_neighbor_detail
          retries: 2
          delay: 5
          until: bgp_neighbor_detail is not failed

        - name: Retrieve BGP IPv6 unicast summary
          cisco.ios.ios_command:
            commands:
              - show bgp ipv6 unicast summary
          register: bgp_ipv6_summary
          failed_when: false

        - name: Display BGP IPv4 summary table
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} BGP IPv4 Summary:\n{{ bgp_ipv4_summary.stdout[0] }}"

        - name: Display BGP neighbor state and prefix detail
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} BGP Neighbor Detail:\n{{ bgp_neighbor_detail.stdout[0] }}"

        - name: Display BGP IPv6 summary when present
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} BGP IPv6 Summary:\n{{ bgp_ipv6_summary.stdout[0] }}"
          when:
            - bgp_ipv6_summary.stdout is defined
            - bgp_ipv6_summary.stdout[0] | length > 10

        - name: Alert on non-Established BGP sessions
          ansible.builtin.debug:
            msg: "WARNING: {{ inventory_hostname }} has BGP session(s) not in Established state — review output above"
          when: >
            bgp_ipv4_summary.stdout[0] | regex_search('Idle|Active|Connect') is not none

        - name: Store BGP audit result for post-play summary
          ansible.builtin.set_fact:
            bgp_audit_result:
              host: "{{ inventory_hostname }}"
              ipv4_summary: "{{ bgp_ipv4_summary.stdout[0] }}"
              degraded: "{{ bgp_ipv4_summary.stdout[0] | regex_search('Idle|Active|Connect') is not none }}"

      rescue:
        - name: Report BGP collection failure
          ansible.builtin.debug:
            msg: "ERROR: BGP audit failed on {{ inventory_hostname }} — {{ ansible_failed_result.msg | default('check SSH connectivity and BGP configuration') }}"

        - name: Flag host for post-play review
          ansible.builtin.set_fact:
            bgp_audit_result:
              host: "{{ inventory_hostname }}"
              degraded: true
              error: "{{ ansible_failed_result.msg | default('collection failed') }}