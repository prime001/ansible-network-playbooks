---
# CDP/LLDP Neighbor Discovery and Topology Documentation
#
# Collects CDP and LLDP neighbor tables from IOS/IOS-XE devices,
# correlates with interface status, and saves per-device topology reports.
# Useful for network audits, documentation, and change-window pre-checks.
#
# Inventory example:
#   [core]
#   core-sw01 ansible_host=10.0.1.1
#   core-sw02 ansible_host=10.0.1.2
#
#   [distribution]
#   dist-sw01 ansible_host=10.0.2.1
#
#   [all:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}          # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}      # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: CDP/LLDP Neighbor Discovery and Topology Documentation
  hosts: network_devices
  gather_facts: false

  vars:
    output_dir: "{{ playbook_dir }}/reports/neighbor_discovery"
    report_date: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Create report output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Collect CDP and LLDP neighbor tables
      block:
        - name: Gather CDP neighbor detail
          cisco.ios.ios_command:
            commands:
              - show cdp neighbors detail
          register: cdp_neighbors
          retries: 2
          delay: 5
          until: cdp_neighbors is not failed

        - name: Gather LLDP neighbor detail
          cisco.ios.ios_command:
            commands:
              - show lldp neighbors detail
          register: lldp_neighbors
          retries: 2
          delay: 5
          until: lldp_neighbors is not failed

        - name: Gather interface status for neighbor correlation
          cisco.ios.ios_command:
            commands:
              - show interfaces status
          register: intf_status
          retries: 2
          delay: 5
          until: intf_status is not failed

      rescue:
        - name: Record collection failure and continue
          ansible.builtin.set_fact:
            collection_failed: true
            failure_reason: "{{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Log failed device
          ansible.builtin.debug:
            msg: "WARN: neighbor collection failed on {{ inventory_hostname }} — {{ failure_reason }}"

    - name: Display CDP neighbor summary
      ansible.builtin.debug:
        msg: "{{ cdp_neighbors.stdout_lines[0] }}"
      when:
        - collection_failed is not defined
        - cdp_neighbors.stdout[0] | length > 0

    - name: Save neighbor topology report
      ansible.builtin.copy:
        content: |
          ========================================
          Neighbor Topology Report
          Device    : {{ inventory_hostname }}
          Timestamp : {{ report_date }}
          ========================================

          --- CDP Neighbors ---
          {{ cdp_neighbors.stdout[0] | default('CDP not enabled or no neighbors') }}

          --- LLDP Neighbors ---
          {{ lldp_neighbors.stdout[0] | default('LLDP not enabled or no neighbors') }}

          --- Interface Status ---
          {{ intf_status.stdout[0] | default('Not collected') }}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_neighbors_{{ report_date }}.txt"
      delegate_to: localhost
      when: collection_failed is not defined

    - name: Warn on skipped devices
      ansible.builtin.debug:
        msg: "SKIP: {{ inventory_hostname }} — neighbor data not saved due to collection failure"
      when: collection_failed is defined