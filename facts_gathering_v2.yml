---
# bgp_state_gather.yml
#
# Gathers BGP neighbor session state, uptime, and prefix counts from
# Cisco IOS/IOS-XE routers. Flags any sessions not in Established state
# and writes per-device reports locally for operational review.
#
# Credentials: store encrypted in group_vars/all/vault.yml (ansible-vault)
#   vault_net_user: <username>
#   vault_net_password: <password>
#   vault_enable_password: <enable secret>
#
# Inventory example:
#   [bgp_routers]
#   core-rtr-01  ansible_host=10.0.1.1
#   core-rtr-02  ansible_host=10.0.1.2
#   edge-rtr-01  ansible_host=10.0.2.1
#
#   [bgp_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Gather BGP neighbor state and prefix statistics
  hosts: bgp_routers
  gather_facts: false

  vars:
    report_dir: "./reports/bgp"
    non_established_states:
      - "Active"
      - "Idle"
      - "Connect"
      - "OpenSent"
      - "OpenConfirm"

  tasks:
    - name: Collect BGP operational data
      block:
        - name: Run BGP show commands
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
              - show ip bgp neighbors | include BGP neighbor|BGP state|Prefixes Current|Up/Down
              - show ip route summary
            retries: 2
            interval: 10
          register: bgp_raw
          failed_when: >
            bgp_raw.failed or
            'BGP not active' in (bgp_raw.stdout | join(' '))

      rescue:
        - name: Log collection failure
          ansible.builtin.debug:
            msg: >-
              BGP data collection failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('unreachable or BGP not configured') }}

        - name: Abort this host
          ansible.builtin.fail:
            msg: "Halting {{ inventory_hostname }} — BGP state collection unsuccessful after retries."

    - name: Display BGP neighbor summary
      ansible.builtin.debug:
        msg:
          - "=== BGP Summary: {{ inventory_hostname }} ==="
          - "{{ bgp_raw.stdout[0] }}"

    - name: Flag non-Established BGP sessions
      ansible.builtin.debug:
        msg: "WARNING: Non-Established BGP session detected on {{ inventory_hostname }} — review output above."
      when: >
        bgp_raw.stdout[0] is defined and
        (non_established_states | select('in', bgp_raw.stdout[0]) | list | length > 0)

    - name: Display route table summary
      ansible.builtin.debug:
        msg:
          - "=== Route Summary: {{ inventory_hostname }} ==="
          - "{{ bgp_raw.stdout[2] }}"

    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Write BGP state report to file
      ansible.builtin.copy:
        content: |
          ================================================================
          BGP State Report: {{ inventory_hostname }}
          Collected: {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
          ================================================================

          -- BGP Summary --
          {{ bgp_raw.stdout[0] }}

          -- BGP Neighbor Detail --
          {{ bgp_raw.stdout[1] }}

          -- Route Table Summary --
          {{ bgp_raw.stdout[2] }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y%m%d') }}.txt"
        mode: "0644"
      delegate_to: localhost