---
# bgp_facts_gathering.yml
#
# Collects BGP neighbor state, prefix counts, and AS path data across
# IOS, IOS-XR, NX-OS, and JunOS platforms. Saves a per-host JSON
# summary to ./reports/bgp_facts/. Distinct from facts_gathering*.yml
# which targets device hardware/interface/version facts.
#
# Vault reference: ansible-vault encrypt_string secrets.yml
# Variables expected (group_vars/all/vault.yml):
#   vault_net_username: "netops"
#   vault_net_password: "{{ vault_net_password }}"
#   vault_net_enable:   "{{ vault_net_enable }}"   # IOS only
#
# Inventory example:
# [core_routers]
# rtr-core-01 ansible_host=10.0.0.1  ansible_network_os=ios
# rtr-core-02 ansible_host=10.0.0.2  ansible_network_os=iosxr
#
# [dc_spine]
# spine-01    ansible_host=10.1.0.1  ansible_network_os=nxos
#
# [all:vars]
# ansible_user="{{ vault_net_username }}"
# ansible_password="{{ vault_net_password }}"
# ansible_become=true
# ansible_become_method=enable
# ansible_connection=network_cli
#

- name: Gather BGP neighbor facts from multi-vendor network devices
  hosts: all
  gather_facts: false
  vars:
    report_dir: "./reports/bgp_facts"
    bgp_cmd_map:
      ios:    "show bgp summary"
      iosxr:  "show bgp summary"
      nxos:   "show bgp summary"
      junos:  "show bgp summary"

  tasks:
    - name: Ensure local report directory exists
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: Collect BGP summary output
      block:
        - name: Run BGP summary command
          ansible.netcommon.cli_command:
            command: "{{ bgp_cmd_map[ansible_network_os] | default('show bgp summary') }}"
          register: bgp_raw
          retries: 3
          delay: 5
          until: bgp_raw is not failed
          failed_when:
            - bgp_raw.failed
            - "'% Invalid' not in (bgp_raw.stdout | default(''))"

        - name: Collect BGP neighbor detail (IOS / IOS-XR)
          ansible.netcommon.cli_command:
            command: "show bgp neighbors"
          register: bgp_neighbors_raw
          when: ansible_network_os in ['ios', 'iosxr']
          retries: 2
          delay: 5
          until: bgp_neighbors_raw is not failed

      rescue:
        - name: Log collection failure and continue
          ansible.builtin.debug:
            msg: "BGP fact collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Mark host as failed non-fatally
          ansible.builtin.set_fact:
            bgp_collection_failed: true

    - name: Parse and display BGP summary
      ansible.builtin.debug:
        msg: |
          === BGP Summary: {{ inventory_hostname }} ({{ ansible_network_os }}) ===
          {{ bgp_raw.stdout | default('No output collected') }}
      when: bgp_collection_failed is not defined

    - name: Save BGP facts report to local file
      delegate_to: localhost
      ansible.builtin.copy:
        content: |
          # BGP Facts Report
          # Host: {{ inventory_hostname }}
          # Platform: {{ ansible_network_os }}
          # Collected: {{ ansible_date_time.iso8601 | default('unknown') }}

          ## BGP Summary
          {{ bgp_raw.stdout | default('collection failed') }}

          ## BGP Neighbors
          {{ bgp_neighbors_raw.stdout | default('N/A - not collected for this platform') }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_bgp_facts.txt"
        mode: "0644"
      when: bgp_collection_failed is not defined

    - name: Summarize collection results
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {% if bgp_collection_failed is defined %}FAILED - skipped report{% else %}OK -
          report saved to {{ report_dir }}/{{ inventory_hostname }}_bgp_facts.txt{% endif %}