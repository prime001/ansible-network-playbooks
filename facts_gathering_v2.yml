---
# BGP Neighbor State and Prefix Statistics Gathering
# Collects BGP session state, uptime, and prefix counts across IOS, NX-OS,
# and IOS-XR platforms. Flags non-Established sessions and saves per-device
# reports to the control node.
#
# Inventory example:
#   [bgp_routers]
#   core-rtr-01  ansible_host=10.0.1.1  ansible_network_os=ios
#   core-rtr-02  ansible_host=10.0.1.2  ansible_network_os=nxos
#   edge-rtr-01  ansible_host=10.0.2.1  ansible_network_os=iosxr
#
#   [bgp_routers:vars]
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}        # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}    # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Gather BGP neighbor state and prefix statistics
  hosts: bgp_routers
  gather_facts: false
  vars:
    ansible_user: "{{ vault_net_username }}"
    ansible_password: "{{ vault_net_password }}"
    report_dir: "{{ playbook_dir }}/reports/bgp"

  tasks:
    - name: Ensure BGP report directory exists on control node
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    - name: Collect BGP summary (IOS / IOS-XE)
      block:
        - name: Run BGP summary commands on IOS
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
              - show ip bgp neighbors | include BGP neighbor|BGP state|Prefixes Current
          register: bgp_ios
          retries: 3
          delay: 5
          until: bgp_ios is not failed
      rescue:
        - name: Record IOS BGP collection failure
          ansible.builtin.debug:
            msg: "BGP collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('connection error') }}"
      when: ansible_network_os in ['ios', 'ios_xe']

    - name: Collect BGP summary (NX-OS)
      block:
        - name: Run BGP all-VRF summary on NX-OS
          cisco.nxos.nxos_command:
            commands:
              - show bgp all summary
          register: bgp_nxos
          retries: 3
          delay: 5
          until: bgp_nxos is not failed
      rescue:
        - name: Record NX-OS BGP collection failure
          ansible.builtin.debug:
            msg: "BGP collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('connection error') }}"
      when: ansible_network_os == 'nxos'

    - name: Collect BGP summary (IOS-XR)
      block:
        - name: Run BGP summary commands on IOS-XR
          cisco.iosxr.iosxr_command:
            commands:
              - show bgp summary
              - show bgp neighbors brief
          register: bgp_iosxr
          retries: 3
          delay: 5
          until: bgp_iosxr is not failed
      rescue:
        - name: Record IOS-XR BGP collection failure
          ansible.builtin.debug:
            msg: "BGP collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('connection error') }}"
      when: ansible_network_os == 'iosxr'

    - name: Merge platform BGP output into single fact
      ansible.builtin.set_fact:
        bgp_output: >-
          {{
            (bgp_ios.stdout | default([])) +
            (bgp_nxos.stdout | default([])) +
            (bgp_iosxr.stdout | default([]))
          }}

    - name: Display BGP neighbor summary
      ansible.builtin.debug:
        msg: "BGP summary for {{ inventory_hostname }}:\n{{ bgp_output | join('\n') }}"
      when: bgp_output | length > 0

    - name: Alert on non-Established BGP sessions
      ansible.builtin.debug:
        msg: "WARNING: Non-Established BGP session detected on {{ inventory_hostname }}"
      failed_when: false
      when:
        - bgp_output | length > 0
        - bgp_output | join(' ') | regex_search('(Idle|Active|Connect|OpenSent|OpenConfirm)')

    - name: Save BGP report to control node
      delegate_to: localhost
      ansible.builtin.copy:
        content: |
          BGP Neighbor Report — {{ inventory_hostname }}
          Platform : {{ ansible_network_os }}
          =================================================
          {{ bgp_output | join('\n\n') | default('No BGP data collected') }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_bgp_report.txt"
        mode: '0644'
      when: bgp_output is defined and bgp_output | length > 0