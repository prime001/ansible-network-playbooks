---
# cdp_lldp_neighbors.yml
#
# Discovers CDP and LLDP neighbors from IOS/IOS-XE devices for topology
# documentation. Saves per-device neighbor reports to the control node.
#
# Credentials: ansible-vault encrypted group_vars/all/vault.yml
#   vault_ansible_user: <username>
#   vault_ansible_password: <password>
#   vault_ansible_become_password: <enable_password>
#
# Inventory example:
#   [core_switches]
#   core-sw-01 ansible_host=10.0.1.1
#   core-sw-02 ansible_host=10.0.1.2
#
#   [distribution_switches]
#   dist-sw-01 ansible_host=10.0.2.1
#
#   [network_devices:children]
#   core_switches
#   distribution_switches
#
#   [network_devices:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_ansible_user }}
#   ansible_password={{ vault_ansible_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_ansible_become_password }}

- name: Discover CDP and LLDP neighbors across network devices
  hosts: network_devices
  gather_facts: false
  vars:
    output_dir: "{{ playbook_dir }}/neighbor_reports"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Collect neighbor tables
      block:
        - name: Run show cdp neighbors detail
          cisco.ios.ios_command:
            commands:
              - show cdp neighbors detail
          register: cdp_output
          retries: 2
          delay: 5
          until: cdp_output is not failed

        - name: Run show lldp neighbors detail
          cisco.ios.ios_command:
            commands:
              - show lldp neighbors detail
          register: lldp_output
          retries: 2
          delay: 5
          until: lldp_output is not failed
          # LLDP may be disabled on some devices — treat that as non-fatal
          failed_when: >
            lldp_output.failed and
            'LLDP is not enabled' not in (lldp_output.stdout | join(''))

      rescue:
        - name: Log collection failure
          ansible.builtin.debug:
            msg: "Failed to collect neighbor data from {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

        - name: Abort for this host
          ansible.builtin.fail:
            msg: "Neighbor collection aborted for {{ inventory_hostname }}"

    - name: Display CDP neighbors
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} CDP neighbors:\n{{ cdp_output.stdout[0] }}"
      when:
        - cdp_output is defined
        - cdp_output.stdout[0] | length > 0

    - name: Display LLDP neighbors
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} LLDP neighbors:\n{{ lldp_output.stdout[0] }}"
      when:
        - lldp_output is defined
        - not lldp_output.failed
        - lldp_output.stdout[0] | length > 0

    - name: Save neighbor report to control node
      ansible.builtin.copy:
        content: |
          === Neighbor Discovery Report ===
          Device    : {{ inventory_hostname }}
          Timestamp : {{ timestamp }}

          --- CDP Neighbors ---
          {{ cdp_output.stdout[0] | default('No CDP data collected') }}

          --- LLDP Neighbors ---
          {{ lldp_output.stdout[0] | default('LLDP not enabled or no data collected') }}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_neighbors_{{ timestamp }}.txt"
        mode: '0644'
      delegate_to: localhost
      when: cdp_output is defined

    - name: Summarize results
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          CDP neighbors found={{ 'Device ID' in (cdp_output.stdout[0] | default('')) }},
          LLDP collected={{ not (lldp_output.failed | default(true)) }},
          report={{ output_dir }}/{{ inventory_hostname }}_neighbors_{{ timestamp }}.txt
      when: cdp_output is defined
```