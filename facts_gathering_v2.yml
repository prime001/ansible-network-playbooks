---
# routing_topology_facts.yml
#
# Collects Layer 3 topology data: BGP/OSPF neighbor states, CDP/LLDP neighbors,
# and routing table summaries. Complements facts_gathering.yml (device-level facts)
# by focusing on protocol adjacencies and reachability state.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.0.1
#   rtr-core-02 ansible_host=10.0.0.2
#
#   [edge_routers]
#   rtr-edge-01 ansible_host=10.0.1.1
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}        # ansible-vault encrypted
#   ansible_password={{ vault_net_password }} # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable

- name: Gather routing topology facts — BGP/OSPF neighbors, CDP/LLDP, route summary
  hosts: core_routers:edge_routers
  gather_facts: false
  vars:
    topology_report_dir: "./topology_reports"
    routing_protocols: "{{ device_routing_protocols | default(['bgp', 'ospf']) }}"

  tasks:
    - name: Collect BGP neighbor summary
      cisco.ios.ios_command:
        commands:
          - show bgp summary
          - show bgp ipv4 unicast summary
      register: bgp_summary_output
      failed_when: false
      retries: 2
      delay: 5

    - name: Collect OSPF neighbor state
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip ospf
      register: ospf_neighbor_output
      failed_when: false
      retries: 2
      delay: 5

    - name: Collect CDP neighbors detail
      cisco.ios.ios_command:
        commands:
          - show cdp neighbors detail
      register: cdp_neighbors_output
      failed_when: false

    - name: Collect LLDP neighbors detail
      cisco.ios.ios_command:
        commands:
          - show lldp neighbors detail
      register: lldp_neighbors_output
      failed_when: false

    - name: Collect routing table summary
      cisco.ios.ios_command:
        commands:
          - show ip route summary
          - show ip route
      register: route_table_output
      failed_when:
        - route_table_output.failed
        - "'Invalid' not in route_table_output.stdout[0]"

    - name: Display BGP neighbor summary
      ansible.builtin.debug:
        msg: "{{ bgp_summary_output.stdout_lines[0] }}"
      when: bgp_summary_output.stdout is defined and bgp_summary_output.stdout[0] != ""

    - name: Display OSPF neighbor state
      ansible.builtin.debug:
        msg: "{{ ospf_neighbor_output.stdout_lines[0] }}"
      when: ospf_neighbor_output.stdout is defined and ospf_neighbor_output.stdout[0] != ""

    - name: Ensure topology report directory exists
      ansible.builtin.file:
        path: "{{ topology_report_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Save topology facts to per-host report
      ansible.builtin.copy:
        content: |
          === Routing Topology Report: {{ inventory_hostname }} ===
          Generated: {{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}

          --- BGP Summary ---
          {{ bgp_summary_output.stdout | default('Not available') | join('\n') }}

          --- OSPF Neighbors ---
          {{ ospf_neighbor_output.stdout | default('Not available') | join('\n') }}

          --- CDP Neighbors ---
          {{ cdp_neighbors_output.stdout | default('Not available') | join('\n') }}

          --- LLDP Neighbors ---
          {{ lldp_neighbors_output.stdout | default('Not available') | join('\n') }}

          --- Route Table Summary ---
          {{ route_table_output.stdout | default('Not available') | join('\n') }}
        dest: "{{ topology_report_dir }}/{{ inventory_hostname }}_topology_{{ ansible_date_time.date | default(lookup('pipe', 'date +%Y-%m-%d')) }}.txt"
        mode: "0640"
      delegate_to: localhost

    - name: Flag hosts with no active BGP or OSPF neighbors
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} — no BGP or OSPF neighbor output detected. Verify routing protocol config."
      when:
        - (bgp_summary_output.stdout[0] | default('')) == ''
        - (ospf_neighbor_output.stdout[0] | default('')) == ''