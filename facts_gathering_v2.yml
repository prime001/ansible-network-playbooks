---
# BGP Neighbor Facts Collector
# Gathers BGP peer state, AS numbers, and prefix counts across IOS, NX-OS, and Junos.
# Distinct from facts_gathering.yml (interface/platform data) — focused on control-plane state.
#
# Credentials: store ansible_password in vault
#   ansible-vault encrypt_string 'secretpass' --name 'ansible_password'
#
# Inventory example (inventory/network.yml):
# all:
#   children:
#     ios_routers:
#       hosts:
#         core-rtr-01:
#           ansible_host: 10.0.0.1
#           ansible_network_os: ios
#         core-rtr-02:
#           ansible_host: 10.0.0.2
#           ansible_network_os: ios
#     nxos_fabric:
#       hosts:
#         spine-01:
#           ansible_host: 10.0.1.1
#           ansible_network_os: nxos
#     junos_pe:
#       hosts:
#         pe-rtr-01:
#           ansible_host: 10.0.2.1
#           ansible_network_os: junos
#   vars:
#     ansible_user: netops
#     ansible_password: !vault |
#       $ANSIBLE_VAULT;1.1;AES256
#       <encrypted-value>
#     ansible_connection: network_cli
#     ansible_become: false

- name: Collect BGP Neighbor State Facts
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  vars:
    retry_count: 3
    retry_delay: 10
    bgp_report_dir: "./reports/bgp"

  tasks:
    - name: Confirm device is reachable
      ansible.netcommon.cli_command:
        command: show version
      register: reachability_check
      retries: "{{ retry_count }}"
      delay: "{{ retry_delay }}"
      until: reachability_check is not failed

    - name: Gather BGP neighbor data — IOS/IOS-XE
      block:
        - name: Run BGP summary and neighbor commands
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
              - show ip bgp neighbors | include BGP neighbor|BGP state|Prefixes
          register: ios_bgp_facts
          failed_when:
            - ios_bgp_facts.failed
            - '"% BGP not active" not in ios_bgp_facts.stdout[0]'

        - name: Display IOS BGP summary
          ansible.builtin.debug:
            var: ios_bgp_facts.stdout_lines

      rescue:
        - name: Record collection failure — IOS
          ansible.builtin.debug:
            msg: "BGP fact collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('check BGP config') }}"
        - name: Flag host as failed
          ansible.builtin.set_fact:
            bgp_facts_failed: true

      when: ansible_network_os in ['ios', 'iosxe']

    - name: Gather BGP neighbor data — NX-OS
      block:
        - name: Run BGP summary and neighbor commands
          cisco.nxos.nxos_command:
            commands:
              - show bgp summary
              - show bgp neighbors | include BGP neighbor|BGP state|Prefixes
          register: nxos_bgp_facts
          failed_when:
            - nxos_bgp_facts.failed
            - '"BGP not running" not in nxos_bgp_facts.stdout[0]'

        - name: Display NX-OS BGP summary
          ansible.builtin.debug:
            var: nxos_bgp_facts.stdout_lines

      rescue:
        - name: Record collection failure — NX-OS
          ansible.builtin.debug:
            msg: "BGP fact collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('check BGP config') }}"
        - name: Flag host as failed
          ansible.builtin.set_fact:
            bgp_facts_failed: true

      when: ansible_network_os == 'nxos'

    - name: Gather BGP neighbor data — Junos
      block:
        - name: Run BGP summary and neighbor commands
          junipernetworks.junos.junos_command:
            commands:
              - show bgp summary
              - show bgp neighbor
          register: junos_bgp_facts

        - name: Display Junos BGP summary
          ansible.builtin.debug:
            var: junos_bgp_facts.stdout_lines

      rescue:
        - name: Record collection failure — Junos
          ansible.builtin.debug:
            msg: "BGP fact collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('check BGP config') }}"
        - name: Flag host as failed
          ansible.builtin.set_fact:
            bgp_facts_failed: true

      when: ansible_network_os == 'junos'

    - name: Report per-host collection status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} BGP facts: {{ 'COLLECTION FAILED' if bgp_facts_failed | default(false) else 'OK' }}