```yaml
---
# bgp_peer_facts.yml
# Collects BGP neighbor summary and session states across IOS and NX-OS devices.
# Useful for scheduled NOC snapshots, pre/post-change verification, and peer audits.
#
# Run: ansible-playbook bgp_peer_facts.yml -i inventory.yml --ask-vault-pass
#
# Inventory example (inventory.yml):
# ---
# all:
#   vars:
#     ansible_connection: network_cli
#     ansible_become: false
#   children:
#     ios_routers:
#       vars:
#         ansible_network_os: ios
#       hosts:
#         rtr-core-01: { ansible_host: 10.0.0.1 }
#         rtr-core-02: { ansible_host: 10.0.0.2 }
#     nxos_switches:
#       vars:
#         ansible_network_os: nxos
#       hosts:
#         sw-dist-01: { ansible_host: 10.0.0.10 }
#   # Vault-encrypted credentials (set per group_vars or host_vars):
#   # ansible_user: netops
#   # ansible_password: !vault |
#   #   $ANSIBLE_VAULT;1.1;AES256
#   #   <encrypted value>

- name: Gather BGP neighbor summary and session states
  hosts: all
  gather_facts: false

  vars:
    bgp_summary_cmd:
      ios: "show ip bgp summary"
      nxos: "show bgp all summary"
      iosxr: "show bgp ipv4 unicast summary"
    bgp_detail_cmd:
      ios: "show ip bgp neighbors | include BGP neighbor|BGP state|Prefixes"
      nxos: "show bgp neighbors | include BGP neighbor|BGP state|Prefixes"
      iosxr: "show bgp neighbors brief"

  tasks:
    - name: Set platform-appropriate BGP commands
      ansible.builtin.set_fact:
        cmd_summary: "{{ bgp_summary_cmd[ansible_network_os] | default('show ip bgp summary') }}"
        cmd_detail: "{{ bgp_detail_cmd[ansible_network_os] | default('show ip bgp neighbors') }}"

    - name: Collect BGP neighbor summary
      block:
        - name: Run BGP summary command
          ansible.netcommon.cli_command:
            command: "{{ cmd_summary }}"
          register: bgp_summary
          retries: 3
          delay: 10
          until: bgp_summary is not failed

        - name: Display BGP summary table
          ansible.builtin.debug:
            msg: "{{ bgp_summary.stdout_lines }}"

        - name: Flag if BGP is not active on device
          ansible.builtin.debug:
            msg: "WARNING: BGP may not be configured or active on {{ inventory_hostname }}"
          when: >
            bgp_summary.stdout | length == 0 or
            'BGP not active' in bgp_summary.stdout or
            'not running' in bgp_summary.stdout

      rescue:
        - name: Record BGP summary collection failure
          ansible.builtin.debug:
            msg: >
              FAILED to collect BGP summary from {{ inventory_hostname }}.
              Verify device reachability, credentials, and BGP configuration.

    - name: Collect BGP neighbor session detail
      ansible.netcommon.cli_command:
        command: "{{ cmd_detail }}"
      register: bgp_detail
      when:
        - bgp_summary is defined
        - bgp_summary is not failed
        - bgp_summary.stdout | length > 0
        - "'BGP not active' not in bgp_summary.stdout"
      failed_when: false
      retries: 2
      delay: 5

    - name: Display BGP session states
      ansible.builtin.debug:
        msg: "{{ bgp_detail.stdout_lines }}"
      when:
        - bgp_detail is defined
        - bgp_detail is not failed
        - bgp_detail.stdout_lines is defined

    - name: Summarize BGP collection result per device
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          platform: "{{ ansible_network_os | default('unknown') }}"
          summary_collected: "{{ (bgp_summary is defined) and (bgp_summary is not failed) }}"
          summary_lines: "{{ bgp_summary.stdout_lines | default([]) | length }}"
          detail_collected: "{{ (bgp_detail is defined) and (bgp_detail is not failed) }}"
```