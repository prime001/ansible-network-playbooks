---
# cdp_lldp_neighbor_discovery.yml
#
# Discovers and reports Layer 2 neighbors via CDP (Cisco) and LLDP (multi-vendor).
# Useful for topology validation, cable-plant audits, and onboarding new segments.
#
# Inventory example:
#   [core_switches]
#   sw-core-01 ansible_host=10.0.0.1
#   sw-core-02 ansible_host=10.0.0.2
#
#   [distribution]
#   sw-dist-01 ansible_host=10.0.1.1
#
#   [network:children]
#   core_switches
#   distribution
#
#   [network:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_network_user }}           # ansible-vault encrypted
#   ansible_password={{ vault_network_password }}   # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_password }} # ansible-vault encrypted

- name: Discover Layer 2 neighbors via CDP and LLDP
  hosts: network
  gather_facts: false
  vars:
    output_dir: "{{ playbook_dir }}/neighbor_reports"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Gather minimal platform facts
      cisco.ios.ios_facts:
        gather_subset:
          - "!all"
          - min
      register: device_facts
      retries: 2
      delay: 5
      until: device_facts is not failed

    - name: Collect CDP and LLDP neighbor data
      block:
        - name: Run CDP neighbor detail
          cisco.ios.ios_command:
            commands:
              - show cdp neighbors detail
              - show cdp neighbors
          register: cdp_output
          failed_when: >
            cdp_output.failed or
            'CDP is not enabled' in (cdp_output.stdout[0] | default(''))

        - name: Run LLDP neighbor detail
          cisco.ios.ios_command:
            commands:
              - show lldp neighbors detail
              - show lldp neighbors
          register: lldp_output
          failed_when: false

      rescue:
        - name: Log collection failure
          ansible.builtin.debug:
            msg: "Neighbor collection failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Seed empty facts on failure
          ansible.builtin.set_fact:
            cdp_output: { stdout: ['', ''] }
            lldp_output: { stdout: ['', ''] }

    - name: Display CDP neighbor summary
      ansible.builtin.debug:
        msg:
          - "=== CDP: {{ inventory_hostname }} ({{ ansible_net_hostname | default(inventory_hostname) }}) ==="
          - "{{ cdp_output.stdout[1] | default('No CDP data') }}"

    - name: Display LLDP neighbor summary
      ansible.builtin.debug:
        msg:
          - "=== LLDP: {{ inventory_hostname }} ==="
          - "{{ lldp_output.stdout[1] | default('No LLDP data') }}"

    - name: Create report output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Save per-device neighbor report
      ansible.builtin.copy:
        content: |
          Neighbor Discovery Report
          Device      : {{ inventory_hostname }}
          Hostname    : {{ ansible_net_hostname | default('unknown') }}
          Platform    : {{ ansible_net_model | default('unknown') }}
          IOS Version : {{ ansible_net_version | default('unknown') }}
          Collected   : {{ timestamp }}

          --- CDP Neighbors Detail ---
          {{ cdp_output.stdout[0] | default('not available') }}

          --- LLDP Neighbors Detail ---
          {{ lldp_output.stdout[0] | default('not available') }}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_neighbors_{{ timestamp }}.txt"
        mode: "0640"
      delegate_to: localhost

    - name: Report neighbor counts
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} —
          CDP peers: {{ (cdp_output.stdout[0] | default('') | regex_findall('Device ID')).count('Device ID') }},
          LLDP peers: {{ (lldp_output.stdout[0] | default('') | regex_findall('System Name')).count('System Name') }}