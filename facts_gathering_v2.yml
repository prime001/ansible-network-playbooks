---
# routing_protocol_status.yml
#
# Collects BGP peer adjacencies, OSPF neighbor states, and IP route summary
# from Cisco IOS devices. Complements general facts_gathering by focusing on
# Layer 3 routing protocol health — useful for pre/post-change validation
# and periodic network state audits.
#
# Credentials: ansible_user, ansible_password, and ansible_become_password
# must be stored in Ansible Vault.
# Run: ansible-playbook routing_protocol_status.yml --ask-vault-pass
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.0.1
#   rtr-core-02 ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable_password }}

- name: Gather routing protocol neighbor status and route summary
  hosts: core_routers
  gather_facts: false
  connection: network_cli

  vars:
    output_dir: "./routing_reports"
    report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:

    - name: Create output directory for routing reports
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Collect routing protocol state
      block:

        - name: Get BGP summary
          cisco.ios.ios_command:
            commands:
              - show bgp all summary
          register: bgp_summary
          retries: 2
          delay: 5
          failed_when: false

        - name: Get OSPF neighbor table
          cisco.ios.ios_command:
            commands:
              - show ip ospf neighbor
          register: ospf_neighbors
          retries: 2
          delay: 5
          failed_when: false

        - name: Get IP route summary
          cisco.ios.ios_command:
            commands:
              - show ip route summary
          register: route_summary
          retries: 2
          delay: 5

      rescue:

        - name: Log collection failure
          ansible.builtin.debug:
            msg: >
              Routing data collection failed for {{ inventory_hostname }}.
              Verify SSH connectivity, credentials, and that the device is reachable.

        - name: Abort play for unreachable host
          ansible.builtin.fail:
            msg: "Aborting routing status collection for {{ inventory_hostname }}"

    - name: Display BGP neighbor summary
      ansible.builtin.debug:
        msg: "{{ bgp_summary.stdout_lines | default(['BGP not configured or no peers found']) }}"

    - name: Display OSPF neighbor table
      ansible.builtin.debug:
        msg: "{{ ospf_neighbors.stdout_lines | default(['OSPF not configured or no active neighbors']) }}"

    - name: Display IP route summary
      ansible.builtin.debug:
        msg: "{{ route_summary.stdout_lines }}"

    - name: Save routing status report to local file
      ansible.builtin.copy:
        content: |
          ============================================================
          Routing Protocol Status Report
          Device   : {{ inventory_hostname }} ({{ ansible_host }})
          Collected: {{ report_timestamp }}
          ============================================================

          [BGP Summary]
          {{ bgp_summary.stdout | default('Not configured or unavailable') }}

          [OSPF Neighbors]
          {{ ospf_neighbors.stdout | default('Not configured or no neighbors') }}

          [IP Route Summary]
          {{ route_summary.stdout | default('Unavailable') }}
        dest: "{{ output_dir }}/{{ inventory_hostname }}_routing_{{ report_timestamp }}.txt"
        mode: '0644'
      delegate_to: localhost