---
# BGP Peer Status Collection
# Queries BGP neighbor summary and flags non-Established sessions across multi-vendor devices.
# Saves per-device status reports to the Ansible control node under /tmp.
#
# Inventory example (inventory/bgp_routers.yml):
# ---
# all:
#   children:
#     bgp_routers:
#       hosts:
#         core-rtr-01:
#           ansible_host: 10.0.0.1
#           ansible_network_os: ios
#           bgp_asn: 65001
#         dist-sw-01:
#           ansible_host: 10.0.1.1
#           ansible_network_os: nxos
#           bgp_asn: 65001
#         edge-rtr-01:
#           ansible_host: 10.0.2.1
#           ansible_network_os: iosxr
#           bgp_asn: 65100
#
# Vault (group_vars/all/vault.yml): vault_net_user, vault_net_pass, vault_net_enable

- name: Collect BGP peer status and flag non-Established sessions
  hosts: bgp_routers
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_pass }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_net_enable }}"
    bgp_summary_cmd:
      ios: "show ip bgp summary"
      nxos: "show bgp ipv4 unicast summary"
      iosxr: "show bgp ipv4 unicast summary"
    # Regex matches any session not in Established state
    bgp_down_states: "Idle|Active|Connect|OpenSent|OpenConfirm"

  tasks:
    - name: Gather BGP neighbor summary
      block:
        - name: Run platform-appropriate BGP summary command
          ansible.netcommon.cli_command:
            command: "{{ bgp_summary_cmd[ansible_network_os] | default('show ip bgp summary') }}"
          register: bgp_summary
          retries: 2
          delay: 5
          until: bgp_summary is not failed

        - name: Gather per-neighbor state detail for non-Established peers (IOS)
          cisco.ios.ios_command:
            commands:
              - "show ip bgp neighbors | include BGP neighbor is|BGP state"
          register: bgp_peer_detail
          failed_when: false
          when: ansible_network_os == 'ios'

      rescue:
        - name: Record collection failure
          ansible.builtin.set_fact:
            bgp_collect_failed: true

        - name: Log connection error
          ansible.builtin.debug:
            msg: >-
              Cannot collect BGP data from {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('connection error') }}

    - name: Display BGP neighbor summary
      ansible.builtin.debug:
        msg:
          - "=== BGP Status: {{ inventory_hostname }} | AS {{ bgp_asn | default('N/A') }} | {{ ansible_network_os | upper }} ==="
          - "{{ bgp_summary.stdout }}"
      when: bgp_collect_failed is not defined

    - name: Alert on non-Established BGP sessions
      ansible.builtin.debug:
        msg: >-
          WARNING: Non-Established BGP peer(s) detected on {{ inventory_hostname }}.
          Sessions in one of: {{ bgp_down_states }} — investigate immediately.
      when:
        - bgp_collect_failed is not defined
        - bgp_summary.stdout is defined
        - bgp_summary.stdout | regex_search(bgp_down_states)

    - name: Write per-device BGP status report to control node
      ansible.builtin.copy:
        content: |
          Device   : {{ inventory_hostname }}
          BGP AS   : {{ bgp_asn | default('N/A') }}
          Platform : {{ ansible_network_os }}

          {{ bgp_summary.stdout }}
        dest: "/tmp/bgp_status_{{ inventory_hostname }}.txt"
        mode: '0640'
      delegate_to: localhost
      when: bgp_collect_failed is not defined

    - name: Report devices with failed BGP data collection
      ansible.builtin.debug:
        msg: >-
          BGP collection FAILED for {{ inventory_hostname }} —
          verify SSH access and confirm BGP process is running.
      when: bgp_collect_failed is defined and bgp_collect_failed | bool