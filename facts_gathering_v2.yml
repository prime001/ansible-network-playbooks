---
# CDP/LLDP Neighbor Discovery — Layer 2 Topology Mapping
#
# Discovers adjacencies via CDP (Cisco) and LLDP (multi-vendor) to build
# a topology snapshot useful for change-window validation and documentation.
# Distinct from facts_gathering.yml (which uses ios_facts for device state).
#
# Inventory example:
#   [core]
#   core-sw01  ansible_host=10.0.0.1
#   core-sw02  ansible_host=10.0.0.2
#
#   [distribution]
#   dist-sw01  ansible_host=10.0.1.1
#
#   [network:children]
#   core
#   distribution
#
#   [network:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}          # ansible-vault encrypted
#   ansible_password={{ vault_net_pass }}      # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_pass }} # ansible-vault encrypted

- name: Discover CDP/LLDP Neighbors and Map Layer 2 Topology
  hosts: network
  gather_facts: false
  vars:
    report_dir: "./topology_reports"
    run_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:

    - name: Create local report directory
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Collect neighbor tables
      block:

        - name: Gather CDP neighbors detail
          ios_command:
            commands:
              - show cdp neighbors detail
              - show cdp interface
          register: cdp_raw
          retries: 3
          delay: 5
          until: cdp_raw is not failed
          failed_when:
            - cdp_raw.failed
            - "'CDP is not enabled' not in (cdp_raw.stdout | join(''))"

        - name: Gather LLDP neighbors detail
          ios_command:
            commands:
              - show lldp neighbors detail
          register: lldp_raw
          retries: 2
          delay: 5
          until: lldp_raw is not failed
          failed_when:
            - lldp_raw.failed
            - "'LLDP is not enabled' not in (lldp_raw.stdout | join(''))"

      rescue:

        - name: Flag collection failure for this host
          set_fact:
            collection_failed: true

        - name: Report collection failure
          debug:
            msg: >
              Neighbor collection failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('unknown error') }}

    - name: Display CDP adjacency summary
      debug:
        msg: "{{ cdp_raw.stdout_lines[0] }}"
      when:
        - collection_failed is not defined
        - cdp_raw is defined
        - not cdp_raw.failed

    - name: Display LLDP adjacency summary
      debug:
        msg: "{{ lldp_raw.stdout_lines[0] }}"
      when:
        - collection_failed is not defined
        - lldp_raw is defined
        - not lldp_raw.failed

    - name: Save topology report
      copy:
        content: |
          Device    : {{ inventory_hostname }}
          Timestamp : {{ run_timestamp }}
          ==========================================

          --- CDP Neighbors ---
          {{ cdp_raw.stdout[0] | default('CDP data unavailable') }}

          --- CDP Interfaces ---
          {{ cdp_raw.stdout[1] | default('N/A') }}

          --- LLDP Neighbors ---
          {{ lldp_raw.stdout[0] | default('LLDP data unavailable') }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_neighbors_{{ run_timestamp }}.txt"
      delegate_to: localhost
      when: collection_failed is not defined