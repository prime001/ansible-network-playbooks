---
# CDP and LLDP Neighbor Discovery
#
# Queries CDP and LLDP adjacency tables to build a per-device topology report.
# Complements facts_gathering.yml (device-level attributes) by capturing
# neighbor adjacencies — useful for validating cabling, detecting rogue
# devices, and generating topology maps.
#
# Inventory example:
#   [network_devices]
#   core-sw1   ansible_host=10.0.1.1  ansible_network_os=ios
#   dist-sw1   ansible_host=10.0.1.2  ansible_network_os=nxos
#   edge-rtr1  ansible_host=10.0.1.3  ansible_network_os=iosxr
#
#   [network_devices:vars]
#   ansible_user="{{ vault_net_username }}"       # ansible-vault encrypted
#   ansible_password="{{ vault_net_password }}"   # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_connection=network_cli

- name: Gather CDP and LLDP neighbor topology data
  hosts: network_devices
  gather_facts: false
  vars:
    ansible_user: "{{ vault_net_username }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_pass: "{{ vault_net_enable_password }}"
    report_dir: "topology_reports"

  tasks:
    - name: Create local report directory
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0750"

    - name: Collect neighbor adjacencies
      block:
        - name: Query CDP and LLDP neighbors (IOS/IOS-XE)
          cisco.ios.ios_command:
            commands:
              - show cdp neighbors detail
              - show lldp neighbors detail
          register: ios_neighbors
          # LLDP may be disabled on some devices; treat partial failure as non-fatal
          failed_when: >-
            ios_neighbors.failed and
            'Invalid input' not in (ios_neighbors.stdout | join(' '))
          retries: 3
          delay: 5
          until: ios_neighbors is not failed
          when: ansible_network_os in ['ios', 'iosxe']

        - name: Query CDP and LLDP neighbors (NX-OS)
          cisco.nxos.nxos_command:
            commands:
              - show cdp neighbors detail
              - show lldp neighbors detail
          register: nxos_neighbors
          failed_when: >-
            nxos_neighbors.failed and
            'Invalid command' not in (nxos_neighbors.stdout | join(' '))
          retries: 3
          delay: 5
          until: nxos_neighbors is not failed
          when: ansible_network_os == 'nxos'

        - name: Query LLDP neighbors (IOS-XR)
          cisco.iosxr.iosxr_command:
            commands:
              - show lldp neighbors detail
          register: iosxr_neighbors
          retries: 3
          delay: 5
          until: iosxr_neighbors is not failed
          when: ansible_network_os == 'iosxr'

      rescue:
        - name: Report neighbor collection failure
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: neighbor query failed —
              {{ ansible_failed_result.msg | default('no detail available') }}

        - name: Flag host so report task is skipped
          ansible.builtin.set_fact:
            neighbor_collect_failed: true

    - name: Merge stdout from whichever platform ran
      ansible.builtin.set_fact:
        neighbor_output: >-
          {{
            (ios_neighbors.stdout | default([]))
            + (nxos_neighbors.stdout | default([]))
            + (iosxr_neighbors.stdout | default([]))
          }}
      when: neighbor_collect_failed is not defined

    - name: Display neighbor adjacency data
      ansible.builtin.debug:
        var: neighbor_output
      when: neighbor_output is defined

    - name: Write per-device neighbor report
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ neighbor_output | join('\n---\n') }}"
        dest: "{{ report_dir }}/{{ inventory_hostname }}_neighbors.txt"
        mode: "0640"
      when:
        - neighbor_output is defined
        - neighbor_output | length > 0

    - name: Report hosts where collection was skipped
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: neighbor collection failed or OS not supported"
      when: neighbor_collect_failed is defined