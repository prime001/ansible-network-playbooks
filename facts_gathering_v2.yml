---
# 027_routing_facts_gather.yml
# Gather detailed routing table and protocol adjacency facts from multi-vendor devices.
# Covers BGP summary, OSPF neighbors, and active route counts — distinct from
# basic device facts collected in 007/017_facts_gathering.yml.
#
# Inventory example:
# [routers]
# rtr-core-01 ansible_host=10.0.0.1 ansible_network_os=ios
# rtr-core-02 ansible_host=10.0.0.2 ansible_network_os=iosxr
# rtr-edge-01 ansible_host=10.0.0.3 ansible_network_os=nxos
#
# [routers:vars]
# ansible_user={{ vault_net_username }}       # ansible-vault encrypted
# ansible_password={{ vault_net_password }}   # ansible-vault encrypted
# ansible_become=yes
# ansible_become_method=enable
# ansible_connection=network_cli

- name: Gather Routing Protocol and Table Facts
  hosts: routers
  gather_facts: false
  vars:
    output_dir: /tmp/routing_facts
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:

    - name: Ensure local output directory exists
      delegate_to: localhost
      run_once: true
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0750'

    - name: Gather routing facts block
      block:

        - name: Query BGP summary
          cli_command:
            command: >-
              {% if ansible_network_os == 'iosxr' %}
              show bgp ipv4 unicast summary
              {% elif ansible_network_os == 'nxos' %}
              show bgp ipv4 unicast summary vrf all
              {% else %}
              show ip bgp summary
              {% endif %}
          register: bgp_summary
          retries: 2
          delay: 5
          until: bgp_summary is not failed

        - name: Query OSPF neighbor state
          cli_command:
            command: >-
              {% if ansible_network_os == 'iosxr' %}
              show ospf neighbor
              {% elif ansible_network_os == 'nxos' %}
              show ip ospf neighbors detail
              {% else %}
              show ip ospf neighbor
              {% endif %}
          register: ospf_neighbors
          retries: 2
          delay: 5
          until: ospf_neighbors is not failed

        - name: Count active routes in RIB
          cli_command:
            command: >-
              {% if ansible_network_os == 'iosxr' %}
              show route summary
              {% elif ansible_network_os == 'nxos' %}
              show ip route summary
              {% else %}
              show ip route summary
              {% endif %}
          register: route_summary
          retries: 2
          delay: 5
          until: route_summary is not failed

        - name: Write per-device routing report
          delegate_to: localhost
          copy:
            dest: "{{ output_dir }}/{{ inventory_hostname }}_{{ timestamp }}.txt"
            content: |
              ====================================================
              Routing Facts Report — {{ inventory_hostname }}
              Collected: {{ timestamp }}
              Platform:  {{ ansible_network_os }}
              ====================================================

              --- BGP Summary ---
              {{ bgp_summary.stdout }}

              --- OSPF Neighbors ---
              {{ ospf_neighbors.stdout }}

              --- Route Table Summary ---
              {{ route_summary.stdout }}

        - name: Display route summary to console
          debug:
            msg: |
              [{{ inventory_hostname }}] Route Summary:
              {{ route_summary.stdout_lines | join('\n') }}

      rescue:

        - name: Log collection failure
          debug:
            msg: >
              WARNING: Failed to collect routing facts from {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Write failure placeholder
          delegate_to: localhost
          copy:
            dest: "{{ output_dir }}/{{ inventory_hostname }}_{{ timestamp }}_FAILED.txt"
            content: |
              Collection failed for {{ inventory_hostname }} at {{ timestamp }}.
              Check connectivity and credentials.