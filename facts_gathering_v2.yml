---
# hardware_inventory.yml
#
# Collects chassis hardware details, module inventory, serial numbers,
# software version, CPU utilization, and memory stats from Cisco IOS
# and NX-OS devices. Saves a per-device report under reports/hardware_inventory/.
# Distinct from facts_gathering.yml (Ansible network facts) — this targets
# operational telemetry and physical asset tracking.
#
# Inventory example:
#   [core_switches]
#   core-sw-01  ansible_host=10.0.1.1  ansible_network_os=ios
#   core-sw-02  ansible_host=10.0.1.2  ansible_network_os=ios
#
#   [distribution]
#   dist-sw-01  ansible_host=10.0.2.1  ansible_network_os=nxos
#
#   [network_devices:children]
#   core_switches
#   distribution
#
#   [network_devices:vars]
#   ansible_user="{{ vault_net_username }}"      # ansible-vault encrypted
#   ansible_password="{{ vault_net_password }}"  # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_connection=network_cli

- name: Hardware inventory and environmental telemetry collection
  hosts: network_devices
  gather_facts: false

  vars:
    report_dir: "{{ playbook_dir }}/reports/hardware_inventory"

  tasks:

    - name: Create local report directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Gather IOS hardware and environmental data
      block:
        - name: Execute IOS show commands
          cisco.ios.ios_command:
            commands:
              - show version
              - show inventory
              - show environment all
              - show processes cpu sorted | head 10
              - show processes memory sorted | head 10
          register: ios_facts
          retries: 3
          delay: 5
          until: ios_facts is not failed
      rescue:
        - name: Report IOS collection error
          ansible.builtin.debug:
            msg: "Failed collecting hardware facts from {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"
        - ansible.builtin.fail:
            msg: "Hardware inventory aborted for {{ inventory_hostname }}"
      when: ansible_network_os == 'ios'

    - name: Gather NX-OS hardware and environmental data
      block:
        - name: Execute NX-OS show commands
          cisco.nxos.nxos_command:
            commands:
              - show version
              - show inventory
              - show environment
              - show processes cpu sort | head 10
              - show processes memory sort | head 10
          register: nxos_facts
          retries: 3
          delay: 5
          until: nxos_facts is not failed
      rescue:
        - name: Report NX-OS collection error
          ansible.builtin.debug:
            msg: "Failed collecting hardware facts from {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"
        - ansible.builtin.fail:
            msg: "Hardware inventory aborted for {{ inventory_hostname }}"
      when: ansible_network_os == 'nxos'

    - name: Set unified device data fact
      ansible.builtin.set_fact:
        device_data: "{{ ios_facts if (ios_facts is defined and ios_facts.stdout is defined) else nxos_facts }}"
      when: (ios_facts is defined and ios_facts.stdout is defined) or
            (nxos_facts is defined and nxos_facts.stdout is defined)

    - name: Display inventory collection summary
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} ({{ ansible_network_os }}) ==="
          - "Sections collected: version, inventory, environment, cpu-top10, memory-top10"
      when: device_data is defined

    - name: Write hardware inventory report
      ansible.builtin.copy:
        content: |
          ================================================================
          Hardware Inventory — {{ inventory_hostname }} | {{ ansible_network_os | upper }}
          ================================================================

          --- SHOW VERSION ---
          {{ device_data.stdout[0] }}

          --- SHOW INVENTORY ---
          {{ device_data.stdout[1] }}

          --- ENVIRONMENT ---
          {{ device_data.stdout[2] }}

          --- CPU TOP-10 PROCESSES ---
          {{ device_data.stdout[3] }}

          --- MEMORY TOP-10 PROCESSES ---
          {{ device_data.stdout[4] }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_hardware.txt"
        mode: "0644"
      delegate_to: localhost
      when: device_data is defined