---
# bgp_neighbor_collection.yml
#
# Collects BGP IPv4 unicast neighbor state, prefix counts, and session uptime
# from IOS/IOS-XE routers. Saves per-device text reports locally and surfaces
# any sessions not in Established state.
#
# Inventory example:
#   [routers]
#   rtr-core-01  ansible_host=10.0.1.1
#   rtr-core-02  ansible_host=10.0.1.2
#   rtr-edge-01  ansible_host=10.0.2.1
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}               # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}       # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }} # ansible-vault encrypted

- name: Collect BGP neighbor state and prefix statistics
  hosts: routers
  gather_facts: false

  vars:
    output_dir: "/tmp/bgp_reports"
    ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  pre_tasks:
    - name: Create local output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

  tasks:
    - name: Collect BGP neighbor data
      block:
        - name: Run BGP show commands
          cisco.ios.ios_command:
            commands:
              - show bgp ipv4 unicast summary
              - show bgp ipv4 unicast neighbors | include BGP neighbor|BGP state|Prefixes Current
          register: bgp_raw
          retries: 2
          delay: 5
          until: bgp_raw is not failed
          failed_when: >
            bgp_raw.failed or
            'Invalid input' in bgp_raw.stdout[0]

        - name: Verify BGP process is active
          ansible.builtin.assert:
            that: "'BGP' in bgp_raw.stdout[0]"
            fail_msg: "No active BGP process found on {{ inventory_hostname }}"

        - name: Alert on non-Established BGP sessions
          ansible.builtin.debug:
            msg: "ALERT: Non-Established BGP peers present on {{ inventory_hostname }} — review the saved report"
          when: bgp_raw.stdout[0] | regex_search('(Idle|Active|Connect|OpenSent|OpenConfirm)')

        - name: Display BGP summary table
          ansible.builtin.debug:
            msg: "{{ bgp_raw.stdout[0].splitlines() }}"

        - name: Save BGP report to disk
          ansible.builtin.copy:
            content: |
              ============================================================
              BGP Neighbor Report  |  Host: {{ inventory_hostname }}
              Collected: {{ ts }}
              ============================================================

              BGP IPv4 Unicast Summary:
              {{ bgp_raw.stdout[0] }}

              Neighbor State / Prefix Detail (filtered):
              {{ bgp_raw.stdout[1] if bgp_raw.stdout[1] else '  (filter returned empty — no neighbors or unsupported syntax)' }}
            dest: "{{ output_dir }}/{{ inventory_hostname }}_bgp_{{ ts }}.txt"
            mode: "0644"
          delegate_to: localhost

      rescue:
        - name: Log collection failure
          ansible.builtin.debug:
            msg: "FAILED to collect BGP data from {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Write failure marker file
          ansible.builtin.copy:
            content: "COLLECTION FAILED on {{ ts }}\nError: {{ ansible_failed_result.msg | default('unknown') }}\n"
            dest: "{{ output_dir }}/{{ inventory_hostname }}_bgp_FAILED_{{ ts }}.txt"
            mode: "0644"
          delegate_to: localhost