# =============================================================================
# Playbook: port_security_config.yml
# Purpose : Configure and verify Layer 2 port security on Cisco IOS/IOS-XE
#           access switches — sticky MAC learning, max-address enforcement,
#           and violation-mode hardening.
# Modules : cisco.ios.ios_config, cisco.ios.ios_command
#
# Inventory example (inventory/network.yml):
#   all:
#     children:
#       access_switches:
#         hosts:
#           sw-access-01:
#             ansible_host: 10.0.1.1
#           sw-access-02:
#             ansible_host: 10.0.1.2
#         vars:
#           ansible_network_os: ios
#           ansible_connection: network_cli
#           ansible_user: "{{ vault_net_user }}"
#           ansible_password: "{{ vault_net_password }}"
#           ansible_become: true
#           ansible_become_method: enable
#           ansible_become_password: "{{ vault_enable_password }}"
#
# Vault: ansible-vault encrypt group_vars/all/vault.yml
#        Required keys: vault_net_user, vault_net_password, vault_enable_password
# =============================================================================

- name: Configure Layer 2 port security on access switches
  hosts: access_switches
  gather_facts: false

  vars:
    port_security_interfaces:
      - name: GigabitEthernet1/0/1
        max_mac: 2
        violation: restrict
        sticky: true
      - name: GigabitEthernet1/0/2
        max_mac: 1
        violation: shutdown
        sticky: true
      - name: GigabitEthernet1/0/3
        max_mac: 4
        violation: protect
        sticky: false

  tasks:
    - name: Apply port security to access interfaces
      block:
        - name: Configure switchport port-security per interface
          cisco.ios.ios_config:
            lines:
              - switchport mode access
              - switchport nonegotiate
              - switchport port-security
              - "switchport port-security maximum {{ item.max_mac }}"
              - "switchport port-security violation {{ item.violation }}"
              - >-
                {{ 'switchport port-security mac-address sticky'
                   if item.sticky
                   else 'no switchport port-security mac-address sticky' }}
            parents: "interface {{ item.name }}"
            save_when: changed
          loop: "{{ port_security_interfaces }}"
          register: ps_config_result
          retries: 2
          delay: 5
          until: ps_config_result is not failed

        - name: Collect port-security status for each secured interface
          cisco.ios.ios_command:
            commands:
              - "show port-security interface {{ item.name }}"
          loop: "{{ port_security_interfaces }}"
          register: ps_status

        - name: Display per-interface port-security status
          ansible.builtin.debug:
            msg: "{{ item.stdout_lines }}"
          loop: "{{ ps_status.results }}"
          loop_control:
            label: "{{ item.item.name }}"

        - name: Check for err-disabled interfaces caused by psecure-violation
          cisco.ios.ios_command:
            commands:
              - show interfaces status err-disabled
          register: errdisabled_check
          failed_when:
            - errdisabled_check.stdout[0] | length > 0
            - "'psecure-violation' in errdisabled_check.stdout[0]"

        - name: Display err-disabled summary
          ansible.builtin.debug:
            msg: "{{ errdisabled_check.stdout_lines }}"

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              Port security configuration failed on {{ inventory_hostname }}.
              Verify target interfaces are switchports in access mode and are
              not currently trunking or routed ports.

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: >-
              Port security deployment failed on {{ inventory_hostname }}.
              Manual review required — check interface mode and existing
              port-security state before re-running.