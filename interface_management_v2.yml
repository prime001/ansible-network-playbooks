---
# routing_config.yml — Configure static routes and OSPF on Cisco IOS routers
#
# Vault setup (ansible-vault create group_vars/routers/vault.yml):
#   vault_net_user: netops
#   vault_net_pass: <device_password>
#   vault_enable_pass: <enable_password>
#
# Inventory example (inventory/hosts.yml):
#   routers:
#     hosts:
#       core-rtr-01:
#         ansible_host: 10.0.1.1
#         ospf_router_id: 10.0.1.1
#       core-rtr-02:
#         ansible_host: 10.0.1.2
#         ospf_router_id: 10.0.1.2
#     vars:
#       ansible_network_os: ios
#       ansible_connection: network_cli
#       ansible_user: "{{ vault_net_user }}"
#       ansible_password: "{{ vault_net_pass }}"
#       ansible_become: true
#       ansible_become_method: enable
#       ansible_become_password: "{{ vault_enable_pass }}"

- name: Configure static routes and OSPF on Cisco IOS routers
  hosts: routers
  gather_facts: false
  vars:
    ospf_process_id: 1
    ospf_area: 0
    default_gateway: 10.0.0.254
    ospf_networks:
      - network: 10.0.1.0
        wildcard: 0.0.0.255
      - network: 192.168.10.0
        wildcard: 0.0.0.255
    static_routes:
      - prefix: "0.0.0.0"
        mask: "0.0.0.0"
        next_hop: "{{ default_gateway }}"

  tasks:
    - name: Verify device is reachable before making changes
      cisco.ios.ios_command:
        commands: show version
      register: pre_check
      retries: 3
      delay: 5
      until: pre_check is not failed

    - name: Apply routing configuration
      block:
        - name: Configure default static route
          cisco.ios.ios_config:
            lines:
              - "ip route {{ item.prefix }} {{ item.mask }} {{ item.next_hop }}"
          loop: "{{ static_routes }}"
          register: static_result

        - name: Configure OSPF process with network statements
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "router-id {{ ospf_router_id | default(ansible_host) }}"
              - "network {{ item.network }} {{ item.wildcard }} area {{ ospf_area }}"
              - "auto-cost reference-bandwidth 1000"
              - "passive-interface default"
          loop: "{{ ospf_networks }}"
          register: ospf_result

      rescue:
        - name: Report routing config failure
          ansible.builtin.debug:
            msg: "Configuration failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort play with actionable message
          ansible.builtin.fail:
            msg: "Routing config aborted on {{ inventory_hostname }} — verify credentials and device state"

    - name: Retrieve routing table for verification
      cisco.ios.ios_command:
        commands:
          - show ip route
          - show ip ospf neighbor
      register: routing_verification
      retries: 2
      delay: 5
      until: routing_verification is not failed

    - name: Assert OSPF adjacency reached FULL state
      ansible.builtin.assert:
        that:
          - "'FULL' in routing_verification.stdout[1]"
        fail_msg: "WARNING: No FULL OSPF adjacencies detected on {{ inventory_hostname }}"
        success_msg: "OSPF adjacencies verified on {{ inventory_hostname }}"
      ignore_errors: true

    - name: Display current routing table
      ansible.builtin.debug:
        msg: "{{ routing_verification.stdout_lines[0] }}"

    - name: Display OSPF neighbor summary
      ansible.builtin.debug:
        msg: "{{ routing_verification.stdout_lines[1] }}"

    - name: Save configuration to NVRAM
      cisco.ios.ios_command:
        commands: write memory
      register: save_result
      failed_when: "'OK' not in save_result.stdout[0]