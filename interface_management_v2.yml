---
# BGP Prefix-List and Route-Map Deployment
# Deploys inbound/outbound BGP route policy on Cisco IOS routers.
# Prefix-lists define allowed/denied prefixes; route-maps apply policy to BGP neighbors.
# Distinct from acl_deploy.yml, which manages traffic ACLs — these filters control BGP RIB.
#
# Inventory example (inventory/network.yml):
# ---
# all:
#   children:
#     routers:
#       hosts:
#         core-rtr-01:
#           ansible_host: 10.0.0.1
#         core-rtr-02:
#           ansible_host: 10.0.0.2
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_net_user }}"
#         ansible_password: "{{ vault_net_pass }}"
#         ansible_become: true
#         ansible_become_method: enable
#         ansible_become_password: "{{ vault_enable_pass }}"

- name: Deploy BGP prefix-lists and route-maps for inbound/outbound route filtering
  hosts: routers
  gather_facts: false

  vars:
    # Credentials — store in group_vars/routers/vault.yml, encrypted with ansible-vault
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_pass }}"
    ansible_become_password: "{{ vault_enable_pass }}"

    bgp_prefix_lists:
      - name: PL_ALLOWED_INBOUND
        description: "Permitted inbound BGP prefixes from upstream peer"
        entries:
          - sequence: 10
            action: permit
            prefix: 192.0.2.0/24
          - sequence: 20
            action: permit
            prefix: 198.51.100.0/24
          - sequence: 99
            action: deny
            prefix: 0.0.0.0/0
            le: 32
      - name: PL_SUPPRESS_DEFAULT
        description: "Block default route in outbound BGP advertisements"
        entries:
          - sequence: 10
            action: deny
            prefix: 0.0.0.0/0
          - sequence: 20
            action: permit
            prefix: 0.0.0.0/0
            le: 32

  tasks:
    - name: Confirm device is reachable before applying changes
      cisco.ios.ios_command:
        commands: show clock
      register: reach_check
      retries: 3
      delay: 5
      until: reach_check is not failed

    - name: Configure prefix-lists and route-maps
      block:
        - name: Apply BGP prefix-lists
          cisco.ios.ios_prefix_lists:
            config:
              - afi: ipv4
                prefix_lists: "{{ bgp_prefix_lists }}"
            state: merged
          register: prefix_list_result

        - name: Apply BGP route-maps referencing prefix-lists
          cisco.ios.ios_route_maps:
            config:
              - route_map: RM_BGP_INBOUND
                entries:
                  - sequence: 10
                    action: permit
                    description: "Permit explicitly allowed inbound prefixes"
                    match:
                      ip:
                        address:
                          prefix_lists:
                            - PL_ALLOWED_INBOUND
                  - sequence: 99
                    action: deny
                    description: "Deny all remaining inbound prefixes"
              - route_map: RM_BGP_OUTBOUND
                entries:
                  - sequence: 10
                    action: permit
                    description: "Advertise all prefixes except default route"
                    match:
                      ip:
                        address:
                          prefix_lists:
                            - PL_SUPPRESS_DEFAULT
            state: merged
          register: route_map_result
          notify: Save running configuration

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "Policy deployment failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('see task output') }}"

        - name: Abort with descriptive error
          ansible.builtin.fail:
            msg: "BGP route policy deployment failed on {{ inventory_hostname }}. No partial config saved."

    - name: Verify prefix-lists and route-maps are active on device
      cisco.ios.ios_command:
        commands:
          - show ip prefix-list summary
          - show route-map
      register: verify_output
      failed_when: >
        'PL_ALLOWED_INBOUND' not in verify_output.stdout[0] or
        'RM_BGP_INBOUND' not in verify_output.stdout[1]

    - name: Display post-deployment verification output
      ansible.builtin.debug:
        msg:
          - "--- {{ inventory_hostname }} Prefix-List Summary ---"
          - "{{ verify_output.stdout_lines[0] }}"
          - "--- Route-Map Summary ---"
          - "{{ verify_output.stdout_lines[1] }}"

  handlers:
    - name: Save running configuration
      cisco.ios.ios_command:
        commands:
          - command: write memory
            prompt: '\[confirm\]'
            answer: ''