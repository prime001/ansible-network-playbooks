---
# =============================================================================
# Unused Interface Audit and Secure Shutdown
# Identifies notconnect/disabled access ports, stamps them with a datestamped
# description, and optionally admin-shuts them to reduce the attack surface.
# Run quarterly on access-layer switches as part of port-security hygiene.
#
# Inventory example:
#   [access_switches]
#   sw-access-01  ansible_host=10.1.1.1
#   sw-access-02  ansible_host=10.1.1.2
#   sw-access-03  ansible_host=10.1.1.3
#
#   [access_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_user }}"
#   ansible_password="{{ vault_net_password }}"
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password="{{ vault_enable_pass }}"
#
# Vault-encrypted vars (ansible-vault encrypt_string):
#   vault_net_user | vault_net_password | vault_enable_pass
# =============================================================================

- name: Unused Interface Audit and Secure Shutdown
  hosts: "{{ target_hosts | default('access_switches') }}"
  gather_facts: false
  vars:
    shutdown_unused: false         # dry-run by default; set true to enforce shutdowns
    audit_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"
    unused_description: "UNUSED - Secured {{ audit_date }}"
    excluded_ports:                # uplinks, management, and SVIs — never touched
      - GigabitEthernet0/0
      - GigabitEthernet0/1
      - GigabitEthernet1/1
      - Vlan1
      - Loopback0

  tasks:
    - name: Audit and remediate unused interfaces
      block:

        - name: Collect interface status table
          cisco.ios.ios_command:
            commands:
              - show interfaces status
          register: iface_status
          retries: 3
          delay: 5
          until: iface_status is not failed
          failed_when:
            - iface_status.stdout[0] is not search('Port|Interface')

        - name: Parse notconnect and disabled port names
          ansible.builtin.set_fact:
            down_ports: >-
              {{
                iface_status.stdout[0]
                | regex_findall('(?m)^((?:Gi|Fa|Te|Eth)\S+)\s+.*(?:notconnect|disabled)')
                | difference(excluded_ports)
                | list
              }}

        - name: Display ports flagged for audit
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} — {{ down_ports | length }} unused port(s) found: {{ down_ports }}"

        - name: Stamp unused ports with datestamped description
          cisco.ios.ios_config:
            lines:
              - "description {{ unused_description }}"
            parents: "interface {{ item }}"
          loop: "{{ down_ports }}"
          when: down_ports | length > 0
          register: desc_changes

        - name: Admin-shut unused ports (requires shutdown_unused true)
          cisco.ios.ios_config:
            lines:
              - shutdown
            parents: "interface {{ item }}"
          loop: "{{ down_ports }}"
          when:
            - shutdown_unused | bool
            - down_ports | length > 0
          register: shutdown_changes

        - name: Persist configuration when changes were made
          cisco.ios.ios_config:
            save_when: modified

      rescue:
        - name: Log failure with context
          ansible.builtin.debug:
            msg: >-
              Audit failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('verify connectivity and vault credentials') }}

        - name: Abort run for this host
          ansible.builtin.fail:
            msg: "Audit incomplete on {{ inventory_hostname }} — manual review required"

    - name: Print per-host audit summary
      ansible.builtin.debug:
        msg:
          - "Host             : {{ inventory_hostname }}"
          - "Unused ports     : {{ down_ports | default([]) | length }}"
          - "Descriptions set : {{ (desc_changes.results | default([])) | selectattr('changed') | list | length }}"
          - "Ports shut down  : {{ (shutdown_changes.results | default([])) | selectattr('changed') | list | length }}"
          - "Mode             : {{ 'ENFORCE' if shutdown_unused else 'DRY RUN — set shutdown_unused: true to apply shutdowns' }}