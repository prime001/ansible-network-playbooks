---
# vlan_management.yml
#
# VLAN Management — Provision and verify VLAN database on Cisco IOS/IOS-XE access switches.
# Merges desired VLAN state, confirms all VLANs are active post-change, and captures
# a human-readable summary so dry-run diffs are immediately useful in CI output.
#
# Credentials: ansible-vault — group_vars/access_switches/vault.yml
#   vault_ansible_user:            <encrypted>
#   vault_ansible_password:        <encrypted>
#   vault_ansible_become_password: <encrypted>
#
# Inventory example (inventory/network.yml):
# ---
# all:
#   children:
#     access_switches:
#       hosts:
#         sw-access-01:
#           ansible_host: 10.10.1.11
#         sw-access-02:
#           ansible_host: 10.10.1.12
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_ansible_user }}"
#         ansible_password: "{{ vault_ansible_password }}"
#         ansible_become: true
#         ansible_become_method: enable
#         ansible_become_password: "{{ vault_ansible_become_password }}"
#
# Usage:
#   ansible-playbook vlan_management.yml -i inventory/network.yml --ask-vault-pass
#   ansible-playbook vlan_management.yml -i inventory/network.yml -e "ansible_host=10.10.1.11" --limit sw-access-01 --check

- name: VLAN Management — provision and verify VLAN database on access switches
  hosts: access_switches
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"
    ansible_become_password: "{{ vault_ansible_become_password }}"

    vlans_desired:
      - vlan_id: 10
        name: CORP_DATA
        state: active
      - vlan_id: 20
        name: CORP_VOICE
        state: active
      - vlan_id: 30
        name: CORP_MGMT
        state: active
      - vlan_id: 99
        name: NATIVE_UNUSED
        state: active

  tasks:
    - name: Block — apply VLAN config, verify state, report result
      block:

        - name: Merge desired VLANs into running config
          cisco.ios.ios_vlans:
            config: "{{ vlans_desired }}"
            state: merged
          register: vlan_push
          retries: 2
          delay: 5
          until: vlan_push is not failed

        - name: Gather VLAN state post-change
          cisco.ios.ios_vlans:
            state: gathered
          register: vlan_state

        - name: Assert every desired VLAN is present and active
          ansible.builtin.assert:
            that:
              - vlan_state.gathered
                | selectattr('vlan_id', 'equalto', item.vlan_id)
                | selectattr('state', 'equalto', 'active')
                | list | length == 1
            fail_msg: "VLAN {{ item.vlan_id }} ({{ item.name }}) missing or not active after push"
            success_msg: "VLAN {{ item.vlan_id }} ({{ item.name }}) confirmed active"
          loop: "{{ vlans_desired }}"

        - name: Report provisioning summary
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: {{ vlan_push.commands | default([]) | length }} command(s) applied.
              Active VLANs: {{ vlan_state.gathered | map(attribute='vlan_id') | list | sort }}

      rescue:

        - name: Capture current VLAN table for triage
          cisco.ios.ios_command:
            commands:
              - show vlan brief
          register: vlan_show_raw
          failed_when: false

        - name: Log failure details
          ansible.builtin.debug:
            msg:
              - "VLAN provisioning FAILED on {{ inventory_hostname }}"
              - "show vlan brief output:"
              - "{{ vlan_show_raw.stdout_lines | default(['no output captured']) }}"

        - name: Abort play with failure signal
          ansible.builtin.fail:
            msg: "VLAN provisioning failed on {{ inventory_hostname }} — review debug output above