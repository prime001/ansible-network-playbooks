---
# Ansible Playbook: QoS Policy Configuration
#
# Configures class-based QoS (class-maps, policy-maps, service-policy)
# on Cisco IOS interfaces. Supports DSCP marking, bandwidth guarantees,
# and traffic shaping for voice/video/data classification.
#
# Credentials: stored in Ansible Vault
#   ansible-vault create group_vars/network_devices/vault.yml
#   vault_ansible_user: admin
#   vault_ansible_password: <device_password>
#   vault_ansible_become_password: <enable_password>
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [distribution_switches]
#   sw-dist-01 ansible_host=10.0.2.1
#
#   [network_devices:children]
#   core_routers
#   distribution_switches
#
#   [network_devices:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_ansible_user }}
#   ansible_password={{ vault_ansible_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_ansible_become_password }}

- name: Configure QoS Policies on Network Devices
  hosts: network_devices
  gather_facts: false

  vars:
    qos_classes:
      - name: VOICE
        dscp: ef
        bandwidth_percent: 30
        match_dscp: [ef]
      - name: VIDEO
        dscp: af41
        bandwidth_percent: 20
        match_dscp: [af41, af42, af43]
      - name: CRITICAL-DATA
        dscp: af31
        bandwidth_percent: 25
        match_dscp: [af31, af32, af33]
    policy_map_name: WAN-EGRESS-POLICY
    apply_interfaces:
      - GigabitEthernet0/0/0
      - GigabitEthernet0/0/1
    qos_direction: output

  tasks:
    - name: Verify device reachability before applying QoS changes
      cisco.ios.ios_command:
        commands: show version
      register: device_version
      retries: 3
      delay: 5
      failed_when: device_version.failed

    - name: Display device platform info
      ansible.builtin.debug:
        msg: "Configuring QoS on: {{ inventory_hostname }} | Platform: {{ device_version.stdout[0] | regex_search('Cisco IOS.+') }}"

    - name: Apply QoS class-maps and policy-map
      block:
        - name: Configure DSCP class-maps
          cisco.ios.ios_config:
            lines:
              - "match dscp {{ item.match_dscp | join(' ') }}"
            parents: "class-map match-any {{ item.name }}"
            save_when: never
          loop: "{{ qos_classes }}"
          loop_control:
            label: "class-map {{ item.name }}"
          register: classmap_result

        - name: Build policy-map with bandwidth guarantees
          cisco.ios.ios_config:
            lines:
              - "class {{ item.name }}"
              - "  bandwidth percent {{ item.bandwidth_percent }}"
              - "  set dscp {{ item.dscp }}"
            parents: "policy-map {{ policy_map_name }}"
            save_when: never
          loop: "{{ qos_classes }}"
          loop_control:
            label: "policy-map class {{ item.name }}"
          register: policymap_result

        - name: Apply service-policy to egress interfaces
          cisco.ios.ios_config:
            lines:
              - "service-policy {{ qos_direction }} {{ policy_map_name }}"
            parents: "interface {{ item }}"
            save_when: never
          loop: "{{ apply_interfaces }}"
          loop_control:
            label: "interface {{ item }}"
          register: servicepolicy_result

        - name: Save running configuration
          cisco.ios.ios_command:
            commands: write memory
          register: save_result
          failed_when: "'OK' not in save_result.stdout[0] and 'ok' not in save_result.stdout[0]"

      rescue:
        - name: Log QoS configuration failure
          ansible.builtin.debug:
            msg: "FAILED: QoS configuration on {{ inventory_hostname }} — rolling back service-policies"

        - name: Remove service-policy from interfaces on failure
          cisco.ios.ios_config:
            lines:
              - "no service-policy {{ qos_direction }} {{ policy_map_name }}"
            parents: "interface {{ item }}"
            save_when: changed
          loop: "{{ apply_interfaces }}"
          ignore_errors: true

        - name: Fail with descriptive message
          ansible.builtin.fail:
            msg: "QoS rollback complete on {{ inventory_hostname }}. Review class-map/policy-map syntax."

    - name: Verify policy-map applied correctly
      cisco.ios.ios_command:
        commands:
          - "show policy-map {{ policy_map_name }}"
          - "show policy-map interface {{ apply_interfaces[0] }}"
      register: qos_verify
      failed_when: policy_map_name not in qos_verify.stdout[0]

    - name: Display QoS verification output
      ansible.builtin.debug:
        msg: "{{ qos_verify.stdout_lines }}