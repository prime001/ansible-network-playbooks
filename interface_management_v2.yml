---
# qos_deploy.yml
# Deploys QoS class-maps, policy-maps, and egress service-policies on Cisco IOS/IOS-XE devices.
# Credentials are stored in Ansible Vault — see group_vars/all/vault.yml
#
# Inventory example:
#   [wan_edge]
#   rtr-edge-01 ansible_host=10.0.0.1
#   rtr-edge-02 ansible_host=10.0.0.2
#
#   [wan_edge:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable_password }}

- name: Deploy QoS class-maps, policy-map, and service-policy on WAN edge devices
  hosts: wan_edge
  gather_facts: false

  vars:
    net_user: "{{ vault_net_user }}"
    net_password: "{{ vault_net_password }}"
    net_enable_password: "{{ vault_net_enable_password }}"

    policy_name: WAN-EDGE-EGRESS
    wan_interface: GigabitEthernet0/0/0

    qos_classes:
      - name: VOIP
        match: "dscp ef"
        action: "priority percent 20"
      - name: VIDEO
        match: "dscp af41"
        action: "bandwidth percent 20"
      - name: CRITICAL-DATA
        match: "dscp af31"
        action: "bandwidth percent 30"
      - name: SCAVENGER
        match: "dscp cs1"
        action: "bandwidth percent 5"

  tasks:
    - name: Verify device is reachable before making changes
      cisco.ios.ios_command:
        commands:
          - show version
      register: device_version
      retries: 3
      delay: 10
      until: device_version is not failed

    - name: Display platform info
      ansible.builtin.debug:
        msg: "{{ device_version.stdout_lines[0][:3] }}"

    - name: Configure QoS class-maps
      block:
        - name: Apply class-map definitions
          cisco.ios.ios_config:
            lines:
              - "class-map match-any {{ item.name }}"
              - " match {{ item.match }}"
          loop: "{{ qos_classes }}"
          register: classmap_result
          notify: Save running config

        - name: Build policy-map with per-class actions
          cisco.ios.ios_config:
            parents: "policy-map {{ policy_name }}"
            lines: "{{ qos_class_lines }}"
          vars:
            qos_class_lines: >-
              {{
                qos_classes | map(attribute='name') | zip(qos_classes | map(attribute='action'))
                | map('join', '\n ') | map('regex_replace', '^(.*)$', 'class \\1')
                | list
                + ['class class-default', ' fair-queue', ' random-detect']
              }}
          register: policymap_result
          notify: Save running config

        - name: Apply service-policy outbound on WAN interface
          cisco.ios.ios_config:
            parents: "interface {{ wan_interface }}"
            lines:
              - "service-policy output {{ policy_name }}"
          register: service_policy_result
          notify: Save running config

      rescue:
        - name: Report failure details
          ansible.builtin.debug:
            msg: >
              QoS deployment FAILED on {{ inventory_hostname }}.
              Task: {{ ansible_failed_task.name }}.
              Error: {{ ansible_failed_result.msg | default('see stdout') }}.

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "QoS policy rollout aborted on {{ inventory_hostname }} — manual review required before retry."

    - name: Verify policy-map is active on interface
      cisco.ios.ios_command:
        commands:
          - "show policy-map interface {{ wan_interface }} output"
          - "show class-map"
      register: qos_verify
      failed_when: >
        policy_name not in qos_verify.stdout[0] or
        qos_verify.stdout[0] == ''

    - name: Display per-class QoS statistics
      ansible.builtin.debug:
        msg: "{{ qos_verify.stdout_lines[0] }}"

  handlers:
    - name: Save running config
      cisco.ios.ios_command:
        commands:
          - write memory
      register: save_result
      failed_when: >
        'OK' not in save_result.stdout[0] and
        '[OK]' not in save_result.stdout[0]