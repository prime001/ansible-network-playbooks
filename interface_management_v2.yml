The playbook needs to cover something not already in the existing set. OSPF routing configuration is the right pick — it's a core network engineering skill distinct from all 20 existing playbooks.

---
# ospf_config.yml
# Deploys OSPF routing on Cisco IOS devices: process config, network statements,
# passive interfaces, and MD5 area authentication. Verifies neighbor adjacency post-deploy.
#
# Inventory example:
#   [core_routers]
#   rtr-01 ansible_host=10.0.1.1
#   rtr-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_secret }}

- name: Configure OSPF routing on Cisco IOS devices
  hosts: core_routers
  gather_facts: false
  connection: network_cli

  vars:
    ospf_process_id: 1
    ospf_router_id: "{{ ansible_host }}"
    ospf_reference_bw: 10000
    ospf_auth_key: "{{ vault_ospf_md5_key }}"  # ansible-vault encrypted
    ospf_networks:
      - { prefix: "10.0.0.0", wildcard: "0.0.255.255", area: "0" }
      - { prefix: "192.168.100.0", wildcard: "0.0.0.255", area: "1" }
    ospf_passive_interfaces:
      - Loopback0
      - GigabitEthernet0/2
    ospf_area0_interfaces:
      - GigabitEthernet0/0
      - GigabitEthernet0/1

  tasks:
    - name: Deploy OSPF process configuration
      block:
        - name: Configure OSPF process, router-id, and area authentication
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bw }}"
              - "area 0 authentication message-digest"
          register: ospf_base_result
          retries: 2
          delay: 5
          until: ospf_base_result is not failed

        - name: Add OSPF network statements
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
          loop: "{{ ospf_networks }}"

        - name: Set passive interfaces
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "passive-interface {{ item }}"
          loop: "{{ ospf_passive_interfaces }}"

        - name: Apply MD5 authentication key on area 0 interfaces
          cisco.ios.ios_config:
            parents: "interface {{ item }}"
            lines:
              - "ip ospf message-digest-key 1 md5 {{ ospf_auth_key }}"
              - "ip ospf hello-interval 10"
              - "ip ospf dead-interval 40"
          loop: "{{ ospf_area0_interfaces }}"

      rescue:
        - name: Log configuration failure detail
          ansible.builtin.debug:
            msg: "OSPF config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('see task output above') }}"

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "OSPF deployment aborted on {{ inventory_hostname }} — manual review required before retry"

    - name: Verify OSPF neighbor adjacency (retries up to 60s for convergence)
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip ospf
          - show ip route ospf
      register: ospf_verify
      retries: 6
      delay: 10
      until: ospf_verify is not failed

    - name: Assert at least one neighbor in FULL state
      ansible.builtin.assert:
        that:
          - "'FULL' in ospf_verify.stdout[0]"
        fail_msg: "No OSPF neighbors reached FULL state on {{ inventory_hostname }} — check area config and MD5 keys"
        success_msg: "OSPF adjacency confirmed on {{ inventory_hostname }}"
      when: ospf_verify.stdout[0] | length > 40

    - name: Display OSPF neighbor table and learned routes
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} OSPF Neighbors ==="
          - "{{ ospf_verify.stdout[0] }}"
          - "=== OSPF Learned Routes ==="
          - "{{ ospf_verify.stdout[2] }}