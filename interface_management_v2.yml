---
# vlan_management.yml
# Provisions VLANs and assigns switchport access/trunk roles on Cisco IOS/IOS-XE switches.
# Credentials sourced from Ansible Vault — see group_vars/all/vault.yml.
#
# Inventory example:
#   [access_switches]
#   sw-access-01  ansible_host=10.0.1.10
#   sw-access-02  ansible_host=10.0.1.11
#
#   [access_switches:vars]
#   ansible_network_os=cisco.ios.ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_ansible_user }}
#   ansible_password={{ vault_ansible_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_ansible_enable_password }}

- name: VLAN Management — Provision VLANs and switchport assignments
  hosts: access_switches
  gather_facts: false

  vars:
    vlans:
      - vlan_id: 10
        name: CORP_DATA
      - vlan_id: 20
        name: CORP_VOICE
      - vlan_id: 30
        name: MGMT
      - vlan_id: 99
        name: NATIVE_VLAN

    trunk_interfaces:
      - GigabitEthernet0/1
      - GigabitEthernet0/2

    access_port_map:
      - interface: GigabitEthernet0/3
        vlan: 10
      - interface: GigabitEthernet0/4
        vlan: 20
      - interface: GigabitEthernet0/5
        vlan: 30

  tasks:
    - name: Create VLANs in device VLAN database
      block:
        - name: Apply VLAN definitions
          cisco.ios.ios_vlans:
            config: "{{ vlans }}"
            state: merged
          register: vlan_result
          retries: 2
          delay: 5
          until: vlan_result is not failed

        - name: Display commands sent to device
          ansible.builtin.debug:
            msg: "Commands applied on {{ inventory_hostname }}: {{ vlan_result.commands | default(['no changes required']) }}"

      rescue:
        - name: Report VLAN provisioning failure
          ansible.builtin.debug:
            msg: "ERROR: Failed to configure VLANs on {{ inventory_hostname }}"

        - name: Abort on unrecoverable VLAN failure
          ansible.builtin.fail:
            msg: "VLAN provisioning aborted for {{ inventory_hostname }} after retries exhausted"

    - name: Configure trunk switchports
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item }}"
            mode: trunk
            trunk:
              allowed_vlans: "10,20,30,99"
              native_vlan: 99
        state: merged
      loop: "{{ trunk_interfaces }}"
      register: trunk_result
      retries: 2
      delay: 3
      until: trunk_result is not failed

    - name: Configure access switchports
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.interface }}"
            mode: access
            access:
              vlan: "{{ item.vlan }}"
        state: merged
      loop: "{{ access_port_map }}"
      register: access_result

    - name: Verify VLAN table is populated on device
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_verify
      failed_when: vlan_verify.stdout[0] | length == 0

    - name: Display current VLAN table from device
      ansible.builtin.debug:
        msg: "{{ vlan_verify.stdout_lines[0] }}