---
# ospf_config.yml
# Deploys OSPFv2 process, area assignments, stub areas, MD5 authentication,
# and passive interfaces on Cisco IOS routers.
#
# Credentials: ansible-vault encrypted in group_vars/ospf_routers/vault.yml
#   vault_ansible_user: netadmin
#   vault_ansible_password: <vault-encrypted>
#
# Inventory example (inventory/network.yml):
# ---
# all:
#   children:
#     ospf_routers:
#       hosts:
#         rtr-core-01:
#           ansible_host: 10.0.1.1
#           ospf_process_id: 1
#           ospf_router_id: 1.1.1.1
#         rtr-branch-01:
#           ansible_host: 10.0.1.2
#           ospf_process_id: 1
#           ospf_router_id: 2.2.2.2
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_ansible_user }}"
#         ansible_password: "{{ vault_ansible_password }}"

- name: Configure OSPFv2 Process, Areas, and Authentication
  hosts: ospf_routers
  gather_facts: false

  vars:
    ospf_areas:
      - area_id: 0
        networks:
          - { address: 10.0.0.0, wildcard: 0.0.0.255 }
          - { address: 10.0.1.0, wildcard: 0.0.0.255 }
        authentication: message-digest
      - area_id: 10
        networks:
          - { address: 192.168.10.0, wildcard: 0.0.0.255 }
        stub: true
    ospf_passive_interfaces:
      - Loopback0
      - GigabitEthernet0/2

  tasks:
    - name: Deploy OSPFv2 configuration
      block:
        - name: Apply OSPF process, areas, and passive interfaces
          ansible.netcommon.cli_config:
            config: |
              router ospf {{ ospf_process_id }}
               router-id {{ ospf_router_id }}
               {% for area in ospf_areas %}
               {% if area.stub | default(false) %}
               area {{ area.area_id }} stub
               {% endif %}
               {% if area.authentication is defined %}
               area {{ area.area_id }} authentication {{ area.authentication }}
               {% endif %}
               {% for net in area.networks %}
               network {{ net.address }} {{ net.wildcard }} area {{ area.area_id }}
               {% endfor %}
               {% endfor %}
               {% for intf in ospf_passive_interfaces %}
               passive-interface {{ intf }}
               {% endfor %}
          register: ospf_push
          retries: 2
          delay: 5
          until: ospf_push is not failed

        - name: Verify OSPF neighbor adjacencies
          ansible.netcommon.cli_command:
            command: show ip ospf neighbor
          register: ospf_neighbors
          retries: 3
          delay: 10
          until: ospf_neighbors is not failed

        - name: Collect OSPF process summary
          ansible.netcommon.cli_command:
            command: show ip ospf
          register: ospf_summary

        - name: Display neighbor table
          ansible.builtin.debug:
            msg: "{{ ospf_neighbors.stdout_lines }}"

        - name: Warn if no FULL adjacencies detected
          ansible.builtin.debug:
            msg: "WARNING: No FULL adjacencies on {{ inventory_hostname }} — verify area IDs, auth keys, and MTU"
          when: "'FULL' not in ospf_neighbors.stdout"

      rescue:
        - name: Pull current OSPF config for diagnostics
          ansible.netcommon.cli_command:
            command: show running-config | section router ospf
          register: ospf_diag
          failed_when: false

        - name: Log failure with context
          ansible.builtin.debug:
            msg:
              - "OSPFv2 deployment failed on {{ inventory_hostname }}"
              - "Existing config: {{ ospf_diag.stdout | default('unavailable') }}"

        - name: Abort with descriptive error
          ansible.builtin.fail:
            msg: >
              OSPFv2 configuration failed on {{ inventory_hostname }}.
              Check for process ID conflicts, mismatched area types, or authentication mismatch.