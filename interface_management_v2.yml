---
# EtherChannel Port-Channel Configuration Playbook
# Configures LACP-based port-channel bundles on Cisco IOS distribution switches.
# Provides idempotent LAG setup, LACP negotiation verification, and err-disable detection.
#
# Inventory example (inventories/distribution.yml):
# ---
# all:
#   children:
#     distribution:
#       hosts:
#         dist-sw-01:
#           ansible_host: 10.0.1.1
#           ansible_network_os: ios
#           ansible_connection: network_cli
#           ansible_user: "{{ vault_net_user }}"
#           ansible_password: "{{ vault_net_pass }}"
#           ansible_become: true
#           ansible_become_method: enable
#           ansible_become_password: "{{ vault_enable_pass }}"
#         dist-sw-02:
#           ansible_host: 10.0.1.2
#           ansible_network_os: ios
#           ansible_connection: network_cli
#           ansible_user: "{{ vault_net_user }}"
#           ansible_password: "{{ vault_net_pass }}"
#           ansible_become: true
#           ansible_become_method: enable
#           ansible_become_password: "{{ vault_enable_pass }}"
#
# Credentials are sourced from Ansible Vault.
# Encrypt with: ansible-vault encrypt_string 'secret' --name vault_net_user
# Run with:    ansible-playbook etherchannel_config.yml -i inventories/distribution.yml --ask-vault-pass

- name: Configure EtherChannel Port-Channels (LACP) on IOS Distribution Switches
  hosts: distribution
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_pass }}"
    ansible_become_password: "{{ vault_enable_pass }}"

    lag_bundles:
      - name: "1"
        members:
          - member: GigabitEthernet1/0/1
            mode: active
          - member: GigabitEthernet1/0/2
            mode: active
      - name: "2"
        members:
          - member: GigabitEthernet1/0/3
            mode: active
          - member: GigabitEthernet1/0/4
            mode: active

  tasks:
    - name: Apply LACP port-channel configuration and verify
      block:
        - name: Configure LAG member interfaces
          cisco.ios.ios_lag_interfaces:
            config: "{{ lag_bundles }}"
            state: merged
          register: lag_result
          retries: 2
          delay: 5
          until: lag_result is not failed

        - name: Collect EtherChannel and LACP status
          cisco.ios.ios_command:
            commands:
              - show etherchannel summary
              - show lacp neighbor
              - show interfaces port-channel 1 status
          register: ec_status
          retries: 3
          delay: 10
          until: ec_status is not failed
          failed_when: >
            'err-disabled' in (ec_status.stdout | join(' '))

        - name: Display EtherChannel operational state
          ansible.builtin.debug:
            msg: "{{ ec_status.stdout_lines }}"

        - name: Report configuration outcome
          ansible.builtin.debug:
            msg: >
              Port-channel configuration on {{ inventory_hostname }}
              completed — changed: {{ lag_result.changed }}

      rescue:
        - name: Collect interface diagnostics on failure
          cisco.ios.ios_command:
            commands:
              - show interfaces GigabitEthernet1/0/1
              - show interfaces GigabitEthernet1/0/2
              - show lacp internal
              - show logging | include LACP
          register: diag_output
          ignore_errors: true

        - name: Log failure details and diagnostics
          ansible.builtin.debug:
            msg:
              - "EtherChannel configuration FAILED on {{ inventory_hostname }}"
              - "Diagnostics: {{ diag_output.stdout_lines | default(['unavailable']) }}"

        - name: Raise fatal error with context
          ansible.builtin.fail:
            msg: >
              Port-channel configuration failed on {{ inventory_hostname }}.
              Check for err-disabled members, LACP mismatch, or reachability issues.