No other skills apply to this well-defined YAML generation task. Writing the VLAN management playbook now — it's a natural gap in the existing set (interface_management covers IP/admin-state, but VLAN database + switchport assignment isn't there yet).

---
# vlan_management.yml
#
# Manages VLAN database creation and switchport VLAN assignments (access + trunk)
# on Cisco IOS and NX-OS devices. Complements interface_management.yml, which
# handles IP addressing and admin state.
#
# Credentials: stored in Ansible Vault
#   ansible-vault create group_vars/all/vault.yml
#   Keys: vault_net_user, vault_net_password, vault_net_enable
#
# Inventory example:
#   [access_switches]
#   sw-access-01  ansible_host=10.10.10.11  ansible_network_os=ios
#   sw-access-02  ansible_host=10.10.10.12  ansible_network_os=ios
#
#   [distribution_switches]
#   sw-dist-01  ansible_host=10.10.10.21  ansible_network_os=nxos
#
#   [switches:children]
#   access_switches
#   distribution_switches

- name: VLAN Management - database, access ports, and trunk assignments
  hosts: switches
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_net_enable }}"

    vlans:
      - id: 10
        name: CORP_DATA
      - id: 20
        name: CORP_VOICE
      - id: 30
        name: MANAGEMENT
      - id: 40
        name: SERVERS

    access_ports:
      - interface: GigabitEthernet0/1
        vlan: 10
      - interface: GigabitEthernet0/2
        vlan: 20

    trunk_ports:
      - interface: GigabitEthernet0/24
        allowed_vlans: "10,20,30,40"

  tasks:

    - name: Configure VLAN database (IOS)
      block:
        - name: Create VLANs on IOS
          cisco.ios.ios_vlans:
            config: "{{ vlans | map('combine', {'state': 'active'}) | list }}"
            state: merged
          register: ios_vlan_result
          retries: 2
          delay: 5
          until: ios_vlan_result is not failed
          when: ansible_network_os == 'ios'

        - name: Create VLANs on NX-OS
          cisco.nxos.nxos_vlans:
            config: "{{ vlans | map('combine', {'enabled': true}) | list }}"
            state: merged
          register: nxos_vlan_result
          retries: 2
          delay: 5
          until: nxos_vlan_result is not failed
          when: ansible_network_os == 'nxos'

      rescue:
        - name: Report VLAN database failure
          ansible.builtin.debug:
            msg: "VLAN configuration failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

        - name: Abort on VLAN failure
          ansible.builtin.fail:
            msg: "Halting play — VLAN database setup failed on {{ inventory_hostname }}"

    - name: Assign access-mode switchports (IOS)
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.interface }}"
            mode: access
            access:
              vlan: "{{ item.vlan }}"
        state: merged
      loop: "{{ access_ports }}"
      register: access_result
      failed_when: access_result.failed is defined and access_result.failed
      when:
        - ansible_network_os == 'ios'
        - access_ports | length > 0

    - name: Assign trunk-mode switchports (IOS)
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.interface }}"
            mode: trunk
            trunk:
              allowed_vlans: "{{ item.allowed_vlans }}"
              encapsulation: dot1q
        state: merged
      loop: "{{ trunk_ports }}"
      register: trunk_result
      failed_when: trunk_result.failed is defined and trunk_result.failed
      when:
        - ansible_network_os == 'ios'
        - trunk_ports | length > 0

    - name: Verify VLAN database post-configuration
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_verify
      when: ansible_network_os == 'ios'

    - name: Display VLAN verification output
      ansible.builtin.debug:
        var: vlan_verify.stdout_lines
      when:
        - vlan_verify is defined
        - not vlan_verify.skipped | default(false)

    - name: Configuration summary
      ansible.builtin.debug:
        msg:
          - "Host            : {{ inventory_hostname }}"
          - "VLANs applied   : {{ vlans | map(attribute='id') | list }}"
          - "Access ports    : {{ access_ports | map(attribute='interface') | list }}"
          - "Trunk ports     : {{ trunk_ports | map(attribute='interface') | list }}