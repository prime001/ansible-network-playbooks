---
# ospf_config.yml
# Deploys OSPF routing process on Cisco IOS devices with multi-area support.
# Validates adjacency formation post-deployment and saves configuration to NVRAM.
#
# Inventory example:
#   [core_routers]
#   core-rtr-01  ansible_host=10.0.0.1  ospf_router_id=10.0.0.1
#   core-rtr-02  ansible_host=10.0.0.2  ospf_router_id=10.0.0.2
#
#   [dist_routers]
#   dist-rtr-01  ansible_host=10.0.10.1  ospf_router_id=10.0.10.1
#
#   [all:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}         # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}     # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_secret }}

- name: Configure OSPF routing process on Cisco IOS devices
  hosts: routers
  gather_facts: false
  vars:
    ospf_process_id: 1
    ospf_reference_bw: 10000
    ospf_networks:
      - prefix: "10.0.0.0"
        wildcard: "0.0.0.255"
        area: 0
      - prefix: "192.168.1.0"
        wildcard: "0.0.0.255"
        area: 1
    ospf_active_interfaces:
      - GigabitEthernet0/0
      - GigabitEthernet0/1
    ospf_stub_areas: []

  tasks:
    - name: Confirm device is reachable before making changes
      cisco.ios.ios_command:
        commands: show version
      register: pre_check
      retries: 3
      delay: 10
      until: pre_check is not failed

    - name: Deploy OSPF configuration
      block:
        - name: Configure OSPF process ID, router-id, and cost reference bandwidth
          cisco.ios.ios_config:
            lines:
              - "router ospf {{ ospf_process_id }}"
              - " router-id {{ ospf_router_id | default(ansible_host) }}"
              - " auto-cost reference-bandwidth {{ ospf_reference_bw }}"
              - " passive-interface default"
            match: line

        - name: Advertise networks into OSPF areas
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
          loop: "{{ ospf_networks }}"

        - name: Enable OSPF on transit interfaces
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "no passive-interface {{ item }}"
          loop: "{{ ospf_active_interfaces }}"

        - name: Configure totally stubby areas
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "area {{ item }} stub no-summary"
          loop: "{{ ospf_stub_areas }}"
          when: ospf_stub_areas | length > 0

      rescue:
        - name: Report which task caused the failure
          ansible.builtin.debug:
            msg: "OSPF deployment failed on {{ inventory_hostname }} at: {{ ansible_failed_task.name }}"

        - name: Halt playbook with descriptive error
          ansible.builtin.fail:
            msg: "Aborting — OSPF configuration unsuccessful on {{ inventory_hostname }}"

    - name: Wait for OSPF adjacencies to converge
      cisco.ios.ios_command:
        commands: show ip ospf neighbor
      register: ospf_neighbors
      retries: 6
      delay: 10
      until: "'FULL' in ospf_neighbors.stdout[0]"
      failed_when: false

    - name: Collect OSPF operational state
      cisco.ios.ios_command:
        commands:
          - show ip ospf
          - show ip ospf neighbor
          - show ip route ospf
      register: ospf_state

    - name: Display OSPF state for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg:
          - "=== OSPF Process Summary ==="
          - "{{ ospf_state.stdout[0] }}"
          - "=== Neighbor Adjacencies ==="
          - "{{ ospf_state.stdout[1] }}"
          - "=== OSPF Routes in RIB ==="
          - "{{ ospf_state.stdout[2] }}"

    - name: Save running configuration to NVRAM
      cisco.ios.ios_config:
        save_when: modified