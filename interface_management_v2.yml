---
# ospf_config.yml - Configure OSPFv2 process and area routing on Cisco IOS routers
#
# Credentials sourced from Ansible Vault:
#   ansible-vault edit group_vars/all/vault.yml
#   Required keys: vault_ansible_user, vault_ansible_password,
#                  vault_enable_password, vault_ospf_md5_key
#
# Inventory example:
# [routers]
# core-rtr-01  ansible_host=10.0.0.1  ospf_router_id=10.255.0.1
# core-rtr-02  ansible_host=10.0.0.2  ospf_router_id=10.255.0.2
#
# [routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_ansible_user }}
# ansible_password={{ vault_ansible_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Configure OSPFv2 process, area assignments, and MD5 authentication
  hosts: routers
  gather_facts: false
  vars:
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"
    ansible_become_password: "{{ vault_enable_password }}"
    ospf_process_id: 1
    ospf_reference_bandwidth: 10000
    ospf_networks:
      - prefix: "10.0.0.0"
        wildcard: "0.0.0.255"
        area: "0"
      - prefix: "192.168.100.0"
        wildcard: "0.0.0.255"
        area: "1"
    ospf_active_interfaces:
      - GigabitEthernet0/1
      - GigabitEthernet0/2

  tasks:
    - name: Capture OSPF state before changes
      cisco.ios.ios_command:
        commands:
          - show ip ospf
          - show ip ospf neighbor summary
      register: ospf_pre_state
      retries: 2
      delay: 5

    - name: Display pre-change OSPF state
      ansible.builtin.debug:
        var: ospf_pre_state.stdout_lines

    - name: Apply OSPF configuration
      block:
        - name: Set OSPF process parameters and passive-interface default
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
              - "passive-interface default"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed

        - name: Activate OSPF on routed interfaces
          cisco.ios.ios_config:
            lines:
              - "no passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed
          loop: "{{ ospf_active_interfaces }}"

        - name: Advertise networks into OSPF areas
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed
          loop: "{{ ospf_networks }}"

        - name: Enable MD5 authentication on active OSPF interfaces
          cisco.ios.ios_config:
            lines:
              - "ip ospf message-digest-key 1 md5 {{ vault_ospf_md5_key }}"
              - "ip ospf authentication message-digest"
            parents: "interface {{ item }}"
            save_when: changed
          loop: "{{ ospf_active_interfaces }}"
          no_log: true

      rescue:
        - name: Report configuration failure details
          ansible.builtin.debug:
            msg: "OSPF config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort play for affected host
          ansible.builtin.fail:
            msg: "Halting: OSPF could not be applied to {{ inventory_hostname }}. Manual review required."

    - name: Wait for OSPF adjacencies to reach FULL state
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
      register: ospf_neighbors
      retries: 6
      delay: 10
      until: "'FULL' in ospf_neighbors.stdout[0]"

    - name: Display OSPF neighbor table
      ansible.builtin.debug:
        var: ospf_neighbors.stdout_lines

    - name: Confirm OSPF routes are present in the RIB
      cisco.ios.ios_command:
        commands:
          - show ip route ospf
      register: ospf_rib
      failed_when:
        - ospf_networks | length > 0
        - "'O ' not in ospf_rib.stdout[0]"

    - name: Display OSPF-learned routes
      ansible.builtin.debug:
        var: ospf_rib.stdout_lines