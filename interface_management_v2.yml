---
# ospf_config.yml — Deploy and verify OSPF on Cisco IOS/IOS-XE devices
# Configures OSPF process, network statements, passive interfaces, and
# validates neighbor adjacencies form successfully after deployment.
#
# Credentials stored in Ansible Vault:
#   ansible-vault edit group_vars/all/vault.yml
#   Required keys: vault_network_user, vault_network_password, vault_enable_password
#
# Inventory example:
# [core_routers]
# r1  ansible_host=10.0.1.1
# r2  ansible_host=10.0.1.2
#
# [core_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_network_user }}
# ansible_password={{ vault_network_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Deploy OSPF routing configuration on Cisco IOS devices
  hosts: core_routers
  gather_facts: false
  vars:
    ansible_user: "{{ vault_network_user }}"
    ansible_password: "{{ vault_network_password }}"
    ansible_become_password: "{{ vault_enable_password }}"
    ospf_process_id: 1
    ospf_reference_bandwidth: 1000
    ospf_networks:
      - prefix: "10.0.0.0"
        wildcard: "0.0.255.255"
        area: 0
      - prefix: "192.168.100.0"
        wildcard: "0.0.0.255"
        area: 1
    ospf_passive_interfaces:
      - GigabitEthernet0/2

  tasks:
    - name: Configure OSPF process and settings
      block:
        - name: Set OSPF reference bandwidth
          cisco.ios.ios_config:
            lines:
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
            parents: "router ospf {{ ospf_process_id }}"

        - name: Configure OSPF network statements
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"

        - name: Configure passive interfaces
          cisco.ios.ios_config:
            lines:
              - "passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_passive_interfaces }}"

        - name: Verify OSPF process is active
          cisco.ios.ios_command:
            commands:
              - "show ip ospf {{ ospf_process_id }}"
              - "show ip ospf neighbor"
              - "show ip ospf interface brief"
          register: ospf_verify
          retries: 3
          delay: 10
          until: ospf_verify.stdout[0] != ""
          failed_when: "'OSPF Router with ID' not in ospf_verify.stdout[0]"

        - name: Display OSPF neighbor table
          ansible.builtin.debug:
            msg: "{{ ospf_verify.stdout_lines[1] }}"

        - name: Display OSPF interface summary
          ansible.builtin.debug:
            msg: "{{ ospf_verify.stdout_lines[2] }}"

      rescue:
        - name: Collect diagnostic information
          cisco.ios.ios_command:
            commands:
              - "show ip protocols"
              - "show running-config | section router ospf"
          register: diag_output
          ignore_errors: true

        - name: Display diagnostics
          ansible.builtin.debug:
            msg: "{{ diag_output.stdout_lines | default(['No diagnostic data collected']) }}"

        - name: Fail with descriptive context
          ansible.builtin.fail:
            msg: >
              OSPF deployment failed on {{ inventory_hostname }}.
              Failed task: {{ ansible_failed_task.name }}.
              Review diagnostic output above before retrying.