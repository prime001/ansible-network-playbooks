No other skills apply here — the requirements are fully specified. Writing an OSPF configuration playbook since routing protocol deployment is the most notable gap in the existing playbook set.

---

```yaml
---
# ospf_config.yml
#
# Deploys OSPF process configuration on Cisco IOS routers:
#   - Creates/updates the OSPF process and router-id
#   - Activates networks into OSPF areas
#   - Sets passive interfaces to suppress hellos on stub segments
#   - Validates adjacencies formed after convergence
#
# Credentials: ansible-vault encrypted group_vars/routers/vault.yml
#   ansible_user: "{{ vault_ansible_user }}"
#   ansible_password: "{{ vault_ansible_password }}"
#   ansible_become_password: "{{ vault_ansible_become_password }}"
#
# Inventory example:
#   [routers]
#   r1  ansible_host=192.168.1.1  ospf_router_id=10.0.0.1
#   r2  ansible_host=192.168.1.2  ospf_router_id=10.0.0.2
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ospf_process_id=1
#   ospf_networks:
#     - prefix: 10.0.0.0
#       wildcard: 0.0.0.255
#       area: 0
#     - prefix: 192.168.10.0
#       wildcard: 0.0.0.255
#       area: 1
#   ospf_passive_interfaces:
#     - Loopback0
#     - GigabitEthernet0/2

- name: Configure OSPF on IOS routers
  hosts: routers
  gather_facts: false
  vars:
    ospf_convergence_wait: 15

  tasks:
    - name: Deploy OSPF process and network statements
      block:
        - name: Apply OSPF configuration
          cisco.ios.ios_config:
            lines: >-
              {{
                ['router ospf ' + (ospf_process_id | string),
                 ' router-id ' + ospf_router_id]
                + ospf_networks | map('regex_replace', '^(.*)$',
                  ' network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}')
                | list
                + ospf_passive_interfaces | map('regex_replace', '^(.*)$',
                  ' passive-interface \1') | list
              }}
          vars:
            lines: >-
              {{
                ['router ospf ' + (ospf_process_id | string),
                 ' router-id ' + ospf_router_id]
                + ospf_networks | map('community.general.dict_item',
                    'prefix', 'wildcard', 'area') | list
                + ospf_passive_interfaces | map('regex_replace',
                    '^(.*)$', ' passive-interface \1') | list
              }}
          notify: save running config
          register: ospf_config_result

        - name: Build OSPF config block
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth 10000"
          register: ospf_base

        - name: Activate networks into OSPF areas
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
          loop: "{{ ospf_networks }}"
          loop_control:
            label: "{{ item.prefix }}/{{ item.area }}"
          register: ospf_networks_result

        - name: Set passive interfaces
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "passive-interface {{ item }}"
          loop: "{{ ospf_passive_interfaces | default([]) }}"
          when: ospf_passive_interfaces is defined and ospf_passive_interfaces | length > 0
          register: ospf_passive_result

        - name: Wait for OSPF convergence
          ansible.builtin.pause:
            seconds: "{{ ospf_convergence_wait }}"
          when: ospf_base.changed or ospf_networks_result.changed

        - name: Verify OSPF neighbors
          cisco.ios.ios_command:
            commands: "show ip ospf neighbor"
            wait_for: "result[0] contains 'FULL'"
            retries: 5
            interval: 10
          register: ospf_neighbors
          failed_when: "'FULL' not in ospf_neighbors.stdout[0]"

        - name: Gather OSPF process summary
          cisco.ios.ios_command:
            commands:
              - "show ip ospf {{ ospf_process_id }}"
              - "show ip ospf interface brief"
          register: ospf_summary

      rescue:
        - name: Capture current OSPF state on failure
          cisco.ios.ios_command:
            commands:
              - "show ip ospf"
              - "show ip ospf neighbor detail"
              - "show logging | include OSPF"
          register: ospf_debug
          ignore_errors: true

        - name: Report failure details
          ansible.builtin.debug:
            msg:
              - "OSPF configuration failed on {{ inventory_hostname }}"
              - "Process output: {{ ospf_debug.stdout | default(['unavailable']) }}"

        - name: Fail with context
          ansible.builtin.fail:
            msg: "OSPF deployment failed on {{ inventory_hostname }} — see debug output above"

    - name: Display OSPF neighbor table
      ansible.builtin.debug:
        msg: "{{ ospf_neighbors.stdout_lines }}"

    - name: Display OSPF interface summary
      ansible.builtin.debug:
        msg: "{{ ospf_summary.stdout_lines }}"

  handlers:
    - name: save running config
      cisco.ios.ios_command:
        commands: "write memory"
```