---
# ospf_config.yml — Configure OSPF routing process, router-id, area assignments,
# and per-interface parameters on Cisco IOS routers. Validates adjacencies post-push.
#
# Inventory example:
#   [routers]
#   rtr-core-01  ansible_host=10.0.0.1
#   rtr-edge-01  ansible_host=10.0.0.5
#
#   [routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}           # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}    # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure OSPF routing on Cisco IOS routers
  hosts: routers
  gather_facts: false

  vars:
    ospf_process_id: 1
    ospf_router_id: "{{ ansible_host }}"
    ospf_reference_bandwidth: 10000
    ospf_interfaces:
      - name: GigabitEthernet0/0
        area: 0
        network_type: broadcast
        passive: false
      - name: GigabitEthernet0/1
        area: 1
        network_type: point-to-point
        passive: false
      - name: Loopback0
        area: 0
        network_type: loopback
        passive: true

  tasks:
    - name: Verify device is reachable before configuration
      ios_command:
        commands: show clock
      register: pre_check
      retries: 3
      delay: 5
      until: pre_check is not failed

    - name: Apply OSPF configuration
      block:
        - name: Configure OSPF process and global parameters
          ios_config:
            lines:
              - "router ospf {{ ospf_process_id }}"
              - " router-id {{ ospf_router_id }}"
              - " log-adjacency-changes detail"
              - " auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
            match: line
          register: ospf_global_result

        - name: Assign interfaces to OSPF areas and set network type
          ios_config:
            parents: "interface {{ item.name }}"
            lines:
              - "ip ospf {{ ospf_process_id }} area {{ item.area }}"
              - "ip ospf network {{ item.network_type }}"
          loop: "{{ ospf_interfaces }}"
          register: ospf_iface_result

        - name: Configure passive interfaces in OSPF process
          ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines: "passive-interface {{ item.name }}"
          loop: "{{ ospf_interfaces | selectattr('passive') | list }}"
          when: ospf_interfaces | selectattr('passive') | list | length > 0

        - name: Persist configuration to startup
          ios_command:
            commands: write memory
          register: save_output
          failed_when: >
            'OK' not in save_output.stdout[0] and
            'Building configuration' not in save_output.stdout[0]

      rescue:
        - name: Capture OSPF state for diagnosis
          ios_command:
            commands:
              - show ip ospf
              - show ip ospf interface brief
              - show running-config | section ospf
          register: ospf_diag
          ignore_errors: true

        - name: Display diagnostic output
          debug:
            var: ospf_diag.stdout_lines

        - name: Fail with structured error message
          fail:
            msg: >
              OSPF configuration failed on {{ inventory_hostname }}.
              Task: {{ ansible_failed_task.name | default('unknown') }}.
              Error: {{ ansible_failed_result.msg | default('see diagnostics above') }}

    - name: Wait up to 60s for OSPF adjacencies to form
      ios_command:
        commands: show ip ospf neighbor
      register: ospf_neighbors
      retries: 6
      delay: 10
      until: ospf_neighbors is not failed
      ignore_errors: true

    - name: Verify OSPF process is active
      ios_command:
        commands: "show ip ospf {{ ospf_process_id }}"
      register: ospf_verify
      failed_when: ospf_process_id | string not in ospf_verify.stdout[0]

    - name: Report OSPF configuration result
      debug:
        msg: >
          {{ inventory_hostname }}: OSPF process {{ ospf_process_id }} active,
          router-id {{ ospf_router_id }},
          interfaces {{ ospf_interfaces | map(attribute='name') | join(', ') }}.
          Neighbor table: {{ ospf_neighbors.stdout_lines[0] | default(['(no neighbors yet)']) }}