Writing a BGP neighbor configuration playbook — not covered by any of the existing 20 playbooks.

---
# BGP Neighbor Configuration and Session Verification
# Configures eBGP/iBGP peers on Cisco IOS routers and validates session establishment
#
# Inventory example:
#   [bgp_routers]
#   core-rtr-01 ansible_host=10.0.1.1
#   core-rtr-02 ansible_host=10.0.1.2
#
#   [bgp_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_network_user }}"          # stored in ansible-vault
#   ansible_password="{{ vault_network_password }}"
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password="{{ vault_enable_password }}"
#   local_asn=65001
#   bgp_peer_ip=10.0.1.2
#   bgp_peer_asn=65002

- name: Configure BGP neighbors and verify peering on Cisco IOS
  hosts: bgp_routers
  gather_facts: false

  vars:
    bgp_keepalive: 30
    bgp_holdtime: 90
    bgp_update_source: Loopback0
    bgp_session_timeout: 150

  tasks:

    - name: Capture pre-change BGP summary
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
      register: bgp_pre_state
      failed_when: false

    - name: Configure BGP neighbor
      block:

        - name: Apply BGP global neighbor statements
          cisco.ios.ios_config:
            lines:
              - "neighbor {{ bgp_peer_ip }} remote-as {{ bgp_peer_asn }}"
              - "neighbor {{ bgp_peer_ip }} description PEER-AS{{ bgp_peer_asn }}"
              - "neighbor {{ bgp_peer_ip }} update-source {{ bgp_update_source }}"
              - "neighbor {{ bgp_peer_ip }} timers {{ bgp_keepalive }} {{ bgp_holdtime }}"
            parents: "router bgp {{ local_asn }}"
          register: bgp_neighbor_cfg
          notify: Write configuration to NVRAM

        - name: Activate neighbor in IPv4 unicast address-family
          cisco.ios.ios_config:
            lines:
              - "neighbor {{ bgp_peer_ip }} activate"
              - "neighbor {{ bgp_peer_ip }} soft-reconfiguration inbound"
            parents:
              - "router bgp {{ local_asn }}"
              - "address-family ipv4 unicast"
          register: bgp_af_cfg

      rescue:

        - name: Log configuration failure details
          ansible.builtin.debug:
            msg: "BGP config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

        - name: Abort with descriptive message
          ansible.builtin.fail:
            msg: "BGP neighbor configuration failed on {{ inventory_hostname }}. Verify BGP process exists and credentials are correct."

    - name: Poll until BGP session reaches Established state
      cisco.ios.ios_command:
        commands:
          - "show ip bgp neighbors {{ bgp_peer_ip }} | include BGP state"
      register: bgp_state_poll
      until: "'Established' in bgp_state_poll.stdout[0]"
      retries: "{{ (bgp_session_timeout / 15) | int }}"
      delay: 15

    - name: Gather full BGP neighbor detail
      cisco.ios.ios_command:
        commands:
          - "show ip bgp neighbors {{ bgp_peer_ip }}"
          - "show ip bgp summary"
      register: bgp_detail

    - name: Assert BGP session is Established
      ansible.builtin.assert:
        that:
          - "'Established' in bgp_state_poll.stdout[0]"
        fail_msg: "BGP peer {{ bgp_peer_ip }} did not reach Established state on {{ inventory_hostname }}"
        success_msg: "BGP session with {{ bgp_peer_ip }} (AS {{ bgp_peer_asn }}) is Established"

    - name: Display BGP session result
      ansible.builtin.debug:
        msg:
          - "Device  : {{ inventory_hostname }}"
          - "Local AS: {{ local_asn }}"
          - "Peer    : {{ bgp_peer_ip }} (AS {{ bgp_peer_asn }})"
          - "State   : {{ bgp_state_poll.stdout[0] | trim }}"

  handlers:
    - name: Write configuration to NVRAM
      cisco.ios.ios_command:
        commands:
          - write memory