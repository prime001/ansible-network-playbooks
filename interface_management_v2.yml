---
# Interface Error Monitoring and Auto-Remediation Playbook
#
# Purpose: Poll interface error counters on Cisco IOS/IOS-XE devices,
#          flag interfaces exceeding error thresholds, and optionally
#          bounce interfaces with persistent errors.
#
# Credentials: Store ansible_user and ansible_password in Ansible Vault.
#   Example: ansible-vault encrypt_string 'mysecret' --name 'ansible_password'
#
# Inventory example:
#   [core_switches]
#   sw-core-01 ansible_host=10.0.1.1
#   sw-core-02 ansible_host=10.0.1.2
#
#   [core_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}         # vault-encrypted
#   ansible_password={{ vault_net_password }} # vault-encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }} # vault-encrypted

- name: Interface Error Monitoring and Auto-Remediation
  hosts: core_switches
  gather_facts: false

  vars:
    error_threshold: 1000        # input/output error count to flag
    crc_threshold: 500           # CRC error count to flag
    bounce_on_errors: false      # set true to auto-shutdown/no-shutdown
    check_interfaces:
      - GigabitEthernet0/1
      - GigabitEthernet0/2
      - GigabitEthernet0/3

  tasks:
    - name: Collect interface error counters
      block:
        - name: Run show interfaces for error stats
          cisco.ios.ios_command:
            commands:
              - "show interfaces {{ item }} | include errors|CRC|resets|flaps"
          loop: "{{ check_interfaces }}"
          register: iface_errors
          retries: 2
          delay: 5
          until: iface_errors is not failed

        - name: Run show interfaces status
          cisco.ios.ios_command:
            commands:
              - show interfaces status
          register: iface_status

        - name: Display raw interface error output
          ansible.builtin.debug:
            msg: "{{ item.stdout_lines }}"
          loop: "{{ iface_errors.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Parse and flag interfaces exceeding error thresholds
          ansible.builtin.set_fact:
            flagged_interfaces: >-
              {{
                iface_errors.results
                | selectattr('stdout', 'search', '[1-9][0-9]{3,} input errors|[1-9][0-9]{2,} CRC')
                | map(attribute='item')
                | list
              }}

        - name: Report flagged interfaces
          ansible.builtin.debug:
            msg: >
              HOST {{ inventory_hostname }} — interfaces exceeding thresholds:
              {{ flagged_interfaces | default([]) | join(', ') | default('none') }}

        - name: Bounce flagged interfaces (if enabled)
          cisco.ios.ios_config:
            lines:
              - shutdown
              - no shutdown
            parents: "interface {{ item }}"
            save_when: never
          loop: "{{ flagged_interfaces }}"
          when:
            - bounce_on_errors | bool
            - flagged_interfaces is defined
            - flagged_interfaces | length > 0
          register: bounce_result
          notify: Save running config

      rescue:
        - name: Log connection or command failure
          ansible.builtin.debug:
            msg: >
              FAILED on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}.
              Skipping this host — investigate manually.

        - name: Mark host as failed without stopping the play
          ansible.builtin.set_fact:
            host_check_failed: true

  handlers:
    - name: Save running config
      cisco.ios.ios_command:
        commands:
          - write memory
      listen: Save running config