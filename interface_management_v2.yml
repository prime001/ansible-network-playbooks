---
# vlan_management.yml
# Provisions VLANs and assigns Layer-2 port modes (access + trunk) on Cisco IOS switches.
# Requires: cisco.ios collection — ansible-galaxy collection install cisco.ios
# Credentials: store switch and enable passwords via ansible-vault
#
# Inventory example:
#   [network_switches]
#   sw-core-01   ansible_host=10.0.1.1
#   sw-access-01 ansible_host=10.0.1.10
#   [network_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user=netadmin
#   ansible_password={{ vault_switch_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: VLAN Provisioning and Layer-2 Port Assignment
  hosts: network_switches
  gather_facts: false

  vars:
    vlans:
      - vlan_id: 10
        name: USERS
        state: active
      - vlan_id: 20
        name: SERVERS
        state: active
      - vlan_id: 30
        name: MANAGEMENT
        state: active
      - vlan_id: 99
        name: NATIVE_TRUNK
        state: active

    access_ports:
      - name: GigabitEthernet0/1
        vlan: 10
      - name: GigabitEthernet0/2
        vlan: 20
      - name: GigabitEthernet0/3
        vlan: 30

    trunk_ports:
      - name: GigabitEthernet0/24
        allowed_vlans: "10,20,30,99"
        native_vlan: 99

  tasks:
    - name: Provision VLANs and port assignments
      block:
        - name: Create and activate VLANs
          cisco.ios.ios_vlans:
            config: "{{ vlans }}"
            state: merged
          register: vlan_result

        - name: Configure access port VLAN assignments
          cisco.ios.ios_l2_interfaces:
            config:
              - name: "{{ item.name }}"
                mode: access
                access:
                  vlan: "{{ item.vlan }}"
            state: merged
          loop: "{{ access_ports }}"
          register: access_result

        - name: Configure trunk ports with allowed VLANs
          cisco.ios.ios_l2_interfaces:
            config:
              - name: "{{ item.name }}"
                mode: trunk
                trunk:
                  allowed_vlans: "{{ item.allowed_vlans }}"
                  native_vlan: "{{ item.native_vlan }}"
            state: merged
          loop: "{{ trunk_ports }}"
          register: trunk_result

        - name: Verify VLAN database and trunk state
          cisco.ios.ios_command:
            commands:
              - show vlan brief
              - show interfaces trunk
          register: vlan_verify
          retries: 2
          delay: 3
          until: vlan_verify is not failed

      rescue:
        - name: Capture VLAN config on failure
          cisco.ios.ios_command:
            commands:
              - show running-config | section vlan
          register: failure_config

        - name: Report failure with context
          ansible.builtin.debug:
            msg:
              - "VLAN provisioning failed on {{ inventory_hostname }}"
              - "Current VLAN config: {{ failure_config.stdout[0] }}"

        - name: Abort with clear error
          ansible.builtin.fail:
            msg: "VLAN provisioning failed on {{ inventory_hostname }} — see rescue output above."

    - name: Display VLAN table and trunk summary
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} ==="
          - "VLAN table: {{ vlan_verify.stdout[0] }}"
          - "Trunk interfaces: {{ vlan_verify.stdout[1] }}"

    - name: Assert all target VLANs present in VLAN table
      ansible.builtin.assert:
        that:
          - "item.vlan_id | string in vlan_verify.stdout[0]"
        fail_msg: "VLAN {{ item.vlan_id }} ({{ item.name }}) missing on {{ inventory_hostname }}"
        success_msg: "VLAN {{ item.vlan_id }} confirmed active on {{ inventory_hostname }}"
      loop: "{{ vlans }}