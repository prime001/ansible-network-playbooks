---
# OSPF Routing Configuration Playbook
# Configures OSPFv2 process, area assignments, passive interfaces, and authentication
# on Cisco IOS routers.
#
# Credentials: store ansible_user / ansible_password / ansible_become_password
# in an Ansible Vault file (e.g. group_vars/routers/vault.yml) and reference
# with --ask-vault-pass or a vault password file.
#
# Inventory example (inventory/routers.yml):
# ---
# all:
#   children:
#     routers:
#       hosts:
#         rtr-core-01:
#           ansible_host: 192.168.1.1
#           ospf_router_id: 1.1.1.1
#           ospf_networks:
#             - prefix: 10.0.0.0
#               wildcard: 0.0.0.255
#               area: 0
#             - prefix: 172.16.1.0
#               wildcard: 0.0.0.3
#               area: 1
#           ospf_passive_interfaces:
#             - Loopback0
#             - GigabitEthernet0/2
#         rtr-edge-01:
#           ansible_host: 192.168.1.2
#           ospf_router_id: 2.2.2.2
#           ospf_networks:
#             - prefix: 172.16.1.0
#               wildcard: 0.0.0.3
#               area: 1

- name: Configure OSPFv2 routing process on Cisco IOS routers
  hosts: routers
  gather_facts: false
  connection: network_cli
  vars:
    ansible_network_os: ios
    # ansible_user, ansible_password, ansible_become_password loaded from vault
    ospf_process_id: "{{ ospf_pid | default(1) }}"
    ospf_auth_key: "{{ vault_ospf_auth_key | default('') }}"
    ospf_reference_bw: 10000

  tasks:
    - name: Verify device reachability before making changes
      cisco.ios.ios_command:
        commands:
          - show version
      register: version_output
      retries: 3
      delay: 5
      until: version_output is not failed

    - name: Display IOS version for audit trail
      ansible.builtin.debug:
        msg: "{{ version_output.stdout_lines[0][:5] }}"

    - name: Apply OSPF process configuration
      block:
        - name: Configure OSPF process, router-id, and reference bandwidth
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bw }}"
              - "passive-interface default"
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_base_result

        - name: Activate OSPF on network ranges
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"
          register: ospf_network_result

        - name: Re-enable OSPF on active (non-passive) interfaces
          cisco.ios.ios_config:
            lines:
              - "no passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_passive_interfaces | default([]) }}"
          when: ospf_passive_interfaces is defined

      rescue:
        - name: Log OSPF configuration failure
          ansible.builtin.debug:
            msg: >
              OSPF configuration failed on {{ inventory_hostname }}.
              Check OSPF process ID conflicts or overlapping network statements.

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: "OSPF config aborted on {{ inventory_hostname }} — manual review required."

    - name: Verify OSPF process is running
      cisco.ios.ios_command:
        commands:
          - "show ip ospf {{ ospf_process_id }}"
          - "show ip ospf neighbor"
      register: ospf_verify
      failed_when: "'OSPF Router with ID' not in ospf_verify.stdout[0]"

    - name: Display OSPF neighbor table
      ansible.builtin.debug:
        msg: "{{ ospf_verify.stdout_lines[1] }}"

    - name: Save running configuration to startup
      cisco.ios.ios_command:
        commands:
          - write memory
      register: save_result
      failed_when: "'OK' not in save_result.stdout[0]