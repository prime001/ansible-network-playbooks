# vlan_management.yml
# Manages VLAN databases and L2 interface (trunk/access) assignments on Cisco IOS switches.
# Credentials are stored in Ansible Vault — reference vault_net_user/vault_net_pass/vault_enable_pass
# in group_vars/all/vault.yml (ansible-vault encrypted).
#
# Inventory example:
#   [cisco_switches]
#   sw-core-01   ansible_host=10.0.1.1
#   sw-access-01 ansible_host=10.0.1.2
#   sw-access-02 ansible_host=10.0.1.3
#
#   [cisco_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_user }}"
#   ansible_password="{{ vault_net_pass }}"
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password="{{ vault_enable_pass }}"

- name: Provision VLANs and L2 interface assignments on Cisco IOS switches
  hosts: cisco_switches
  gather_facts: false

  vars:
    vlans:
      - vlan_id: 10
        name: DATA
      - vlan_id: 20
        name: VOICE
      - vlan_id: 30
        name: MANAGEMENT
      - vlan_id: 99
        name: NATIVE

    access_interfaces:
      - name: GigabitEthernet0/1
        vlan: 10
      - name: GigabitEthernet0/2
        vlan: 20

    trunk_interfaces:
      - name: GigabitEthernet0/24
        allowed_vlans: "10,20,30,99"
        native_vlan: 99

  tasks:

    - name: Create or update VLAN database
      block:
        - name: Configure VLANs
          cisco.ios.ios_vlans:
            config: "{{ vlans }}"
            state: merged
          register: vlan_result
          retries: 2
          delay: 5
          until: vlan_result is not failed

        - name: Report VLAN provisioning result
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: VLAN database
              {{ 'updated' if vlan_result.changed else 'already compliant' }}

      rescue:
        - name: Alert on VLAN provisioning failure
          ansible.builtin.debug:
            msg: "VLAN provisioning failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort on unrecoverable VLAN error
          ansible.builtin.fail:
            msg: "Halting — VLAN provisioning failed on {{ inventory_hostname }}"

    - name: Configure access port VLAN membership
      block:
        - name: Set access mode and VLAN assignment
          cisco.ios.ios_l2_interfaces:
            config:
              - name: "{{ item.name }}"
                mode: access
                access:
                  vlan: "{{ item.vlan }}"
            state: merged
          loop: "{{ access_interfaces }}"
          register: access_result
          failed_when:
            - access_result.failed
            - "'Invalid input' in (access_result.msg | default(''))"

        - name: Report access port changes
          ansible.builtin.debug:
            msg: "{{ item.item.name }}: {{ 'updated' if item.changed else 'no change' }}"
          loop: "{{ access_result.results }}"

      rescue:
        - name: Alert on access port failure
          ansible.builtin.debug:
            msg: "Access port config failed on {{ inventory_hostname }}"

    - name: Configure trunk ports with allowed VLANs
      block:
        - name: Set trunk mode, allowed VLANs, and native VLAN
          cisco.ios.ios_l2_interfaces:
            config:
              - name: "{{ item.name }}"
                mode: trunk
                trunk:
                  allowed_vlans: "{{ item.allowed_vlans }}"
                  native_vlan: "{{ item.native_vlan }}"
            state: merged
          loop: "{{ trunk_interfaces }}"
          register: trunk_result

        - name: Report trunk port changes
          ansible.builtin.debug:
            msg: "{{ item.item.name }}: {{ 'updated' if item.changed else 'no change' }}"
          loop: "{{ trunk_result.results }}"

      rescue:
        - name: Alert on trunk port failure
          ansible.builtin.debug:
            msg: "Trunk port config failed on {{ inventory_hostname }}"

    - name: Gather VLAN state for post-change verification
      cisco.ios.ios_vlans:
        state: gathered
      register: vlans_gathered

    - name: Display active VLANs on device
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} active VLANs:
          {{ vlans_gathered.gathered | map(attribute='vlan_id') | list }}