---
# BGP Neighbor Configuration Playbook
# Configures iBGP and eBGP peers on Cisco IOS routers with timers,
# next-hop-self for iBGP, and neighbor change logging.
# Credentials: ansible-vault encrypted (group_vars/bgp_routers/vault.yml)
#
# Inventory example:
# [bgp_routers]
# core-rtr-01  ansible_host=10.0.0.1  bgp_asn=65001
# edge-rtr-01  ansible_host=10.0.0.3  bgp_asn=65001
#
# [bgp_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_ansible_user }}
# ansible_password={{ vault_ansible_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_ansible_enable_password }}

- name: Configure BGP Neighbors on Cisco IOS Routers
  hosts: bgp_routers
  gather_facts: false

  vars:
    bgp_timers_keepalive: 30
    bgp_timers_holdtime: 90
    bgp_neighbors:
      - peer_ip: "10.0.0.2"
        remote_asn: 65001
        description: "iBGP peer core-rtr-02"
        update_source: "Loopback0"
        next_hop_self: true
      - peer_ip: "203.0.113.1"
        remote_asn: 65100
        description: "eBGP ISP-A uplink"
        update_source: "GigabitEthernet0/0"
        next_hop_self: false

  tasks:
    - name: Capture pre-change BGP summary
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
      register: bgp_pre_state
      failed_when: false

    - name: Configure BGP neighbors
      block:
        - name: Apply neighbor base configuration
          cisco.ios.ios_config:
            lines:
              - "neighbor {{ item.peer_ip }} remote-as {{ item.remote_asn }}"
              - "neighbor {{ item.peer_ip }} description {{ item.description }}"
              - "neighbor {{ item.peer_ip }} update-source {{ item.update_source }}"
              - "neighbor {{ item.peer_ip }} timers {{ bgp_timers_keepalive }} {{ bgp_timers_holdtime }}"
            parents: "router bgp {{ bgp_asn }}"
          loop: "{{ bgp_neighbors }}"
          register: neighbor_config

        - name: Set next-hop-self on iBGP peers
          cisco.ios.ios_config:
            lines:
              - "neighbor {{ item.peer_ip }} next-hop-self"
            parents: "router bgp {{ bgp_asn }}"
          loop: "{{ bgp_neighbors }}"
          when: item.next_hop_self | bool

        - name: Enable BGP neighbor change logging
          cisco.ios.ios_config:
            lines:
              - "bgp log-neighbor-changes"
            parents: "router bgp {{ bgp_asn }}"

        - name: Save running configuration
          cisco.ios.ios_config:
            save_when: modified

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "BGP config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort with context
          ansible.builtin.fail:
            msg: "BGP neighbor config could not be applied to {{ inventory_hostname }}. Review device logs."

    - name: Poll until BGP neighbor state is readable
      cisco.ios.ios_command:
        commands:
          - "show ip bgp neighbors {{ item.peer_ip }} | include BGP state"
      register: bgp_verify
      retries: 6
      delay: 15
      until: bgp_verify.stdout[0] is defined
      loop: "{{ bgp_neighbors }}"

    - name: Display BGP neighbor verification results
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} - {{ item.item.peer_ip }}: {{ item.stdout[0] }}"
      loop: "{{ bgp_verify.results }}"
      loop_control:
        label: "{{ item.item.peer_ip }}