---
# VLAN and Layer 2 Interface Management
# Creates VLANs and configures access/trunk port assignments on Cisco IOS switches.
# Distinct from interface_management.yml (L3/routed) — this targets L2 switching.
#
# Inventory example:
#   [access_switches]
#   sw-core-01  ansible_host=10.0.1.11
#   sw-edge-01  ansible_host=10.0.1.21
#
#   [access_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}           # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}    # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Manage VLANs and Layer 2 port assignments
  hosts: access_switches
  gather_facts: false

  vars:
    vlans:
      - vlan_id: 10
        name: CORPORATE_USERS
      - vlan_id: 20
        name: SERVERS
      - vlan_id: 30
        name: MANAGEMENT
      - vlan_id: 40
        name: VOICE
      - vlan_id: 99
        name: NATIVE_UNTAGGED

    access_ports:
      - name: GigabitEthernet1/0/1
        vlan: 10
        description: "Corp user workstation"
      - name: GigabitEthernet1/0/2
        vlan: 40
        description: "IP Phone - voice VLAN"
      - name: GigabitEthernet1/0/48
        vlan: 20
        description: "App server NIC"

    trunk_uplinks:
      - name: GigabitEthernet1/0/24
        allowed_vlans: "10,20,30,40,99"
        description: "Uplink to distribution layer"

  tasks:
    - name: Create and name VLANs
      block:
        - name: Apply VLAN database entries
          cisco.ios.ios_vlans:
            config: "{{ vlans }}"
            state: merged
          register: vlan_config
          retries: 2
          delay: 5
          until: vlan_config is not failed

        - name: Show VLAN changes applied
          ansible.builtin.debug:
            msg: "{{ vlan_config.commands | default(['No VLAN changes needed']) }}"

      rescue:
        - name: Fail clearly on VLAN provisioning error
          ansible.builtin.fail:
            msg: "VLAN provisioning failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Assign access ports to VLANs
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: access
            access:
              vlan: "{{ item.vlan }}"
        state: merged
      loop: "{{ access_ports }}"
      register: access_config
      failed_when:
        - access_config.failed
        - "'not supported' not in (access_config.msg | default(''))"

    - name: Set access port descriptions
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
            enabled: true
        state: merged
      loop: "{{ access_ports }}"

    - name: Configure trunk uplink ports
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: trunk
            trunk:
              allowed_vlans: "{{ item.allowed_vlans }}"
              native_vlan: 99
        state: merged
      loop: "{{ trunk_uplinks }}"
      register: trunk_config
      retries: 2
      delay: 3
      until: trunk_config is not failed

    - name: Set trunk port descriptions
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
            enabled: true
        state: merged
      loop: "{{ trunk_uplinks }}"

    - name: Gather VLAN state for verification
      cisco.ios.ios_vlans:
        state: gathered
      register: vlan_state

    - name: Assert all required VLANs are active
      ansible.builtin.assert:
        that:
          - item.vlan_id in (vlan_state.gathered | map(attribute='vlan_id') | list)
        fail_msg: "VLAN {{ item.vlan_id }} ({{ item.name }}) missing on {{ inventory_hostname }}"
        success_msg: "VLAN {{ item.vlan_id }} confirmed present"
      loop: "{{ vlans }}"

    - name: Display final VLAN inventory
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} active VLANs:
          {{ vlan_state.gathered | map(attribute='vlan_id') | list | sort }}