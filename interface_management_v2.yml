---
# static_route_management.yml
#
# Deploys and verifies static IPv4 routes on Cisco IOS routers.
# Supports merged state (add/update without removing unlisted routes).
#
# Requirements: cisco.ios collection (ansible-galaxy collection install cisco.ios)
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}          # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}  # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }}
#
# Usage: ansible-playbook static_route_management.yml --ask-vault-pass

- name: Static route management on Cisco IOS routers
  hosts: core_routers
  gather_facts: false

  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_enable_pass }}"

    # Routes to install — adjust per environment
    static_routes:
      - vrf: default
        address_families:
          - afi: ipv4
            routes:
              - dest: 192.168.100.0/24
                next_hops:
                  - forward_router_address: 10.0.0.1
                    admin_distance: 1
                    description: spoke-site-a
              - dest: 192.168.200.0/24
                next_hops:
                  - forward_router_address: 10.0.0.1
                    interface: GigabitEthernet0/1
                    tag: 200
                    description: spoke-site-b

  tasks:
    - name: Deploy and verify static routes
      block:
        - name: Apply static routes (merged — existing unrelated routes preserved)
          cisco.ios.ios_static_routes:
            config: "{{ static_routes }}"
            state: merged
          register: route_deploy
          retries: 2
          delay: 5
          until: route_deploy is not failed

        - name: Retrieve static routing table
          cisco.ios.ios_command:
            commands:
              - show ip route static
              - show running-config | section ^ip route
          register: route_verify
          failed_when: >
            route_verify.stdout[0] is not defined or
            '192.168.100.0' not in route_verify.stdout[0]

        - name: Display deployment summary
          ansible.builtin.debug:
            msg:
              - "Host       : {{ inventory_hostname }}"
              - "Changed    : {{ route_deploy.changed }}"
              - "Static routes in RIB:"
              - "{{ route_verify.stdout_lines[0] }}"
              - "Running-config static entries:"
              - "{{ route_verify.stdout_lines[1] }}"

      rescue:
        - name: Capture diagnostic state after failure
          cisco.ios.ios_command:
            commands:
              - show ip route
              - show running-config | include ip route
          register: diag
          ignore_errors: true

        - name: Print diagnostics
          ansible.builtin.debug:
            msg:
              - "ERROR: static route deployment failed on {{ inventory_hostname }}"
              - "Reason : {{ ansible_failed_result.msg | default('see diag below') }}"
              - "RIB    : {{ diag.stdout_lines[0] | default([]) }}"
              - "Config : {{ diag.stdout_lines[1] | default([]) }}"

        - name: Abort with failure
          ansible.builtin.fail:
            msg: "Static route deployment failed on {{ inventory_hostname }}. Review diagnostic output above.