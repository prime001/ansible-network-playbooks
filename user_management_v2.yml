---
# AAA Centralized Authentication Configuration Playbook
# Configures TACACS+ and RADIUS server groups plus method lists on Cisco IOS/IOS-XE.
# Complements user_management.yml (local accounts) — this playbook handles
# centralized auth infrastructure (TACACS+/RADIUS), not local user CRUD.
#
# Vault reference: ansible-vault encrypt group_vars/network_devices/vault.yml
#   vault_tacacs_key: <shared secret>
#   vault_radius_key: <shared secret>
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.1.0.1
#   rtr-core-02  ansible_host=10.1.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user=netops
#   ansible_password=!vault | $ANSIBLE_VAULT;1.1;AES256 ...
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password=!vault | $ANSIBLE_VAULT;1.1;AES256 ...

- name: Configure AAA centralized authentication (TACACS+/RADIUS) on IOS devices
  hosts: network_devices
  gather_facts: false
  connection: network_cli

  vars:
    # Vault-encrypted — see group_vars/network_devices/vault.yml
    tacacs_key: "{{ vault_tacacs_key }}"
    radius_key: "{{ vault_radius_key }}"
    local_fallback: true

    tacacs_servers:
      - { name: tacacs-primary,   host: 10.0.100.10, port: 49, timeout: 5 }
      - { name: tacacs-secondary, host: 10.0.100.11, port: 49, timeout: 5 }

    radius_servers:
      - { name: radius-primary,   host: 10.0.100.20, auth_port: 1812, acct_port: 1813 }
      - { name: radius-secondary, host: 10.0.100.21, auth_port: 1812, acct_port: 1813 }

  tasks:
    - name: Deploy AAA server groups and method lists
      block:
        - name: Enable AAA new-model
          cisco.ios.ios_config:
            lines:
              - aaa new-model

        - name: Configure TACACS+ server entries
          cisco.ios.ios_config:
            lines:
              - "address ipv4 {{ item.host }}"
              - "port {{ item.port }}"
              - "key {{ tacacs_key }}"
              - "timeout {{ item.timeout }}"
            parents: "tacacs server {{ item.name }}"
          loop: "{{ tacacs_servers }}"
          register: tacacs_cfg
          retries: 2
          delay: 5
          until: tacacs_cfg is not failed

        - name: Add TACACS+ servers to named server group
          cisco.ios.ios_config:
            lines:
              - "server name {{ item.name }}"
            parents: aaa group server tacacs+ TACACS-GROUP
          loop: "{{ tacacs_servers }}"

        - name: Configure RADIUS server entries
          cisco.ios.ios_config:
            lines:
              - "address ipv4 {{ item.host }} auth-port {{ item.auth_port }} acct-port {{ item.acct_port }}"
              - "key {{ radius_key }}"
            parents: "radius server {{ item.name }}"
          loop: "{{ radius_servers }}"
          register: radius_cfg
          retries: 2
          delay: 5
          until: radius_cfg is not failed

        - name: Add RADIUS servers to named server group
          cisco.ios.ios_config:
            lines:
              - "server name {{ item.name }}"
            parents: aaa group server radius RADIUS-GROUP
          loop: "{{ radius_servers }}"

        - name: Apply authentication, authorization, and accounting method lists
          cisco.ios.ios_config:
            lines:
              - "aaa authentication login default group TACACS-GROUP{{ ' local' if local_fallback else '' }}"
              - aaa authentication enable default group TACACS-GROUP enable
              - "aaa authorization exec default group TACACS-GROUP{{ ' local' if local_fallback else '' }}"
              - aaa authorization commands 15 default group TACACS-GROUP local
              - aaa accounting exec default start-stop group TACACS-GROUP
              - aaa accounting commands 15 default start-stop group TACACS-GROUP
          register: aaa_method_result

      rescue:
        - name: Log failure details
          ansible.builtin.debug:
            msg: "AAA config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Halt with actionable message
          ansible.builtin.fail:
            msg: "AAA configuration incomplete on {{ inventory_hostname }} — manual review required"

    - name: Verify AAA new-model is present in running config
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^aaa
          - show tacacs
      register: aaa_verify
      failed_when: "'aaa new-model' not in aaa_verify.stdout[0]"

    - name: Display AAA configuration summary
      ansible.builtin.debug:
        msg:
          - "Device        : {{ inventory_hostname }}"
          - "AAA new-model : {{ 'active' if 'aaa new-model' in aaa_verify.stdout[0] else 'MISSING' }}"
          - "TACACS servers: {{ tacacs_servers | map(attribute='host') | list | join(', ') }}"
          - "RADIUS servers: {{ radius_servers | map(attribute='host') | list | join(', ') }}"
          - "Local fallback: {{ local_fallback }}"
          - "TACACS detail :"
          - "{{ aaa_verify.stdout[1] }}"
```