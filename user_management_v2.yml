---
# AAA (Authentication, Authorization, Accounting) Configuration
# Configures RADIUS and TACACS+ server groups, AAA method lists, and
# accounting policies on Cisco IOS/IOS-XE devices.
#
# Distinct from user_management.yml (local accounts) -- this playbook
# manages the AAA framework: server groups, method lists, and accounting.
#
# Credentials: ansible-vault encrypted group_vars/network/vault.yml
#   ansible_user: "{{ vault_network_user }}"
#   ansible_password: "{{ vault_network_password }}"
#   ansible_become_password: "{{ vault_enable_password }}"
#
# Inventory example:
# [network_devices]
# core-sw-01  ansible_host=10.0.0.1  ansible_network_os=ios
# dist-rtr-01 ansible_host=10.0.0.2  ansible_network_os=ios
#
# [network_devices:vars]
# ansible_connection=network_cli
# ansible_become=yes
# ansible_become_method=enable

- name: Configure AAA with RADIUS/TACACS+ on network devices
  hosts: network_devices
  gather_facts: false

  vars:
    # Override via group_vars or extra-vars; secrets via ansible-vault
    tacacs_servers:
      - host: "{{ vault_tacacs_primary | default('10.0.1.10') }}"
        key: "{{ vault_tacacs_key }}"
        timeout: 5
        priority: primary
      - host: "{{ vault_tacacs_secondary | default('10.0.1.11') }}"
        key: "{{ vault_tacacs_key }}"
        timeout: 5
        priority: secondary
    radius_servers:
      - host: "{{ vault_radius_primary | default('10.0.1.20') }}"
        auth_port: 1812
        acct_port: 1813
        key: "{{ vault_radius_key }}"
    aaa_local_fallback: true

  tasks:
    - name: Gather device facts for pre-change baseline
      cisco.ios.ios_facts:
        gather_subset:
          - config
      register: pre_facts

    - name: Apply AAA configuration
      block:
        - name: Configure TACACS+ server group
          cisco.ios.ios_config:
            lines:
              - "server-private {{ item.host }} key {{ item.key }}"
              - "timeout {{ item.timeout }}"
            parents: "aaa group server tacacs+ TACACS-SERVERS"
          loop: "{{ tacacs_servers }}"
          loop_control:
            label: "{{ item.priority }} TACACS+ {{ item.host }}"
          register: tacacs_result
          retries: 2
          delay: 5
          until: tacacs_result is not failed

        - name: Configure RADIUS server group
          cisco.ios.ios_config:
            lines:
              - "server-private {{ item.host }} auth-port {{ item.auth_port }} acct-port {{ item.acct_port }} key {{ item.key }}"
            parents: "aaa group server radius RADIUS-SERVERS"
          loop: "{{ radius_servers }}"
          loop_control:
            label: "RADIUS {{ item.host }}"
          register: radius_result

        - name: Enable AAA new-model and configure method lists
          cisco.ios.ios_config:
            lines:
              - aaa new-model
              - "aaa authentication login default group TACACS-SERVERS {{ 'local' if aaa_local_fallback else '' }}"
              - "aaa authentication enable default group TACACS-SERVERS enable"
              - "aaa authorization exec default group TACACS-SERVERS {{ 'local' if aaa_local_fallback else '' }}"
              - "aaa authorization commands 15 default group TACACS-SERVERS {{ 'local' if aaa_local_fallback else '' }}"
              - "aaa accounting exec default start-stop group TACACS-SERVERS"
              - "aaa accounting commands 15 default start-stop group TACACS-SERVERS"
              - "aaa accounting network default start-stop group RADIUS-SERVERS"

        - name: Save running configuration
          cisco.ios.ios_config:
            save_when: modified

      rescue:
        - name: Log AAA configuration failure
          ansible.builtin.debug:
            msg: "AAA configuration failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: >
              AAA config failed on {{ inventory_hostname }}.
              Verify TACACS/RADIUS server reachability and vault keys.
              Device retains previous AAA state -- no lockout risk.

    - name: Verify AAA server reachability via show output
      cisco.ios.ios_command:
        commands:
          - show aaa servers
          - show running-config | section ^aaa
      register: aaa_verify
      failed_when: "'% Invalid' in aaa_verify.stdout[0]"

    - name: Display AAA verification output
      ansible.builtin.debug:
        msg:
          - "=== AAA Servers on {{ inventory_hostname }} ==="
          - "{{ aaa_verify.stdout[0] }}"
          - "=== AAA Config Section ==="
          - "{{ aaa_verify.stdout[1] }}