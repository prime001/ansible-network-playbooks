---
# VLAN Management Playbook
# Configures and manages VLANs across Cisco IOS, IOS-XR, and NX-OS devices
#
# Inventory Example:
# all:
#   children:
#     network_devices:
#       children:
#         ios_devices:
#           hosts:
#             switch01:
#               ansible_host: 192.168.1.10
#               ansible_network_os: ios
#         nxos_devices:
#           hosts:
#             switch02:
#               ansible_host: 192.168.1.11
#               ansible_network_os: nxos
#
# Usage:
# ansible-playbook vlan_management.yml -i hosts.yml

- name: Manage VLANs across network infrastructure
  hosts: network_devices
  gather_facts: no
  connection: network_cli

  vars:
    # Device credentials - reference vault for production deployment
    # ansible_user: "{{ vault_device_username }}"
    # ansible_password: "{{ vault_device_password }}"
    
    vlans_to_create:
      - vlan_id: 10
        name: Management
      - vlan_id: 20
        name: Production
      - vlan_id: 30
        name: Development
      - vlan_id: 40
        name: Guest
    
    vlan_interfaces:
      - interface: GigabitEthernet0/0/1
        vlan_id: 10
      - interface: GigabitEthernet0/0/2
        vlan_id: 20
      - interface: GigabitEthernet0/0/3
        vlan_id: 30

  tasks:
    - name: Create VLANs on IOS devices
      cisco.ios.ios_vlan:
        vlan_id: "{{ item.vlan_id }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ vlans_to_create }}"
      register: ios_vlan_result
      retries: 3
      delay: 5
      until: ios_vlan_result is not failed
      when: ansible_network_os == 'ios'
      tags:
        - vlan_create

    - name: Create VLANs on NX-OS devices
      cisco.nxos.nxos_vlan:
        vlan_id: "{{ item.vlan_id }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ vlans_to_create }}"
      register: nxos_vlan_result
      retries: 3
      delay: 5
      until: nxos_vlan_result is not failed
      when: ansible_network_os == 'nxos'
      tags:
        - vlan_create

    - name: Assign VLANs to interfaces (IOS)
      cisco.ios.ios_l2_interface:
        name: "{{ item.interface }}"
        mode: access
        access_vlan: "{{ item.vlan_id }}"
        state: present
      loop: "{{ vlan_interfaces }}"
      register: ios_interface_result
      retries: 2
      delay: 3
      until: ios_interface_result is not failed
      when: ansible_network_os == 'ios'
      tags:
        - vlan_assign

    - name: Verify VLAN configuration on IOS
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_output
      failed_when: '"VLAN Name" not in vlan_output.stdout[0]'
      when: ansible_network_os == 'ios'
      tags:
        - verify

    - name: Verify VLAN configuration on NX-OS
      cisco.nxos.nxos_command:
        commands:
          - show vlan brief
      register: nxos_vlan_output
      failed_when: '"VLAN Name" not in nxos_vlan_output.stdout[0]'
      when: ansible_network_os == 'nxos'
      tags:
        - verify

    - name: Display VLAN configuration summary
      debug:
        msg: |
          VLAN Configuration Report - {{ inventory_hostname }}
          ====================================================
          Device OS: {{ ansible_network_os }}
          VLANs Configured: {{ vlans_to_create | length }}
          Interfaces Updated: {{ vlan_interfaces | length }}
          Status: Completed successfully
      tags:
        - report

  rescue:
    - name: Capture error details
      debug:
        msg: |
          VLAN configuration failed on {{ inventory_hostname }}
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}
          Device OS: {{ ansible_network_os }}

    - name: Attempt device recovery
      cisco.ios.ios_command:
        commands:
          - show interfaces status
      register: device_status
      ignore_errors: yes

    - name: Report device status
      debug:
        var: device_status.stdout_lines
      when: device_status is not skipped
