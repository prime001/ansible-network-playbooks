---
# ssh_key_auth.yml - SSH Public Key Authentication Management for Cisco IOS
#
# Configures SSH public key authentication (ip ssh pubkey-chain) for local users,
# enabling key-based SSH login. Distinct from user_management.yml which handles
# username/password/privilege-level provisioning.
#
# Usage: ansible-playbook ssh_key_auth.yml -i inventory/network.yml --ask-vault-pass
#
# Inventory example:
#   [ios_routers]
#   core-rtr-01  ansible_host=10.0.1.1
#   dist-rtr-01  ansible_host=10.0.1.2
#
#   [ios_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}             # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}      # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pw }}  # ansible-vault encrypted

- name: Manage SSH public key authentication on Cisco IOS devices
  hosts: ios_routers
  gather_facts: false

  vars:
    ssh_version: 2
    ssh_timeout: 60
    ssh_auth_retries: 3
    # Defined in group_vars/all/vault.yml (ansible-vault encrypted)
    # Structure: [{username: "netops", public_key: "ssh-rsa AAAA...xyz user@host"}, ...]
    ssh_key_users: "{{ vault_ssh_key_users | default([]) }}"

  tasks:
    - name: Harden SSH transport settings
      cisco.ios.ios_config:
        lines:
          - "ip ssh version {{ ssh_version }}"
          - "ip ssh time-out {{ ssh_timeout }}"
          - "ip ssh authentication-retries {{ ssh_auth_retries }}"
      register: ssh_base_cfg
      retries: 2
      delay: 5
      until: ssh_base_cfg is not failed

    - name: Gather current SSH and pubkey-chain state
      cisco.ios.ios_command:
        commands:
          - show ip ssh
          - show ip ssh pubkey-chain
      register: ssh_state
      failed_when: ssh_state.stdout | length == 0

    - name: Display current SSH state
      ansible.builtin.debug:
        msg: "{{ ssh_state.stdout_lines }}"

    - name: Configure RSA public keys per user
      block:
        - name: Push public key into pubkey-chain for each user
          cisco.ios.ios_config:
            lines:
              - key-string
              - "{{ item.public_key }}"
              - exit
            parents:
              - ip ssh pubkey-chain
              - "username {{ item.username }}"
          loop: "{{ ssh_key_users }}"
          loop_control:
            label: "{{ item.username }}"
          register: pubkey_cfg
          when: ssh_key_users | length > 0

      rescue:
        - name: Report pubkey configuration failure
          ansible.builtin.debug:
            msg: >
              SSH pubkey config failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Abort with actionable error
          ansible.builtin.fail:
            msg: >
              SSH pubkey-chain configuration failed on {{ inventory_hostname }}.
              Verify IOS version supports 'ip ssh pubkey-chain' (requires 15.1+).

    - name: Verify pubkey-chain reflects configured users
      cisco.ios.ios_command:
        commands:
          - show ip ssh pubkey-chain
      register: pubkey_verify
      retries: 2
      delay: 3
      until: pubkey_verify is not failed
      when: ssh_key_users | length > 0

    - name: Assert each user key appears in pubkey-chain output
      ansible.builtin.assert:
        that:
          - "item.username in pubkey_verify.stdout[0]"
        fail_msg: "Public key for '{{ item.username }}' not found in pubkey-chain on {{ inventory_hostname }}"
        success_msg: "Public key verified for '{{ item.username }}' on {{ inventory_hostname }}"
      loop: "{{ ssh_key_users }}"
      loop_control:
        label: "{{ item.username }}"
      when: ssh_key_users | length > 0

    - name: Show SSH key authentication summary
      ansible.builtin.debug:
        msg:
          - "Host            : {{ inventory_hostname }}"
          - "SSH hardening   : {{ 'changed' if ssh_base_cfg.changed else 'already compliant' }}"
          - "Key auth users  : {{ ssh_key_users | map(attribute='username') | list }}"
          - "SSH version     : {{ ssh_version }}