---
# =============================================================================
# Playbook: SSH Public Key Deployment & SSH Hardening
# Description: Deploys user SSH public keys for certificate-based auth and
#              enforces SSH hardening parameters (version, timeout, retries,
#              DH key size) on Cisco IOS/IOS-XE network devices.
#              Distinct from user_management.yml (password-based accounts) —
#              this playbook manages key-based authentication and SSH policy.
#
# Credentials: Loaded via ansible-vault
#   vault file: group_vars/all/vault.yml
#   ansible-vault encrypt_string '<secret>' --name 'vault_net_pass'
#
# Inventory Example:
#   [core_switches]
#   sw-core-01  ansible_host=10.10.10.1
#   sw-core-02  ansible_host=10.10.10.2
#
#   [core_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_pass }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }}
#
# Usage:
#   ansible-playbook ssh_pubkey_hardening.yml -i inventory/production \
#     --vault-password-file ~/.vault_pass -e "target_hosts=core_switches"
# =============================================================================

- name: SSH Public Key Deployment and Hardening
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false

  vars:
    ssh_version: 2
    ssh_timeout_seconds: 60
    ssh_auth_retries: 3
    ssh_dh_min_bits: 2048

    # Public keys per user — sensitive values should live in vault.yml
    ssh_pubkey_users:
      - username: netadmin
        pubkey: "{{ vault_netadmin_pubkey | default('REPLACE_WITH_VAULT_REF') }}"
        privilege: 15
      - username: netops
        pubkey: "{{ vault_netops_pubkey | default('REPLACE_WITH_VAULT_REF') }}"
        privilege: 7

  tasks:
    - name: Enforce SSH version and hardening parameters
      cisco.ios.ios_config:
        lines:
          - "ip ssh version {{ ssh_version }}"
          - "ip ssh time-out {{ ssh_timeout_seconds }}"
          - "ip ssh authentication-retries {{ ssh_auth_retries }}"
          - "ip ssh dh min size {{ ssh_dh_min_bits }}"
        save_when: changed
      register: ssh_hardening_result
      retries: 2
      delay: 5
      until: ssh_hardening_result is not failed

    - name: Deploy SSH public keys for managed users
      block:
        - name: Push public key for each user
          cisco.ios.ios_config:
            lines:
              - "username {{ item.username }} privilege {{ item.privilege }}"
              - "ip ssh pubkey-chain"
              - "  username {{ item.username }}"
              - "  key-string"
              - "  {{ item.pubkey }}"
              - "  exit"
              - "exit"
          loop: "{{ ssh_pubkey_users }}"
          loop_control:
            label: "{{ item.username }}"
          register: pubkey_result
          changed_when: pubkey_result.changed

      rescue:
        - name: Report public key push failure
          ansible.builtin.debug:
            msg: >
              Failed to push SSH public key on {{ inventory_hostname }}.
              Verify key format (RSA, single line) and IOS version >= 12.3(14)T.

        - name: Abort play for this host on key push failure
          ansible.builtin.fail:
            msg: "SSH pubkey deployment failed — halting to prevent partial state"

    - name: Collect SSH status for verification
      cisco.ios.ios_command:
        commands:
          - show ip ssh
      register: ssh_status_output
      retries: 2
      delay: 3
      until: ssh_status_output is not failed

    - name: Assert SSH version 2 is active
      ansible.builtin.assert:
        that:
          - "'version 2.0' in ssh_status_output.stdout[0]"
        fail_msg: "SSH version 2 not confirmed on {{ inventory_hostname }} — check IOS crypto key configuration"
        success_msg: "SSH version 2 confirmed on {{ inventory_hostname }}"

    - name: Display full SSH status
      ansible.builtin.debug:
        var: ssh_status_output.stdout_lines[0]

    - name: Summarize changes applied
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }}: hardening={{ ssh_hardening_result.changed }},
          pubkeys_configured={{ ssh_pubkey_users | map(attribute='username') | list }}