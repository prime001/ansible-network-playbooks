---
# AAA Configuration Playbook
# Configures TACACS+/RADIUS authentication, authorization, and accounting
# on Cisco IOS/IOS-XE devices. Complements local user_management playbooks
# by wiring devices into centralized auth infrastructure.
#
# Credentials: store in Ansible Vault
#   ansible-vault encrypt_string 'secretkey' --name 'vault_tacacs_key'
#   ansible-vault encrypt_string 'admin' --name 'vault_ansible_user'
#
# Inventory example:
#   [core_switches]
#   sw-core-01 ansible_host=10.0.1.1
#   sw-core-02 ansible_host=10.0.1.2
#
#   [core_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_ansible_user }}
#   ansible_password={{ vault_ansible_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure AAA (TACACS+) authentication and accounting on IOS devices
  hosts: core_switches
  gather_facts: false

  vars:
    tacacs_servers:
      - name: TACACS-PRIMARY
        host: 10.0.100.10
        port: 49
        timeout: 5
      - name: TACACS-SECONDARY
        host: 10.0.100.11
        port: 49
        timeout: 5
    tacacs_key: "{{ vault_tacacs_key }}"       # ansible-vault encrypted
    tacacs_source_interface: Loopback0
    aaa_fallback_method: local
    accounting_group: TACACS-GROUP

  tasks:
    - name: Provision TACACS+ servers and AAA policy
      block:
        - name: Define TACACS+ server entries
          cisco.ios.ios_config:
            lines:
              - "tacacs server {{ item.name }}"
              - " address ipv4 {{ item.host }} port {{ item.port }}"
              - " key {{ tacacs_key }}"
              - " timeout {{ item.timeout }}"
          loop: "{{ tacacs_servers }}"
          register: tacacs_server_result
          retries: 2
          delay: 5
          until: tacacs_server_result is not failed

        - name: Create TACACS+ server group
          cisco.ios.ios_config:
            lines:
              - "aaa group server tacacs+ {{ accounting_group }}"
              - " server name {{ item.name }}"
              - " ip tacacs source-interface {{ tacacs_source_interface }}"
          loop: "{{ tacacs_servers }}"

        - name: Apply AAA authentication, authorization, and accounting policies
          cisco.ios.ios_config:
            lines:
              - "aaa new-model"
              - "aaa authentication login default group {{ accounting_group }} {{ aaa_fallback_method }}"
              - "aaa authentication enable default group {{ accounting_group }} enable"
              - "aaa authorization exec default group {{ accounting_group }} {{ aaa_fallback_method }} if-authenticated"
              - "aaa authorization commands 15 default group {{ accounting_group }} {{ aaa_fallback_method }}"
              - "aaa accounting exec default start-stop group {{ accounting_group }}"
              - "aaa accounting commands 15 default start-stop group {{ accounting_group }}"
              - "aaa accounting system default start-stop group {{ accounting_group }}"

      rescue:
        - name: Report AAA provisioning failure
          ansible.builtin.debug:
            msg: "FAILED on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Halt play for this host
          ansible.builtin.fail:
            msg: "AAA configuration failed on {{ inventory_hostname }}. Leaving existing config intact."

    - name: Verify TACACS+ server connectivity
      cisco.ios.ios_command:
        commands:
          - show tacacs
          - show aaa servers
      register: aaa_status
      failed_when: >
        'ERROR' in (aaa_status.stdout[0] | upper) or
        aaa_status.stdout[0] == ''

    - name: Display AAA server status summary
      ansible.builtin.debug:
        msg:
          - "Host      : {{ inventory_hostname }}"
          - "TACACS    : {{ aaa_status.stdout[0] | regex_findall('Server.*') | join(', ') }}"
          - "AAA State : {{ aaa_status.stdout[1] | regex_findall('.*requests.*') | join(', ') }}"

    - name: Save running configuration
      cisco.ios.ios_config:
        save_when: modified