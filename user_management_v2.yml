---
# aaa_tacacs_config.yml
# Configures TACACS+ AAA authentication, authorization, and accounting on Cisco IOS.
# Distinct from user_management.yml (local users) — this manages centralized auth
# via TACACS+ with a local emergency fallback account for out-of-band recovery.
#
# Credentials via Ansible Vault:
#   ansible-vault create group_vars/network/vault.yml
#   Required vault vars: vault_ansible_user, vault_ansible_password,
#                        vault_enable_password, vault_tacacs_key,
#                        vault_emergency_password
#
# Inventory example (inventory/hosts.yml):
# all:
#   children:
#     network:
#       hosts:
#         core-sw1:
#           ansible_host: 10.0.1.1
#         dist-sw1:
#           ansible_host: 10.0.1.10
#       vars:
#         ansible_network_os: ios
#         ansible_user: "{{ vault_ansible_user }}"
#         ansible_password: "{{ vault_ansible_password }}"
#         ansible_become: true
#         ansible_become_method: enable
#         ansible_become_password: "{{ vault_enable_password }}"

- name: Configure TACACS+ AAA authentication and accounting on Cisco IOS
  hosts: network
  gather_facts: false
  vars:
    tacacs_primary_host: "10.0.0.10"
    tacacs_backup_host: "10.0.0.11"
    tacacs_timeout: 5
    local_fallback_user: "netops-recovery"
    local_fallback_privilege: 15

  tasks:
    - name: Verify device reachability before making changes
      cisco.ios.ios_command:
        commands: "show version"
      register: version_output
      retries: 3
      delay: 5
      until: version_output is not failed

    - name: Deploy TACACS+ AAA configuration
      block:
        - name: Enable AAA new-model
          cisco.ios.ios_config:
            lines:
              - aaa new-model

        - name: Configure primary TACACS+ server
          cisco.ios.ios_config:
            parents: "tacacs server TACACS-PRIMARY"
            lines:
              - "address ipv4 {{ tacacs_primary_host }}"
              - "key 0 {{ vault_tacacs_key }}"
              - "timeout {{ tacacs_timeout }}"
          no_log: true

        - name: Configure backup TACACS+ server
          cisco.ios.ios_config:
            parents: "tacacs server TACACS-BACKUP"
            lines:
              - "address ipv4 {{ tacacs_backup_host }}"
              - "key 0 {{ vault_tacacs_key }}"
              - "timeout {{ tacacs_timeout }}"
          no_log: true

        - name: Create TACACS+ server group
          cisco.ios.ios_config:
            parents: "aaa group server tacacs+ TACACS-GROUP"
            lines:
              - "server name TACACS-PRIMARY"
              - "server name TACACS-BACKUP"

        - name: Configure AAA authentication and authorization with local fallback
          cisco.ios.ios_config:
            lines:
              - "aaa authentication login default group TACACS-GROUP local"
              - "aaa authentication enable default group TACACS-GROUP enable"
              - "aaa authorization exec default group TACACS-GROUP local if-authenticated"
              - "aaa authorization commands 15 default group TACACS-GROUP local if-authenticated"
              - "aaa accounting exec default start-stop group TACACS-GROUP"
              - "aaa accounting commands 15 default start-stop group TACACS-GROUP"

        - name: Ensure local emergency recovery account exists
          cisco.ios.ios_config:
            lines:
              - "username {{ local_fallback_user }} privilege {{ local_fallback_privilege }} algorithm-type scrypt secret {{ vault_emergency_password }}"
          no_log: true

        - name: Save configuration to NVRAM
          cisco.ios.ios_config:
            save_when: modified

      rescue:
        - name: Report failure with context
          ansible.builtin.debug:
            msg: "AAA deployment failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('check task output above') }}"

        - name: Fail with remediation guidance
          ansible.builtin.fail:
            msg: >
              TACACS+ AAA configuration failed on {{ inventory_hostname }}.
              Verify: TACACS+ servers reachable, vault vars populated, device in enable mode.

    - name: Collect AAA and TACACS+ operational status
      cisco.ios.ios_command:
        commands:
          - show aaa servers
          - show tacacs
          - show running-config | section aaa
      register: aaa_status
      failed_when: false

    - name: Display AAA operational status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} AAA status:\n{{ aaa_status.stdout | join('\n---\n') }}