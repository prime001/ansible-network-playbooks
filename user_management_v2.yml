---
# AAA / RADIUS-TACACS+ Server Configuration Playbook
# Configures external authentication servers, AAA groups, and method lists.
# Complements local user_management.yml by adding centralized AAA integration.
#
# Credentials stored in Ansible Vault — see group_vars/network/vault.yml
# Encrypt secrets: ansible-vault encrypt_string --vault-id network@vault_pass
#
# Inventory example:
# [cisco_ios]
# rtr-core-01 ansible_host=10.0.1.1
# rtr-core-02 ansible_host=10.0.1.2
#
# [cisco_ios:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_ansible_user }}
# ansible_password={{ vault_ansible_password }}
# ansible_become=true
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Configure AAA RADIUS/TACACS+ Authentication
  hosts: cisco_ios
  gather_facts: false

  vars:
    tacacs_server_ip: "{{ vault_tacacs_host }}"
    tacacs_key: "{{ vault_tacacs_key }}"
    radius_server_ip: "{{ vault_radius_host }}"
    radius_key: "{{ vault_radius_key }}"
    aaa_tacacs_group: "CORP-TACACS"
    aaa_radius_group: "CORP-RADIUS"
    aaa_method_list: "CORP-AUTH"

  tasks:
    - name: Configure TACACS+ and RADIUS servers
      block:
        - name: Define TACACS+ server object
          cisco.ios.ios_config:
            lines:
              - "tacacs server CORP-TACACS-01"
              - " address ipv4 {{ tacacs_server_ip }}"
              - " key {{ tacacs_key }}"
              - " timeout 5"
          register: tacacs_cfg
          retries: 3
          delay: 5
          until: tacacs_cfg is not failed

        - name: Define RADIUS server object
          cisco.ios.ios_config:
            lines:
              - "radius server CORP-RADIUS-01"
              - " address ipv4 {{ radius_server_ip }} auth-port 1812 acct-port 1813"
              - " key {{ radius_key }}"
              - " timeout 5"
              - " retransmit 2"

        - name: Configure AAA server groups
          cisco.ios.ios_config:
            lines:
              - "aaa group server tacacs+ {{ aaa_tacacs_group }}"
              - " server name CORP-TACACS-01"
              - "aaa group server radius {{ aaa_radius_group }}"
              - " server name CORP-RADIUS-01"

        - name: Enable AAA new-model and configure method lists
          cisco.ios.ios_config:
            lines:
              - "aaa new-model"
              - "aaa authentication login {{ aaa_method_list }} group {{ aaa_tacacs_group }} group {{ aaa_radius_group }} local"
              - "aaa authorization exec {{ aaa_method_list }} group {{ aaa_tacacs_group }} local if-authenticated"
              - "aaa accounting exec default start-stop group {{ aaa_tacacs_group }}"
              - "aaa accounting commands 15 default start-stop group {{ aaa_tacacs_group }}"
            match: line

        - name: Apply AAA method list to VTY and console lines
          cisco.ios.ios_config:
            parents: "{{ item }}"
            lines:
              - "login authentication {{ aaa_method_list }}"
              - "authorization exec {{ aaa_method_list }}"
          loop:
            - "line vty 0 15"
            - "line con 0"

      rescue:
        - name: Report failure details
          ansible.builtin.debug:
            msg: >
              AAA configuration failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }}: AAA config failed — verify server reachability and vault credentials"

    - name: Verify AAA servers appear in running config
      cisco.ios.ios_command:
        commands:
          - "show run | section ^aaa"
          - "show aaa servers"
          - "show tacacs"
      register: aaa_verify
      failed_when: >
        aaa_method_list not in aaa_verify.stdout[0] or
        'aaa new-model' not in aaa_verify.stdout[0]

    - name: Display AAA configuration summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "AAA method list applied: {{ aaa_method_list }}"
          - "TACACS group: {{ aaa_tacacs_group }}"
          - "RADIUS group: {{ aaa_radius_group }}"
          - "Server reachability: {{ aaa_verify.stdout[1] | truncate(200) }}"

    - name: Save configuration if changed
      cisco.ios.ios_config:
        save_when: changed