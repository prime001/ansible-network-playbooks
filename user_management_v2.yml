---
# aaa_config.yml
# Configures centralized AAA with TACACS+ for network device authentication,
# authorization, and accounting. Distinct from user_management.yml (local accounts).
#
# Inventory example:
#   [network_devices]
#   router01  ansible_host=10.0.1.1  ansible_network_os=ios
#   router02  ansible_host=10.0.1.2  ansible_network_os=ios
#   switch01  ansible_host=10.0.1.10 ansible_network_os=ios
#
#   [network_devices:vars]
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#
# Vault: ansible-vault encrypt_string '<value>' --name 'vault_tacacs_key'

- name: Configure AAA and TACACS+ centralized authentication
  hosts: network_devices
  gather_facts: false

  vars:
    tacacs_primary_ip: "{{ vault_tacacs_primary_ip }}"
    tacacs_secondary_ip: "{{ vault_tacacs_secondary_ip }}"
    tacacs_shared_key: "{{ vault_tacacs_key }}"
    tacacs_timeout: 5
    local_admin_user: "{{ vault_local_admin_user }}"
    local_admin_pass: "{{ vault_local_admin_pass }}"

  tasks:
    - name: Configure TACACS+ servers, AAA policies, and accounting
      block:
        - name: Define primary TACACS+ server
          cisco.ios.ios_config:
            lines:
              - "address ipv4 {{ tacacs_primary_ip }}"
              - "key {{ tacacs_shared_key }}"
              - "timeout {{ tacacs_timeout }}"
            parents: "tacacs server TACACS-PRIMARY"
            match: line

        - name: Define secondary TACACS+ server
          cisco.ios.ios_config:
            lines:
              - "address ipv4 {{ tacacs_secondary_ip }}"
              - "key {{ tacacs_shared_key }}"
              - "timeout {{ tacacs_timeout }}"
            parents: "tacacs server TACACS-SECONDARY"
            match: line

        - name: Create TACACS+ server group
          cisco.ios.ios_config:
            lines:
              - "server name TACACS-PRIMARY"
              - "server name TACACS-SECONDARY"
            parents: "aaa group server tacacs+ TACACS-GROUP"
            match: line

        - name: Enable AAA and apply authentication and authorization policies
          cisco.ios.ios_config:
            lines:
              - aaa new-model
              - "aaa authentication login default group TACACS-GROUP local"
              - "aaa authentication enable default group TACACS-GROUP enable"
              - "aaa authorization exec default group TACACS-GROUP local if-authenticated"
              - "aaa authorization commands 15 default group TACACS-GROUP local if-authenticated"
              - "aaa accounting exec default start-stop group TACACS-GROUP"
              - "aaa accounting commands 15 default start-stop group TACACS-GROUP"
            match: line

        - name: Ensure local fallback admin account exists
          cisco.ios.ios_config:
            lines:
              - "username {{ local_admin_user }} privilege 15 algorithm-type scrypt secret {{ local_admin_pass }}"
            match: line

        - name: Verify TACACS+ server reachability
          cisco.ios.ios_command:
            commands:
              - show aaa servers
              - show tacacs
          register: aaa_status
          retries: 2
          delay: 5
          until: aaa_status is not failed

        - name: Display TACACS+ server reachability status
          ansible.builtin.debug:
            var: aaa_status.stdout_lines

      rescue:
        - name: Report AAA configuration failure
          ansible.builtin.debug:
            msg: >
              AAA configuration failed on {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Abort with remediation guidance
          ansible.builtin.fail:
            msg: >
              Manual AAA remediation required on {{ inventory_hostname }}.
              Verify TACACS+ server connectivity and shared key, then re-run.