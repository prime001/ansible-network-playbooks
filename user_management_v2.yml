---
# aaa_config.yml
# Configures AAA (Authentication, Authorization, Accounting) using RADIUS/TACACS+
# with local fallback — distinct from local user management (user_management_v2.yml).
#
# Inventory example:
#   [network_devices]
#   router1 ansible_host=192.168.1.1 ansible_network_os=ios
#   switch1 ansible_host=192.168.1.2 ansible_network_os=ios
#
#   [network_devices:vars]
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#   # Credentials stored in: group_vars/network_devices/vault.yml (ansible-vault encrypted)

- name: Configure AAA with RADIUS/TACACS+ and local fallback
  hosts: network_devices
  gather_facts: false
  connection: network_cli

  vars:
    tacacs_server_host: "{{ vault_tacacs_host }}"
    tacacs_server_key: "{{ vault_tacacs_key }}"
    radius_server_host: "{{ vault_radius_host }}"
    radius_server_key: "{{ vault_radius_key }}"
    aaa_timeout: 5
    aaa_retransmit: 2

  tasks:
    - name: Apply AAA configuration
      block:
        - name: Configure TACACS+ server
          cisco.ios.ios_config:
            lines:
              - "tacacs server TACACS-PRIMARY"
              - " address ipv4 {{ tacacs_server_host }}"
              - " key {{ tacacs_server_key }}"
              - " timeout {{ aaa_timeout }}"
          register: tacacs_result

        - name: Configure RADIUS server
          cisco.ios.ios_config:
            lines:
              - "radius server RADIUS-PRIMARY"
              - " address ipv4 {{ radius_server_host }} auth-port 1812 acct-port 1813"
              - " key {{ radius_server_key }}"
              - " timeout {{ aaa_timeout }}"
              - " retransmit {{ aaa_retransmit }}"
          register: radius_result

        - name: Configure AAA server groups
          cisco.ios.ios_config:
            lines:
              - "aaa group server tacacs+ TACACS-GROUP"
              - " server name TACACS-PRIMARY"
              - "aaa group server radius RADIUS-GROUP"
              - " server name RADIUS-PRIMARY"

        - name: Configure AAA authentication and authorization policies
          cisco.ios.ios_config:
            lines:
              - "aaa new-model"
              - "aaa authentication login default group TACACS-GROUP local"
              - "aaa authentication enable default group TACACS-GROUP enable"
              - "aaa authorization exec default group TACACS-GROUP local if-authenticated"
              - "aaa authorization commands 15 default group TACACS-GROUP local if-authenticated"
              - "aaa accounting exec default start-stop group TACACS-GROUP"
              - "aaa accounting commands 15 default start-stop group TACACS-GROUP"
          register: aaa_policy_result

        - name: Verify AAA servers are reachable
          cisco.ios.ios_command:
            commands:
              - "show aaa servers"
              - "show tacacs"
          register: aaa_status
          retries: 2
          delay: 3
          failed_when:
            - aaa_status.stdout[0] is not defined

        - name: Display AAA server status
          ansible.builtin.debug:
            msg: "{{ aaa_status.stdout_lines }}"

      rescue:
        - name: Log AAA configuration failure
          ansible.builtin.debug:
            msg: "AAA configuration failed on {{ inventory_hostname }}. Manual review required."

        - name: Preserve local authentication fallback
          cisco.ios.ios_config:
            lines:
              - "aaa authentication login default local"
              - "aaa authentication enable default enable"
          ignore_errors: true

        - name: Fail with context
          ansible.builtin.fail:
            msg: "AAA config failed on {{ inventory_hostname }}. Local auth fallback applied.