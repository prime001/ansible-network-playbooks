```yaml
---
# aaa_config.yml
# Configures AAA (Authentication, Authorization, Accounting) on Cisco IOS devices.
# Sets up TACACS+ server groups, authentication, authorization, and accounting policies
# for centralized identity management — companion to local user_management playbooks.
#
# Credentials: store the following in Ansible Vault (ansible-vault encrypt vault.yml):
#   vault_ansible_user, vault_ansible_password, vault_ansible_become_pass,
#   vault_tacacs_key
#
# Inventory example:
#   [core_switches]
#   sw-core-01  ansible_host=10.10.1.1
#   sw-core-02  ansible_host=10.10.1.2
#
#   [core_switches:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable

- name: Configure AAA centralized authentication on IOS devices
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  vars:
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"
    ansible_become_pass: "{{ vault_ansible_become_pass }}"
    tacacs_primary: "{{ vault_tacacs_primary | default('10.0.100.10') }}"
    tacacs_secondary: "{{ vault_tacacs_secondary | default('10.0.100.11') }}"
    tacacs_key: "{{ vault_tacacs_key }}"
    tacacs_timeout: 5

  tasks:
    - name: Confirm device is reachable before modifying authentication
      cisco.ios.ios_command:
        commands:
          - show clock
      register: reachability_check
      retries: 3
      delay: 5
      until: reachability_check is not failed

    - name: Apply AAA configuration
      block:
        - name: Configure TACACS+ servers and AAA policies
          cisco.ios.ios_config:
            lines:
              - "tacacs server TACACS-PRIMARY"
              - " address ipv4 {{ tacacs_primary }}"
              - " key {{ tacacs_key }}"
              - " timeout {{ tacacs_timeout }}"
              - "tacacs server TACACS-SECONDARY"
              - " address ipv4 {{ tacacs_secondary }}"
              - " key {{ tacacs_key }}"
              - " timeout {{ tacacs_timeout }}"
              - "aaa group server tacacs+ TACACS-SERVERS"
              - " server name TACACS-PRIMARY"
              - " server name TACACS-SECONDARY"
              - "aaa authentication login default group TACACS-SERVERS local"
              - "aaa authentication enable default group TACACS-SERVERS enable"
              - "aaa authorization exec default group TACACS-SERVERS local if-authenticated"
              - "aaa authorization commands 15 default group TACACS-SERVERS local if-authenticated"
              - "aaa accounting exec default start-stop group TACACS-SERVERS"
              - "aaa accounting commands 15 default start-stop group TACACS-SERVERS"
          register: aaa_config_result
          notify: Save running config

        - name: Validate TACACS+ server reachability
          cisco.ios.ios_command:
            commands:
              - show tacacs
          register: tacacs_status
          failed_when: >
            tacacs_primary not in tacacs_status.stdout[0] and
            tacacs_secondary not in tacacs_status.stdout[0]

        - name: Display TACACS+ server status
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} TACACS+ state: {{ tacacs_status.stdout_lines[0] }}"

      rescue:
        - name: Report AAA configuration failure
          ansible.builtin.debug:
            msg: >
              AAA config failed on {{ inventory_hostname }}.
              Local fallback remains active via 'local' keyword in auth lines.
              Failure: {{ ansible_failed_result.msg | default('see task output') }}

        - name: Abort play with actionable message
          ansible.builtin.fail:
            msg: "AAA configuration failed on {{ inventory_hostname }} — verify TACACS+ reachability and vault_tacacs_key"

    - name: Collect AAA running config for audit record
      cisco.ios.ios_command:
        commands:
          - show running-config | section aaa
          - show running-config | section tacacs
      register: aaa_audit
      retries: 2
      delay: 3
      until: aaa_audit is not failed

    - name: Display final AAA configuration state
      ansible.builtin.debug:
        var: aaa_audit.stdout_lines

  handlers:
    - name: Save running config
      cisco.ios.ios_command:
        commands:
          - write memory
      register: save_output
      failed_when:
        - "'OK' not in save_output.stdout[0]"
        - "'Building configuration' not in save_output.stdout[0]"
```