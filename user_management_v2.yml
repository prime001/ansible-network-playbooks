---
# Network Device Local User Audit and Remediation
# Audits existing local accounts, identifies unauthorized users, and optionally removes them.
# Complements user_management.yml (provisioning) with active account hygiene enforcement.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.10.1.1
#   rtr-core-02 ansible_host=10.10.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_secret }}
#
# Vault usage: ansible-vault encrypt_string 'mysecret' --name 'vault_net_password'

- name: Audit and remediate local user accounts on IOS devices
  hosts: core_routers
  gather_facts: false

  vars:
    # Vault-encrypted credentials — store in vars/vault.yml, never plaintext
    net_username: "{{ vault_net_username }}"
    net_password: "{{ vault_net_password }}"
    enable_secret: "{{ vault_enable_secret }}"

    # Authoritative list of permitted local usernames
    authorized_users:
      - netadmin
      - noc_ro
      - backup_svc

    # Dry-run by default; set true to actually remove unauthorized accounts
    enforce_removal: false

  tasks:
    - name: Collect local user configuration
      block:
        - name: Pull username lines from running config
          cisco.ios.ios_command:
            commands:
              - show running-config | include ^username
          register: raw_user_output
          retries: 3
          delay: 5
          until: raw_user_output is not failed

        - name: Parse current usernames into a list
          set_fact:
            discovered_users: >-
              {{ raw_user_output.stdout[0]
                 | regex_findall('username (\S+)')
                 | list }}

        - name: Derive unauthorized and missing accounts
          set_fact:
            unauthorized_users: "{{ discovered_users | difference(authorized_users) }}"
            missing_users: "{{ authorized_users | difference(discovered_users) }}"

        - name: Display audit summary
          debug:
            msg:
              - "Device           : {{ inventory_hostname }}"
              - "Authorized found : {{ discovered_users | intersect(authorized_users) | join(', ') | default('none') }}"
              - "Unauthorized     : {{ unauthorized_users | join(', ') | default('none') }}"
              - "Missing expected : {{ missing_users | join(', ') | default('none') }}"

        - name: Warn when unauthorized users found and enforce is off
          debug:
            msg: >-
              AUDIT WARNING — {{ unauthorized_users | length }} unauthorized account(s) on
              {{ inventory_hostname }}. Re-run with -e enforce_removal=true to remove.
          when:
            - not (enforce_removal | bool)
            - unauthorized_users | length > 0

        - name: Remove unauthorized local accounts
          cisco.ios.ios_user:
            name: "{{ item }}"
            state: absent
          loop: "{{ unauthorized_users }}"
          when:
            - enforce_removal | bool
            - unauthorized_users | length > 0
          register: removal_results

        - name: Confirm removals
          debug:
            msg: "Removed '{{ item.item }}' from {{ inventory_hostname }}"
          loop: "{{ removal_results.results | default([]) }}"
          when:
            - enforce_removal | bool
            - item.changed | default(false)

      rescue:
        - name: Report task failure context
          debug:
            msg: >-
              Audit failed on {{ inventory_hostname }}:
              {{ ansible_failed_task.name }} — {{ ansible_failed_result.msg | default('no detail') }}

        - name: Abort with actionable message
          fail:
            msg: >-
              User audit incomplete for {{ inventory_hostname }}.
              Verify SSH reachability, credentials, and enable privilege level.