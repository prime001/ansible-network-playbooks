```yaml
---
- name: Deploy SSH Public Key Authentication on Network Devices
  hosts: network_devices
  gather_facts: no
  vars:
    ssh_users:
      - name: automation
        privilege_level: 15
      - name: monitor
        privilege_level: 5
    ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAA..."
    # SSH public key should be stored in vault: ansible-vault encrypt_string

  # INVENTORY EXAMPLE:
  # [network_devices]
  # router1 ansible_host=192.168.1.1 ansible_network_os=ios
  # router2 ansible_host=192.168.1.2 ansible_network_os=iosxr
  # [all:vars]
  # ansible_connection=network_cli
  # ansible_user={{ vault_network_username }}
  # ansible_password={{ vault_network_password }}

  tasks:
    - name: Validate SSH public key format
      assert:
        that:
          - ssh_public_key is defined
          - ssh_public_key.startswith('ssh-rsa') or ssh_public_key.startswith('ssh-ed25519')
        fail_msg: "Invalid SSH public key format - must start with 'ssh-rsa' or 'ssh-ed25519'"
      run_once: yes

    - name: Configure SSH users on Cisco IOS devices
      ios_config:
        lines:
          - "username {{ item.name }} privilege {{ item.privilege_level }}"
          - "username {{ item.name }} secret 9 {{ vault_device_secret }}"
        provider: "{{ ansible_network_provider }}"
      loop: "{{ ssh_users }}"
      when: ansible_network_os == 'ios'
      register: ios_result
      retries: 2
      delay: 5
      until: ios_result is not failed

    - name: Configure SSH users on Cisco IOS-XR devices
      iosxr_config:
        lines:
          - "username {{ item.name }}"
          - "group root-lr"
          - "secret {{ vault_device_secret }}"
        match: none
      loop: "{{ ssh_users }}"
      when: ansible_network_os == 'iosxr'
      register: iosxr_result
      retries: 2
      delay: 5
      until: iosxr_result is not failed

    - name: Verify SSH user configuration
      cli_command:
        command: "show running-config | include username"
      register: ssh_verify
      failed_when: ssh_verify.stdout == ""
      retries: 3
      delay: 2

    - name: Display SSH configuration status
      debug:
        msg: |
          ========================================
          SSH User Configuration Summary
          ========================================
          Device: {{ inventory_hostname }}
          Platform: {{ ansible_network_os }}
          Users Configured: {{ ssh_users | map(attribute='name') | join(', ') }}
          Privilege Levels: {{ ssh_users | map(attribute='privilege_level') | join(', ') }}
          Status: SUCCESS

    - name: Backup running configuration
      cli_command:
        command: "show running-config"
      register: device_config

    - name: Save configuration backup locally
      copy:
        content: "{{ device_config.stdout }}"
        dest: "backups/{{ inventory_hostname }}_ssh_auth_{{ ansible_date_time.date }}.cfg"
      delegate_to: localhost

  rescue:
    - name: Log SSH configuration failure
      debug:
        msg: |
          SSH configuration failed on {{ inventory_hostname }}
          Platform: {{ ansible_network_os }}
          Error details available in logs
      failed: yes
```