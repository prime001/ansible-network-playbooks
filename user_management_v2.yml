---
# Ansible Playbook: Network Device User Privilege Audit and Enforcement
# Purpose: Audit existing local user accounts, enforce privilege levels, and remove
#          unauthorized accounts across IOS, NX-OS, and JunOS platforms.
#
# This complements basic user creation (003/013_user_management.yml) by adding
# drift detection, privilege enforcement, and orphaned account cleanup.
#
# Inventory example:
# [ios_routers]
# rtr-core-01 ansible_host=10.0.1.1
# rtr-core-02 ansible_host=10.0.1.2
#
# [nxos_switches]
# sw-core-01 ansible_host=10.0.2.1
#
# [network:children]
# ios_routers
# nxos_switches
#
# Group vars (vars/vault.yml — encrypt with ansible-vault):
# vault_net_username: admin
# vault_net_password: <encrypted>
# vault_net_enable:   <encrypted>
#
# Run: ansible-playbook 023_user_privilege_audit.yml -i inventory.yml --ask-vault-pass

- name: Network User Privilege Audit and Enforcement
  hosts: network
  gather_facts: false
  connection: network_cli

  vars:
    # Credentials — reference ansible-vault encrypted vars/vault.yml
    ansible_user: "{{ vault_net_username }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_net_enable }}"

    # Define the authoritative list of permitted local accounts and their privilege levels
    authorized_users:
      - { name: admin,    privilege: 15 }
      - { name: netops,   privilege: 10 }
      - { name: readonly, privilege: 1  }

    authorized_usernames: "{{ authorized_users | map(attribute='name') | list }}"

  tasks:

    - name: Collect current local user table (IOS/IOS-XE)
      cisco.ios.ios_command:
        commands: show running-config | section ^username
      register: ios_user_output
      when: ansible_network_os == "ios"
      retries: 2
      delay: 5
      failed_when: ios_user_output.failed is defined and ios_user_output.failed

    - name: Collect current local user table (NX-OS)
      cisco.nxos.nxos_command:
        commands: show running-config | section ^username
      register: nxos_user_output
      when: ansible_network_os == "nxos"
      retries: 2
      delay: 5

    - name: Display raw user config (IOS)
      ansible.builtin.debug:
        var: ios_user_output.stdout_lines
      when:
        - ansible_network_os == "ios"
        - ios_user_output is defined

    - name: Enforce authorized privilege levels (IOS/IOS-XE)
      block:
        - name: Apply privilege level for each authorized user
          cisco.ios.ios_user:
            name: "{{ item.name }}"
            privilege: "{{ item.privilege }}"
            state: present
            update_password: on_create
          loop: "{{ authorized_users }}"
          loop_control:
            label: "{{ item.name }} priv={{ item.privilege }}"
          register: user_enforce_result
          notify: Save IOS config

      rescue:
        - name: Log privilege enforcement failure
          ansible.builtin.debug:
            msg: "FAILED to enforce user privileges on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Enforce authorized roles (NX-OS)
      block:
        - name: Apply network-operator role for read-only user (NX-OS)
          cisco.nxos.nxos_user:
            name: "{{ item.name }}"
            role: "{{ 'network-admin' if item.privilege == 15 else 'network-operator' }}"
            state: present
            update_password: on_create
          loop: "{{ authorized_users }}"
          loop_control:
            label: "{{ item.name }}"
          when: ansible_network_os == "nxos"
          register: nxos_user_result
          notify: Save NX-OS config

      rescue:
        - name: Log NX-OS role enforcement failure
          ansible.builtin.debug:
            msg: "FAILED to enforce NX-OS roles on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Audit summary — flag any non-authorized user lines detected
      ansible.builtin.debug:
        msg: >-
          WARNING: Potential unauthorized account detected on {{ inventory_hostname }}.
          Review output manually — automated removal skipped for safety.
          Raw output: {{ ios_user_output.stdout | default(nxos_user_output.stdout | default('')) }}
      when: >-
        (ios_user_output.stdout | default('') | regex_search('username (?!' + authorized_usernames | join('|') + ')\\S+')) or
        (nxos_user_output.stdout | default('') | regex_search('username (?!' + authorized_usernames | join('|') + ')\\S+'))
      changed_when: false

  handlers:
    - name: Save IOS config
      cisco.ios.ios_command:
        commands: write memory
      listen: Save IOS config

    - name: Save NX-OS config
      cisco.nxos.nxos_command:
        commands: copy running-config startup-config
      listen: Save NX-OS config