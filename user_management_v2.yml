---
# AAA and TACACS+ Configuration Playbook
# Configures centralized authentication via TACACS+, local fallback,
# login security hardening, and command accounting on Cisco IOS/IOS-XE.
#
# Credentials (store in Ansible Vault — group_vars/network/vault.yml):
#   ansible_user:             "{{ vault_net_user }}"
#   ansible_password:         "{{ vault_net_password }}"
#   ansible_become_password:  "{{ vault_enable_password }}"
#   tacacs_key:               "{{ vault_tacacs_key }}"
#
# Inventory example:
#   [routers]
#   rtr-core-01 ansible_host=10.0.0.1
#   rtr-core-02 ansible_host=10.0.0.2
#   [switches]
#   sw-dist-01  ansible_host=10.0.1.1
#   [network:children]
#   routers
#   switches
#   [network:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable

- name: Configure AAA and TACACS+ centralized authentication on Cisco IOS
  hosts: network
  gather_facts: false
  vars:
    tacacs_servers:
      - name: TACACS-PRIMARY
        host: 10.0.100.10
        timeout: 5
      - name: TACACS-SECONDARY
        host: 10.0.100.11
        timeout: 5
    tacacs_source_interface: Loopback0
    login_retry_limit: 3
    login_quiet_mode_seconds: 60
    exec_timeout_minutes: 10
    min_password_length: 12

  tasks:
    - name: Verify device is reachable and capture IOS version
      ios_command:
        commands:
          - show version | include ^Cisco IOS
      register: device_version
      retries: 3
      delay: 5
      until: not device_version.failed

    - name: Display target device version
      debug:
        msg: "{{ inventory_hostname }}: {{ device_version.stdout[0] | default('version unknown') }}"

    - name: Apply TACACS+ server definitions, AAA model, and accounting
      block:
        - name: Define TACACS+ servers and server group
          ios_config:
            lines:
              - "tacacs server {{ item.name }}"
              - " address ipv4 {{ item.host }}"
              - " key {{ tacacs_key }}"
              - " timeout {{ item.timeout }}"
          loop: "{{ tacacs_servers }}"
          register: tacacs_server_result

        - name: Configure AAA server group and authentication policies
          ios_config:
            lines:
              - "aaa group server tacacs+ TACACS-GROUP"
              - " server name TACACS-PRIMARY"
              - " server name TACACS-SECONDARY"
              - " ip tacacs source-interface {{ tacacs_source_interface }}"
              - "aaa new-model"
              - "aaa authentication login default group TACACS-GROUP local"
              - "aaa authentication enable default group TACACS-GROUP enable"
              - "aaa authorization exec default group TACACS-GROUP local if-authenticated"
              - "aaa authorization commands 15 default group TACACS-GROUP local if-authenticated"
              - "aaa accounting exec default start-stop group TACACS-GROUP"
              - "aaa accounting commands 15 default start-stop group TACACS-GROUP"
            save_when: changed
          register: aaa_policy_result

        - name: Configure login security hardening and password policy
          ios_config:
            lines:
              - "login block-for {{ login_quiet_mode_seconds }} attempts {{ login_retry_limit }} within 30"
              - "login on-failure log"
              - "login on-success log"
              - "security passwords min-length {{ min_password_length }}"
              - "service password-encryption"
            save_when: changed

        - name: Set exec timeout on console and VTY lines
          ios_config:
            lines:
              - "exec-timeout {{ exec_timeout_minutes }} 0"
            parents: "{{ item }}"
            save_when: changed
          loop:
            - line con 0
            - line vty 0 4
            - line vty 5 15

      rescue:
        - name: Log configuration failure details
          debug:
            msg: "AAA config FAILED on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('see above') }}"

        - name: Abort with descriptive error
          fail:
            msg: "Halting — AAA configuration error on {{ inventory_hostname }}. Verify TACACS+ reachability and vault key."

    - name: Validate AAA configuration is present in running config
      ios_command:
        commands:
          - show running-config | section ^aaa
          - show aaa servers
      register: aaa_validation
      failed_when: "'TACACS-GROUP' not in aaa_validation.stdout[0]"

    - name: Report AAA server connectivity status
      debug:
        msg: "{{ inventory_hostname }} AAA servers:\n{{ aaa_validation.stdout[1] }}