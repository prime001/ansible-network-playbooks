---
- name: VLAN Management and Configuration
  description: |
    Configures and manages VLANs across Cisco IOS, IOS-XE, and NX-OS network devices.
    Includes VLAN creation, validation, and reporting with comprehensive error handling.
    Suitable for enterprise network operations requiring standardized VLAN deployment.
  hosts: network_devices
  gather_facts: no

  vars:
    # Credentials - store in Ansible Vault
    # ansible-vault encrypt group_vars/all/vault.yml
    # then reference via: vault_device_user, vault_device_password, vault_enable_password
    device_username: "{{ vault_device_user | default('admin') }}"
    device_password: "{{ vault_device_password }}"
    enable_password: "{{ vault_enable_password | default('') }}"

  tasks:
    - name: Validate VLAN configuration input
      assert:
        that:
          - vlan_list is defined
          - vlan_list | length > 0
        fail_msg: "VLAN list must be defined with at least one VLAN"
        success_msg: "VLAN configuration validated successfully"
      tags: [validate, always]

    - name: Gather current VLAN configuration
      network.cli.cli_command:
        commands: "show vlan brief"
      register: current_vlan_config
      retries: 2
      delay: 5
      tags: [gather, always]

    - name: Configure VLANs on device
      block:
        - name: Create and configure VLANs
          network.cli.cli_config:
            config: |
              {% for vlan in vlan_list %}
              vlan {{ vlan.vlan_id }}
                name {{ vlan.vlan_name }}
                {% if vlan.description is defined %}description {{ vlan.description }}{% endif %}
              {% endfor %}
          register: vlan_configuration
          tags: [config]

        - name: Save running configuration to startup
          network.cli.cli_command:
            commands: "write memory"
          register: config_saved
          failed_when: "'OK' not in config_saved.stdout[0] and '[OK]' not in config_saved.stdout[0]"
          tags: [config]

      rescue:
        - name: Handle configuration failure
          debug:
            msg: "VLAN configuration failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('Unknown error') }}"
          tags: [error]

        - name: Attempt to reload configuration from backup
          network.cli.cli_command:
            commands: "copy startup-config running-config"
          ignore_errors: yes
          tags: [error, recovery]

    - name: Verify VLAN configuration
      block:
        - name: Retrieve updated VLAN configuration
          network.cli.cli_command:
            commands: "show vlan brief"
          register: updated_vlan_config
          retries: 2
          delay: 3
          tags: [verify]

        - name: Validate each VLAN exists
          assert:
            that:
              - "item.vlan_id | string in updated_vlan_config.stdout[0]"
            fail_msg: "VLAN {{ item.vlan_id }} ({{ item.vlan_name }}) not found in configuration"
            success_msg: "VLAN {{ item.vlan_id }} verified"
          loop: "{{ vlan_list }}"
          tags: [verify]

      rescue:
        - name: Verification check failed
          debug:
            msg: "VLAN verification failed - some VLANs may not be configured correctly"
          tags: [verify]

    - name: Generate and display configuration report
      debug:
        msg:
          - "========================================="
          - "VLAN Configuration Report"
          - "========================================="
          - "Device: {{ inventory_hostname }}"
          - "Status: {{ 'SUCCESS' if vlan_configuration is changed else 'NO CHANGES' }}"
          - "VLANs Processed: {{ vlan_list | length }}"
          - "Configuration Saved: {{ 'Yes' if config_saved is changed else 'No' }}"
          - "========================================="
      tags: [always, report]

# INVENTORY EXAMPLE (place in inventory/hosts.yml or hosts.ini):
# [network_devices]
# switch-core-1 ansible_host=10.0.1.10 device_type=ios
# switch-core-2 ansible_host=10.0.1.11 device_type=iosxe
# switch-access-1 ansible_host=10.0.1.20 device_type=ios
# switch-access-2 ansible_host=10.0.1.21 device_type=nxos
#
# [network_devices:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_become=yes
# ansible_become_method=enable
#
# USAGE:
# ansible-playbook vlan_management.yml \
#   -i inventory/hosts.yml \
#   -e "vlan_list=[{vlan_id: 100, vlan_name: Management}, {vlan_id: 200, vlan_name: Users, description: User VLAN}]" \
#   --vault-password-file ~/.vault_pass