---
# Inventory example:
# [cisco_ios]
# rtr-core-01 ansible_host=10.0.1.1
# rtr-core-02 ansible_host=10.0.1.2
#
# [cisco_ios:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_ssh_user }}         # stored in ansible-vault
# ansible_password={{ vault_ssh_password }} # stored in ansible-vault
# ansible_become=true
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Deploy SSH public keys for local user accounts on IOS devices
  hosts: cisco_ios
  gather_facts: false
  vars:
    ansible_user: "{{ vault_ssh_user }}"
    ansible_password: "{{ vault_ssh_password }}"
    # SSH RSA public keys per service account — values from ansible-vault
    # Generate with: ssh-keygen -t rsa -b 4096 -f ~/.ssh/netops_rsa
    ssh_key_accounts:
      - username: netops-svc
        privilege: 15
        sshkey: "{{ vault_netops_rsa_pubkey }}"
      - username: readonly-auditor
        privilege: 5
        sshkey: "{{ vault_auditor_rsa_pubkey }}"

  tasks:
    - name: Confirm SSH service is enabled before key deployment
      cisco.ios.ios_command:
        commands: show ip ssh
      register: ssh_check
      retries: 3
      delay: 10
      until: ssh_check is not failed
      failed_when: "'SSH Enabled' not in ssh_check.stdout[0]"
      changed_when: false

    - name: Deploy RSA public keys to local user accounts
      block:
        - name: Apply SSH public key per service account
          cisco.ios.ios_user:
            name: "{{ item.username }}"
            privilege: "{{ item.privilege }}"
            sshkey: "{{ item.sshkey }}"
            state: present
          loop: "{{ ssh_key_accounts }}"
          loop_control:
            label: "{{ item.username }} (priv {{ item.privilege }})"
          register: key_push_results

        - name: Verify keys appear in running config
          cisco.ios.ios_command:
            commands: "show running-config | section username {{ item.username }}"
          register: key_verify
          loop: "{{ ssh_key_accounts }}"
          loop_control:
            label: "{{ item.username }}"
          changed_when: false
          failed_when: item.username not in key_verify.stdout[0]

        - name: Report per-account deployment outcome
          ansible.builtin.debug:
            msg: >-
              {{ item.item.username }}: {{ 'key updated' if item.changed else 'key already current' }}
          loop: "{{ key_push_results.results }}"
          loop_control:
            label: "{{ item.item.username }}"

      rescue:
        - name: Report failed device
          ansible.builtin.debug:
            msg: "SSH key deployment FAILED on {{ inventory_hostname }} — check SSH version (must be v2) and AAA config."

        - name: Abort with detail
          ansible.builtin.fail:
            msg: >-
              Key deployment aborted on {{ inventory_hostname }}.
              Ensure 'ip ssh version 2' and 'aaa new-model' are configured.

    - name: Audit all local users with SSH keys present
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^username
          - show ip ssh
      register: post_audit
      changed_when: false

    - name: Display post-deployment user and SSH summary
      ansible.builtin.debug:
        msg:
          - "=== Local Users ({{ inventory_hostname }}) ==="
          - "{{ post_audit.stdout_lines[0] }}"
          - "=== SSH Status ==="
          - "{{ post_audit.stdout_lines[1] }}