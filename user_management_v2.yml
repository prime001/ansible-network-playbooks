---
# AAA Authentication and TACACS+ Server Group Configuration
# Manages AAA new-model, TACACS+ server groups, authentication/authorization/
# accounting policies, and validates server reachability with local fallback.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#
# Secrets: group_vars/core_routers/vault.yml (ansible-vault encrypted)
# Encrypt: ansible-vault encrypt_string 'value' --name 'vault_var_name'

- name: Configure AAA new-model with TACACS+ server groups and local fallback
  hosts: core_routers
  gather_facts: false
  vars:
    # All vault_ vars sourced from ansible-vault encrypted group_vars
    tacacs_group_name: TACACS-PROD
    tacacs_source_interface: Loopback0
    tacacs_servers:
      - name: TACACS-PRIMARY
        host: "{{ vault_tacacs_primary_ip }}"
        key: "{{ vault_tacacs_key }}"
        timeout: 5
      - name: TACACS-SECONDARY
        host: "{{ vault_tacacs_secondary_ip }}"
        key: "{{ vault_tacacs_key }}"
        timeout: 5

  tasks:
    - name: Verify device is reachable before making changes
      cisco.ios.ios_command:
        commands: show clock
      register: reachability_check
      retries: 3
      delay: 10
      until: reachability_check is not failed

    - name: Apply TACACS+ server definitions and AAA group
      block:
        - name: Define TACACS+ servers
          cisco.ios.ios_config:
            lines:
              - "tacacs server {{ item.name }}"
              - " address ipv4 {{ item.host }}"
              - " key {{ item.key }}"
              - " timeout {{ item.timeout }}"
          loop: "{{ tacacs_servers }}"
          loop_control:
            label: "{{ item.name }}"
          register: tacacs_server_result
          notify: Write memory

        - name: Configure TACACS+ server group with source interface
          cisco.ios.ios_config:
            lines:
              - "server name {{ item.name }}"
              - "ip tacacs source-interface {{ tacacs_source_interface }}"
            parents: "aaa group server tacacs+ {{ tacacs_group_name }}"
          loop: "{{ tacacs_servers }}"
          loop_control:
            label: "{{ item.name }}"
          notify: Write memory

        - name: Enable aaa new-model and apply authentication policies
          cisco.ios.ios_config:
            lines:
              - aaa new-model
              - "aaa authentication login default group {{ tacacs_group_name }} local"
              - "aaa authentication enable default group {{ tacacs_group_name }} enable"
              - "aaa authorization exec default group {{ tacacs_group_name }} local if-authenticated"
              - "aaa authorization commands 15 default group {{ tacacs_group_name }} local"
              - "aaa accounting exec default start-stop group {{ tacacs_group_name }}"
              - "aaa accounting commands 15 default start-stop group {{ tacacs_group_name }}"
          register: aaa_policy_result
          notify: Write memory

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: >
              AAA configuration failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see stdout') }}

        - name: Abort with actionable error
          ansible.builtin.fail:
            msg: "AAA rollback required on {{ inventory_hostname }} — verify TACACS+ reachability and key before retrying"

    - name: Test TACACS+ group reachability from device
      cisco.ios.ios_command:
        commands:
          - "test aaa group {{ tacacs_group_name }} {{ vault_net_user }} {{ vault_net_password }} legacy"
      register: aaa_test_result
      failed_when: >
        'successfully' not in (aaa_test_result.stdout[0] | lower) and
        'pass' not in (aaa_test_result.stdout[0] | lower)
      ignore_errors: true

    - name: Collect post-change AAA and TACACS+ state for audit
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^aaa
          - show tacacs
      register: aaa_audit

    - name: Display AAA configuration audit output
      ansible.builtin.debug:
        msg:
          - "=== AAA CONFIG: {{ inventory_hostname }} ==="
          - "{{ aaa_audit.stdout_lines[0] }}"
          - "=== TACACS+ STATUS ==="
          - "{{ aaa_audit.stdout_lines[1] }}"
          - "=== SERVER TEST RESULT ==="
          - "{{ aaa_test_result.stdout[0] | default('test skipped or failed') }}"

  handlers:
    - name: Write memory
      cisco.ios.ios_command:
        commands:
          - command: write memory
            prompt: '\[confirm\]'
            answer: "\r"
      register: save_output
      failed_when: >
        'OK' not in (save_output.stdout[0] | default('')) and
        'Building' not in (save_output.stdout[0] | default(''))