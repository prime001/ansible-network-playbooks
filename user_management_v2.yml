---
# ospf_config.yml
# Configures OSPF routing protocol on Cisco IOS routers.
# Handles process setup, router-id, network advertisements, and neighbor verification.
#
# Credentials must be stored in Ansible Vault:
#   ansible_user: "{{ vault_net_user }}"
#   ansible_password: "{{ vault_net_password }}"
#   ansible_become_password: "{{ vault_enable_password }}"
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1 ospf_router_id=1.1.1.1
#   rtr-core-02 ansible_host=10.0.1.2 ospf_router_id=2.2.2.2
#
#   [core_routers:vars]
#   ospf_process_id=1
#   ospf_area=0
#   ansible_network_os=ios
#   ansible_connection=network_cli

- name: Configure OSPF Routing Protocol on Cisco IOS Devices
  hosts: core_routers
  gather_facts: false

  vars:
    ospf_process_id: "{{ ospf_process_id | default(1) }}"
    ospf_area: "{{ ospf_area | default(0) }}"
    ospf_reference_bandwidth: 10000
    ospf_networks:
      - network: 10.0.0.0
        wildcard: 0.0.255.255
        area: "{{ ospf_area }}"
    ospf_passive_interfaces:
      - Loopback0

  tasks:
    - name: Capture pre-change routing state
      cisco.ios.ios_command:
        commands:
          - show ip protocols
          - show ip route summary
      register: pre_state
      retries: 2
      delay: 5

    - name: Display pre-change routing state
      ansible.builtin.debug:
        msg: "{{ pre_state.stdout_lines }}"

    - name: Apply OSPF configuration
      block:
        - name: Configure OSPF process, router-id, and reference bandwidth
          cisco.ios.ios_config:
            lines:
              - "router ospf {{ ospf_process_id }}"
              - " router-id {{ ospf_router_id }}"
              - " auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
              - " passive-interface default"
            save_when: changed

        - name: Activate OSPF on configured networks
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "network {{ item.network }} {{ item.wildcard }} area {{ item.area }}"
            save_when: changed
          loop: "{{ ospf_networks }}"

        - name: Selectively enable non-passive interfaces
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "no passive-interface {{ item }}"
            save_when: changed
          loop: "{{ ospf_active_interfaces | default([]) }}"
          when: ospf_active_interfaces is defined

        - name: Set passive interfaces explicitly
          cisco.ios.ios_config:
            parents: "router ospf {{ ospf_process_id }}"
            lines:
              - "passive-interface {{ item }}"
            save_when: changed
          loop: "{{ ospf_passive_interfaces }}"

      rescue:
        - name: Report OSPF configuration failure
          ansible.builtin.debug:
            msg: "OSPF config failed on {{ inventory_hostname }} — check privilege level and connectivity."

        - name: Abort play on configuration error
          ansible.builtin.fail:
            msg: "Halting: OSPF configuration error on {{ inventory_hostname }}"

    - name: Wait for OSPF adjacencies to form
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip ospf
      register: ospf_state
      retries: 4
      delay: 15
      failed_when:
        - ospf_state.stdout[1] is defined
        - "'Routing Process' not in ospf_state.stdout[1]"

    - name: Display OSPF neighbor and process state
      ansible.builtin.debug:
        msg: "{{ ospf_state.stdout_lines }}"

    - name: Verify OSPF routes present in routing table
      cisco.ios.ios_command:
        commands:
          - show ip route ospf
      register: ospf_routes
      failed_when:
        - ospf_routes.stdout[0] | length == 0
        - inventory_hostname not in groups['ospf_seed_routers'] | default([])

    - name: Display OSPF-learned routes
      ansible.builtin.debug:
        msg: "{{ ospf_routes.stdout_lines }}