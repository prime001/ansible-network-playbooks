---
# aaa_config.yml
# Configures AAA authentication/authorization using TACACS+ on Cisco IOS devices.
# Distinct from user_management.yml (local accounts) — this manages centralized
# auth-server policy, method lists, accounting, and VTY login binding.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.0.1
#   rtr-core-02 ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure AAA centralized authentication and accounting (TACACS+)
  hosts: core_routers
  gather_facts: false

  vars:
    # All sensitive values come from Ansible Vault — see group_vars/all/vault.yml
    tacacs_primary_ip: "{{ vault_tacacs_primary_ip }}"
    tacacs_secondary_ip: "{{ vault_tacacs_secondary_ip }}"
    tacacs_key: "{{ vault_tacacs_key }}"
    aaa_method_list: "NETOPS"

  tasks:
    - name: Check device reachability and capture IOS version
      cisco.ios.ios_command:
        commands:
          - show version | include IOS Software
      register: ios_version
      retries: 3
      delay: 5
      until: not ios_version.failed
      failed_when: ios_version.stdout[0] == ""

    - name: Display target device info
      ansible.builtin.debug:
        msg: "Configuring AAA on {{ inventory_hostname }} — {{ ios_version.stdout[0] }}"

    - name: Apply TACACS+ server definitions and AAA policy
      block:
        - name: Configure TACACS+ servers
          cisco.ios.ios_config:
            lines:
              - "tacacs server TACACS-PRIMARY"
              - " address ipv4 {{ tacacs_primary_ip }}"
              - " key {{ tacacs_key }}"
              - " timeout 3"
              - "tacacs server TACACS-SECONDARY"
              - " address ipv4 {{ tacacs_secondary_ip }}"
              - " key {{ tacacs_key }}"
              - " timeout 3"
            save_when: modified
          register: tacacs_server_result

        - name: Enable AAA and configure method lists
          cisco.ios.ios_config:
            lines:
              - "aaa new-model"
              - "aaa authentication login {{ aaa_method_list }} group tacacs+ local"
              - "aaa authorization exec {{ aaa_method_list }} group tacacs+ local if-authenticated"
              - "aaa authorization commands 15 {{ aaa_method_list }} group tacacs+ local"
              - "aaa accounting exec default start-stop group tacacs+"
              - "aaa accounting commands 15 default start-stop group tacacs+"
              - "line vty 0 15"
              - " login authentication {{ aaa_method_list }}"
              - " authorization commands 15 {{ aaa_method_list }}"
            save_when: modified
          register: aaa_policy_result

        - name: Verify TACACS+ server connectivity
          cisco.ios.ios_command:
            commands:
              - show tacacs
          register: tacacs_status
          failed_when: "'No TACACS' in tacacs_status.stdout[0]"

      rescue:
        - name: Log failure details
          ansible.builtin.debug:
            msg: >
              AAA config failed on {{ inventory_hostname }}.
              Verify TACACS+ servers are reachable before applying.
              Error: {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Revert VTY lines to local auth fallback
          cisco.ios.ios_config:
            lines:
              - "line vty 0 15"
              - " login local"

        - name: Raise failure so pipeline reports the error
          ansible.builtin.fail:
            msg: "AAA configuration failed on {{ inventory_hostname }} — reverted VTY to local auth."

    - name: Capture AAA and TACACS sections for audit
      cisco.ios.ios_command:
        commands:
          - show running-config | section aaa
          - show running-config | section tacacs
          - show tacacs
      register: aaa_audit

    - name: Display post-change AAA summary
      ansible.builtin.debug:
        var: aaa_audit.stdout_lines