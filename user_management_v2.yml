```yaml
---
- name: Configure SSH Key-Based Authentication and User Access Control
  hosts: network_devices
  gather_facts: no
  vars:
    # Vault reference: ansible-vault encrypt_string --vault-password-file ~/.vault_pass
    device_username: "{{ vault_device_username | default('admin') }}"
    device_password: "{{ vault_device_password }}"
    enable_password: "{{ vault_enable_password }}"
    
    # SSH key and user access configuration
    authorized_ssh_keys:
      - name: "netadmin_prod"
        key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQDxx... netadmin@company.com"
        privilege_level: 15
      - name: "netops_readonly"
        key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQDyy... netops@company.com"
        privilege_level: 5
    
    session_logging:
      enabled: true
      buffer_size: 1000
      archive_path: "flash:session_logs"

  tasks:
    - name: Configure SSH server parameters
      ios_config:
        lines:
          - "ip ssh version 2"
          - "ip ssh authentication retries 2"
          - "ip ssh time-out 60"
          - "ip ssh pubkey-chain"
        after:
          - "exit"
      vars:
        ansible_connection: network_cli
        ansible_network_os: ios
      register: ssh_config_result
      retries: 3
      delay: 5
      until: ssh_config_result is succeeded
      tags: ssh_config
      rescue:
        - name: Log SSH configuration error
          debug:
            msg: "SSH configuration failed on {{ inventory_hostname }}: {{ ssh_config_result.msg }}"
          tags: ssh_config

    - name: Deploy authorized SSH public keys for users
      ios_config:
        lines:
          - "username {{ item.name }}"
          - "privilege level {{ item.privilege_level }}"
          - "pubkey-chain"
          - "key-string"
          - "{{ item.key }}"
          - "quit"
          - "quit"
          - "exit"
        before:
          - "no username {{ item.name }}"
      loop: "{{ authorized_ssh_keys }}"
      vars:
        ansible_connection: network_cli
        ansible_network_os: ios
      register: pubkey_deploy_result
      retries: 3
      delay: 5
      until: pubkey_deploy_result is succeeded
      tags: pubkey_deploy
      rescue:
        - name: Handle key deployment failure
          debug:
            msg: "Public key deployment failed for user {{ item.name }}"
          tags: pubkey_deploy

    - name: Configure session logging for user activity audit
      ios_config:
        lines:
          - "logging buffered {{ session_logging.buffer_size }}"
          - "logging userinfo"
          - "logging console informational"
          - "logging monitor informational"
        match: line
      vars:
        ansible_connection: network_cli
        ansible_network_os: ios
      register: logging_config_result
      retries: 2
      delay: 5
      until: logging_config_result is succeeded
      when: session_logging.enabled
      tags: logging

    - name: Verify SSH key installation
      ios_command:
        commands:
          - "show ip ssh"
          - "show username"
      vars:
        ansible_connection: network_cli
        ansible_network_os: ios
      register: ssh_verify_result
      failed_when: "'SSH Enabled' not in ssh_verify_result.stdout[0]"
      tags: verify
      rescue:
        - name: Log SSH verification failure
          debug:
            msg: "SSH verification failed on {{ inventory_hostname }}"

    - name: Display user access configuration summary
      debug:
        msg: |
          User Access Configuration Summary - {{ inventory_hostname }}
          ============================================================
          SSH Version 2: Enabled
          Configured Users: {{ authorized_ssh_keys | length }}
          {% for user in authorized_ssh_keys %}
          - {{ user.name }}: Privilege Level {{ user.privilege_level }}
          {% endfor %}
          Session Logging: {{ 'Enabled' if session_logging.enabled else 'Disabled' }}
          Buffer Size: {{ session_logging.buffer_size }} bytes
          SSH Status: {{ 'Operational' if ssh_verify_result is succeeded else 'FAILED' }}
      tags: summary

  # Inventory Example:
  # [network_devices]
  # router1.lab ansible_host=192.168.1.10 ansible_user=admin
  # router2.lab ansible_host=192.168.1.11 ansible_user=admin
  # switch1.lab ansible_host=192.168.1.20 ansible_user=admin
  #
  # [network_devices:vars]
  # ansible_network_os=ios
  # ansible_connection=network_cli
  # ansible_become=yes
  # ansible_become_method=enable
  # ansible_python_interpreter=/usr/bin/python3
```