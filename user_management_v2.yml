---
# AAA Authentication and TACACS+/RADIUS Server Configuration
# Centralized user authentication, authorization, and accounting
# for enterprise network device access control and compliance logging.
#
# Supports: Cisco IOS, IOS-XR, NX-OS, Junos platforms
# Use Cases: Enterprise AAA integration, compliance audit trails,
#           centralized user management, privilege authorization
#
# Inventory Example:
# [network_devices]
# router1 ansible_host=10.1.1.1 device_type=ios
# switch1 ansible_host=10.1.1.2 device_type=nxos
# [group_vars/network_devices.yml]:
#   tacacs_key: !vault |encrypted_tacacs_secret
#   radius_key: !vault |encrypted_radius_secret

- name: Configure AAA Servers and User Authentication
  hosts: network_devices
  gather_facts: no
  
  vars:
    tacacs_servers:
      - host: 10.100.1.10
        port: 49
      - host: 10.100.1.11
        port: 49
    radius_servers:
      - host: 10.100.2.10
        port: 1812
      - host: 10.100.2.11
        port: 1812
    enable_accounting: true
    timeout_seconds: 5

  tasks:
    - name: Configure TACACS+ servers
      ios_config:
        lines:
          - "tacacs-server host {{ item.host }} port {{ item.port }} key {{ tacacs_key }}"
          - "tacacs-server timeout {{ timeout_seconds }}"
        parents: ""
        match: line
      loop: "{{ tacacs_servers }}"
      register: tacacs_result
      retries: 2
      delay: 5
      failed_when:
        - tacacs_result is failed
        - "'invalid' not in tacacs_result.msg | lower"
      rescue:
        - name: Log TACACS+ configuration failure
          debug:
            msg: "TACACS+ server config failed for {{ item.host }}: {{ tacacs_result.msg }}"

    - name: Configure RADIUS servers
      ios_config:
        lines:
          - "radius-server host {{ item.host }} auth-port {{ item.port }} key {{ radius_key }}"
          - "radius-server timeout {{ timeout_seconds }}"
        parents: ""
        match: line
      loop: "{{ radius_servers }}"
      register: radius_result
      retries: 2
      delay: 5
      failed_when:
        - radius_result is failed
        - "'invalid' not in radius_result.msg | lower"
      rescue:
        - name: Log RADIUS configuration failure
          debug:
            msg: "RADIUS server config failed for {{ item.host }}: {{ radius_result.msg }}"

    - name: Configure AAA authentication
      ios_config:
        lines:
          - "aaa new-model"
          - "aaa authentication login default group tacacs+ group radius local"
          - "aaa authentication enable default group tacacs+ enable"
        parents: ""
        match: exact
      register: aaa_auth
      retries: 2
      delay: 5
      rescue:
        - name: Log AAA authentication configuration failure
          debug:
            msg: "AAA authentication config failed: {{ aaa_auth.msg }}"

    - name: Configure AAA authorization
      ios_config:
        lines:
          - "aaa authorization exec default group tacacs+ local"
          - "aaa authorization commands 1 default group tacacs+ local"
          - "aaa authorization commands 15 default group tacacs+ local"
        parents: ""
        match: exact
      register: aaa_authz
      retries: 2
      delay: 5
      rescue:
        - name: Log AAA authorization configuration failure
          debug:
            msg: "AAA authorization config failed: {{ aaa_authz.msg }}"

    - name: Configure AAA accounting
      ios_config:
        lines:
          - "aaa accounting exec default start-stop group tacacs+ local"
          - "aaa accounting commands 1 default start-stop group tacacs+ local"
          - "aaa accounting commands 15 default start-stop group tacacs+ local"
        parents: ""
        match: exact
      when: enable_accounting | bool
      register: aaa_acct
      retries: 2
      delay: 5
      rescue:
        - name: Log AAA accounting configuration failure
          debug:
            msg: "AAA accounting config failed: {{ aaa_acct.msg }}"

    - name: Verify AAA and server configuration
      ios_command:
        commands:
          - "show aaa servers"
          - "show running-config | include aaa"
      register: aaa_verify
      retries: 2
      delay: 3

    - name: Display configuration results
      debug:
        msg: |
          Device: {{ inventory_hostname }}
          TACACS+ Servers Configured: {{ tacacs_result.results | selectattr('changed', 'equalto', true) | length }}
          RADIUS Servers Configured: {{ radius_result.results | selectattr('changed', 'equalto', true) | length }}
          AAA Authentication Enabled: {{ aaa_auth.changed }}
          AAA Authorization Enabled: {{ aaa_authz.changed }}
          AAA Accounting Enabled: {{ aaa_acct.changed if enable_accounting else 'Disabled' }}
          Server Status: Verified

  handlers:
    - name: Save configuration to NVRAM
      ios_command:
        commands:
          - "write memory"
      listen: aaa_configured
      when: not ansible_check_mode

  post_tasks:
    - name: Confirm AAA configuration
      debug:
        msg: "AAA configuration completed for {{ inventory_hostname }}"
      when: not ansible_check_mode
```