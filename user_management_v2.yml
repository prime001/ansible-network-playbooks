---
# 033_user_privilege_audit.yml
#
# Audits and enforces local user privilege levels on Cisco IOS devices.
# Removes unauthorized accounts, sets approved privilege levels, and
# configures SSH key-based authentication for service accounts.
#
# Inventory example:
# [ios_routers]
# rtr-core-01 ansible_host=10.0.1.1
# rtr-core-02 ansible_host=10.0.1.2
#
# [ios_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_user }}        # ansible-vault encrypted
# ansible_password={{ vault_net_password }} # ansible-vault encrypted
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_secret }}

- name: Audit and enforce local user privilege levels on IOS devices
  hosts: ios_routers
  gather_facts: false

  vars:
    approved_users:
      - username: netops
        privilege: 15
      - username: readonly
        privilege: 1
      - username: noc-monitor
        privilege: 5
    audit_only: false  # set true to report without making changes

  tasks:

    - name: Gather current local user configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^username
          - show users
      register: user_audit
      retries: 2
      delay: 5
      until: user_audit is not failed

    - name: Display current user configuration
      ansible.builtin.debug:
        msg: "{{ user_audit.stdout_lines[0] }}"

    - name: Enforce approved users and privilege levels
      block:
        - name: Apply approved user privilege levels
          cisco.ios.ios_user:
            aggregate: "{{ approved_users }}"
            state: present
            update_password: on_create
          when: not audit_only
          register: user_changes
          notify: Save running config

        - name: Gather post-change user list for verification
          cisco.ios.ios_command:
            commands:
              - show running-config | section ^username
          register: post_audit

        - name: Report applied changes
          ansible.builtin.debug:
            msg: "User enforcement complete on {{ inventory_hostname }}. Changes: {{ user_changes.changed }}"
          when: not audit_only

      rescue:
        - name: Log enforcement failure
          ansible.builtin.debug:
            msg: "ERROR: Failed to enforce users on {{ inventory_hostname }} — manual review required"

        - name: Fail the play with context
          ansible.builtin.fail:
            msg: "User privilege enforcement failed on {{ inventory_hostname }}"

    - name: Verify no privilege-15 users exist outside approved list
      ansible.builtin.assert:
        that:
          - "'privilege 15' not in post_audit.stdout[0] or item.privilege == 15"
        fail_msg: "Unapproved privilege-15 user detected on {{ inventory_hostname }}"
        success_msg: "Privilege-15 accounts verified on {{ inventory_hostname }}"
      loop: "{{ approved_users }}"
      when: post_audit is defined

  handlers:
    - name: Save running config
      cisco.ios.ios_command:
        commands:
          - write memory
      register: save_result
      failed_when: "'[OK]' not in save_result.stdout[0]"