---
# 135_banner_deploy_multiplatform.yml
# Deploys MOTD and login banners across heterogeneous platforms (IOS, NX-OS, JunOS)
# with per-platform conditional tasks and post-deploy verification.
# Credentials sourced from Ansible Vault — see group_vars/all/vault.yml.
#
# Inventory example:
#   [cisco_ios]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [cisco_nxos]
#   sw-dist-01 ansible_host=10.0.2.1
#
#   [juniper]
#   fw-edge-01 ansible_host=10.0.3.1
#
#   [network:children]
#   cisco_ios
#   cisco_nxos
#   juniper
#
#   [network:vars]
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable_password }}

- name: Deploy MOTD and login banners across multi-vendor network devices
  hosts: network
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_net_enable_password }}"

    motd_banner: |
      ******************************************************************
      *  AUTHORIZED ACCESS ONLY                                        *
      *  Unauthorized access is prohibited and will be prosecuted.     *
      *  All sessions are monitored and logged.                        *
      ******************************************************************
    login_banner: |
      WARNING: This system is restricted to authorized users only.
      Disconnect immediately if you are not an authorized user.

  tasks:
    - name: Deploy banners on Cisco IOS/IOS-XE
      block:
        - name: Set MOTD banner (IOS)
          cisco.ios.ios_banner:
            banner: motd
            text: "{{ motd_banner }}"
            state: present
          register: ios_motd
          retries: 3
          delay: 5
          until: ios_motd is not failed

        - name: Set login banner (IOS)
          cisco.ios.ios_banner:
            banner: login
            text: "{{ login_banner }}"
            state: present
          register: ios_login

        - name: Verify banners in running config (IOS)
          cisco.ios.ios_command:
            commands: show running-config | section banner
          register: ios_verify
          failed_when: "'AUTHORIZED ACCESS' not in ios_verify.stdout[0]"

      rescue:
        - name: Report IOS banner failure
          ansible.builtin.debug:
            msg: "Banner deploy failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

      when: ansible_network_os == 'cisco.ios.ios'

    - name: Deploy banners on Cisco NX-OS
      block:
        - name: Set MOTD banner (NX-OS)
          cisco.nxos.nxos_banner:
            banner: motd
            text: "{{ motd_banner }}"
            state: present
          register: nxos_result
          retries: 3
          delay: 5
          until: nxos_result is not failed

        - name: Verify MOTD banner (NX-OS)
          cisco.nxos.nxos_command:
            commands: show banner motd
          register: nxos_verify
          failed_when: "'AUTHORIZED ACCESS' not in nxos_verify.stdout[0]"

      rescue:
        - name: Report NX-OS banner failure
          ansible.builtin.debug:
            msg: "Banner deploy failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

      when: ansible_network_os == 'cisco.nxos.nxos'

    - name: Deploy banners on Juniper JunOS
      block:
        - name: Set login announcement and message (JunOS)
          junipernetworks.junos.junos_config:
            lines:
              - "set system login announcement \"{{ login_banner | replace('\n', '\\n') }}\""
              - "set system login message \"{{ motd_banner | replace('\n', '\\n') }}\""
          register: junos_result
          retries: 2
          delay: 10
          until: junos_result is not failed

        - name: Verify login config (JunOS)
          junipernetworks.junos.junos_command:
            commands: show system login
          register: junos_verify
          failed_when: junos_verify.stdout | length == 0

      rescue:
        - name: Report JunOS banner failure
          ansible.builtin.debug:
            msg: "Banner deploy failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

      when: ansible_network_os == 'junipernetworks.junos.junos'

    - name: Summarize banner deployment results
      ansible.builtin.debug:
        msg:
          - "Host      : {{ inventory_hostname }}"
          - "Platform  : {{ ansible_network_os | default('unknown') }}"
          - "MOTD changed (IOS)  : {{ ios_motd.changed | default('N/A') }}"
          - "Login changed (IOS) : {{ ios_login.changed | default('N/A') }}"
          - "Changed (NX-OS)     : {{ nxos_result.changed | default('N/A') }}"
          - "Changed (JunOS)     : {{ junos_result.changed | default('N/A') }}