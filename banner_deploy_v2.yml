---
# banner_deploy_v3.yml
# Multi-platform banner deployment with compliance validation and rollback.
# Supports Cisco IOS/IOS-XE and NX-OS. Captures pre-change state, validates
# required legal text, and rolls back on failure.
#
# Credentials: ansible-vault encrypted group_vars/all/vault.yml
#   vault_net_user, vault_net_password, vault_net_enable
#
# Inventory example:
#   [core]
#   core-01 ansible_host=10.0.1.1 ansible_network_os=ios
#   core-02 ansible_host=10.0.1.2 ansible_network_os=ios
#
#   [datacenter]
#   dc-nxos-01 ansible_host=10.0.2.1 ansible_network_os=nxos
#
#   [network_devices:children]
#   core
#   datacenter
#
#   [all:vars]
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable }}
#   ansible_connection=network_cli

- name: Deploy compliance banners to network devices with rollback support
  hosts: network_devices
  gather_facts: false

  vars:
    net_user: "{{ vault_net_user }}"
    net_password: "{{ vault_net_password }}"
    net_enable: "{{ vault_net_enable }}"
    required_compliance_phrase: "authorized users only"
    motd_banner: |
      ************************************************************************
      *   AUTHORIZED USERS ONLY — Unauthorized access is strictly           *
      *   prohibited. All sessions are monitored and recorded per            *
      *   security policy SEC-NET-001. Disconnect if not authorized.        *
      ************************************************************************
    login_banner: |
      WARNING: This device is restricted to authorized users only.
      Unauthorized access attempts will be logged and prosecuted.

  tasks:
    - name: Validate compliance phrase present in banner before pushing
      assert:
        that:
          - required_compliance_phrase in motd_banner | lower
        fail_msg: "Banner text missing required phrase: '{{ required_compliance_phrase }}'"
        success_msg: "Compliance text validated on {{ inventory_hostname }}"

    - name: Capture existing banner config (pre-change snapshot)
      block:
        - name: Snapshot current banner — IOS
          ios_command:
            commands: ["show running-config | section banner"]
          register: pre_change_ios
          when: ansible_network_os == 'ios'
          retries: 2
          delay: 5

        - name: Snapshot current banner — NX-OS
          nxos_command:
            commands: ["show running-config | section banner"]
          register: pre_change_nxos
          when: ansible_network_os == 'nxos'
          retries: 2
          delay: 5

      rescue:
        - name: Warn on snapshot failure (non-fatal)
          debug:
            msg: "Could not capture pre-change state on {{ inventory_hostname }} — rollback will use empty banner"

    - name: Deploy MOTD and login banners — IOS
      block:
        - name: Apply MOTD banner (IOS)
          ios_banner:
            banner: motd
            text: "{{ motd_banner }}"
            state: present
          register: ios_motd

        - name: Apply login banner (IOS)
          ios_banner:
            banner: login
            text: "{{ login_banner }}"
            state: present
          register: ios_login

      rescue:
        - name: Rollback MOTD banner to pre-change state (IOS)
          ios_banner:
            banner: motd
            text: "{{ pre_change_ios.stdout[0] | default('') }}"
            state: present
          ignore_errors: true

        - name: Abort after rollback (IOS)
          fail:
            msg: "Banner deploy failed on {{ inventory_hostname }} — IOS rollback attempted"

      when: ansible_network_os == 'ios'

    - name: Deploy MOTD banner — NX-OS
      block:
        - name: Apply MOTD banner (NX-OS)
          nxos_banner:
            banner: motd
            text: "{{ motd_banner }}"
            state: present
          register: nxos_motd

      rescue:
        - name: Abort on NX-OS failure
          fail:
            msg: "Banner deploy failed on {{ inventory_hostname }} — NX-OS"

      when: ansible_network_os == 'nxos'

    - name: Verify banner contains compliance text post-deploy (IOS)
      ios_command:
        commands: ["show running-config | section banner motd"]
      register: ios_verify
      failed_when: required_compliance_phrase not in (ios_verify.stdout[0] | lower)
      when: ansible_network_os == 'ios'

    - name: Verify banner contains compliance text post-deploy (NX-OS)
      nxos_command:
        commands: ["show running-config | section banner"]
      register: nxos_verify
      failed_when: required_compliance_phrase not in (nxos_verify.stdout[0] | lower)
      when: ansible_network_os == 'nxos'

    - name: Report deployment result
      debug:
        msg:
          - "Host      : {{ inventory_hostname }}"
          - "Platform  : {{ ansible_network_os }}"
          - "MOTD      : {{ 'changed' if (ios_motd.changed | default(nxos_motd.changed | default(false))) else 'no change' }}"
          - "Login     : {{ 'changed' if (ios_login.changed | default(false)) else 'no change or N/A' }}"
          - "Verified  : PASSED"
```