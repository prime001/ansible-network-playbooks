Writing a VLAN provisioning playbook — distinct from all existing playbooks in the repo.

---
# vlan_provisioning.yml
#
# Provisions and verifies VLANs on Cisco IOS and NX-OS switches.
# Uses merged state: non-destructive, existing VLANs are preserved.
#
# Credentials (use ansible-vault for production):
#   ansible_user        — vault ref: {{ vault_network_user }}
#   ansible_password    — vault ref: {{ vault_network_password }}
#   ansible_become_pass — vault ref: {{ vault_enable_password }}
#
# Inventory example:
#   [ios_switches]
#   sw-access-01  ansible_host=10.0.1.11  ansible_network_os=ios
#   sw-access-02  ansible_host=10.0.1.12  ansible_network_os=ios
#
#   [nxos_switches]
#   sw-dc-01  ansible_host=10.0.2.11  ansible_network_os=nxos
#
#   [campus_switches:children]
#   ios_switches
#   nxos_switches
#
#   [campus_switches:vars]
#   ansible_connection=network_cli
#   ansible_user="{{ vault_network_user }}"
#   ansible_password="{{ vault_network_password }}"

- name: Provision VLANs on campus and data-center switches
  hosts: campus_switches
  gather_facts: false

  vars:
    vlans_to_provision:
      - vlan_id: 10
        name: USERS
        state: active
      - vlan_id: 20
        name: SERVERS
        state: active
      - vlan_id: 30
        name: MANAGEMENT
        state: active
      - vlan_id: 99
        name: NATIVE_UNUSED
        state: active

  tasks:
    - name: Verify SSH connectivity before making changes
      ansible.netcommon.cli_command:
        command: show version
      register: connectivity_check
      retries: 2
      delay: 5
      until: connectivity_check is not failed

    - name: Capture pre-change VLAN state (IOS)
      cisco.ios.ios_vlans:
        state: gathered
      register: vlans_before
      when: ansible_network_os == 'ios'

    - name: Capture pre-change VLAN state (NX-OS)
      cisco.nxos.nxos_vlans:
        state: gathered
      register: vlans_before
      when: ansible_network_os == 'nxos'

    - name: Apply VLAN configuration
      block:

        - name: Provision VLANs (IOS)
          cisco.ios.ios_vlans:
            config: "{{ vlans_to_provision }}"
            state: merged
          register: vlan_result
          when: ansible_network_os == 'ios'

        - name: Provision VLANs (NX-OS)
          cisco.nxos.nxos_vlans:
            config: "{{ vlans_to_provision }}"
            state: merged
          register: vlan_result
          when: ansible_network_os == 'nxos'

      rescue:
        - name: Report provisioning failure
          ansible.builtin.debug:
            msg: "VLAN provisioning failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Halt play for failed host
          ansible.builtin.fail:
            msg: "Stopping play for {{ inventory_hostname }} — manual intervention required"

    - name: Gather post-change VLAN state (IOS)
      cisco.ios.ios_vlans:
        state: gathered
      register: vlans_after
      when: ansible_network_os == 'ios'

    - name: Gather post-change VLAN state (NX-OS)
      cisco.nxos.nxos_vlans:
        state: gathered
      register: vlans_after
      when: ansible_network_os == 'nxos'

    - name: Verify each target VLAN is present after provisioning
      ansible.builtin.assert:
        that:
          - vlans_after.gathered | selectattr('vlan_id', 'equalto', item.vlan_id) | list | length > 0
        fail_msg: "VLAN {{ item.vlan_id }} ({{ item.name }}) missing on {{ inventory_hostname }} after provisioning"
        success_msg: "VLAN {{ item.vlan_id }} ({{ item.name }}) confirmed on {{ inventory_hostname }}"
      loop: "{{ vlans_to_provision }}"

    - name: Display provisioning summary
      ansible.builtin.debug:
        msg:
          - "Device: {{ inventory_hostname }} ({{ ansible_network_os }})"
          - "VLANs targeted: {{ vlans_to_provision | map(attribute='vlan_id') | list }}"
          - "Configuration changed: {{ vlan_result.changed | default(false) }}"
          - "Commands issued: {{ vlan_result.commands | default([]) }}