---
- name: Configure VLANs and Network Device Interfaces
  hosts: network_devices
  gather_facts: no
  
  vars:
    # Use ansible-vault for production credentials
    # ansible-vault encrypt group_vars/network_devices/vault.yml
    ansible_user: "{{ vault_ssh_user }}"
    ansible_password: "{{ vault_ssh_password }}"
    
    vlans:
      - vlan_id: 100
        name: "Management"
      - vlan_id: 200
        name: "Production"
      - vlan_id: 300
        name: "Development"
  
  tasks:
    - name: Create VLANs with retry logic
      ios_vlans:
        config:
          - vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
            state: active
      loop: "{{ vlans }}"
      when: ansible_network_os == 'ios'
      register: vlan_result
      retries: 3
      delay: 5
      until: vlan_result is succeeded
      rescue:
        - name: Handle VLAN creation failure
          debug:
            msg: "Warning: VLAN creation failed on {{ inventory_hostname }} after 3 retries"

    - name: Configure trunk ports
      ios_config:
        lines:
          - "switchport mode trunk"
          - "switchport trunk allowed vlan 100,200,300"
          - "switchport trunk native vlan 1"
        parents: "interface {{ item }}"
      loop: ["GigabitEthernet0/1", "GigabitEthernet0/2"]
      when: ansible_network_os == 'ios'
      register: trunk_result
      failed_when: trunk_result.failed

    - name: Configure access ports
      ios_config:
        lines:
          - "switchport mode access"
          - "switchport access vlan 100"
          - "no shutdown"
        parents: "interface {{ item }}"
      loop: ["FastEthernet0/3", "FastEthernet0/4"]
      when: ansible_network_os == 'ios'
      register: access_result

    - name: Verify VLAN configuration
      ios_command:
        commands:
          - "show vlan brief"
          - "show interfaces trunk"
      register: verification
      when: ansible_network_os == 'ios'

    - name: Display VLAN verification
      debug:
        msg: |
          VLAN Configuration on {{ inventory_hostname }}:
          {{ verification.stdout[0] | default('No VLAN data') }}
          
          Trunk Interfaces:
          {{ verification.stdout[1] | default('No trunk data') }}
      when: verification is defined

    - name: Save running configuration
      ios_command:
        commands:
          - "write memory"
      register: save_result
      when: ansible_network_os == 'ios'

    - name: Report configuration status
      debug:
        msg: |
          Configuration Summary for {{ inventory_hostname }}:
          VLANs Created: {{ vlans | length }}
          Trunk Ports Configured: 2
          Access Ports Configured: 2
          Configuration Saved: {{ not save_result.failed | default(false) }}

# Inventory Example:
# [network_devices]
# switch-core-01 ansible_host=192.168.1.10 ansible_network_os=ios
# switch-access-01 ansible_host=192.168.1.20 ansible_network_os=ios
#
# [network_devices:vars]
# ansible_connection=ansible.netcommon.network_cli
# ansible_become=yes
# ansible_become_method=enable
# vault_ssh_user=admin
# vault_ssh_password=!vault |
#   $ANSIBLE_VAULT;1.1;AES256
#   ...encrypted_password_hash...