---
- name: Configure Port Security on Network Devices
  hosts: network_devices
  gather_facts: no

  vars:
    # Device credentials (use: ansible-vault encrypt credentials.yml)
    ansible_connection: network_cli
    ansible_network_os: ios
    ansible_user: "{{ vault_username }}"
    ansible_password: "{{ vault_password }}"

    port_security_config:
      - interface: "GigabitEthernet0/0/1"
        max_mac: 2
        violation_action: "shutdown"
      - interface: "GigabitEthernet0/0/2"
        max_mac: 1
        violation_action: "restrict"
      - interface: "GigabitEthernet0/0/3"
        max_mac: 5
        violation_action: "protect"

  tasks:
    - name: Gather current port security status
      ios_command:
        commands:
          - "show port-security"
          - "show interface status"
      register: port_sec_status
      failed_when: false

    - name: Display current port security configuration
      debug:
        msg: "Current status on {{ inventory_hostname }}: {{ port_sec_status.stdout_lines[0:5] }}"

    - name: Enable port security on interfaces
      ios_config:
        lines:
          - "switchport mode access"
          - "switchport port-security"
          - "switchport port-security maximum {{ item.max_mac }}"
          - "switchport port-security violation {{ item.violation_action }}"
          - "switchport port-security aging time 120"
          - "switchport port-security aging type inactivity"
        parents: "interface {{ item.interface }}"
        save_when: modified
      loop: "{{ port_security_config }}"
      register: port_sec_deploy
      retries: 3
      delay: 2
      until: port_sec_deploy is not failed
      rescue:
        - name: Log port security configuration error
          debug:
            msg: "Failed to configure port security on {{ item.interface }}: {{ port_sec_deploy.msg }}"

    - name: Verify port security configuration
      ios_command:
        commands:
          - "show port-security interface GigabitEthernet0/0/1"
      register: port_sec_verify
      until: "'Port Security' in port_sec_verify.stdout"
      retries: 3
      delay: 2
      failed_when: "'Port Security' not in port_sec_verify.stdout"

    - name: Generate port security configuration report
      debug:
        msg: |
          Port Security Deployment Summary
          ==================================
          Device: {{ inventory_hostname }}
          Interfaces Configured: {{ port_security_config | length }}
          Deployment Status: SUCCESS
          Configurations Applied:
          {% for intf in port_security_config %}
          - {{ intf.interface }}: Max MAC={{ intf.max_mac }}, Violation={{ intf.violation_action }}
          {% endfor %}

    - name: Save running configuration to startup
      ios_command:
        commands:
          - "write memory"
      register: config_save
      when: port_sec_deploy is changed
      retries: 2
      delay: 1

    - name: Confirm configuration save
      debug:
        msg: "Configuration successfully saved on {{ inventory_hostname }}"
      when: config_save is changed

# Inventory Example:
# [network_devices]
# switch01 ansible_host=10.1.1.10 ansible_network_os=ios
# switch02 ansible_host=10.1.1.11 ansible_network_os=ios
# switch03 ansible_host=10.1.1.12 ansible_network_os=ios
#
# [network_devices:vars]
# ansible_connection=network_cli
# vault_username=admin
# vault_password=!vault |
#   $ANSIBLE_VAULT;1.1;AES256;production
#   (encrypted credentials here)