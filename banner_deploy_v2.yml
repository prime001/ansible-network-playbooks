The brainstorming skill is designed for open-ended design sessions — this task has fully specified requirements and asks for YAML output only. Writing the playbook directly.

The existing `banner_deploy.yml` and `_v2.yml` cover basic IOS banner deployment. I'll write a v3 that adds multi-vendor support (IOS + NXOS + EOS), post-deploy compliance verification, and rollback on failure — distinct value for the portfolio.

---
# banner_deploy_v3.yml
# Multi-vendor MOTD/login banner deployment with compliance verification and
# automatic rollback. Extends banner_deploy_v2.yml to cover NXOS and EOS targets.
#
# Inventory example:
#   [ios_devices]
#   rtr-core-01  ansible_host=10.0.1.1  ansible_network_os=ios
#   rtr-core-02  ansible_host=10.0.1.2  ansible_network_os=ios
#
#   [nxos_devices]
#   dc-sw-01     ansible_host=10.0.2.1  ansible_network_os=nxos
#
#   [eos_devices]
#   spine-01     ansible_host=10.0.3.1  ansible_network_os=eos
#
#   [network:children]
#   ios_devices
#   nxos_devices
#   eos_devices
#
#   [network:vars]
#   # Credentials stored in Ansible Vault: group_vars/network/vault.yml
#   ansible_user="{{ vault_net_username }}"
#   ansible_password="{{ vault_net_password }}"
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass="{{ vault_enable_password }}"
#   ansible_connection=network_cli

- name: Deploy and verify compliance banners across multi-vendor network devices
  hosts: network
  gather_facts: false
  vars:
    # vault_net_username and vault_net_password sourced from Ansible Vault
    compliance_keyword: "AUTHORIZED ACCESS ONLY"
    motd_text: |
      **************************************************************************
      * AUTHORIZED ACCESS ONLY                                                 *
      * Unauthorized use of this system is strictly prohibited and monitored.  *
      * All sessions are logged. Disconnect now if you are not authorized.     *
      * Contact: noc@example.com                                               *
      **************************************************************************
    login_text: |
      **************************************************************************
      * AUTHORIZED PERSONNEL ONLY -- {{ inventory_hostname }}                  *
      * Disconnect immediately if you are not an authorized user.              *
      **************************************************************************

  tasks:
    - name: Capture existing banner state before changes
      ansible.netcommon.cli_command:
        command: show banner motd
      register: banner_before
      failed_when: false
      changed_when: false

    - name: Deploy MOTD and login banners (IOS)
      block:
        - name: Apply MOTD banner (IOS)
          cisco.ios.ios_banner:
            banner: motd
            text: "{{ motd_text }}"
            state: present
          register: ios_motd_result

        - name: Apply login banner (IOS)
          cisco.ios.ios_banner:
            banner: login
            text: "{{ login_text }}"
            state: present
          register: ios_login_result

        - name: Save running config (IOS)
          cisco.ios.ios_command:
            commands: write memory
          when: ios_motd_result.changed or ios_login_result.changed

      rescue:
        - name: Log IOS banner failure and roll back
          ansible.builtin.debug:
            msg: "Banner deploy failed on {{ inventory_hostname }}. Rolling back."

        - name: Remove banners on failure (IOS rollback)
          cisco.ios.ios_config:
            lines:
              - no banner motd
              - no banner login

        - name: Abort after rollback
          ansible.builtin.fail:
            msg: "IOS banner deployment failed on {{ inventory_hostname }}; rollback applied."

      when: inventory_hostname in groups.get('ios_devices', [])

    - name: Deploy MOTD banner (NXOS)
      block:
        - name: Apply MOTD banner (NXOS)
          cisco.nxos.nxos_banner:
            banner: motd
            text: "{{ motd_text }}"
            state: present
          register: nxos_motd_result

      rescue:
        - name: Remove banner on failure (NXOS rollback)
          cisco.nxos.nxos_config:
            lines:
              - no banner motd

        - name: Abort after rollback
          ansible.builtin.fail:
            msg: "NXOS banner deployment failed on {{ inventory_hostname }}; rollback applied."

      when: inventory_hostname in groups.get('nxos_devices', [])

    - name: Deploy MOTD and login banners (EOS)
      block:
        - name: Apply banners (EOS)
          arista.eos.eos_banner:
            banner: "{{ item.type }}"
            text: "{{ item.text }}"
            state: present
          loop:
            - {type: motd,  text: "{{ motd_text }}"}
            - {type: login, text: "{{ login_text }}"}
          register: eos_banner_result

      rescue:
        - name: Remove banners on failure (EOS rollback)
          arista.eos.eos_config:
            lines:
              - no banner motd
              - no banner login

        - name: Abort after rollback
          ansible.builtin.fail:
            msg: "EOS banner deployment failed on {{ inventory_hostname }}; rollback applied."

      when: inventory_hostname in groups.get('eos_devices', [])

    - name: Verify compliance keyword present in deployed banner
      ansible.netcommon.cli_command:
        command: show banner motd
      register: banner_verify
      retries: 3
      delay: 5
      until: compliance_keyword in banner_verify.stdout
      failed_when: compliance_keyword not in banner_verify.stdout
      changed_when: false

    - name: Report deployment outcome
      ansible.builtin.debug:
        msg:
          - "Device       : {{ inventory_hostname }}"
          - "Pre-change   : {{ (banner_before.stdout | default('')) | truncate(60) }}"
          - "Post-change  : {{ (banner_verify.stdout | default('')) | truncate(60) }}"
          - "Compliant    : {{ compliance_keyword in banner_verify.stdout }}