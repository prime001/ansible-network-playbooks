---
# banner_deploy_v3.yml
# Multi-vendor banner deployment (IOS/IOS-XE, NX-OS, Junos) with
# pre-change capture, per-platform idempotent push, and rollback on failure.
#
# Credentials: store in Ansible Vault — group_vars/all/vault.yml
#   vault_ansible_user, vault_ansible_password
#
# Inventory example:
#   [core_routers]
#   core-rtr-01 ansible_host=10.0.1.1 ansible_network_os=ios
#   core-rtr-02 ansible_host=10.0.1.2 ansible_network_os=iosxe
#
#   [distribution]
#   dist-sw-01 ansible_host=10.0.2.1 ansible_network_os=nxos
#
#   [edge]
#   edge-fw-01 ansible_host=10.0.3.1 ansible_network_os=junos
#
#   [network:children]
#   core_routers
#   distribution
#   edge

- name: Deploy login and MOTD banners across multi-vendor network devices
  hosts: network
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"
    banner_motd: |
      *********************************************************************
      *  AUTHORIZED ACCESS ONLY — All activity is logged and monitored.  *
      *  Unauthorized use is prohibited and subject to prosecution.       *
      *********************************************************************
    banner_login: |
      WARNING: Authorized users only. Disconnect immediately if unauthorized.
    banner_deployed: false

  tasks:
    - name: Capture pre-change banner state (IOS/IOS-XE)
      cisco.ios.ios_command:
        commands: ["show running-config | section banner"]
      register: pre_banner
      when: ansible_network_os in ['ios', 'iosxe']
      retries: 2
      delay: 5

    - name: Capture pre-change banner state (NX-OS)
      cisco.nxos.nxos_command:
        commands: ["show running-config | section banner"]
      register: pre_banner
      when: ansible_network_os == 'nxos'
      retries: 2
      delay: 5

    - name: Show pre-change banner snapshot
      ansible.builtin.debug:
        msg: "Pre-change on {{ inventory_hostname }}: {{ pre_banner.stdout_lines | default(['(no banner configured)']) }}"
      when: pre_banner is defined

    - name: Deploy banners
      block:
        - name: Push MOTD and login banners (IOS/IOS-XE)
          cisco.ios.ios_banner:
            banner: "{{ item.type }}"
            text: "{{ item.text }}"
            state: present
          loop:
            - { type: motd,  text: "{{ banner_motd }}" }
            - { type: login, text: "{{ banner_login }}" }
          when: ansible_network_os in ['ios', 'iosxe']

        - name: Push MOTD and exec banners (NX-OS)
          cisco.nxos.nxos_banner:
            banner: "{{ item.type }}"
            text: "{{ item.text }}"
            state: present
          loop:
            - { type: motd, text: "{{ banner_motd }}" }
            - { type: exec, text: "{{ banner_login }}" }
          when: ansible_network_os == 'nxos'

        - name: Push MOTD and login banners (Junos)
          junipernetworks.junos.junos_banner:
            banner: "{{ item.type }}"
            text: "{{ item.text }}"
            state: present
          loop:
            - { type: motd,  text: "{{ banner_motd }}" }
            - { type: login, text: "{{ banner_login }}" }
          when: ansible_network_os == 'junos'

        - name: Mark deployment succeeded
          ansible.builtin.set_fact:
            banner_deployed: true

      rescue:
        - name: Log failure and attempt rollback
          ansible.builtin.debug:
            msg: "Banner push FAILED on {{ inventory_hostname }} — removing partial config"

        - name: Remove partial banners on failure (IOS/IOS-XE)
          cisco.ios.ios_banner:
            banner: "{{ item }}"
            state: absent
          loop: [motd, login]
          when: ansible_network_os in ['ios', 'iosxe']
          ignore_errors: true

        - name: Remove partial banners on failure (NX-OS)
          cisco.nxos.nxos_banner:
            banner: "{{ item }}"
            state: absent
          loop: [motd, exec]
          when: ansible_network_os == 'nxos'
          ignore_errors: true

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: "Banner deployment failed on {{ inventory_hostname }}. Rollback attempted. Review device connectivity and privilege level."

    - name: Verify banner present in running config (IOS/IOS-XE)
      cisco.ios.ios_command:
        commands: ["show running-config | section banner"]
      register: post_banner
      failed_when: "'banner' not in post_banner.stdout[0]"
      when: ansible_network_os in ['ios', 'iosxe'] and banner_deployed

    - name: Verify banner present in running config (NX-OS)
      cisco.nxos.nxos_command:
        commands: ["show running-config | section banner"]
      register: post_banner
      failed_when: "'banner' not in post_banner.stdout[0]"
      when: ansible_network_os == 'nxos' and banner_deployed

    - name: Report deployment result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — banner deployment {{ 'VERIFIED OK' if banner_deployed else 'SKIPPED (unsupported OS)' }}