---
# ospf_config.yml
# Deploys OSPF process, network statements, and interface roles to Cisco IOS routers
# Credentials stored in Ansible Vault — encrypt with:
#   ansible-vault encrypt_string 'secret' --name vault_net_password
#
# Inventory example:
# [core_routers]
# rtr-core-01 ansible_host=10.0.1.1 ospf_router_id=10.0.1.1
# rtr-core-02 ansible_host=10.0.1.2 ospf_router_id=10.0.1.2
#
# [core_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_username }}
# ansible_password={{ vault_net_password }}
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}

- name: Deploy OSPF routing configuration to IOS core routers
  hosts: core_routers
  gather_facts: false
  vars:
    ospf_process_id: 1
    # Per-host ospf_router_id set in inventory or host_vars
    ospf_reference_bandwidth: 10000
    ospf_networks:
      - { prefix: 10.0.0.0,   wildcard: 0.0.255.255, area: 0 }
      - { prefix: 192.168.0.0, wildcard: 0.0.0.255,  area: 1 }
    ospf_active_interfaces:
      - GigabitEthernet0/0
      - GigabitEthernet0/1
    max_retries: 3

  tasks:
    - name: Verify device is reachable before making changes
      cisco.ios.ios_command:
        commands: show clock
      register: reachability_check
      retries: "{{ max_retries }}"
      delay: 5
      until: reachability_check is not failed

    - name: Configure OSPF process
      block:
        - name: Set OSPF global parameters — router-id, bandwidth, passive-interface default
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
              - "passive-interface default"
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_global_result

        - name: Add OSPF network statements per area
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"
          register: ospf_networks_result

        - name: Activate OSPF on transit interfaces (override passive-interface default)
          cisco.ios.ios_config:
            lines:
              - "no passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_active_interfaces }}"
          register: ospf_interfaces_result

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "OSPF configuration failed on {{ inventory_hostname }} — review device logs before retrying"

        - name: Abort play with descriptive error
          ansible.builtin.fail:
            msg: "Halting OSPF deployment on {{ inventory_hostname }} due to configuration error in block"

    - name: Wait for OSPF adjacencies to reach FULL state (up to 60s)
      cisco.ios.ios_command:
        commands: show ip ospf neighbor
      register: ospf_neighbors
      retries: 6
      delay: 10
      until: "'FULL' in ospf_neighbors.stdout[0]"
      failed_when: false

    - name: Collect OSPF state for audit record
      cisco.ios.ios_command:
        commands:
          - show ip ospf
          - show ip ospf neighbor detail
          - show ip route ospf
      register: ospf_audit

    - name: Display OSPF adjacency and route summary
      ansible.builtin.debug:
        msg: "{{ ospf_audit.stdout_lines }}"

    - name: Warn if no OSPF FULL adjacencies found
      ansible.builtin.debug:
        msg: "WARNING: No FULL OSPF adjacencies on {{ inventory_hostname }} — verify peer config and network statements"
      when: "'FULL' not in ospf_neighbors.stdout[0]"

    - name: Persist approved configuration to NVRAM
      cisco.ios.ios_config:
        save_when: changed