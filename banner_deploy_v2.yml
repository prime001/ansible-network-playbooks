---
# vlan_management.yml
# Deploys and verifies VLAN definitions on Cisco IOS/IOS-XE switches.
# Covers create, name, and active-state enforcement across access and distribution tiers.
# Credentials stored in Ansible Vault — see vars/secrets.yml
#
# Inventory example:
#   [access_switches]
#   sw-access-01 ansible_host=10.10.1.11 ansible_network_os=ios
#   sw-access-02 ansible_host=10.10.1.12 ansible_network_os=ios
#
#   [distribution_switches]
#   sw-dist-01 ansible_host=10.10.1.1 ansible_network_os=ios
#
#   [switches:children]
#   access_switches
#   distribution_switches
#
#   [switches:vars]
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable }}

- name: Deploy and Verify VLAN Configuration on Cisco IOS Switches
  hosts: switches
  gather_facts: false
  vars:
    # Encrypt with: ansible-vault encrypt_string --ask-vault-pass 'value' --name 'vault_net_password'
    vlan_definitions:
      - { vlan_id: 10,  name: "CORP_DATA",          state: "active" }
      - { vlan_id: 20,  name: "CORP_VOICE",          state: "active" }
      - { vlan_id: 30,  name: "CORP_MGMT",           state: "active" }
      - { vlan_id: 40,  name: "SERVERS",             state: "active" }
      - { vlan_id: 99,  name: "NATIVE_QUARANTINE",   state: "active" }
      - { vlan_id: 100, name: "GUEST_WIFI",          state: "active" }

  tasks:
    - name: Capture VLAN database before changes
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_pre_state
      retries: 2
      delay: 5

    - name: Display pre-change VLAN state
      ansible.builtin.debug:
        msg: "{{ vlan_pre_state.stdout_lines }}"

    - name: Configure and save VLANs
      block:
        - name: Apply VLAN definitions via ios_vlans
          cisco.ios.ios_vlans:
            config:
              - vlan_id: "{{ item.vlan_id }}"
                name: "{{ item.name }}"
                state: "{{ item.state }}"
            state: merged
          loop: "{{ vlan_definitions }}"
          loop_control:
            label: "VLAN {{ item.vlan_id }} - {{ item.name }}"
          register: vlan_config_result

        - name: Persist running config to startup
          cisco.ios.ios_config:
            save_when: changed

      rescue:
        - name: Log configuration failure detail
          ansible.builtin.debug:
            msg: >
              VLAN push failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('no message captured') }}

        - name: Abort with clear failure reason
          ansible.builtin.fail:
            msg: "VLAN deployment halted on {{ inventory_hostname }} — review rescue output above."

    - name: Verify each VLAN exists in the database
      cisco.ios.ios_command:
        commands:
          - "show vlan id {{ item.vlan_id }}"
      register: vlan_verify
      loop: "{{ vlan_definitions }}"
      loop_control:
        label: "Verify VLAN {{ item.vlan_id }}"
      failed_when: "'not found in current VLAN database' in vlan_verify.stdout[0]"
      retries: 1
      delay: 3

    - name: Capture VLAN database after changes
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_post_state

    - name: Display post-change VLAN state
      ansible.builtin.debug:
        msg: "{{ vlan_post_state.stdout_lines }}"

    - name: Summarize results
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }}: {{ vlan_definitions | length }} VLANs enforced.
          Changed={{ vlan_config_result.changed }}.