---
# banner_deploy_v3.yml
# Multi-vendor MOTD and login banner deployment with policy compliance verification
# Credentials stored in Ansible Vault — reference: group_vars/all/vault.yml
# vault variables: vault_net_username, vault_net_password, vault_net_enable_password
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1 ansible_network_os=ios
#   rtr-core-02 ansible_host=10.0.1.2 ansible_network_os=iosxr
#
#   [datacenter_switches]
#   sw-dc-01 ansible_host=10.0.2.1 ansible_network_os=nxos
#   sw-dc-02 ansible_host=10.0.2.2 ansible_network_os=nxos
#
#   [all:vars]
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable_password }}

- name: Deploy and verify MOTD and login banners across multi-vendor devices
  hosts: all
  gather_facts: false
  connection: network_cli

  vars:
    banner_policy_id: "SEC-BANNER-2024"
    org_name: "Acme Corporation"
    noc_contact: "noc@acme.example.com"
    banner_motd_text: |
      ***********************************************************************
      *  AUTHORIZED USERS ONLY — {{ org_name }}
      *  Unauthorized access is prohibited and subject to prosecution.
      *  All activity is monitored, logged, and subject to audit.
      *  Policy: {{ banner_policy_id }} | Contact: {{ noc_contact }}
      ***********************************************************************
    banner_login_text: |
      By proceeding, you acknowledge and accept the Acceptable Use Policy.
      Disconnect immediately if you are not an authorized user.

  tasks:
    - name: Banner deployment block
      block:
        - name: Apply MOTD banner — IOS/IOS-XE
          ios_banner:
            banner: motd
            text: "{{ banner_motd_text }}"
            state: present
          when: ansible_network_os == "ios"
          register: ios_motd_result
          retries: 3
          delay: 5

        - name: Apply login banner — IOS/IOS-XE
          ios_banner:
            banner: login
            text: "{{ banner_login_text }}"
            state: present
          when: ansible_network_os == "ios"
          retries: 3
          delay: 5

        - name: Apply MOTD banner — NX-OS
          nxos_banner:
            banner: motd
            text: "{{ banner_motd_text }}"
            state: present
          when: ansible_network_os == "nxos"
          register: nxos_motd_result
          retries: 3
          delay: 5

        - name: Apply banners — IOS-XR (CLI config)
          iosxr_config:
            lines:
              - "banner motd {{ banner_policy_id }}: Authorized users only. All sessions monitored."
          when: ansible_network_os == "iosxr"
          register: iosxr_result
          retries: 3
          delay: 5

        - name: Apply MOTD banner — Junos
          junos_config:
            lines:
              - "set system login message \"{{ banner_login_text }}\""
          when: ansible_network_os == "junos"
          register: junos_result
          retries: 3
          delay: 5

        - name: Verify banner policy ID present on device
          cli_command:
            command: show banner motd
          register: banner_verify
          failed_when:
            - banner_verify.stdout is defined
            - banner_policy_id not in banner_verify.stdout
          when: ansible_network_os in ["ios", "nxos"]

      rescue:
        - name: Report deployment failure
          debug:
            msg: >
              Banner deployment FAILED on {{ inventory_hostname }}
              (OS: {{ ansible_network_os | default('unknown') }}).
              Error: {{ ansible_failed_task.name | default('unknown task') }}

        - name: Escalate failure
          fail:
            msg: "Banner policy {{ banner_policy_id }} could not be applied to {{ inventory_hostname }}. Manual remediation required."

    - name: Summarize banner deployment result
      debug:
        msg:
          - "Device      : {{ inventory_hostname }}"
          - "Platform    : {{ ansible_network_os | default('unknown') }}"
          - "Policy ID   : {{ banner_policy_id }}"
          - "IOS changed : {{ ios_motd_result.changed | default('N/A') }}"
          - "NX-OS changed: {{ nxos_motd_result.changed | default('N/A') }}"
          - "IOS-XR result: {{ iosxr_result.changed | default('N/A') }}"
          - "Verified    : {{ 'PASS' if banner_verify is not failed else 'FAIL' }}"
```