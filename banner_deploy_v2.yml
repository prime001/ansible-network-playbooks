---
# banner_deploy_v3.yml - Multi-vendor banner deployment with post-deploy verification
#
# Distinct from banner_deploy_v2: adds NX-OS support, post-deploy content verification,
# and per-platform banner type mapping (exec vs login).
#
# Inventory example:
#   [network_devices]
#   core-01  ansible_host=10.0.1.1 ansible_network_os=ios
#   core-02  ansible_host=10.0.1.2 ansible_network_os=ios
#   dist-01  ansible_host=10.0.2.1 ansible_network_os=nxos
#
#   [network_devices:vars]
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}             # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}      # ansible-vault encrypted
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }} # ansible-vault encrypted

- name: Deploy and verify MOTD and login banners across IOS and NX-OS devices
  hosts: "{{ target_hosts | default('network_devices') }}"
  gather_facts: false
  vars:
    # Vault references — encrypt with: ansible-vault encrypt_string '<secret>'
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_enable_pass | default(vault_net_password) }}"

    banner_verification_string: "AUTHORIZED ACCESS ONLY"
    banner_motd_text: |
      *************************************************************************
      *   AUTHORIZED ACCESS ONLY — Activity on this device is monitored       *
      *   Unauthorized use is prohibited and subject to legal action           *
      *   Disconnect immediately if you are not an authorized user             *
      *************************************************************************
    banner_login_text: |
      WARNING: This system is restricted to authorized users.
      All access attempts are logged and reviewed.

  tasks:
    - name: Deploy banners on IOS/IOS-XE
      block:
        - name: Apply MOTD banner (IOS)
          cisco.ios.ios_banner:
            banner: motd
            text: "{{ banner_motd_text }}"
            state: present
          register: ios_motd_result
          retries: 3
          delay: 5
          until: ios_motd_result is not failed
          when: ansible_network_os == 'ios'

        - name: Apply login banner (IOS)
          cisco.ios.ios_banner:
            banner: login
            text: "{{ banner_login_text }}"
            state: present
          register: ios_login_result
          retries: 3
          delay: 5
          until: ios_login_result is not failed
          when: ansible_network_os == 'ios'

        - name: Apply MOTD banner (NX-OS)
          cisco.nxos.nxos_banner:
            banner: motd
            text: "{{ banner_motd_text }}"
            state: present
          register: nxos_motd_result
          retries: 3
          delay: 5
          until: nxos_motd_result is not failed
          when: ansible_network_os == 'nxos'

        - name: Apply exec banner (NX-OS — login banner equivalent)
          cisco.nxos.nxos_banner:
            banner: exec
            text: "{{ banner_login_text }}"
            state: present
          register: nxos_exec_result
          retries: 3
          delay: 5
          until: nxos_exec_result is not failed
          when: ansible_network_os == 'nxos'

        - name: Verify MOTD banner contains expected content (IOS)
          cisco.ios.ios_command:
            commands:
              - show banner motd
          register: ios_banner_verify
          failed_when: banner_verification_string not in ios_banner_verify.stdout[0]
          when: ansible_network_os == 'ios'

        - name: Verify MOTD banner contains expected content (NX-OS)
          cisco.nxos.nxos_command:
            commands:
              - show banner motd
          register: nxos_banner_verify
          failed_when: banner_verification_string not in nxos_banner_verify.stdout[0]
          when: ansible_network_os == 'nxos'

        - name: Report successful deployment
          ansible.builtin.debug:
            msg:
              - "Host        : {{ inventory_hostname }}"
              - "Platform    : {{ ansible_network_os }}"
              - "MOTD banner : deployed and verified"
              - "Changed     : {{ (ios_motd_result.changed | default(false)) or (nxos_motd_result.changed | default(false)) }}"

      rescue:
        - name: Report deployment failure
          ansible.builtin.debug:
            msg: "Banner deployment FAILED on {{ inventory_hostname }}: {{ ansible_failed_task.name }} — {{ ansible_failed_result.msg | default('check device logs') }}"

        - name: Abort with descriptive error
          ansible.builtin.fail:
            msg: "Halting play for {{ inventory_hostname }} — banner deploy or verification step failed.