---
# prefix_list_deploy.yml
#
# Deploys IP prefix lists and route maps for BGP/OSPF route filtering on Cisco IOS.
# Enforces inbound/outbound route policy at network boundaries.
#
# Vault reference: group_vars/network/vault.yml (ansible-vault encrypted)
# Required vault vars: vault_net_user, vault_net_pass, vault_enable_pass
#
# Inventory example:
#   [edge_routers]
#   edge-rtr-01  ansible_host=10.0.1.1
#   edge-rtr-02  ansible_host=10.0.1.2
#
#   [edge_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_pass }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_pass }}

- name: Deploy IP prefix lists and route maps for route policy enforcement
  hosts: edge_routers
  gather_facts: false
  vars:
    # Credentials sourced from vault — never store plaintext secrets here
    net_user: "{{ vault_net_user }}"
    net_pass: "{{ vault_net_pass }}"
    enable_pass: "{{ vault_enable_pass }}"

    prefix_list_name: "PERMITTED_CUSTOMER_PREFIXES"
    route_map_name: "BGP_IMPORT_POLICY"
    local_preference: 200

    permitted_networks:
      - { seq: 10, action: permit, prefix: "10.0.0.0/8",     le: 24 }
      - { seq: 20, action: permit, prefix: "172.16.0.0/12",  le: 28 }
      - { seq: 30, action: permit, prefix: "192.168.0.0/16", le: 30 }
      - { seq: 99, action: deny,   prefix: "0.0.0.0/0",      le: 32 }

  tasks:
    - name: Verify device reachability before making changes
      cisco.ios.ios_command:
        commands: "show version | include Cisco IOS"
      register: version_check
      retries: 3
      delay: 10
      until: version_check is not failed

    - name: Display IOS version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ version_check.stdout[0] | trim }}"

    - name: Snapshot existing prefix list for rollback reference
      cisco.ios.ios_command:
        commands: "show ip prefix-list {{ prefix_list_name }}"
      register: pre_deploy_snapshot
      failed_when: false

    - block:
        - name: Remove stale prefix list entries before redeploy
          cisco.ios.ios_config:
            lines:
              - "no ip prefix-list {{ prefix_list_name }}"
          failed_when: false

        - name: Deploy prefix list entries
          cisco.ios.ios_config:
            lines: >-
              ip prefix-list {{ prefix_list_name }} seq {{ item.seq }}
              {{ item.action }} {{ item.prefix }}
              {% if item.le is defined %}le {{ item.le }}{% endif %}
          loop: "{{ permitted_networks }}"
          loop_control:
            label: "seq {{ item.seq }} {{ item.action }} {{ item.prefix }}"
          register: prefix_deploy_result

        - name: Deploy route map referencing prefix list
          cisco.ios.ios_config:
            lines:
              - "match ip address prefix-list {{ prefix_list_name }}"
              - "set local-preference {{ local_preference }}"
            parents:
              - "route-map {{ route_map_name }} permit 10"

        - name: Deny unmatched routes in route map
          cisco.ios.ios_config:
            lines:
              - "route-map {{ route_map_name }} deny 99"

        - name: Verify prefix list entries were applied
          cisco.ios.ios_command:
            commands:
              - "show ip prefix-list {{ prefix_list_name }}"
              - "show route-map {{ route_map_name }}"
          register: verify_output
          failed_when: prefix_list_name not in verify_output.stdout[0]

        - name: Display applied prefix list and route map
          ansible.builtin.debug:
            msg: "{{ verify_output.stdout_lines }}"

        - name: Save running configuration
          cisco.ios.ios_command:
            commands: "write memory"
          register: save_result
          failed_when: "'[OK]' not in save_result.stdout[0]"

        - name: Confirm save success
          ansible.builtin.debug:
            msg: "Configuration saved on {{ inventory_hostname }}"

      rescue:
        - name: Collect diagnostic state after failure
          cisco.ios.ios_command:
            commands:
              - "show ip prefix-list {{ prefix_list_name }}"
              - "show route-map {{ route_map_name }}"
              - "show log | last 20"
          register: diag_output
          ignore_errors: true

        - name: Display diagnostics
          ansible.builtin.debug:
            msg: "{{ diag_output.stdout_lines | default(['No diagnostic output captured']) }}"

        - name: Fail with rollback context
          ansible.builtin.fail:
            msg: >
              Prefix list deployment failed on {{ inventory_hostname }}.
              Pre-deploy snapshot: {{ pre_deploy_snapshot.stdout[0] | default('none') }}.
              Review diagnostics above and restore snapshot manually if needed.
```

This is a `prefix_list_deploy` playbook covering BGP/OSPF route filtering — functionality not present in any of the existing playbooks. Key features: vault-referenced credentials, pre-deploy snapshot for rollback context, idempotent clear-then-redeploy pattern, `failed_when` guards on verify and save steps, a rescue block with diagnostic collection, and `retries`/`until` on the connectivity check.