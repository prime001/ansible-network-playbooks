---
- name: Deploy and manage VLANs across network infrastructure
  hosts: network_devices
  gather_facts: no
  connection: network_cli
  vars:
    # Credentials - reference vault for sensitive data
    # ansible-vault encrypt_string 'your_password' --name 'ansible_password'
    ansible_user: "{{ vault_username }}"
    ansible_password: "{{ vault_password }}"
    # VLAN configurations to deploy
    vlans_to_deploy:
      - vlan_id: 10
        name: Management
        description: "Device and infrastructure management"
      - vlan_id: 20
        name: Data
        description: "User and application data traffic"
      - vlan_id: 30
        name: Voice
        description: "VoIP and telephony traffic"
      - vlan_id: 99
        name: Native
        description: "Native VLAN for untagged traffic"

  tasks:
    - name: Gather device facts and current configuration
      ios_facts:
      register: device_info
      retries: 3
      delay: 10
      until: device_info is not failed

    - name: Display target device information
      debug:
        msg: |
          Hostname: {{ inventory_hostname }}
          OS Version: {{ device_info.ansible_facts.ansible_net_version }}
          Model: {{ device_info.ansible_facts.ansible_net_model }}
          Serial: {{ device_info.ansible_facts.ansible_net_serialnum }}

    - name: Retrieve current VLAN configuration
      ios_command:
        commands:
          - "show vlan brief"
      register: current_vlans
      retries: 2
      delay: 5

    - name: Deploy VLAN configurations
      ios_config:
        lines:
          - "name {{ item.name }}"
          - "description {{ item.description }}"
        parents: "vlan {{ item.vlan_id }}"
        before: "vlan {{ item.vlan_id }}"
      loop: "{{ vlans_to_deploy }}"
      register: vlan_deploy
      retries: 2
      delay: 5
      until: vlan_deploy is not failed
      ignore_errors: yes

    - name: Verify VLAN deployment
      ios_command:
        commands:
          - "show vlan id {{ item.vlan_id }}"
      loop: "{{ vlans_to_deploy }}"
      register: vlan_verify
      retries: 2
      delay: 5
      until: vlan_verify is not failed
      failed_when: "'not exist' in vlan_verify.stdout[0]"

    - name: Display deployed VLANs
      debug:
        msg: "{{ item.stdout }}"
      loop: "{{ vlan_verify.results }}"

    - name: Save running configuration to startup
      ios_config:
        save_when: modified
      register: config_save

    - name: Report configuration save status
      debug:
        msg: |
          Configuration modified: {{ config_save.changed }}
          Commands executed: {{ config_save.updates | length }}

  rescue:
    - name: Handle configuration errors
      debug:
        msg: |
          Error deploying VLANs on {{ inventory_hostname }}
          Failed task: {{ ansible_failed_task.name }}
          Error details: {{ ansible_failed_result.msg }}

    - name: Backup configuration on failure
      ios_command:
        commands:
          - "show running-config"
      register: running_config
      when: ansible_failed_result is defined

    - name: Save failed state for troubleshooting
      copy:
        content: "{{ running_config.stdout[0] }}"
        dest: "/tmp/{{ inventory_hostname }}_config_backup.txt"
      delegate_to: localhost
      when: running_config is defined

# Inventory example for hosts.yml:
# [network_devices]
# core-switch-1 ansible_host=192.168.1.1 device_type=ios
# core-switch-2 ansible_host=192.168.1.2 device_type=ios
# access-switch-1 ansible_host=192.168.1.3 device_type=ios
# router-1 ansible_host=192.168.1.4 device_type=iosxr
#
# [network_devices:vars]
# ansible_connection=network_cli
# vault_username=admin
# vault_password=!vault |encrypted...
#
# Usage:
# ansible-playbook vlan_deploy.yml -i hosts.yml --ask-vault-pass
# ansible-playbook vlan_deploy.yml -i hosts.yml -k (for ssh password prompt)