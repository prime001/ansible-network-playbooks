---
# 007_banner_deploy.yml
# Multi-OS banner deployment with pre/post verification and rollback support
#
# Supports: Cisco IOS/IOS-XE, IOS-XR, NX-OS, Juniper JunOS
# Credentials: ansible-vault encrypted vars in group_vars/all/vault.yml
#   vault_net_username, vault_net_password, vault_net_enable_secret
#
# Inventory example:
# [ios_devices]
# core-sw-01 ansible_host=10.10.1.1 ansible_network_os=ios
# dist-sw-02 ansible_host=10.10.1.2 ansible_network_os=ios
#
# [iosxr_devices]
# edge-rtr-01 ansible_host=10.10.2.1 ansible_network_os=iosxr
#
# [nxos_devices]
# dc-sw-01 ansible_host=10.10.3.1 ansible_network_os=nxos
#
# [network:children]
# ios_devices
# iosxr_devices
# nxos_devices
#
# Usage: ansible-playbook 007_banner_deploy.yml -i inventory.ini --ask-vault-pass

- name: Deploy login and MOTD banners across multi-vendor network devices
  hosts: network
  gather_facts: false
  connection: network_cli

  vars:
    net_username: "{{ vault_net_username }}"
    net_password: "{{ vault_net_password }}"
    net_enable_secret: "{{ vault_net_enable_secret | default(omit) }}"
    banner_delimiter: "^"
    motd_banner: |
      **************************************************************************
      *  AUTHORIZED ACCESS ONLY - All activity is monitored and logged         *
      *  Unauthorized access is strictly prohibited and will be prosecuted      *
      *  Contact noc@company.com for access issues                             *
      **************************************************************************
    login_banner: |
      **************************************************************************
      *  WARNING: This system is restricted to authorized users only           *
      *  Disconnect immediately if you are not an authorized user              *
      **************************************************************************

  tasks:
    - name: Capture running banner config before changes
      cisco.ios.ios_command:
        commands: show running-config | section banner
      register: pre_change_banner
      when: ansible_network_os == 'ios'
      retries: 2
      delay: 5

    - name: Deploy MOTD and login banners on IOS/IOS-XE
      block:
        - name: Apply banners (IOS)
          cisco.ios.ios_banner:
            banner: "{{ item.type }}"
            text: "{{ item.text }}"
            state: present
          loop:
            - { type: motd, text: "{{ motd_banner }}" }
            - { type: login, text: "{{ login_banner }}" }
          register: ios_banner_result
          notify: save ios config
      rescue:
        - name: Restore pre-change banner config (IOS rollback)
          cisco.ios.ios_config:
            lines: "{{ pre_change_banner.stdout_lines[0] }}"
          when: pre_change_banner is defined
        - name: Fail with rollback notice
          ansible.builtin.fail:
            msg: "Banner deploy failed on {{ inventory_hostname }} — config restored from pre-change snapshot"
      when: ansible_network_os == 'ios'

    - name: Deploy banners on IOS-XR
      cisco.iosxr.iosxr_banner:
        banner: "{{ item.type }}"
        text: "{{ item.text }}"
        state: present
      loop:
        - { type: motd, text: "{{ motd_banner }}" }
        - { type: login, text: "{{ login_banner }}" }
      register: iosxr_banner_result
      when: ansible_network_os == 'iosxr'
      failed_when:
        - iosxr_banner_result.failed is defined
        - iosxr_banner_result.failed

    - name: Deploy banners on NX-OS
      cisco.nxos.nxos_banner:
        banner: "{{ item.type }}"
        text: "{{ item.text }}"
        state: present
      loop:
        - { type: motd, text: "{{ motd_banner }}" }
      register: nxos_banner_result
      when: ansible_network_os == 'nxos'

    - name: Verify banner deployment (IOS post-check)
      cisco.ios.ios_command:
        commands: show running-config | section banner
      register: post_change_banner
      when: ansible_network_os == 'ios'

    - name: Assert banner text is present in running config (IOS)
      ansible.builtin.assert:
        that:
          - "'AUTHORIZED ACCESS ONLY' in post_change_banner.stdout[0]"
        fail_msg: "Banner verification failed on {{ inventory_hostname }} — MOTD text not found in running config"
        success_msg: "Banner successfully verified on {{ inventory_hostname }}"
      when:
        - ansible_network_os == 'ios'
        - post_change_banner is defined

    - name: Display banner deployment results
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ ansible_network_os }}): banners deployed and verified"

  handlers:
    - name: save ios config
      cisco.ios.ios_command:
        commands: write memory