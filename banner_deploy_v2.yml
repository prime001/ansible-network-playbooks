---
# BGP Neighbor and Route Policy Configuration
# Configures eBGP peers, inbound/outbound prefix-lists, and max-prefix safety limits
# on Cisco IOS/IOS-XE edge and core routers.
#
# Inventory example:
#   [bgp_routers]
#   edge-rtr-01 ansible_host=10.0.1.1
#   edge-rtr-02 ansible_host=10.0.1.2
#
#   [bgp_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#
# Run: ansible-playbook bgp_neighbor_config.yml -i inventory/network.yml --ask-vault-pass

- name: Configure eBGP neighbors and route policy on Cisco IOS
  hosts: bgp_routers
  gather_facts: false

  vars:
    bgp_asn: "{{ vault_bgp_asn | default('65000') }}"
    bgp_router_id: "{{ ansible_host }}"
    max_prefixes: 1000
    max_prefixes_warning_pct: 80
    bgp_peers:
      - neighbor_ip: "{{ vault_peer1_ip | default('203.0.113.2') }}"
        remote_asn: "{{ vault_peer1_asn | default('65001') }}"
        description: "Transit Provider A"
        prefix_list_in: "TRANSIT-A-IN"
        prefix_list_out: "ADVERTISE-OUT"
      - neighbor_ip: "{{ vault_peer2_ip | default('198.51.100.6') }}"
        remote_asn: "{{ vault_peer2_asn | default('65002') }}"
        description: "Transit Provider B"
        prefix_list_in: "TRANSIT-B-IN"
        prefix_list_out: "ADVERTISE-OUT"

  tasks:
    - name: Capture pre-change BGP summary
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
      register: pre_bgp_summary
      retries: 2
      delay: 5
      ignore_errors: true

    - name: Display pre-change BGP state
      ansible.builtin.debug:
        msg: "{{ pre_bgp_summary.stdout_lines[0] }}"
      when: pre_bgp_summary.stdout is defined

    - name: Configure BGP process and neighbors
      block:
        - name: Set BGP process, router-id, and global options
          cisco.ios.ios_config:
            lines:
              - "router bgp {{ bgp_asn }}"
              - " bgp router-id {{ bgp_router_id }}"
              - " bgp log-neighbor-changes"
              - " no auto-summary"
            match: line
          register: bgp_base_result

        - name: Configure each eBGP neighbor
          cisco.ios.ios_config:
            lines:
              - " neighbor {{ item.neighbor_ip }} remote-as {{ item.remote_asn }}"
              - " neighbor {{ item.neighbor_ip }} description {{ item.description }}"
              - " neighbor {{ item.neighbor_ip }} prefix-list {{ item.prefix_list_in }} in"
              - " neighbor {{ item.neighbor_ip }} prefix-list {{ item.prefix_list_out }} out"
              - " neighbor {{ item.neighbor_ip }} maximum-prefix {{ max_prefixes }} {{ max_prefixes_warning_pct }} warning-only"
              - " neighbor {{ item.neighbor_ip }} soft-reconfiguration inbound"
            parents: "router bgp {{ bgp_asn }}"
            match: line
          loop: "{{ bgp_peers }}"
          loop_control:
            label: "{{ item.neighbor_ip }} AS{{ item.remote_asn }}"
          register: peer_results

      rescue:
        - name: Report configuration failure details
          ansible.builtin.debug:
            msg: >
              BGP config failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('check device connectivity and IOS version') }}

        - name: Halt play for this host
          ansible.builtin.fail:
            msg: "BGP neighbor configuration aborted on {{ inventory_hostname }}."

    - name: Verify neighbor sessions (allow time for BGP open)
      cisco.ios.ios_command:
        commands:
          - show ip bgp neighbors | include BGP neighbor|BGP state
      register: neighbor_state
      retries: 4
      delay: 15
      until: "'Established' in neighbor_state.stdout[0] or neighbor_state.failed"
      failed_when: false

    - name: Display post-change neighbor states
      ansible.builtin.debug:
        var: neighbor_state.stdout_lines

    - name: Save running config when changes were made
      cisco.ios.ios_config:
        save_when: modified
      register: save_result
      failed_when:
        - save_result.failed is defined
        - save_result.failed

    - name: Print configuration summary
      ansible.builtin.debug:
        msg:
          - "Device      : {{ inventory_hostname }}"
          - "Local ASN   : {{ bgp_asn }}"
          - "Router-ID   : {{ bgp_router_id }}"
          - "Peers added : {{ bgp_peers | map(attribute='neighbor_ip') | list | join(', ') }}"
          - "Config saved: {{ save_result.changed | default(false) }}"
```