---
# banner_deploy_v3.yml
# Deploys MOTD, login, and exec banners to Cisco IOS devices with pre/post
# verification and Jinja2-rendered site-specific content. Supports per-site
# banner customization via host_vars.
#
# Inventory example:
#   [wan_routers]
#   rtr-core-01 ansible_host=10.0.1.1 site_name="HQ" site_location="New York"
#   rtr-edge-02 ansible_host=10.0.2.1 site_name="BR1" site_location="Chicago"
#
#   [wan_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_secret }}
#
# Vault: ansible-vault encrypt_string 'secret' --name 'vault_net_password'

- name: Deploy and verify site-aware banners on IOS WAN routers
  hosts: wan_routers
  gather_facts: false

  vars:
    # Vault-backed credentials — define in group_vars/all/vault.yml
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_pass: "{{ vault_enable_secret }}"

    site_name: "{{ site_name | default('UNKNOWN') }}"
    site_location: "{{ site_location | default('UNKNOWN') }}"
    legal_entity: "Example Corp."

    banner_motd: |
      ******************************************************************
      * AUTHORIZED ACCESS ONLY — {{ legal_entity }}
      * Site: {{ site_name }} | Location: {{ site_location }}
      * Unauthorized use is prohibited and subject to prosecution.
      * All sessions are monitored and recorded.
      ******************************************************************

    banner_login: |
      ******************************************************************
      * {{ legal_entity }} — Restricted Network Device
      * Authenticate with your assigned credentials.
      ******************************************************************

    banner_exec: |
      -- Active session on {{ inventory_hostname }} ({{ site_name }}) --

  tasks:
    - name: Capture existing banner configuration before changes
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^banner
      register: pre_change_banners
      retries: 3
      delay: 5

    - name: Deploy all banner types
      block:
        - name: Configure MOTD banner
          cisco.ios.ios_banner:
            banner: motd
            text: "{{ banner_motd }}"
            state: present
          register: result_motd

        - name: Configure login banner
          cisco.ios.ios_banner:
            banner: login
            text: "{{ banner_login }}"
            state: present
          register: result_login

        - name: Configure exec banner
          cisco.ios.ios_banner:
            banner: exec
            text: "{{ banner_exec }}"
            state: present
          register: result_exec

      rescue:
        - name: Report banner deployment failure
          ansible.builtin.debug:
            msg: >
              Banner deployment failed on {{ inventory_hostname }}.
              Error: {{ ansible_failed_result.msg | default('See Ansible output') }}

        - name: Abort play for this host
          ansible.builtin.fail:
            msg: "Manual remediation required on {{ inventory_hostname }}."

    - name: Verify MOTD and login banners present post-change
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^banner
      register: post_change_banners
      failed_when: >
        ('banner motd' not in post_change_banners.stdout[0]) or
        ('banner login' not in post_change_banners.stdout[0])
      retries: 2
      delay: 3

    - name: Persist configuration to NVRAM when changes were made
      cisco.ios.ios_config:
        save_when: changed

    - name: Report deployment summary
      ansible.builtin.debug:
        msg:
          - "Device       : {{ inventory_hostname }} ({{ site_name }}, {{ site_location }})"
          - "MOTD changed : {{ result_motd.changed }}"
          - "Login changed: {{ result_login.changed }}"
          - "Exec changed : {{ result_exec.changed }}"
          - "Verification : PASSED