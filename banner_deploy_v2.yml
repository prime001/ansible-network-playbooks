---
# banner_deploy_v3.yml
# Multi-vendor login/MOTD banner enforcement with pre-check, dynamic content,
# and automatic rollback on push failure.
#
# Credentials are stored in Ansible Vault — encrypt with:
#   ansible-vault encrypt_string 'secret' --name 'ansible_password'
#
# Inventory example:
#   [cisco_ios]
#   core-sw1  ansible_host=10.0.1.1  ansible_network_os=ios
#   core-sw2  ansible_host=10.0.1.2  ansible_network_os=ios
#
#   [nxos]
#   dc-leaf1  ansible_host=10.0.2.1  ansible_network_os=nxos
#
#   [junos]
#   edge-fw1  ansible_host=10.0.3.1  ansible_network_os=junos
#
#   [network:children]
#   cisco_ios
#   nxos
#   junos
#
#   [network:vars]
#   ansible_user=netops
#   ansible_password=!vault |  <encrypted>
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable

- name: Multi-vendor banner compliance enforcement with rollback
  hosts: network
  gather_facts: false
  vars:
    # Override per environment or pass with -e
    org_name: "Acme Corp"
    contact_email: "noc@example.com"  # vault: ansible_vault_contact_email
    banner_compliance_string: "AUTHORIZED USE ONLY"
    max_retries: 2

    login_banner: |
      **************************************************************************
      *  {{ org_name | upper }} — AUTHORIZED PERSONNEL ONLY                   *
      *  Unauthorized access is prohibited and subject to prosecution.         *
      *  All activity is monitored and logged.                                 *
      *  Contact: {{ contact_email }}                                          *
      **************************************************************************

    motd_banner: |
      -- Managed by Ansible | Last applied: {{ ansible_date_time.date | default('N/A') }} --
      -- Device: {{ inventory_hostname }} --

  tasks:
    - name: Audit current login banner
      block:
        - name: Retrieve running banner config
          cli_command:
            command: show running-config | include banner
          register: banner_audit
          retries: "{{ max_retries }}"
          delay: 5
          until: banner_audit is not failed

        - name: Flag non-compliant devices
          set_fact:
            banner_compliant: "{{ banner_compliance_string in banner_audit.stdout }}"

        - name: Report compliance status
          debug:
            msg: >-
              {{ inventory_hostname }}: banner
              {{ 'COMPLIANT' if banner_compliant else 'NON-COMPLIANT — will remediate' }}

      rescue:
        - name: Log audit failure
          debug:
            msg: "WARN: Could not audit {{ inventory_hostname }} — skipping: {{ ansible_failed_result.msg }}"

        - name: Mark host as unreachable for remainder of play
          meta: end_host

    - name: Apply banners (IOS / IOS-XE)
      when: ansible_network_os == 'ios' and not banner_compliant
      block:
        - name: Push login banner (IOS)
          ios_banner:
            banner: login
            text: "{{ login_banner }}"
            state: present

        - name: Push MOTD banner (IOS)
          ios_banner:
            banner: motd
            text: "{{ motd_banner }}"
            state: present

      rescue:
        - name: Remove partial banner on IOS failure
          ios_banner:
            banner: login
            state: absent
          ignore_errors: true

        - name: Fail with context
          fail:
            msg: "IOS banner push failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Apply banners (NX-OS)
      when: ansible_network_os == 'nxos' and not banner_compliant
      block:
        - name: Push login banner (NX-OS)
          nxos_banner:
            banner: login
            text: "{{ login_banner }}"
            state: present

        - name: Push MOTD banner (NX-OS)
          nxos_banner:
            banner: motd
            text: "{{ motd_banner }}"
            state: present

      rescue:
        - name: Fail with context (NX-OS)
          fail:
            msg: "NX-OS banner push failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Apply banners (Junos)
      when: ansible_network_os == 'junos' and not banner_compliant
      block:
        - name: Push login banner (Junos)
          junos_banner:
            banner: login
            text: "{{ login_banner }}"
            state: present

        - name: Push MOTD banner (Junos)
          junos_banner:
            banner: motd
            text: "{{ motd_banner }}"
            state: present

      rescue:
        - name: Rollback Junos config on failure
          junos_config:
            rollback: 1
          ignore_errors: true

        - name: Fail with context (Junos)
          fail:
            msg: "Junos banner push failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Verify banner applied successfully
      cli_command:
        command: show running-config | include banner
      register: banner_verify
      failed_when: banner_compliance_string not in banner_verify.stdout
      when: not banner_compliant

    - name: Summarize results
      debug:
        msg: >-
          {{ inventory_hostname }}: banner enforcement
          {{ 'skipped (already compliant)' if banner_compliant else 'APPLIED and verified' }}