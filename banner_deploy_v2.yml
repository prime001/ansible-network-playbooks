```yaml
---
# Ansible Playbook: VLAN Configuration Management
# Purpose: Deploy and manage VLAN configurations across network devices
# Supported Platforms: Cisco IOS, IOS-XR, Nexus (NX-OS), Juniper
# Author: Network Engineering Team
#
# Inventory Example:
# [ios_devices]
# router1 ansible_host=192.168.1.1 ansible_network_os=ios
# switch1 ansible_host=192.168.1.2 ansible_network_os=ios
#
# [iosxr_devices]
# router2 ansible_host=192.168.2.1 ansible_network_os=iosxr
#
# [nxos_devices]
# switch2 ansible_host=192.168.3.1 ansible_network_os=nxos
#
# Vault Usage: ansible-vault encrypt group_vars/all/credentials.yml

- name: VLAN Configuration and Management
  hosts: "{{ target_devices | default('all') }}"
  gather_facts: no
  vars:
    ansible_connection: network_cli
    ansible_user: "{{ vault_username }}"
    ansible_password: "{{ vault_password }}"

  tasks:
    - name: Display playbook execution details
      debug:
        msg: "Managing VLANs on {{ inventory_hostname }} ({{ ansible_network_os }})"

    - name: Configure VLANs on Cisco IOS devices
      when: ansible_network_os == 'ios'
      block:
        - name: Create or modify VLANs
          ios_vlan:
            vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
            state: "{{ item.state | default('present') }}"
          register: ios_vlan_result
          loop: "{{ vlans }}"
          retries: 3
          delay: 5
          failed_when:
            - ios_vlan_result.failed
            - "'failed' not in ios_vlan_result.msg | lower"

        - name: Display IOS VLAN configuration results
          debug:
            msg: "VLAN {{ item.item.vlan_id }} - {{ item.item.name }}: {{ 'Created' if item.changed else 'Unchanged' }}"
          loop: "{{ ios_vlan_result.results }}"
          when: ios_vlan_result.results is defined

      rescue:
        - name: Handle IOS configuration failure
          debug:
            msg: "Failed to configure VLANs on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Configure VLANs on Cisco IOS-XR devices
      when: ansible_network_os == 'iosxr'
      block:
        - name: Configure VLAN via CLI
          iosxr_config:
            lines:
              - "vlan {{ item.vlan_id }}"
              - "name {{ item.name }}"
            match: line
            replace: block
          register: iosxr_vlan_result
          loop: "{{ vlans }}"
          retries: 3
          delay: 5

        - name: Commit configuration
          iosxr_config:
            commit: true
          when: iosxr_vlan_result.changed

        - name: Display IOS-XR configuration status
          debug:
            msg: "VLANs configured on {{ inventory_hostname }}"

      rescue:
        - name: Handle IOS-XR configuration failure
          debug:
            msg: "Failed to configure VLANs on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Configure VLANs on Cisco NX-OS devices
      when: ansible_network_os == 'nxos'
      block:
        - name: Create or modify VLANs
          nxos_vlan:
            vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
            state: "{{ item.state | default('present') }}"
          register: nxos_vlan_result
          loop: "{{ vlans }}"
          retries: 3
          delay: 5

        - name: Display NX-OS VLAN results
          debug:
            msg: "VLAN {{ item.item.vlan_id }} - {{ item.item.name }}: {{ 'Created' if item.changed else 'Unchanged' }}"
          loop: "{{ nxos_vlan_result.results }}"
          when: nxos_vlan_result.results is defined

      rescue:
        - name: Handle NX-OS configuration failure
          debug:
            msg: "Failed to configure VLANs on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

    - name: Verify VLAN configuration
      ios_command:
        commands:
          - "show vlan brief"
      register: vlan_verification
      when: ansible_network_os == 'ios'
      retries: 2
      delay: 3

    - name: Display VLAN verification results
      debug:
        var: vlan_verification.stdout_lines[0]
      when:
        - vlan_verification.stdout_lines is defined
        - vlan_verification.stdout_lines | length > 0

  vars:
    vlans:
      - vlan_id: 10
        name: "Management"
        state: present
      - vlan_id: 20
        name: "Data"
        state: present
      - vlan_id: 30
        name: "Voice"
        state: present
      - vlan_id: 40
        name: "Video"
        state: present
