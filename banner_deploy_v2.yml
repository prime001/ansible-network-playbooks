---
# banner_deploy_v3.yml
# Deploys MOTD and login banners across IOS and NX-OS devices with post-deploy verification.
# Credentials: ansible_user / ansible_password sourced from Ansible Vault (see vars_files below).
#
# Inventory example:
#   [ios_routers]
#   rtr-01 ansible_host=10.0.0.1
#   rtr-02 ansible_host=10.0.0.2
#
#   [nxos_switches]
#   sw-core-01 ansible_host=10.0.1.1
#
#   [network:children]
#   ios_routers
#   nxos_switches
#
#   [network:vars]
#   ansible_connection=network_cli
#   ansible_become=yes
#   ansible_become_method=enable

- name: Deploy and verify login/MOTD banners on network devices
  hosts: network
  gather_facts: false
  vars_files:
    - vault/network_creds.yml   # ansible_user, ansible_password, ansible_become_pass

  vars:
    banner_motd: |
      ******************************************************************
      *  AUTHORIZED ACCESS ONLY                                        *
      *  Unauthorized use is prohibited and subject to prosecution.    *
      *  All sessions are monitored and logged.                        *
      ******************************************************************
    banner_login: |
      -- Managed by Ansible | Contact: netops@corp.example.com --
    banner_delimiter: "@"
    deploy_timestamp: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%SZ') }}"

  tasks:
    - name: Deploy MOTD banner (IOS/IOS-XE)
      cisco.ios.ios_banner:
        banner: motd
        text: "{{ banner_motd }}"
        state: present
      when: ansible_network_os == "cisco.ios.ios"
      register: ios_motd_result
      retries: 2
      delay: 5
      failed_when:
        - ios_motd_result.failed is defined
        - ios_motd_result.failed
      rescue:
        - name: Log IOS MOTD banner failure
          ansible.builtin.debug:
            msg: "MOTD banner deploy failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"
        - name: Fail task explicitly after rescue
          ansible.builtin.fail:
            msg: "Banner deploy could not be recovered on {{ inventory_hostname }}"

    - name: Deploy login banner (IOS/IOS-XE)
      cisco.ios.ios_banner:
        banner: login
        text: "{{ banner_login }}"
        state: present
      when: ansible_network_os == "cisco.ios.ios"
      register: ios_login_result

    - name: Deploy MOTD banner (NX-OS)
      cisco.nxos.nxos_banner:
        banner: motd
        text: "{{ banner_motd }}"
        state: present
      when: ansible_network_os == "cisco.nxos.nxos"
      register: nxos_motd_result
      retries: 2
      delay: 5

    - name: Verify banner is present via show command
      ansible.netcommon.cli_command:
        command: show banner motd
      register: banner_verify
      changed_when: false
      failed_when: "'AUTHORIZED ACCESS' not in banner_verify.stdout"

    - name: Display verification result
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Banner deployed at: {{ deploy_timestamp }}"
          - "Verification excerpt: {{ banner_verify.stdout | truncate(120) }}