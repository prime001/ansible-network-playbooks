---
# banner_deploy_v3.yml
#
# Audit-first banner enforcement across multi-vendor devices.
# Reads the current banner, compares against the required legal template,
# and remediates only non-compliant devices. Generates a per-run report.
#
# Credentials: ansible-vault encrypted group_vars/network/vault.yml
#   ansible_user: "{{ vault_net_user }}"
#   ansible_password: "{{ vault_net_pass }}"
#   ansible_become_password: "{{ vault_net_enable }}"
#
# Inventory example:
#   [ios_devices]
#   core-sw-01 ansible_host=10.0.1.1 ansible_network_os=ios
#   core-sw-02 ansible_host=10.0.1.2 ansible_network_os=ios
#
#   [nxos_devices]
#   dc-spine-01 ansible_host=10.0.2.1 ansible_network_os=nxos
#
#   [junos_devices]
#   edge-fw-01  ansible_host=10.0.3.1 ansible_network_os=junos
#
#   [network:children]
#   ios_devices
#   nxos_devices
#   junos_devices
#
# Usage:
#   ansible-playbook banner_deploy_v3.yml -i inventory.yml --vault-id @prompt
#   ansible-playbook banner_deploy_v3.yml -i inventory.yml --tags audit_only

- name: Audit and enforce legal banner compliance across multi-vendor network devices
  hosts: network
  gather_facts: false
  connection: network_cli

  vars:
    banner_required_text: "AUTHORIZED ACCESS ONLY. Unauthorized use is prohibited and subject to prosecution."
    report_path: "/tmp/banner_compliance_{{ ansible_date_time.date }}.txt"
    compliance_results: []

  tasks:
    - name: Gather current MOTD banner (IOS/IOS-XE)
      cisco.ios.ios_command:
        commands: show banner motd
      register: ios_banner_output
      retries: 2
      delay: 5
      when: ansible_network_os == "ios"
      failed_when: false

    - name: Gather current MOTD banner (NX-OS)
      cisco.nxos.nxos_command:
        commands: show banner motd
      register: nxos_banner_output
      retries: 2
      delay: 5
      when: ansible_network_os == "nxos"
      failed_when: false

    - name: Gather current banner (Junos)
      junipernetworks.junos.junos_command:
        commands: show system login message
      register: junos_banner_output
      retries: 2
      delay: 5
      when: ansible_network_os == "junos"
      failed_when: false

    - name: Evaluate compliance and remediate if needed (IOS)
      tags: [remediate]
      when:
        - ansible_network_os == "ios"
        - ios_banner_output is defined
        - banner_required_text not in (ios_banner_output.stdout | join(''))
      block:
        - name: Deploy compliant MOTD banner (IOS)
          cisco.ios.ios_banner:
            banner: motd
            text: |
              **************************************************************************
              * {{ banner_required_text }}
              * All activity may be monitored and recorded.
              **************************************************************************
            state: present
          register: ios_deploy_result

        - name: Save configuration after banner update (IOS)
          cisco.ios.ios_command:
            commands: write memory
          register: ios_save_result
          failed_when: "'OK' not in ios_save_result.stdout[0] and 'Building configuration' not in ios_save_result.stdout[0]"

      rescue:
        - name: Log IOS remediation failure
          ansible.builtin.debug:
            msg: "FAILED to remediate banner on {{ inventory_hostname }}: check connectivity and privilege level"

    - name: Evaluate compliance and remediate if needed (NX-OS)
      tags: [remediate]
      when:
        - ansible_network_os == "nxos"
        - nxos_banner_output is defined
        - banner_required_text not in (nxos_banner_output.stdout | join(''))
      block:
        - name: Deploy compliant MOTD banner (NX-OS)
          cisco.nxos.nxos_banner:
            banner: motd
            text: |
              **************************************************************************
              * {{ banner_required_text }}
              * All activity may be monitored and recorded.
              **************************************************************************
            state: present
          register: nxos_deploy_result

        - name: Save configuration after banner update (NX-OS)
          cisco.nxos.nxos_command:
            commands: copy running-config startup-config
          register: nxos_save_result

      rescue:
        - name: Log NX-OS remediation failure
          ansible.builtin.debug:
            msg: "FAILED to remediate banner on {{ inventory_hostname }}: check connectivity and privilege level"

    - name: Report per-device compliance status
      tags: [audit_only, remediate]
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_network_os }}) banner status:
          {% set raw = (ios_banner_output.stdout | default(nxos_banner_output.stdout | default(junos_banner_output.stdout | default(['']))) | join('')) %}
          {% if banner_required_text in raw %}COMPLIANT{% else %}NON-COMPLIANT — remediation attempted{% endif %}
