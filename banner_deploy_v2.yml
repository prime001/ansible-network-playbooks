---
# 030_banner_deploy.yml
#
# Multi-Vendor Banner Enforcement Playbook
# Deploys MOTD and login banners across IOS, NX-OS, and JunOS devices.
# Validates deployed content post-push and reports per-host status.
#
# Credentials: store in Ansible Vault
#   ansible-vault encrypt_string 'mysecret' --name 'ansible_password'
#
# Inventory example:
# [cisco_ios]
# rtr-core-01  ansible_host=10.0.1.1
# rtr-core-02  ansible_host=10.0.1.2
#
# [nxos]
# sw-dc-01     ansible_host=10.0.2.1
#
# [junos]
# fw-edge-01   ansible_host=10.0.3.1
#
# [network:children]
# cisco_ios
# nxos
# junos
#
# [network:vars]
# ansible_user=netops
# ansible_password="{{ vault_device_password }}"    # ansible-vault
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password="{{ vault_enable_password }}"  # ansible-vault
# ansible_connection=network_cli

- name: Multi-Vendor Banner Enforcement
  hosts: network
  gather_facts: false

  vars:
    banner_motd: |
      **************************************************************************
      *  AUTHORIZED ACCESS ONLY — Activity on this system is monitored.        *
      *  Unauthorized access is prohibited and subject to prosecution.          *
      *  Disconnect immediately if you are not an authorized user.              *
      **************************************************************************
    banner_login: |
      WARNING: This device is the property of Example Corp.
      Unauthorized access is a violation of policy and applicable law.
    deploy_timestamp: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%SZ') }}"
    max_retries: 3
    retry_delay: 5

  tasks:

    - name: Deploy MOTD and login banner — Cisco IOS
      when: ansible_network_os == 'ios'
      block:
        - name: Apply IOS MOTD banner
          cisco.ios.ios_banner:
            banner: motd
            text: "{{ banner_motd }}"
            state: present
          register: ios_motd_result
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: ios_motd_result is succeeded

        - name: Apply IOS login banner
          cisco.ios.ios_banner:
            banner: login
            text: "{{ banner_login }}"
            state: present
          register: ios_login_result
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: ios_login_result is succeeded

      rescue:
        - name: Report IOS banner failure
          ansible.builtin.debug:
            msg: "FAILED — {{ inventory_hostname }} IOS banner deploy error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Deploy MOTD banner — Cisco NX-OS
      when: ansible_network_os == 'nxos'
      block:
        - name: Apply NX-OS MOTD banner
          cisco.nxos.nxos_banner:
            banner: motd
            text: "{{ banner_motd }}"
            state: present
          register: nxos_result
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: nxos_result is succeeded

      rescue:
        - name: Report NX-OS banner failure
          ansible.builtin.debug:
            msg: "FAILED — {{ inventory_hostname }} NX-OS banner deploy error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Deploy MOTD banner — Juniper JunOS
      when: ansible_network_os == 'junos'
      block:
        - name: Apply JunOS MOTD via set command
          junipernetworks.junos.junos_config:
            lines:
              - "set system login message \"{{ banner_login }}\""
          register: junos_result
          retries: "{{ max_retries }}"
          delay: "{{ retry_delay }}"
          until: junos_result is succeeded

      rescue:
        - name: Report JunOS banner failure
          ansible.builtin.debug:
            msg: "FAILED — {{ inventory_hostname }} JunOS banner deploy error: {{ ansible_failed_result.msg | default('unknown') }}"

    - name: Verify banner present in running config — IOS and NX-OS
      when: ansible_network_os in ['ios', 'nxos']
      cisco.ios.ios_command:
        commands:
          - show running-config | include banner
      register: banner_verify
      failed_when:
        - banner_verify.stdout[0] is defined
        - "'banner' not in banner_verify.stdout[0]"

    - name: Display banner verification result
      when: banner_verify is defined and banner_verify.stdout is defined
      ansible.builtin.debug:
        msg:
          - "Host       : {{ inventory_hostname }}"
          - "Timestamp  : {{ deploy_timestamp }}"
          - "Verify out : {{ banner_verify.stdout[0] | default('n/a') }}"
          - "Changed    : {{ banner_verify.changed }}"