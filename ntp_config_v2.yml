```yaml
---
# NTP Authentication and Access Control Playbook
# Configures NTP MD5 authentication keys, trusted-key associations,
# and access-group restrictions to secure time synchronization.
# Distinct from ntp_config*.yml which handles server/peer configuration only.
#
# Inventory example:
#   [core_switches]
#   sw-core-01 ansible_host=10.0.1.10 ansible_network_os=ios
#   sw-core-02 ansible_host=10.0.1.11 ansible_network_os=ios
#
#   [core_switches:vars]
#   ansible_user=netadmin
#   ansible_password="{{ vault_net_password }}"   # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass="{{ vault_enable_secret }}" # ansible-vault encrypted

- name: Configure NTP Authentication and Access Controls
  hosts: core_switches
  gather_facts: false
  connection: network_cli

  vars:
    ntp_auth_key_id: 1
    ntp_auth_key_string: "{{ vault_ntp_auth_key }}"  # ansible-vault
    ntp_trusted_servers:
      - "10.0.0.10"
      - "10.0.0.11"
    ntp_acl_name: NTP_PERMIT_SERVERS
    ntp_acl_permit_subnet: "10.0.0.0"
    ntp_acl_wildcard: "0.0.0.255"

  tasks:
    - name: Configure NTP authentication and ACL
      block:
        - name: Configure NTP MD5 authentication key
          cisco.ios.ios_config:
            lines:
              - "ntp authentication-key {{ ntp_auth_key_id }} md5 {{ ntp_auth_key_string }}"
              - "ntp authenticate"
              - "ntp trusted-key {{ ntp_auth_key_id }}"
          no_log: true
          register: ntp_auth_result
          retries: 2
          delay: 5
          until: ntp_auth_result is not failed

        - name: Create NTP access ACL
          cisco.ios.ios_acls:
            config:
              - afi: ipv4
                acls:
                  - name: "{{ ntp_acl_name }}"
                    acl_type: standard
                    aces:
                      - sequence: 10
                        grant: permit
                        source:
                          address: "{{ ntp_acl_permit_subnet }}"
                          wildcard_bits: "{{ ntp_acl_wildcard }}"
            state: merged

        - name: Apply NTP access-group to restrict queries
          cisco.ios.ios_config:
            lines:
              - "ntp access-group peer {{ ntp_acl_name }}"
              - "ntp access-group serve-only {{ ntp_acl_name }}"

        - name: Verify NTP authentication status
          cisco.ios.ios_command:
            commands:
              - show ntp associations detail
              - show ntp status
          register: ntp_verify_output
          failed_when: >
            'synchronized' not in ntp_verify_output.stdout[1] and
            'Clock is unsynchronized' not in ntp_verify_output.stdout[1]

        - name: Display NTP synchronization status
          ansible.builtin.debug:
            msg: "{{ ntp_verify_output.stdout_lines[1] }}"

      rescue:
        - name: Collect diagnostic output on failure
          cisco.ios.ios_command:
            commands:
              - show ntp associations
              - show logging last 20
          register: ntp_diag_output
          ignore_errors: true

        - name: Report failure with diagnostics
          ansible.builtin.debug:
            msg:
              - "NTP auth configuration failed on {{ inventory_hostname }}"
              - "NTP associations: {{ ntp_diag_output.stdout_lines[0] | default('unavailable') }}"
              - "Recent syslog: {{ ntp_diag_output.stdout_lines[1] | default('unavailable') }}"

        - name: Fail with context
          ansible.builtin.fail:
            msg: "NTP authentication setup failed on {{ inventory_hostname }} — see diagnostics above"
```