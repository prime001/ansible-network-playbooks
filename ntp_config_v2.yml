---
# 031_ntp_config.yml
# NTP Authentication and Stratum Verification — Multi-Vendor
#
# Configures NTP with MD5 authentication keys and validates stratum
# reachability post-deployment. Distinct from prior NTP playbooks
# (001/011/021) which cover basic server push; this playbook adds
# key-based auth and post-change drift assertions.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.0.1  ansible_network_os=ios
#   rtr-core-02  ansible_host=10.0.0.2  ansible_network_os=ios
#   rtr-edge-01  ansible_host=10.0.1.1  ansible_network_os=nxos
#
# Vault: ansible-vault encrypt_string '<password>' --name 'ntp_auth_key'
#        store result in group_vars/all/vault.yml

- name: NTP Authentication and Stratum Verification
  hosts: core_routers
  gather_facts: false
  connection: network_cli

  vars:
    # Override via group_vars or ansible-vault
    ntp_key_id: 1
    ntp_auth_key: "{{ vault_ntp_auth_key }}"        # vault-encrypted
    ntp_servers:
      - address: 10.0.254.10
        prefer: true
      - address: 10.0.254.11
        prefer: false
    ntp_source_interface: Loopback0
    ntp_max_stratum: 4                               # fail if stratum exceeds this
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_pass: "{{ vault_enable_password }}"

  tasks:

    - name: Push NTP authentication key (IOS/IOS-XE)
      cisco.ios.ios_config:
        lines:
          - "ntp authentication-key {{ ntp_key_id }} md5 {{ ntp_auth_key }}"
          - ntp authenticate
          - "ntp trusted-key {{ ntp_key_id }}"
      when: ansible_network_os == "ios"
      notify: save ios config

    - name: Push NTP server entries with auth key (IOS/IOS-XE)
      cisco.ios.ios_config:
        lines: >-
          {{
            ntp_servers | map(
              attribute='address'
            ) | map('regex_replace', '^(.*)$',
              'ntp server \1 key ' + (ntp_key_id | string)
              + (' prefer' if item.prefer else '')
            ) | list
          }}
      loop: "{{ ntp_servers }}"
      loop_control:
        label: "{{ item.address }}"
      when: ansible_network_os == "ios"

    - name: Configure NTP source interface (IOS/IOS-XE)
      cisco.ios.ios_config:
        lines:
          - "ntp source {{ ntp_source_interface }}"
      when:
        - ansible_network_os == "ios"
        - ntp_source_interface is defined

    - name: Push NTP config (NX-OS)
      cisco.nxos.nxos_config:
        lines:
          - "ntp authentication-key {{ ntp_key_id }} md5 {{ ntp_auth_key }}"
          - ntp authenticate
          - "ntp trusted-key {{ ntp_key_id }}"
          - "ntp server {{ item.address }} key {{ ntp_key_id }}{{ ' prefer' if item.prefer else '' }}"
          - "ntp source-interface {{ ntp_source_interface }}"
      loop: "{{ ntp_servers }}"
      loop_control:
        label: "{{ item.address }}"
      when: ansible_network_os == "nxos"

    - name: Verify NTP associations after config push
      block:
        - name: Query NTP associations
          cisco.ios.ios_command:
            commands: show ntp associations detail
            wait_for:
              - result[0] contains "our_master"
            retries: 6
            interval: 10
          register: ntp_assoc_output
          when: ansible_network_os == "ios"

        - name: Assert stratum is within acceptable range
          ansible.builtin.assert:
            that:
              - ntp_assoc_output.stdout[0] is search("stratum [1-" + ntp_max_stratum | string + "]")
            fail_msg: >
              NTP stratum on {{ inventory_hostname }} exceeds {{ ntp_max_stratum }}
              or no synchronized peer found. Output: {{ ntp_assoc_output.stdout[0][:300] }}
            success_msg: "NTP synchronized within acceptable stratum on {{ inventory_hostname }}"
          when: ansible_network_os == "ios"

        - name: Display NTP status summary
          ansible.builtin.debug:
            msg: "{{ ntp_assoc_output.stdout_lines[0][:20] }}"
          when: ansible_network_os == "ios"

      rescue:
        - name: Log NTP sync failure
          ansible.builtin.debug:
            msg: >
              WARNING: {{ inventory_hostname }} did not achieve NTP sync within timeout.
              Manual verification required. Check reachability to {{ ntp_servers | map(attribute='address') | list }}.

        - name: Fail the play on sync timeout
          ansible.builtin.fail:
            msg: "NTP sync verification failed on {{ inventory_hostname }}"

  handlers:
    - name: save ios config
      cisco.ios.ios_command:
        commands: write memory