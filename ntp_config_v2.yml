---
# ntp_auth_config.yml
# Configures NTP authentication (MD5 keys, trusted-key) on Cisco IOS devices and verifies sync.
# Extends basic NTP server config with authentication hardening and post-change validation.
# Credentials stored in Ansible Vault — reference group_vars/all/vault.yml
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable }}

- name: Configure NTP Authentication and Verify Synchronization
  hosts: core_routers
  gather_facts: false

  vars:
    ntp_key_id: 1
    ntp_key_value: "{{ vault_ntp_auth_key }}"   # ansible-vault encrypted string
    ntp_servers:
      - address: "10.0.0.100"
        prefer: true
      - address: "10.0.0.101"
        prefer: false
    ntp_sync_retries: 4
    ntp_sync_delay: 15

  tasks:
    - name: Enable NTP authentication and configure MD5 key
      block:
        - name: Apply NTP authentication global config
          cisco.ios.ios_config:
            lines:
              - "ntp authenticate"
              - "ntp authentication-key {{ ntp_key_id }} md5 {{ ntp_key_value }}"
              - "ntp trusted-key {{ ntp_key_id }}"
            save_when: changed
          register: ntp_auth_config

        - name: Bind NTP servers to authentication key
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ ntp_key_id }}{{ ' prefer' if item.prefer else '' }}"
          loop: "{{ ntp_servers }}"
          register: ntp_server_config

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "NTP auth config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown') }}"

        - name: Abort with descriptive error
          ansible.builtin.fail:
            msg: "Halting — NTP authentication configuration did not complete on {{ inventory_hostname }}"

    - name: Verify NTP synchronization (retry up to {{ ntp_sync_retries }}x)
      cisco.ios.ios_command:
        commands:
          - show ntp status
          - show ntp associations
      register: ntp_status
      retries: "{{ ntp_sync_retries }}"
      delay: "{{ ntp_sync_delay }}"
      until: >
        'Clock is synchronized' in ntp_status.stdout[0] or
        'synchronized' in ntp_status.stdout[0]
      failed_when: false

    - name: Display NTP status output
      ansible.builtin.debug:
        msg: "{{ ntp_status.stdout_lines[0] }}"

    - name: Display NTP peer associations
      ansible.builtin.debug:
        msg: "{{ ntp_status.stdout_lines[1] }}"

    - name: Warn if NTP not yet synchronized
      ansible.builtin.debug:
        msg: >
          WARNING: {{ inventory_hostname }} NTP did not reach synchronized state after
          {{ ntp_sync_retries }} attempts ({{ ntp_sync_retries * ntp_sync_delay }}s).
          Clock drift may require additional convergence time.
      when: >
        'Clock is synchronized' not in ntp_status.stdout[0] and
        'synchronized' not in ntp_status.stdout[0]