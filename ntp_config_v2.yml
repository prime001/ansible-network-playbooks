# NTP Authentication Configuration
# Hardens NTP by enabling MD5 key-based authentication between this device
# and its upstream time sources, preventing time-spoofing/injection attacks.
#
# Credentials: store vault_ntp_auth_key, vault_net_user, vault_net_password,
# and vault_enable_password in ansible-vault (ansible-vault encrypt_string).
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.1.10
#   rtr-core-02  ansible_host=10.0.1.11
#
#   [distribution_switches]
#   sw-dist-01   ansible_host=10.0.2.10
#
#   [ntp_clients:children]
#   core_routers
#   distribution_switches
#
#   [ntp_clients:vars]
#   ansible_network_os=ios
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: Configure NTP MD5 Authentication on Cisco IOS Devices
  hosts: ntp_clients
  gather_facts: false
  connection: network_cli

  vars:
    ntp_auth_key_id: 1
    ntp_auth_key_string: "{{ vault_ntp_auth_key }}"  # ansible-vault encrypted
    ntp_servers:
      - address: "10.0.0.10"
        prefer: true
      - address: "10.0.0.11"
        prefer: false

  tasks:
    - name: Apply NTP authentication configuration
      block:
        - name: Configure NTP auth key, enable authentication, and mark key as trusted
          cisco.ios.ios_config:
            lines:
              - "ntp authentication-key {{ ntp_auth_key_id }} md5 {{ ntp_auth_key_string }}"
              - "ntp authenticate"
              - "ntp trusted-key {{ ntp_auth_key_id }}"
            save_when: changed

        - name: Configure NTP servers with authentication key binding
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ ntp_auth_key_id }}{{ ' prefer' if item.prefer else '' }}"
            save_when: changed
          loop: "{{ ntp_servers }}"

        - name: Wait for NTP to synchronize with authenticated peer
          cisco.ios.ios_command:
            commands:
              - show ntp status
              - show ntp associations detail
          register: ntp_verify
          retries: 4
          delay: 15
          until: "'synchronized' in ntp_verify.stdout[0]"

      rescue:
        - name: Report failure details
          ansible.builtin.debug:
            msg: >-
              NTP auth configuration failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('unknown error — check device reachability and vault key') }}

        - name: Fail with remediation guidance
          ansible.builtin.fail:
            msg: >-
              NTP authentication setup failed on {{ inventory_hostname }}.
              Verify vault_ntp_auth_key matches the key on all NTP servers,
              UDP/TCP 123 is not filtered, and the device clock is within 1000s of server time.

    - name: Display NTP synchronization status
      ansible.builtin.debug:
        msg: "{{ ntp_verify.stdout_lines[0] }}"
      when: ntp_verify is defined and ntp_verify.stdout is defined

    - name: Display NTP authenticated peer associations
      ansible.builtin.debug:
        msg: "{{ ntp_verify.stdout_lines[1] }}"
      when: ntp_verify is defined and ntp_verify.stdout is defined