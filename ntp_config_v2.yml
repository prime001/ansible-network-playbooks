---
# ntp_auth_config.yml
# Hardens NTP by enabling MD5 peer authentication on Cisco IOS devices.
# Complements basic NTP server config (ntp_config.yml / ntp_config_v2.yml) by
# adding cryptographic key binding, trusted-key enforcement, and sync validation.
#
# Usage:
#   ansible-playbook ntp_auth_config.yml -i inventory/production --ask-vault-pass
#
# Inventory example:
#   [distribution_switches]
#   sw-dist-01 ansible_host=10.10.1.10
#   sw-dist-02 ansible_host=10.10.1.11
#
#   [distribution_switches:vars]
#   ansible_user=netadmin
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_password=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     636661643530336566653939...
#   vault_ntp_auth_key=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     346237613263396664653939...

- name: Configure NTP MD5 Authentication on Cisco IOS Distribution Layer
  hosts: distribution_switches
  gather_facts: false
  vars:
    ntp_auth_key_id: 10
    ntp_auth_key: "{{ vault_ntp_auth_key }}"   # ansible-vault encrypt_string
    ntp_servers:
      - { address: "10.0.0.1", prefer: true }
      - { address: "10.0.0.2", prefer: false }
    ntp_sync_timeout_seconds: 60

  tasks:
    - name: Apply NTP authentication configuration
      block:
        - name: Enable NTP auth global flag and register trusted key
          cisco.ios.ios_config:
            lines:
              - ntp authenticate
              - "ntp authentication-key {{ ntp_auth_key_id }} md5 {{ ntp_auth_key }}"
              - "ntp trusted-key {{ ntp_auth_key_id }}"
            save_when: changed
          register: ntp_auth_config
          retries: 2
          delay: 5
          until: ntp_auth_config is not failed

        - name: Bind NTP servers to authentication key
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ ntp_auth_key_id }}{{ ' prefer' if item.prefer else '' }}"
            save_when: changed
          loop: "{{ ntp_servers }}"
          register: ntp_server_config
          retries: 2
          delay: 5
          until: ntp_server_config is not failed

        - name: Poll NTP status — allow time for synchronization
          cisco.ios.ios_command:
            commands:
              - show ntp status
              - show ntp associations
          register: ntp_status
          retries: 4
          delay: "{{ (ntp_sync_timeout_seconds / 4) | int }}"
          until: "'synchronized' in ntp_status.stdout[0] | lower"
          failed_when: false

        - name: Assert at least one peer was selected
          ansible.builtin.assert:
            that: "'*' in ntp_status.stdout[1]"
            fail_msg: "No NTP peer selected on {{ inventory_hostname }} — check reachability and key mismatch"
            success_msg: "NTP peer selected on {{ inventory_hostname }}"

        - name: Display NTP synchronization summary
          ansible.builtin.debug:
            msg:
              - "Device      : {{ inventory_hostname }}"
              - "Synchronized: {{ 'YES' if 'synchronized' in ntp_status.stdout[0] | lower else 'PENDING' }}"
              - "Status line : {{ ntp_status.stdout[0].splitlines()[0] }}"
              - "Associations: {{ ntp_status.stdout[1] }}"

      rescue:
        - name: Collect current NTP running config for diagnostics
          cisco.ios.ios_command:
            commands: show running-config | section ntp
          register: ntp_running
          ignore_errors: true

        - name: Display NTP running config
          ansible.builtin.debug:
            var: ntp_running.stdout_lines

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: >
              NTP authentication setup failed on {{ inventory_hostname }}.
              Verify: (1) key ID matches NTP server config, (2) MD5 key value matches,
              (3) IOS version supports 'ntp authenticate', (4) vault decryption succeeded.