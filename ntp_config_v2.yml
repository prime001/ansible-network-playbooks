---
# Playbook: ntp_auth_config.yml
# Purpose: Harden NTP by enabling MD5 key authentication and verifying
#          synchronization. Prevents rogue-server injection attacks.
#          Basic server/source config is handled by ntp_config.yml.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.10.1.1
#   rtr-core-02  ansible_host=10.10.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_pass }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }}
#
# Vault usage: ansible-vault encrypt_string 'secret' --name 'vault_ntp_md5_key'

- name: Configure NTP MD5 authentication and verify synchronization
  hosts: core_routers
  gather_facts: false
  vars:
    ntp_key_id: 10
    ntp_key_value: "{{ vault_ntp_md5_key }}"
    ntp_servers:
      - { address: "10.0.1.10", prefer: true }
      - { address: "10.0.1.11", prefer: false }
    ntp_source_intf: Loopback0
    ntp_sync_retries: 9
    ntp_sync_interval: 10

  tasks:
    - name: Apply NTP authentication configuration
      block:
        - name: Enable NTP authentication and define trusted key
          cisco.ios.ios_config:
            lines:
              - "ntp authenticate"
              - "ntp authentication-key {{ ntp_key_id }} md5 {{ ntp_key_value }}"
              - "ntp trusted-key {{ ntp_key_id }}"
              - "ntp source {{ ntp_source_intf }}"
            save_when: changed
          register: ntp_auth_cfg
          retries: 2
          delay: 5
          until: ntp_auth_cfg is not failed

        - name: Bind authenticated key to each NTP server
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ ntp_key_id }}{{ ' prefer' if item.prefer else '' }}"
            save_when: changed
          loop: "{{ ntp_servers }}"
          register: ntp_server_cfg

        - name: Wait for NTP clock to synchronize
          cisco.ios.ios_command:
            commands:
              - show ntp status
            wait_for:
              - result[0] contains "Clock is synchronized"
            retries: "{{ ntp_sync_retries }}"
            interval: "{{ ntp_sync_interval }}"
          register: ntp_status

        - name: Collect NTP association detail for audit record
          cisco.ios.ios_command:
            commands:
              - show ntp associations detail
          register: ntp_assoc
          failed_when:
            - ntp_assoc.stdout[0] is not defined or ntp_assoc.stdout[0] | length == 0

        - name: Display synchronization and association summary
          ansible.builtin.debug:
            msg:
              - "Device     : {{ inventory_hostname }}"
              - "NTP status : {{ ntp_status.stdout_lines[0][:4] }}"
              - "Associations:"
              - "{{ ntp_assoc.stdout_lines[0][:8] }}"

      rescue:
        - name: Report failure details
          ansible.builtin.debug:
            msg: >
              NTP auth config failed on {{ inventory_hostname }}:
              {{ ansible_failed_task.name }} — {{ ansible_failed_result.msg | default('see device logs') }}

        - name: Roll back authentication config on failure
          cisco.ios.ios_config:
            lines:
              - "no ntp authenticate"
              - "no ntp authentication-key {{ ntp_key_id }}"
              - "no ntp trusted-key {{ ntp_key_id }}"
            save_when: always
          ignore_errors: true

        - name: Abort with actionable error
          ansible.builtin.fail:
            msg: >
              NTP authentication failed on {{ inventory_hostname }} and was reverted.
              Verify key value in vault, reachability to {{ ntp_servers | map(attribute='address') | list }},
              and that the source interface {{ ntp_source_intf }} is up.