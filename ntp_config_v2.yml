---
# bgp_neighbor_config.yml
# Configures eBGP and iBGP neighbor relationships on Cisco IOS/IOS-XE devices.
# Supports MD5 authentication, custom timers, and soft-reconfiguration inbound.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_network_user }}
#   ansible_password={{ vault_network_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_password }}

- name: Configure BGP Neighbors on IOS/IOS-XE Devices
  hosts: core_routers
  gather_facts: false

  vars:
    # Credentials sourced from Ansible Vault — encrypt with: ansible-vault encrypt_string
    ansible_user: "{{ vault_network_user }}"
    ansible_password: "{{ vault_network_password }}"
    ansible_become_pass: "{{ vault_enable_password }}"

    bgp_local_as: "{{ bgp_local_as | default('65001') }}"
    bgp_neighbors:
      - peer_ip: "10.0.0.2"
        remote_as: "65002"
        description: "eBGP-UPSTREAM-ISP-01"
        password: "{{ vault_bgp_md5_password }}"
        keepalive: 30
        hold: 90
      - peer_ip: "192.168.1.2"
        remote_as: "65001"
        description: "iBGP-CORE-RTR-02"
        password: "{{ vault_bgp_md5_password }}"
        keepalive: 60
        hold: 180

  tasks:
    - name: Confirm BGP process exists before modifying neighbors
      cisco.ios.ios_command:
        commands: "show ip bgp summary"
      register: bgp_pre_check
      failed_when: false

    - name: Configure BGP neighbors with auth and timers
      block:
        - name: Push BGP neighbor stanzas
          cisco.ios.ios_config:
            lines:
              - "neighbor {{ item.peer_ip }} remote-as {{ item.remote_as }}"
              - "neighbor {{ item.peer_ip }} description {{ item.description }}"
              - "neighbor {{ item.peer_ip }} password {{ item.password }}"
              - "neighbor {{ item.peer_ip }} timers {{ item.keepalive }} {{ item.hold }}"
              - "neighbor {{ item.peer_ip }} soft-reconfiguration inbound"
              - "neighbor {{ item.peer_ip }} send-community"
            parents: "router bgp {{ bgp_local_as }}"
          loop: "{{ bgp_neighbors }}"
          register: bgp_push_result
          retries: 2
          delay: 5
          until: bgp_push_result is not failed

        - name: Poll for BGP session establishment
          cisco.ios.ios_command:
            commands: "show ip bgp neighbors {{ item.peer_ip }} | include BGP state"
          loop: "{{ bgp_neighbors }}"
          register: bgp_state_poll
          retries: 6
          delay: 10
          until: "'Established' in (bgp_state_poll.stdout | join(''))"
          failed_when: false

      rescue:
        - name: Collect BGP section from running config for diagnostics
          cisco.ios.ios_command:
            commands: "show running-config | section router bgp"
          register: bgp_diag

        - name: Log failure context
          ansible.builtin.debug:
            msg: |
              BGP neighbor config failed on {{ inventory_hostname }}.
              BGP config snapshot: {{ bgp_diag.stdout[0] }}

        - name: Abort with actionable message
          ansible.builtin.fail:
            msg: "BGP neighbor configuration failed on {{ inventory_hostname }} — see debug output above"

    - name: Retrieve final BGP summary
      cisco.ios.ios_command:
        commands: "show ip bgp summary"
      register: bgp_final_summary

    - name: Display BGP neighbor table
      ansible.builtin.debug:
        msg: "{{ bgp_final_summary.stdout_lines[0] }}