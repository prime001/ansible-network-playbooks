---
# ntp_auth_verify.yml — Configure NTP MD5 authentication and verify clock synchronization
#
# Differentiator: adds authentication key binding and sync-state verification,
# complementing the basic NTP server configs in ntp_config.yml / ntp_config_v2.yml
#
# Inventory example (inventory/network.yml):
#   all:
#     children:
#       routers:
#         hosts:
#           core-rtr-01:
#             ansible_host: 10.0.0.1
#           core-rtr-02:
#             ansible_host: 10.0.0.2
#         vars:
#           ansible_network_os: ios
#           ansible_connection: network_cli
#           ansible_user: "{{ vault_net_user }}"
#           ansible_password: "{{ vault_net_password }}"
#           ansible_become: true
#           ansible_become_method: enable
#           ansible_become_password: "{{ vault_enable_password }}"

- name: Configure NTP MD5 authentication and verify synchronization on IOS devices
  hosts: routers
  gather_facts: false
  vars:
    # Credentials sourced from vault: ansible-vault encrypt group_vars/all/vault.yml
    ntp_key_id: "{{ vault_ntp_key_id | default(1) }}"
    ntp_key_string: "{{ vault_ntp_md5_key }}"
    ntp_servers:
      - address: 10.0.1.10
        preferred: true
      - address: 10.0.1.11
        preferred: false
    ntp_sync_retries: 10
    ntp_sync_interval: 15
    max_acceptable_stratum: 4

  tasks:
    - name: Configure NTP MD5 authentication and bind trusted servers
      block:
        - name: Apply authentication key and enforce NTP auth globally
          cisco.ios.ios_config:
            lines:
              - "ntp authentication-key {{ ntp_key_id }} md5 {{ ntp_key_string }}"
              - "ntp authenticate"
              - "ntp trusted-key {{ ntp_key_id }}"

        - name: Configure each NTP server with authentication key binding
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ ntp_key_id }}{{ ' prefer' if item.preferred else '' }}"
          loop: "{{ ntp_servers }}"

        - name: Poll until NTP clock reaches synchronized state
          cisco.ios.ios_command:
            commands: show ntp status
            wait_for:
              - result[0] contains 'Clock is synchronized'
            retries: "{{ ntp_sync_retries }}"
            interval: "{{ ntp_sync_interval }}"
          register: ntp_sync_result

        - name: Collect NTP peer associations and system clock detail
          cisco.ios.ios_command:
            commands:
              - show ntp associations
              - show clock detail
          register: ntp_assoc_result

        - name: Assert active stratum does not exceed threshold
          ansible.builtin.assert:
            that:
              - ntp_sync_result.stdout[0] | regex_search('stratum (\\d+)', '\\1') | first | int <= max_acceptable_stratum
            fail_msg: "Stratum on {{ inventory_hostname }} exceeds max of {{ max_acceptable_stratum }}"
            success_msg: "NTP synchronized within acceptable stratum on {{ inventory_hostname }}"

        - name: Report synchronization summary
          ansible.builtin.debug:
            msg:
              - "Host     : {{ inventory_hostname }}"
              - "NTP sync : {{ ntp_sync_result.stdout[0] | regex_search('Clock is \\w+[^,]*') }}"
              - "Clock    : {{ ntp_assoc_result.stdout_lines[1] | default(['(no clock detail)']) }}"

        - name: Persist configuration to NVRAM
          cisco.ios.ios_command:
            commands: write memory
          register: save_result
          failed_when: >
            'OK' not in save_result.stdout[0] and
            'Building' not in save_result.stdout[0]

      rescue:
        - name: Capture NTP diagnostic output on failure
          cisco.ios.ios_command:
            commands:
              - show ntp status
              - show ntp associations detail
          register: ntp_failure_diag
          ignore_errors: true

        - name: Display diagnostic output for failed host
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} diagnostics: {{ ntp_failure_diag.stdout_lines | default(['no output captured']) }}"

        - name: Fail with actionable error message
          ansible.builtin.fail:
            msg: >
              NTP authentication or synchronization failed on {{ inventory_hostname }}.
              Verify vault_ntp_md5_key matches the NTP server's key, confirm UDP 123
              reachability to {{ ntp_servers | map(attribute='address') | list }},
              and check 'show ntp associations detail' for auth failure flags.