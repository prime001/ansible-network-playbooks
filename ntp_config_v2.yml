---
# ntp_config_v3.yml
# NTP Authentication Hardening — configures MD5 auth keys, enables authenticated
# peering, and verifies synchronization status post-change.
#
# Credentials: store ansible_password and vault_ntp_auth_key in vault:
#   ansible-vault encrypt_string 'secretkey' --name vault_ntp_auth_key
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.0.1
#   rtr-core-02 ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user=netadmin
#   ansible_password=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     <encrypted_string>

- name: Configure NTP authentication hardening on Cisco IOS devices
  hosts: core_routers
  gather_facts: false

  vars:
    ntp_auth_key_id: 1
    # vault_ntp_auth_key must be defined in group_vars/all/vault.yml
    ntp_auth_key: "{{ vault_ntp_auth_key }}"
    ntp_servers:
      - address: 192.0.2.10
        prefer: true
      - address: 192.0.2.11
        prefer: false
    ntp_sync_timeout_retries: 6
    ntp_sync_retry_delay: 10

  tasks:
    - name: Apply NTP authentication configuration
      block:
        - name: Enable NTP authentication and configure key
          cisco.ios.ios_config:
            lines:
              - "ntp authenticate"
              - "ntp authentication-key {{ ntp_auth_key_id }} md5 {{ ntp_auth_key }}"
              - "ntp trusted-key {{ ntp_auth_key_id }}"
          register: ntp_auth_push
          retries: 2
          delay: 5
          until: ntp_auth_push is not failed

        - name: Bind NTP servers to authentication key
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ ntp_auth_key_id }}{{ ' prefer' if item.prefer else '' }}"
          loop: "{{ ntp_servers }}"
          loop_control:
            label: "{{ item.address }}"
          register: ntp_server_push

        - name: Poll for NTP synchronization (up to {{ ntp_sync_timeout_retries }} attempts)
          cisco.ios.ios_command:
            commands:
              - show ntp status
              - show ntp associations detail
          register: ntp_verify
          retries: "{{ ntp_sync_timeout_retries }}"
          delay: "{{ ntp_sync_retry_delay }}"
          until: >
            'synchronized' in ntp_verify.stdout[0] or
            'Clock is synchronized' in ntp_verify.stdout[0]
          failed_when: false

        - name: Assert NTP is synchronized
          ansible.builtin.assert:
            that:
              - "'synchronized' in ntp_verify.stdout[0] or 'Clock is synchronized' in ntp_verify.stdout[0]"
            fail_msg: >
              {{ inventory_hostname }} is not NTP-synchronized after
              {{ ntp_sync_timeout_retries * ntp_sync_retry_delay }}s.
              Check key mismatch or server reachability.
            success_msg: "{{ inventory_hostname }} NTP authenticated and synchronized"

      rescue:
        - name: Report authentication configuration failure
          ansible.builtin.debug:
            msg: >
              NTP auth hardening failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see task output above') }}

        - name: Abort with descriptive error
          ansible.builtin.fail:
            msg: >
              NTP authentication did not complete on {{ inventory_hostname }}.
              Verify vault_ntp_auth_key matches the server key and that
              NTP servers are reachable before retrying.

      always:
        - name: Display NTP status and associations
          ansible.builtin.debug:
            msg: "{{ ntp_verify.stdout_lines | default([['NTP status unavailable']]) }}