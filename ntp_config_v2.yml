---
# NTP Authentication and Peer Security Hardening
# Configures MD5 authentication keys, trusted-key bindings, and access-group
# restrictions on Cisco IOS/IOS-XE. Complements ntp_config.yml (server/source
# basics) with cryptographic peer authentication and query access control.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.10.1.1
#   rtr-core-02 ansible_host=10.10.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user="{{ vault_net_user }}"
#   ansible_password="{{ vault_net_password }}"
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password="{{ vault_net_enable_pass }}"

- name: Harden NTP with MD5 authentication and access control
  hosts: core_routers
  gather_facts: false

  vars:
    # Vault reference: ansible-vault encrypt_string '<secret>' --name 'vault_ntp_key'
    ntp_key_id: 10
    ntp_key_string: "{{ vault_ntp_key }}"
    ntp_servers:
      - address: 10.0.100.1
        prefer: true
      - address: 10.0.100.2
        prefer: false
    # Standard ACL number — must exist on device before running this playbook
    ntp_query_acl: 55

  tasks:
    - name: Apply NTP authentication hardening
      block:
        - name: Enable NTP auth and register MD5 key
          cisco.ios.ios_config:
            lines:
              - ntp authenticate
              - "ntp authentication-key {{ ntp_key_id }} md5 {{ ntp_key_string }}"
              - "ntp trusted-key {{ ntp_key_id }}"
            save_when: changed
          register: auth_cfg
          retries: 2
          delay: 5
          until: auth_cfg is not failed

        - name: Bind authentication key to each NTP server
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ ntp_key_id }}{{ ' prefer' if item.prefer else '' }}"
          loop: "{{ ntp_servers }}"
          register: server_cfg

        - name: Restrict inbound NTP queries via access-group
          cisco.ios.ios_config:
            lines:
              - "ntp access-group serve-only {{ ntp_query_acl }}"
            save_when: changed
          register: acl_cfg

        - name: Verify NTP sync status post-hardening
          cisco.ios.ios_command:
            commands:
              - show ntp status
              - show ntp associations
          register: ntp_status
          failed_when: ntp_status.stdout[0] is not defined or ntp_status.stdout[0] == ""

      rescue:
        - name: Surface device-level failure details
          ansible.builtin.debug:
            msg: >-
              NTP hardening failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default(ansible_failed_result.stdout | default('no detail')) }}

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: >-
              NTP authentication hardening incomplete on {{ inventory_hostname }}.
              Verify ACL {{ ntp_query_acl }} exists and vault_ntp_key is set.

    - name: Display NTP hardening summary
      ansible.builtin.debug:
        msg:
          - "Device         : {{ inventory_hostname }}"
          - "Auth key cfg   : {{ 'changed' if auth_cfg.changed else 'already present' }}"
          - "Server binding : {{ 'changed' if server_cfg.changed else 'already present' }}"
          - "ACL applied    : {{ 'changed' if acl_cfg.changed else 'already present' }}"
          - "NTP Status     : {{ ntp_status.stdout[0].split('\n')[0] | default('unavailable') }}