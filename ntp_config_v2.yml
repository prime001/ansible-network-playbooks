---
# bgp_config.yml
# Configures eBGP neighbors on Cisco IOS devices: neighbor auth, timers,
# prefix limits, and soft-reconfiguration. Verifies session convergence
# post-apply and captures diagnostics on failure.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.0.1 bgp_peer_ip=192.168.1.2 bgp_peer_asn=65002
#   rtr-core-02 ansible_host=10.0.0.2 bgp_peer_ip=192.168.1.6 bgp_peer_asn=65002
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable_password }}
#
# Vault: ansible-vault encrypt_string 'secret' --name 'vault_net_password'

- name: Configure eBGP neighbors on Cisco IOS routers
  hosts: core_routers
  gather_facts: false
  vars:
    # Credentials sourced from group_vars/all/vault.yml (ansible-vault)
    ansible_user: "{{ vault_net_username }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_net_enable_password }}"
    bgp_local_asn: 65001
    bgp_router_id: "{{ ansible_host }}"
    bgp_keepalive: 30
    bgp_holdtime: 90
    bgp_auth_password: "{{ vault_bgp_md5_password }}"
    bgp_max_prefixes: 500
    bgp_max_prefix_warning_pct: 80

  tasks:
    - name: Capture pre-change BGP summary
      cisco.ios.ios_command:
        commands: "show ip bgp summary"
      register: bgp_pre_check
      retries: 2
      delay: 5
      failed_when: false

    - name: Display pre-change BGP state
      ansible.builtin.debug:
        msg: "{{ bgp_pre_check.stdout_lines }}"

    - name: Apply BGP neighbor configuration
      block:
        - name: Configure BGP process and neighbor
          cisco.ios.ios_config:
            lines:
              - "bgp router-id {{ bgp_router_id }}"
              - "bgp log-neighbor-changes"
              - "timers bgp {{ bgp_keepalive }} {{ bgp_holdtime }}"
              - "neighbor {{ bgp_peer_ip }} remote-as {{ bgp_peer_asn }}"
              - "neighbor {{ bgp_peer_ip }} description EBGP-{{ bgp_peer_asn }}"
              - "neighbor {{ bgp_peer_ip }} password {{ bgp_auth_password }}"
              - "neighbor {{ bgp_peer_ip }} maximum-prefix {{ bgp_max_prefixes }} {{ bgp_max_prefix_warning_pct }}"
              - "neighbor {{ bgp_peer_ip }} soft-reconfiguration inbound"
              - "neighbor {{ bgp_peer_ip }} send-community both"
            parents: "router bgp {{ bgp_local_asn }}"
          register: bgp_apply_result
          notify: save_running_config

        - name: Wait for BGP session to establish
          cisco.ios.ios_command:
            commands: "show ip bgp neighbors {{ bgp_peer_ip }} | include BGP state"
          register: bgp_state
          retries: 8
          delay: 10
          until: "'Established' in (bgp_state.stdout | join(''))"
          failed_when:
            - bgp_state.stdout | join('') | length == 0

        - name: Display BGP session state
          ansible.builtin.debug:
            msg: "Neighbor {{ bgp_peer_ip }} on {{ inventory_hostname }}: {{ bgp_state.stdout_lines }}"

      rescue:
        - name: Log configuration failure
          ansible.builtin.debug:
            msg: >
              BGP neighbor {{ bgp_peer_ip }} (AS {{ bgp_peer_asn }}) config
              failed on {{ inventory_hostname }}: {{ ansible_failed_result | default('unknown error') }}

        - name: Collect BGP section for diagnostics
          cisco.ios.ios_command:
            commands: "show run | section router bgp"
          register: bgp_diag
          failed_when: false

        - name: Display diagnostic output
          ansible.builtin.debug:
            msg: "{{ bgp_diag.stdout_lines }}"

        - name: Raise failure with context
          ansible.builtin.fail:
            msg: >
              BGP neighbor setup failed on {{ inventory_hostname }}.
              Check diagnostic output above and verify peer reachability.

  handlers:
    - name: save_running_config
      cisco.ios.ios_command:
        commands: "write memory"
      listen: save_running_config