```yaml
---
# NTP Authentication & Security Hardening
# Configures MD5 authentication keys, trusted-key associations, and NTP
# access-group restrictions. Distinct from ntp_config.yml (basic server config)
# and ntp_config_v2.yml (multi-platform server config).
#
# Inventory example:
# [ios_routers]
# core-rtr-01 ansible_host=10.0.0.1
# core-rtr-02 ansible_host=10.0.0.2
#
# [ios_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_user }}        # ansible-vault encrypted
# ansible_password={{ vault_net_password }} # ansible-vault encrypted
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password={{ vault_enable_password }}
#
# ntp_auth_key_id: 1
# ntp_auth_key_value: "{{ vault_ntp_md5_key }}"
# ntp_trusted_key_ids: [1]
# ntp_servers:
#   - address: 10.0.1.10
#     key_id: 1
#   - address: 10.0.1.11
#     key_id: 1
# ntp_access_group_permit_acl: "NTP_SOURCES"

- name: Configure NTP authentication and access control on IOS devices
  hosts: ios_routers
  gather_facts: false

  vars:
    ntp_auth_key_id: 1
    ntp_auth_key_value: "{{ vault_ntp_md5_key }}"
    ntp_trusted_key_ids:
      - 1
    ntp_servers:
      - address: 10.0.1.10
        key_id: 1
      - address: 10.0.1.11
        key_id: 1
    ntp_access_group_permit_acl: "NTP_SOURCES"

  tasks:
    - name: Apply NTP authentication configuration
      block:
        - name: Configure NTP MD5 authentication key and trusted keys
          cisco.ios.ios_config:
            lines:
              - "ntp authenticate"
              - "ntp authentication-key {{ ntp_auth_key_id }} md5 {{ ntp_auth_key_value }}"
              - "{% for k in ntp_trusted_key_ids %}ntp trusted-key {{ k }}{% endfor %}"
          register: ntp_auth_result
          retries: 2
          delay: 5
          until: ntp_auth_result is not failed

        - name: Associate NTP servers with authentication key
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ item.key_id }}"
          loop: "{{ ntp_servers }}"
          register: ntp_server_result
          retries: 2
          delay: 5
          until: ntp_server_result is not failed

        - name: Restrict NTP queries to permitted sources
          cisco.ios.ios_config:
            lines:
              - "ntp access-group peer {{ ntp_access_group_permit_acl }}"
          register: ntp_acg_result

      rescue:
        - name: Report NTP auth configuration failure
          ansible.builtin.debug:
            msg: "NTP authentication config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Fail the play after rescue notification
          ansible.builtin.fail:
            msg: "Halting — NTP auth config could not be applied to {{ inventory_hostname }}"

    - name: Verify NTP associations show authenticated status
      cisco.ios.ios_command:
        commands:
          - show ntp associations detail
          - show ntp status
      register: ntp_verify
      failed_when: "'synchronized' not in ntp_verify.stdout[1] | lower and 'unsynchronized' not in ntp_verify.stdout[1] | lower"

    - name: Display NTP authentication association summary
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} NTP status: {{ ntp_verify.stdout[1] | regex_search('Clock is \\S+') | default('status unavailable') }}"

    - name: Flag any unauthenticated associations
      ansible.builtin.debug:
        msg: "WARNING: unauthenticated NTP peer detected on {{ inventory_hostname }}"
      when: "'unauthenticated' in ntp_verify.stdout[0] | lower"
```