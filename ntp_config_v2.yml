---
# NTP Authentication and Stratum Validation
# Configures NTP MD5 authentication keys and validates stratum reachability.
# Extends ntp_config.yml (server list) and ntp_config_v2.yml (source interface)
# by enforcing cryptographic authentication and asserting acceptable stratum depth.
#
# Inventory example:
#   [ios_routers]
#   core-rtr-01 ansible_host=10.0.0.1 ansible_network_os=ios
#   core-rtr-02 ansible_host=10.0.0.2 ansible_network_os=ios
#
#   [ios_routers:vars]
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#   ansible_connection=network_cli

- name: Configure NTP Authentication and Validate Stratum
  hosts: ios_routers
  gather_facts: false

  vars:
    # All credentials must be encrypted with: ansible-vault encrypt_string
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_enable_password }}"
    ntp_auth_key_id: 1
    ntp_auth_key_string: "{{ vault_ntp_auth_key }}"
    ntp_max_stratum: 5
    ntp_servers:
      - 10.0.0.253
      - 10.0.0.254

  tasks:
    - name: Apply NTP authentication and validate sync state
      block:
        - name: Enable NTP authentication and register trusted key
          cisco.ios.ios_config:
            lines:
              - ntp authenticate
              - "ntp authentication-key {{ ntp_auth_key_id }} md5 {{ ntp_auth_key_string }}"
              - "ntp trusted-key {{ ntp_auth_key_id }}"
            save_when: changed
          register: ntp_auth_result
          retries: 2
          delay: 5
          until: ntp_auth_result is not failed

        - name: Bind NTP servers to authentication key
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item }} key {{ ntp_auth_key_id }}"
          loop: "{{ ntp_servers }}"
          register: ntp_server_result
          retries: 2
          delay: 5
          until: ntp_server_result is not failed

        - name: Collect NTP associations and clock status
          cisco.ios.ios_command:
            commands:
              - show ntp associations detail
              - show ntp status
          register: ntp_verification
          retries: 3
          delay: 10
          until: ntp_verification is not failed

        - name: Assert at least one synchronized peer exists
          ansible.builtin.fail:
            msg: "No synchronized NTP peer — verify server reachability and authentication key"
          when: >
            'synchronized' not in ntp_verification.stdout[1] | lower and
            '*' not in ntp_verification.stdout[0]

        - name: Parse stratum from clock status output
          ansible.builtin.set_fact:
            ntp_stratum: "{{ ntp_verification.stdout[1] | regex_search('stratum (\\d+)', '\\1') | first | int }}"
          when: "'stratum' in ntp_verification.stdout[1]"

        - name: Assert stratum is within acceptable depth
          ansible.builtin.fail:
            msg: "NTP stratum {{ ntp_stratum }} exceeds configured maximum ({{ ntp_max_stratum }})"
          when: ntp_stratum is defined and ntp_stratum | int > ntp_max_stratum | int

        - name: Report NTP authentication and stratum results
          ansible.builtin.debug:
            msg:
              - "Host       : {{ inventory_hostname }}"
              - "Auth config: {{ ntp_auth_result.changed | ternary('updated', 'already correct') }}"
              - "Stratum    : {{ ntp_stratum | default('unknown') }}"
              - "Clock state: {{ ntp_verification.stdout[1] | regex_search('Clock is (\\S+)', '\\1') | first | default('unknown') }}"

      rescue:
        - name: Log configuration failure
          ansible.builtin.debug:
            msg: "NTP auth/validation failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Capture live NTP state for post-mortem
          cisco.ios.ios_command:
            commands:
              - show ntp associations
              - show run | include ntp
          register: ntp_diagnostic
          ignore_errors: true

        - name: Emit diagnostic output
          ansible.builtin.debug:
            var: ntp_diagnostic.stdout_lines
          when: ntp_diagnostic is defined

        - name: Propagate failure after rescue
          ansible.builtin.fail:
            msg: "NTP authentication setup failed on {{ inventory_hostname }} — review diagnostic output above