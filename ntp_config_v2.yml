```yaml
---
# NTP Authentication and Source Interface Hardening
# Configures NTP with MD5 authentication keys, trusted key enforcement,
# source interface binding, and access-group restrictions.
#
# Credentials stored in Ansible Vault — encrypt with:
#   ansible-vault encrypt_string 'secret' --name 'ansible_password'
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.1.1
#   rtr-core-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_user=netadmin
#   ansible_password=!vault |
#     $ANSIBLE_VAULT;1.1;AES256
#     ...
#   ansible_become=yes
#   ansible_become_method=enable

- name: Harden NTP with authentication, source binding, and access control
  hosts: core_routers
  gather_facts: false
  connection: network_cli

  vars:
    ntp_auth_key_id: 1
    ntp_auth_key_type: md5
    # ntp_auth_key_secret: "{{ vault_ntp_auth_key }}"
    ntp_auth_key_secret: "NTPauth@2024!"
    ntp_servers:
      - address: 10.0.0.10
        prefer: true
      - address: 10.0.0.11
        prefer: false
    ntp_source_interface: Loopback0
    ntp_access_group_permit: NTP_SERVERS_ACL

  tasks:
    - name: Apply NTP authentication and server configuration
      block:
        - name: Configure NTP authentication key and trusted key
          cisco.ios.ios_config:
            lines:
              - "ntp authenticate"
              - "ntp authentication-key {{ ntp_auth_key_id }} {{ ntp_auth_key_type }} {{ ntp_auth_key_secret }}"
              - "ntp trusted-key {{ ntp_auth_key_id }}"
          register: ntp_auth_result
          retries: 2
          delay: 5
          until: ntp_auth_result is not failed

        - name: Configure NTP servers with authentication key reference
          cisco.ios.ios_config:
            lines:
              - "ntp server {{ item.address }} key {{ ntp_auth_key_id }}{% if item.prefer %} prefer{% endif %}"
          loop: "{{ ntp_servers }}"
          register: ntp_server_result

        - name: Bind NTP to source interface
          cisco.ios.ios_config:
            lines:
              - "ntp source {{ ntp_source_interface }}"
          register: ntp_source_result

        - name: Apply NTP access-group restriction
          cisco.ios.ios_config:
            lines:
              - "ntp access-group peer {{ ntp_access_group_permit }}"
          register: ntp_acl_result

      rescue:
        - name: Report NTP hardening failure
          ansible.builtin.debug:
            msg: "NTP hardening failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Fail with context
          ansible.builtin.fail:
            msg: "Halting — manual review required on {{ inventory_hostname }}"

    - name: Verify NTP authentication status
      cisco.ios.ios_command:
        commands:
          - show ntp status
          - show ntp associations detail
      register: ntp_verify
      failed_when: "'unsynchronized' in ntp_verify.stdout[0] and 'Clock is synchronized' not in ntp_verify.stdout[0]"

    - name: Display NTP synchronization status
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "NTP Status: {{ ntp_verify.stdout[0].split('\n')[0] }}"
          - "Auth configured: {{ ntp_auth_result.changed }}"
          - "Source interface: {{ ntp_source_interface }}"
```