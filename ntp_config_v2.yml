---
- name: Configure VLANs on Network Devices
  hosts: network_devices
  gather_facts: no
  vars:
    vlan_configs:
      - vlan_id: 10
        name: Management
        description: "Management VLAN"
      - vlan_id: 20
        name: Data
        description: "Data Traffic"
      - vlan_id: 30
        name: Voice
        description: "Voice Traffic"
      - vlan_id: 40
        name: Guest
        description: "Guest Network"
    
    device_username: "{{ vault_device_username }}"
    device_password: "{{ vault_device_password }}"

  tasks:
    - name: Gather network device facts
      ios_facts:
        gather_subset: all
      register: device_facts
      ignore_errors: yes

    - name: Display device OS version
      debug:
        msg: "Device {{ inventory_hostname }} running {{ device_facts.ansible_facts.ansible_net_version }}"

    - name: Configure VLANs on Cisco IOS devices
      ios_vlans:
        config: "{{ vlan_configs }}"
        state: merged
      register: vlan_result
      retries: 3
      delay: 5
      until: vlan_result is succeeded
      when: device_facts.ansible_facts.ansible_net_os == 'ios'
      rescue:
        - name: Fallback to CLI-based VLAN configuration
          ios_config:
            lines:
              - "vlan {{ item.vlan_id }}"
              - "name {{ item.name }}"
              - "description {{ item.description }}"
            parents: "vlan {{ item.vlan_id }}"
          loop: "{{ vlan_configs }}"
          register: cli_result

    - name: Verify VLAN configuration
      ios_command:
        commands:
          - "show vlan brief"
      register: vlan_verify
      failed_when: '"VLAN" not in vlan_verify.stdout[0]'
      retries: 2
      delay: 3
      when: device_facts.ansible_facts.ansible_net_os == 'ios'

    - name: Display VLAN verification
      debug:
        var: vlan_verify.stdout_lines[0]
      when: vlan_verify is defined

    - name: Save running configuration
      ios_command:
        commands:
          - "write memory"
      register: save_result
      when: vlan_result is changed or cli_result is changed

    - name: Configuration status report
      debug:
        msg: |
          Configuration Summary:
          - Device: {{ inventory_hostname }}
          - VLANs Configured: {{ vlan_configs | length }}
          - Status: {% if save_result is changed %}Saved{% else %}Verified{% endif %}
          - Timestamp: {{ ansible_date_time.iso8601 }}

# Inventory Example:
# [network_devices]
# switch1 ansible_host=192.168.1.10 ansible_network_os=ios device_type=cisco_ios
# switch2 ansible_host=192.168.1.11 ansible_network_os=ios device_type=cisco_ios
# router1 ansible_host=192.168.1.20 ansible_network_os=iosxr device_type=cisco_iosxr
#
# [network_devices:vars]
# ansible_connection=network_cli
# ansible_user=admin
# vault_device_username=admin
# vault_device_password=<encrypted_password>