Looking at the existing files, NTP config is already covered by ntp_config.yml, ntp_config_v2.yml, and numbered variants. I'll write an NTP authentication hardening + drift verification playbook — a distinct angle not covered by basic NTP server configuration.

```yaml
---
# ntp_auth_verify.yml
# Configures NTP authentication (MD5 keys + trusted-key) and verifies
# clock sync/stratum post-deployment. Distinct from ntp_config.yml
# (server list push) — this hardens existing NTP associations and
# validates the result.
#
# Credentials: ansible-vault encrypted group_vars/all/vault.yml
#   vault_net_username, vault_net_password, vault_ntp_key_string
#
# Inventory example:
# [core_routers]
# rtr-core-01 ansible_host=10.0.1.1
# rtr-core-02 ansible_host=10.0.1.2
#
# [core_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user={{ vault_net_username }}
# ansible_password={{ vault_net_password }}

- name: Harden NTP authentication and verify clock synchronisation
  hosts: core_routers
  gather_facts: false

  vars:
    ntp_key_id: 1
    ntp_key_type: md5
    ntp_key_string: "{{ vault_ntp_key_string }}"
    max_stratum: 4
    max_drift_seconds: 2
    ntp_source_interface: Loopback0

  tasks:
    - name: Apply NTP authentication key and trusted-key config
      block:
        - name: Push NTP authentication lines
          cisco.ios.ios_config:
            lines:
              - "ntp authentication-key {{ ntp_key_id }} {{ ntp_key_type }} {{ ntp_key_string }}"
              - "ntp authenticate"
              - "ntp trusted-key {{ ntp_key_id }}"
              - "ntp source {{ ntp_source_interface }}"
            save_when: changed
          register: ntp_auth_result
          retries: 2
          delay: 5
          until: ntp_auth_result is not failed

        - name: Confirm running-config reflects authentication
          cisco.ios.ios_command:
            commands: "show running-config | include ntp"
          register: ntp_running_cfg
          failed_when: "'ntp authenticate' not in ntp_running_cfg.stdout[0]"

      rescue:
        - name: Log authentication push failure
          ansible.builtin.debug:
            msg: "NTP auth config failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

        - name: Abort remaining tasks for this host
          ansible.builtin.meta: end_host

    - name: Verify NTP synchronisation status
      block:
        - name: Collect NTP associations detail
          cisco.ios.ios_command:
            commands:
              - show ntp associations detail
              - show ntp status
          register: ntp_status
          retries: 3
          delay: 10
          until: "'Clock is synchronized' in ntp_status.stdout[1]"

        - name: Parse stratum from NTP status output
          ansible.builtin.set_fact:
            current_stratum: >-
              {{ ntp_status.stdout[1]
                 | regex_search('stratum\s+(\d+)', '\1')
                 | first | int }}

        - name: Enforce stratum ceiling
          ansible.builtin.assert:
            that: current_stratum <= max_stratum
            fail_msg: >-
              {{ inventory_hostname }} stratum {{ current_stratum }}
              exceeds allowed maximum of {{ max_stratum }}
            success_msg: "Stratum {{ current_stratum }} — within policy"

      rescue:
        - name: Report sync failure after retries
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} failed to synchronise NTP within
              retry window. Manual investigation required.

    - name: Display NTP verification summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          auth_config_changed: "{{ ntp_auth_result.changed }}"
          stratum: "{{ current_stratum | default('unknown') }}"
          status_output: "{{ ntp_status.stdout[1].split('\n') | first }}"
```