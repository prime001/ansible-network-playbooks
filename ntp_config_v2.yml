---
# ntp_drift_audit.yml
#
# NTP Drift & Synchronization Audit
# Collects NTP stratum, peer status, and clock offset from network devices,
# then validates drift against configurable thresholds.  Unlike ntp_config.yml
# (which pushes NTP server config) and ntp_config_v2.yml (which handles
# authentication keys), this playbook is read-only: it audits whether time
# is actually synchronized and flags devices exceeding drift or stratum limits.
#
# Supported platforms: IOS / IOS-XE, NX-OS, JunOS (via platform vars)
#
# Credentials: use ansible-vault for ansible_user / ansible_password
#   ansible-vault encrypt_string 'mypassword' --name 'ansible_password'
#
# Inventory example:
#   [core_switches]
#   core-sw-01  ansible_host=10.0.1.1  ntp_platform=ios
#   core-sw-02  ansible_host=10.0.1.2  ntp_platform=ios
#
#   [distribution]
#   dist-sw-01  ansible_host=10.0.2.1  ntp_platform=nxos
#
#   [wan_routers]
#   wan-rtr-01  ansible_host=10.0.3.1  ntp_platform=junos
#
#   [all:vars]
#   ansible_network_os=cisco.ios.ios
#   ansible_connection=network_cli
#   ansible_user=netadmin
#   ansible_password=!vault |  # see ansible-vault above
#
# Usage:
#   ansible-playbook ntp_drift_audit.yml -i inventory/hosts.yml --ask-vault-pass
#   ansible-playbook ntp_drift_audit.yml -i inventory/hosts.yml --limit core_switches

- name: NTP Drift and Synchronization Audit
  hosts: all
  gather_facts: false

  vars:
    max_offset_ms: 500         # Flag devices with offset > 500 ms
    max_stratum: 5             # Flag devices syncing to stratum > 5
    ntp_platform: "ios"        # Override per host in inventory

    ntp_status_cmd:
      ios:   "show ntp status"
      nxos:  "show ntp status"
      junos: "show ntp status"

    ntp_peers_cmd:
      ios:   "show ntp associations detail"
      nxos:  "show ntp peer-status"
      junos: "show ntp associations detail"

  tasks:
    - name: Collect NTP status
      block:
        - name: Run NTP status command
          cisco.ios.ios_command:
            commands:
              - "{{ ntp_status_cmd[ntp_platform] }}"
              - "{{ ntp_peers_cmd[ntp_platform] }}"
          register: ntp_raw
          retries: 2
          delay: 5
          until: ntp_raw is not failed

        - name: Display raw NTP output
          ansible.builtin.debug:
            msg: "{{ ntp_raw.stdout_lines }}"

        - name: Check synchronization state (IOS / NX-OS)
          ansible.builtin.set_fact:
            ntp_synchronized: "{{ 'Clock is synchronized' in ntp_raw.stdout[0] or
                                   'synchronized' in ntp_raw.stdout[0] }}"
          when: ntp_platform in ['ios', 'nxos']

        - name: Check synchronization state (JunOS)
          ansible.builtin.set_fact:
            ntp_synchronized: "{{ 'status=0x' in ntp_raw.stdout[0] and
                                   'leap_none' in ntp_raw.stdout[0] }}"
          when: ntp_platform == 'junos'

        - name: Extract stratum from status output (IOS / NX-OS)
          ansible.builtin.set_fact:
            ntp_stratum: >-
              {{ ntp_raw.stdout[0]
                 | regex_search('stratum\s+(\d+)', '\1')
                 | first | int }}
          when:
            - ntp_platform in ['ios', 'nxos']
            - ntp_synchronized | bool

        - name: Extract offset from status output (IOS / NX-OS, milliseconds)
          ansible.builtin.set_fact:
            ntp_offset_ms: >-
              {{ (ntp_raw.stdout[0]
                 | regex_search('offset\s+([\d\.\-]+)', '\1')
                 | first | float) | abs | round(2) }}
          when:
            - ntp_platform in ['ios', 'nxos']
            - ntp_synchronized | bool

        - name: Assert device is synchronized
          ansible.builtin.assert:
            that:
              - ntp_synchronized | bool
            fail_msg: "AUDIT FAIL: {{ inventory_hostname }} NTP is NOT synchronized"
            success_msg: "OK: {{ inventory_hostname }} is NTP-synchronized"

        - name: Assert stratum within threshold
          ansible.builtin.assert:
            that:
              - ntp_stratum is defined
              - ntp_stratum | int <= max_stratum
            fail_msg: >-
              AUDIT FAIL: {{ inventory_hostname }} stratum {{ ntp_stratum }}
              exceeds threshold {{ max_stratum }}
            success_msg: >-
              OK: {{ inventory_hostname }} stratum {{ ntp_stratum }}
              (threshold {{ max_stratum }})
          when: ntp_stratum is defined

        - name: Assert offset within threshold
          ansible.builtin.assert:
            that:
              - ntp_offset_ms is defined
              - ntp_offset_ms | float <= max_offset_ms
            fail_msg: >-
              AUDIT FAIL: {{ inventory_hostname }} offset {{ ntp_offset_ms }} ms
              exceeds {{ max_offset_ms }} ms threshold
            success_msg: >-
              OK: {{ inventory_hostname }} offset {{ ntp_offset_ms }} ms
              (threshold {{ max_offset_ms }} ms)
          when: ntp_offset_ms is defined

      rescue:
        - name: Log failure and continue
          ansible.builtin.debug:
            msg: >-
              ERROR on {{ inventory_hostname }}: {{ ansible_failed_task.name }}
              — {{ ansible_failed_result.msg | default('no detail') }}.
              Device skipped; investigate connectivity or platform variable.