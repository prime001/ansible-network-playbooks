---
# BGP Neighbor State and Routing Table Facts Gathering
#
# Collects BGP peer status, prefix counts, and routing table summary
# across Cisco IOS routers. Use for pre/post-change validation,
# daily health checks, and NOC reporting.
#
# Inventory example:
#   [core_routers]
#   core-rtr-01 ansible_host=10.0.1.1
#   core-rtr-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}          # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}   # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}  # ansible-vault encrypted

- name: Gather BGP neighbor state and routing table facts
  hosts: core_routers
  gather_facts: false
  vars:
    strict_bgp_check: false    # set true to fail playbook on any non-Established peer
    report_dir: "./reports/bgp"

  tasks:
    - name: Collect BGP and routing data
      block:
        - name: Retrieve BGP summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
          register: bgp_summary
          retries: 3
          delay: 5
          until: not bgp_summary.failed

        - name: Retrieve route summary by protocol
          cisco.ios.ios_command:
            commands:
              - show ip route summary
          register: route_summary
          retries: 3
          delay: 5
          until: not route_summary.failed

        - name: Retrieve BGP neighbor session states
          cisco.ios.ios_command:
            commands:
              - show ip bgp neighbors | include BGP neighbor is|BGP state
          register: bgp_neighbor_states
          retries: 2
          delay: 5
          until: not bgp_neighbor_states.failed

      rescue:
        - name: Report collection failure
          ansible.builtin.debug:
            msg: >
              FAILED to gather BGP/routing facts from {{ inventory_hostname }}.
              Verify connectivity and vault credentials are correct.

        - name: Abort on collection failure
          ansible.builtin.fail:
            msg: "BGP fact collection aborted for {{ inventory_hostname }}"

    - name: Identify non-Established BGP peers
      ansible.builtin.set_fact:
        down_peers: >-
          {{ bgp_summary.stdout[0]
             | regex_findall('(?m)^\d{1,3}(?:\.\d{1,3}){3}\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+(?:Active|Idle|Connect|OpenSent|OpenConfirm)\b.*') }}

    - name: Display BGP summary
      ansible.builtin.debug:
        msg: "{{ bgp_summary.stdout_lines[0] }}"

    - name: Display route summary
      ansible.builtin.debug:
        msg: "{{ route_summary.stdout_lines[0] }}"

    - name: Warn on non-Established BGP peers
      ansible.builtin.debug:
        msg: "WARNING: {{ down_peers | length }} peer(s) not Established on {{ inventory_hostname }}: {{ down_peers }}"
      when: down_peers | length > 0

    - name: Fail if strict mode enabled and peers are down
      ansible.builtin.fail:
        msg: "{{ down_peers | length }} BGP peer(s) not Established on {{ inventory_hostname }}"
      when:
        - down_peers | length > 0
        - strict_bgp_check | bool

    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Write per-device BGP facts report
      ansible.builtin.copy:
        content: |
          ===== BGP Facts Report: {{ inventory_hostname }} =====

          --- BGP Summary ---
          {{ bgp_summary.stdout[0] }}

          --- Routing Table Summary ---
          {{ route_summary.stdout[0] }}

          --- BGP Neighbor Session States ---
          {{ bgp_neighbor_states.stdout[0] }}

          Non-Established peers: {{ down_peers | length }}
        dest: "{{ report_dir }}/{{ inventory_hostname }}_bgp_facts.txt"
        mode: "0644"
      delegate_to: localhost
      failed_when: false