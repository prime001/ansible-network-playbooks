---
# Ansible Playbook: BGP Neighbor State Verification
# Playbook: 035_bgp_neighbor_audit.yml
#
# Purpose:
#   Verify that all expected BGP neighbors are in the ESTABLISHED state.
#   Fails the play if any required peer is missing or not established.
#   Safe to run in production — read-only (show commands only).
#
# Modules used: cisco.ios.ios_command, ansible.utils.cli_parse
#
# Inventory example:
#   [core_routers]
#   rtr-core-01 ansible_host=10.0.0.1
#   rtr-core-02 ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_username }}        # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}    # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_secret }}
#
# Usage:
#   ansible-playbook 035_bgp_neighbor_audit.yml \
#     -i inventory/core_routers.ini \
#     --ask-vault-pass
#
# Variables (define in host_vars or group_vars, encrypted with ansible-vault):
#   vault_net_username   - SSH username
#   vault_net_password   - SSH password
#   vault_enable_secret  - Enable/privilege secret
#   bgp_expected_peers   - List of peer IPs that must be ESTABLISHED

- name: BGP Neighbor State Audit — Verify All Required Peers Are Established
  hosts: core_routers
  gather_facts: false
  connection: network_cli

  vars:
    bgp_expected_peers:
      - "10.255.0.1"
      - "10.255.0.2"
      - "172.16.100.1"
    bgp_audit_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:

    - name: Collect BGP summary from device
      cisco.ios.ios_command:
        commands:
          - show bgp summary
          - show bgp neighbors | include BGP neighbor|BGP state
      register: bgp_raw
      retries: 2
      delay: 5
      until: bgp_raw is not failed

    - name: Parse BGP neighbor states from summary output
      ansible.builtin.set_fact:
        bgp_summary_output: "{{ bgp_raw.stdout[0] }}"
        bgp_state_output: "{{ bgp_raw.stdout[1] }}"

    - name: Report full BGP summary for each device
      ansible.builtin.debug:
        msg: |
          === BGP Summary: {{ inventory_hostname }} ({{ ansible_host }}) ===
          {{ bgp_summary_output }}

    - name: Check each expected peer appears in BGP summary
      ansible.builtin.assert:
        that:
          - "item in bgp_summary_output"
        fail_msg: >
          COMPLIANCE FAIL [{{ inventory_hostname }}]:
          Expected BGP peer {{ item }} not found in 'show bgp summary'.
          Peer may be unconfigured or session was never established.
        success_msg: >
          PASS [{{ inventory_hostname }}]: Peer {{ item }} is present in BGP table.
      loop: "{{ bgp_expected_peers }}"
      register: peer_presence_check
      ignore_errors: true

    - name: Check that no expected peer shows Idle or Active state
      block:
        - name: Flag sessions not in Established state
          ansible.builtin.fail:
            msg: >
              COMPLIANCE FAIL [{{ inventory_hostname }}]:
              BGP state output indicates a non-Established session.
              Review 'show bgp neighbors' output and check peer reachability.
          failed_when: >
            ('Idle' in bgp_state_output) or
            ('Active' in bgp_state_output) or
            ('Connect' in bgp_state_output)
          when: bgp_state_output is defined

      rescue:
        - name: Log BGP state failure for remediation
          ansible.builtin.debug:
            msg: |
              [ALERT] {{ inventory_hostname }} has one or more BGP sessions
              not in Established state. Investigate immediately.
              Raw state output:
              {{ bgp_state_output }}

        - name: Persist failure flag for reporting
          ansible.builtin.set_fact:
            bgp_audit_failed: true

    - name: Summarize audit result per device
      ansible.builtin.debug:
        msg: >
          BGP Audit Complete [{{ inventory_hostname }}] at {{ bgp_audit_timestamp }}.
          Peers checked: {{ bgp_expected_peers | join(', ') }}.
          Status: {{ 'FAIL — review output above' if bgp_audit_failed | default(false) else 'PASS — all peers present and Established' }}