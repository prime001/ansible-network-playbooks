---
# Security Hardening Compliance Check for Cisco IOS Devices
# Validates devices against CIS Benchmark / NIST SP 800-53 controls:
#   - SSH v2 enforcement
#   - Service password-encryption enabled
#   - Legacy TCP/UDP small-server services disabled
#   - IP HTTP server disabled
#   - IP source-routing disabled
#   - VTY exec-timeout configured
#
# Credentials stored in Ansible Vault — see group_vars/all/vault.yml
#   ansible-vault encrypt_string 'secret' --name 'vault_net_pass'
#
# Inventory example (inventory/network.yml):
# ---
# all:
#   children:
#     cisco_ios:
#       hosts:
#         core-rtr-01:
#           ansible_host: 192.168.1.1
#           ansible_network_os: ios
#           ansible_connection: network_cli
#           ansible_user: "{{ vault_net_user }}"
#           ansible_password: "{{ vault_net_pass }}"
#           ansible_become: true
#           ansible_become_method: enable
#           ansible_become_pass: "{{ vault_enable_pass }}"

- name: IOS Security Hardening Compliance Check
  hosts: cisco_ios
  gather_facts: false

  vars:
    # Vault references — never store plaintext credentials in playbooks
    # ansible_user: "{{ vault_net_user }}"
    # ansible_password: "{{ vault_net_pass }}"
    hardening_controls:
      - name: SSH version 2 enforced
        pattern: "ip ssh version 2"
      - name: Service password-encryption enabled
        pattern: "service password-encryption"
      - name: IP source-routing disabled
        pattern: "no ip source-route"
      - name: IP HTTP server disabled
        pattern: "no ip http server"
      - name: IP HTTPS server disabled
        pattern: "no ip http secure-server"
      - name: TCP small-servers disabled
        pattern: "no service tcp-small-servers"
      - name: UDP small-servers disabled
        pattern: "no service udp-small-servers"
      - name: Finger service disabled
        pattern: "no service finger|no ip finger"

  tasks:
    - name: Collect and evaluate hardening controls
      block:
        - name: Retrieve full running configuration
          cisco.ios.ios_command:
            commands:
              - show running-config
          register: running_config
          retries: 3
          delay: 5
          until: running_config is not failed

        - name: Evaluate each hardening control against running-config
          ansible.builtin.set_fact:
            compliance_results: >-
              {{
                compliance_results | default([]) + [{
                  'check': item.name,
                  'status': 'PASS' if (running_config.stdout[0] | regex_search(item.pattern)) else 'FAIL'
                }]
              }}
          loop: "{{ hardening_controls }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Check VTY lines for exec-timeout
          cisco.ios.ios_command:
            commands:
              - show running-config | section line vty
          register: vty_config
          retries: 2
          delay: 3
          until: vty_config is not failed

        - name: Append VTY exec-timeout result
          ansible.builtin.set_fact:
            compliance_results: >-
              {{
                compliance_results + [{
                  'check': 'VTY exec-timeout configured',
                  'status': 'PASS' if (vty_config.stdout[0] | regex_search('exec-timeout [1-9]')) else 'FAIL'
                }]
              }}

        - name: Display individual control results
          ansible.builtin.debug:
            msg: "[{{ item.status }}] {{ item.check }}"
          loop: "{{ compliance_results }}"
          loop_control:
            label: "{{ item.check }}"

        - name: Report failed controls
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} FAILED controls:
              {{ compliance_results | selectattr('status', 'eq', 'FAIL') | map(attribute='check') | list }}
          when: compliance_results | selectattr('status', 'eq', 'FAIL') | list | length > 0

        - name: Fail play if any hardening control is non-compliant
          ansible.builtin.assert:
            that:
              - compliance_results | selectattr('status', 'eq', 'FAIL') | list | length == 0
            fail_msg: >-
              {{ inventory_hostname }} failed
              {{ compliance_results | selectattr('status', 'eq', 'FAIL') | list | length }}
              hardening control(s). Remediate before next audit window.
            success_msg: "{{ inventory_hostname }} is fully compliant with all hardening controls."

      rescue:
        - name: Report connection or execution failure
          ansible.builtin.debug:
            msg: >-
              Compliance check aborted on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('unknown error') }}

        - name: Abort with explicit failure for pipeline visibility
          ansible.builtin.fail:
            msg: "Hardening compliance check could not complete for {{ inventory_hostname }}.