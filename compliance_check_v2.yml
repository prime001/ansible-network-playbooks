---
# BGP Neighbor Configuration and Session Verification
# Configures iBGP/eBGP peers on IOS routers and validates Established state.
# Distinct from compliance_check.yml — this actively pushes BGP peer config,
# not just auditing existing config against policy.
#
# Inventory example (inventory/routers.yml):
#   all:
#     children:
#       core_routers:
#         hosts:
#           core-rtr-01:
#             ansible_host: 192.168.1.1
#             bgp_local_as: 65001
#           core-rtr-02:
#             ansible_host: 192.168.1.2
#             bgp_local_as: 65001
#         vars:
#           ansible_network_os: ios
#           ansible_connection: network_cli
#           ansible_user: "{{ vault_net_user }}"
#           ansible_password: "{{ vault_net_password }}"
#           ansible_become: true
#           ansible_become_method: enable
#           ansible_become_password: "{{ vault_enable_password }}"
#
# Run: ansible-playbook bgp_neighbors.yml -i inventory/routers.yml --ask-vault-pass

- name: Configure and verify BGP neighbor sessions on IOS routers
  hosts: core_routers
  gather_facts: false
  vars:
    # Credentials sourced from Ansible Vault — see group_vars/all/vault.yml
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_enable_password }}"
    bgp_local_as: "{{ hostvars[inventory_hostname]['bgp_local_as'] | default(65001) }}"
    bgp_session_wait_retries: 12
    bgp_session_wait_interval: 5
    bgp_neighbors:
      - peer_ip: 10.255.0.2
        remote_as: 65001
        description: "iBGP-to-core-rtr-02"
        update_source: Loopback0
      - peer_ip: 203.0.113.1
        remote_as: 65100
        description: "eBGP-to-ISP-A"
        update_source: GigabitEthernet0/0/0

  tasks:
    - name: Apply BGP neighbor configuration
      block:
        - name: Configure BGP peers under router bgp process
          cisco.ios.ios_config:
            parents: "router bgp {{ bgp_local_as }}"
            lines:
              - "neighbor {{ item.peer_ip }} remote-as {{ item.remote_as }}"
              - "neighbor {{ item.peer_ip }} description {{ item.description }}"
              - "neighbor {{ item.peer_ip }} update-source {{ item.update_source }}"
            match: line
          loop: "{{ bgp_neighbors }}"
          register: bgp_config_result

        - name: Persist configuration after successful BGP changes
          cisco.ios.ios_command:
            commands: "write memory"
          when: bgp_config_result.changed

      rescue:
        - name: Collect diagnostic output after config failure
          cisco.ios.ios_command:
            commands:
              - "show running-config | section router bgp"
              - "show ip bgp summary"
          register: bgp_diag
          ignore_errors: true

        - name: Display diagnostic output
          ansible.builtin.debug:
            msg: "{{ bgp_diag.stdout_lines | default(['No output collected']) }}"

        - name: Fail with actionable message
          ansible.builtin.fail:
            msg: >
              BGP configuration failed on {{ inventory_hostname }} —
              verify AS number ({{ bgp_local_as }}) and neighbor IP reachability.

    - name: Wait for BGP sessions to reach Established state
      cisco.ios.ios_command:
        commands: "show ip bgp neighbors {{ item.peer_ip }} | include BGP state"
        wait_for:
          - "result[0] contains 'BGP state = Established'"
        retries: "{{ bgp_session_wait_retries }}"
        interval: "{{ bgp_session_wait_interval }}"
      loop: "{{ bgp_neighbors }}"
      register: bgp_session_check

    - name: Retrieve full BGP summary for reporting
      cisco.ios.ios_command:
        commands:
          - "show ip bgp summary"
          - "show ip bgp neighbors | include BGP state|Description|remote AS|BGP version"
      register: bgp_final_report

    - name: Display BGP session report
      ansible.builtin.debug:
        msg: "BGP summary on {{ inventory_hostname }}:\n{{ bgp_final_report.stdout_lines | join('\n') }}