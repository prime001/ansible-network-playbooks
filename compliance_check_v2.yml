---
# BGP Session Compliance Check
# Verifies all expected BGP neighbors are in Established state and
# that received prefix counts fall within defined per-peer thresholds.
#
# Credentials: stored in Ansible Vault (group_vars/all/vault.yml)
#   vault_ansible_user: <device_username>
#   vault_ansible_password: <device_password>
#   vault_enable_password: <enable_secret>
#
# Inventory example (inventory/hosts.yml):
#   all:
#     children:
#       bgp_routers:
#         hosts:
#           core-rtr-01:
#             ansible_host: 10.0.0.1
#             bgp_peers:
#               - peer_ip: 192.168.1.1
#                 description: "ISP-Primary"
#                 min_prefixes: 100
#               - peer_ip: 192.168.2.1
#                 description: "Transit-B"
#                 min_prefixes: 5000
#         vars:
#           ansible_network_os: ios
#           ansible_connection: network_cli

- name: BGP Session Compliance Check
  hosts: bgp_routers
  gather_facts: false
  vars:
    ansible_user: "{{ vault_ansible_user }}"
    ansible_password: "{{ vault_ansible_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_enable_password }}"

  tasks:
    - name: Collect BGP data from device
      block:
        - name: Run show ip bgp summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
          register: bgp_summary_output
          retries: 2
          delay: 5
          until: bgp_summary_output is not failed

        - name: Check state of each expected BGP peer
          cisco.ios.ios_command:
            commands:
              - "show ip bgp neighbors {{ item.peer_ip }} | include BGP state|prefixes"
          loop: "{{ bgp_peers | default([]) }}"
          loop_control:
            label: "{{ item.description }} ({{ item.peer_ip }})"
          register: peer_state_results
          failed_when: false

      rescue:
        - name: Report data collection failure
          ansible.builtin.debug:
            msg: "Failed to collect BGP data from {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

        - name: Abort with descriptive error
          ansible.builtin.fail:
            msg: "BGP compliance check aborted on {{ inventory_hostname }} — connection or command failure"

    - name: Identify non-established BGP sessions
      ansible.builtin.set_fact:
        failed_peers: >-
          {{
            peer_state_results.results
            | selectattr('stdout', 'defined')
            | rejectattr('stdout', 'search', 'BGP state = Established')
            | map(attribute='item')
            | list
          }}

    - name: Display BGP summary table
      ansible.builtin.debug:
        msg: "{{ bgp_summary_output.stdout_lines[0] }}"

    - name: Report each non-compliant BGP session
      ansible.builtin.debug:
        msg: >-
          NON-COMPLIANT: {{ item.description }} ({{ item.peer_ip }})
          is not in Established state on {{ inventory_hostname }}
      loop: "{{ failed_peers }}"
      when: failed_peers | length > 0

    - name: Confirm full BGP compliance
      ansible.builtin.debug:
        msg: >-
          COMPLIANT: All {{ bgp_peers | default([]) | length }} BGP peers
          are Established on {{ inventory_hostname }}
      when: failed_peers | length == 0

    - name: Fail if any BGP peer is non-compliant
      ansible.builtin.fail:
        msg: >-
          {{ failed_peers | length }} BGP session(s) non-compliant on
          {{ inventory_hostname }}. Non-established peers:
          {{ failed_peers | map(attribute='peer_ip') | join(', ') }}
      when: failed_peers | length > 0