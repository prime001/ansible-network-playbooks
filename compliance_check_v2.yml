---
# qos_policy.yml
# Deploys QoS class maps, policy maps, and service policies on Cisco IOS WAN devices.
# Applies DSCP-based traffic classification and bandwidth guarantees on egress interfaces.
#
# Credentials: ansible-vault encrypted vars in group_vars/network/vault.yml
#   vault_network_user, vault_network_pass, vault_enable_pass
#
# Inventory example:
#   [wan_routers]
#   rtr-core-01 ansible_host=10.0.0.1
#   rtr-core-02 ansible_host=10.0.0.2
#
#   [wan_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_network_user }}
#   ansible_password={{ vault_network_pass }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_pass={{ vault_enable_pass }}

- name: Deploy QoS policies on Cisco IOS WAN devices
  hosts: wan_routers
  gather_facts: false

  vars:
    qos_voice_class: VOICE-EF
    qos_business_class: BUSINESS-AF
    qos_policy_name: WAN-EGRESS-POLICY
    qos_voice_bw_pct: 30
    qos_business_bw_pct: 40
    qos_egress_interface: GigabitEthernet0/0/1

  tasks:
    - name: Verify device is reachable and running IOS
      cisco.ios.ios_command:
        commands:
          - show version | include IOS
      register: ios_version_check
      retries: 3
      delay: 5
      until: ios_version_check is not failed

    - name: Capture pre-change policy state
      cisco.ios.ios_command:
        commands:
          - show policy-map {{ qos_policy_name }}
      register: pre_change_policy
      failed_when: false

    - name: Display pre-change policy state
      ansible.builtin.debug:
        msg: "Pre-change: {{ pre_change_policy.stdout[0] | default('No existing policy found') }}"

    - block:
        - name: Configure DSCP EF class map for voice
          cisco.ios.ios_config:
            lines:
              - class-map match-any {{ qos_voice_class }}
              - " match dscp ef"
              - " match dscp cs5"

        - name: Configure DSCP AF class map for business data
          cisco.ios.ios_config:
            lines:
              - class-map match-any {{ qos_business_class }}
              - " match dscp af31"
              - " match dscp af32"
              - " match dscp af33"

        - name: Build policy map with bandwidth guarantees
          cisco.ios.ios_config:
            lines:
              - policy-map {{ qos_policy_name }}
              - " class {{ qos_voice_class }}"
              - "  priority percent {{ qos_voice_bw_pct }}"
              - " class {{ qos_business_class }}"
              - "  bandwidth percent {{ qos_business_bw_pct }}"
              - " class class-default"
              - "  fair-queue"

        - name: Apply policy map to egress interface
          cisco.ios.ios_config:
            lines:
              - service-policy output {{ qos_policy_name }}
            parents: interface {{ qos_egress_interface }}

        - name: Write memory after successful deployment
          cisco.ios.ios_command:
            commands:
              - write memory
          register: save_result

      rescue:
        - name: Log failure details
          ansible.builtin.debug:
            msg: "QoS deployment failed on {{ inventory_hostname }} — manual review of 'show policy-map' required before retry"

        - name: Abort with descriptive error
          ansible.builtin.fail:
            msg: "QoS policy deployment failed on {{ inventory_hostname }}. Correct errors and re-run."

    - name: Verify policy applied to interface
      cisco.ios.ios_command:
        commands:
          - show policy-map interface {{ qos_egress_interface }}
          - show policy-map {{ qos_policy_name }}
      register: post_change_verify

    - name: Display post-deployment policy statistics
      ansible.builtin.debug:
        msg: "{{ post_change_verify.stdout[0] }}"

    - name: Assert policy map is present after deployment
      ansible.builtin.assert:
        that:
          - qos_policy_name in post_change_verify.stdout[1]
        fail_msg: "Policy {{ qos_policy_name }} missing from device output on {{ inventory_hostname }}"
        success_msg: "QoS policy {{ qos_policy_name }} confirmed on {{ inventory_hostname }}