No skill directly applies to writing a network automation playbook. Proceeding with the implementation.

The existing playbooks cover NTP, syslog, interfaces, backup, SNMP, users, ACLs, banners, facts, and generic compliance. I'll write a **BGP neighbor compliance** playbook — checking session state, prefix limits, MD5 authentication, and route policy enforcement, which is clearly distinct from everything already covered.

---

```yaml
---
# bgp_compliance.yml
# Audits BGP neighbor health, authentication, prefix limits, and route-policy
# enforcement on Cisco IOS/IOS-XE routers. Produces a per-host compliance
# verdict without making any configuration changes.
#
# Inventory example:
#   [bgp_routers]
#   rtr-core-01  ansible_host=10.0.0.1
#   rtr-core-02  ansible_host=10.0.0.2
#
#   [bgp_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}           # store in ansible-vault
#   ansible_password={{ vault_net_password }}   # store in ansible-vault
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}

- name: BGP Neighbor Compliance Audit
  hosts: bgp_routers
  gather_facts: false
  vars:
    bgp_non_established_pattern: "(Idle|Active|Connect|OpenSent|OpenConfirm)"
    compliance_fail_on_issues: false   # set true to hard-fail the play on violations

  tasks:

    - name: Collect BGP data from device
      block:

        - name: Show BGP summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
          register: bgp_summary
          retries: 3
          delay: 10
          until: bgp_summary is not failed

        - name: Show BGP neighbor detail
          cisco.ios.ios_command:
            commands:
              - show ip bgp neighbors
          register: bgp_neighbors
          retries: 2
          delay: 5
          until: bgp_neighbors is not failed

      rescue:
        - name: Record collection failure
          ansible.builtin.set_fact:
            bgp_audit_status: "ERROR"
            bgp_audit_notes: "Could not retrieve BGP data — check reachability and credentials"

        - name: Report collection failure
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }}: {{ bgp_audit_notes }}"

    - name: Evaluate BGP session state
      when: bgp_summary is defined and bgp_summary is not failed
      block:

        - name: Check for non-Established peers
          ansible.builtin.set_fact:
            bgp_session_ok: >-
              {{ not (bgp_summary.stdout[0] |
                 regex_search(bgp_non_established_pattern)) | bool }}

        - name: Check BGP MD5 authentication presence
          ansible.builtin.set_fact:
            bgp_auth_ok: >-
              {{ 'password' in bgp_neighbors.stdout[0] | lower }}

        - name: Check inbound route-map applied to at least one peer
          ansible.builtin.set_fact:
            bgp_policy_ok: >-
              {{ 'route-map' in bgp_neighbors.stdout[0] | lower }}

        - name: Check prefix-limit configured for at least one peer
          ansible.builtin.set_fact:
            bgp_prefix_limit_ok: >-
              {{ 'maximum-prefix' in bgp_neighbors.stdout[0] | lower }}

        - name: Compute overall compliance verdict
          ansible.builtin.set_fact:
            bgp_audit_status: >-
              {{ 'COMPLIANT' if (bgp_session_ok and bgp_auth_ok and
                 bgp_policy_ok and bgp_prefix_limit_ok) else 'NON-COMPLIANT' }}

    - name: Display BGP summary output
      ansible.builtin.debug:
        msg: "{{ bgp_summary.stdout_lines[0] }}"
      when: bgp_summary is defined and bgp_summary is not failed

    - name: Report compliance findings per check
      ansible.builtin.debug:
        msg:
          - "Host            : {{ inventory_hostname }}"
          - "Sessions OK     : {{ bgp_session_ok | default('N/A') }}"
          - "MD5 Auth OK     : {{ bgp_auth_ok | default('N/A') }}"
          - "Route Policy OK : {{ bgp_policy_ok | default('N/A') }}"
          - "Prefix Limit OK : {{ bgp_prefix_limit_ok | default('N/A') }}"
          - "Verdict         : {{ bgp_audit_status | default('UNKNOWN') }}"
      when: bgp_audit_status is defined

    - name: Fail play when violations found and strict mode is enabled
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }} BGP compliance check FAILED — see findings above"
      when:
        - compliance_fail_on_issues | bool
        - bgp_audit_status is defined
        - bgp_audit_status == "NON-COMPLIANT"
```