---
# Routing Protocol Compliance Check — BGP and OSPF Neighbor Validation
# Verifies that BGP peers are in Established state, OSPF adjacencies are FULL,
# and critical routes are present in the routing table.
#
# Inventory example:
#   [core_routers]
#   core-rtr-01  ansible_host=10.0.1.1
#   core-rtr-02  ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}             # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}      # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_pass }} # ansible-vault encrypted

- name: Routing Protocol Compliance — BGP and OSPF Neighbor Validation
  hosts: core_routers
  gather_facts: false

  vars:
    # Routes that must exist in the routing table — override per host in host_vars/
    required_routes:
      - "0.0.0.0"
      - "10.0.0.0"
    bgp_compliant: false
    ospf_compliant: false

  tasks:
    - name: Collect routing protocol state
      block:
        - name: Gather BGP IPv4 unicast summary
          cisco.ios.ios_command:
            commands:
              - show bgp ipv4 unicast summary
            wait_for:
              - result[0] contains "BGP"
            retries: 3
            interval: 10
          register: bgp_summary

        - name: Gather OSPF neighbor table
          cisco.ios.ios_command:
            commands:
              - show ip ospf neighbor detail
          register: ospf_neighbors

        - name: Verify required routes present
          cisco.ios.ios_command:
            commands: "{{ required_routes | map('regex_replace', '^(.*)$', 'show ip route \\1') | list }}"
          register: route_check
          failed_when: >
            route_check.stdout | select('search', '% Network not in table') | list | length > 0

      rescue:
        - name: Flag host as unreachable or error state
          ansible.builtin.debug:
            msg: >
              COMPLIANCE ERROR on {{ inventory_hostname }}:
              Task '{{ ansible_failed_task.name }}' failed — {{ ansible_failed_result.msg | default('no detail') }}

        - name: Abort remaining tasks for this host
          ansible.builtin.meta: end_host

    - name: Evaluate BGP Established state
      ansible.builtin.set_fact:
        bgp_compliant: "{{ 'Established' in bgp_summary.stdout[0] }}"

    - name: Evaluate OSPF FULL adjacency
      ansible.builtin.set_fact:
        ospf_compliant: "{{ 'FULL' in ospf_neighbors.stdout[0] }}"

    - name: Display BGP summary output
      ansible.builtin.debug:
        var: bgp_summary.stdout_lines

    - name: Display OSPF neighbor detail
      ansible.builtin.debug:
        var: ospf_neighbors.stdout_lines

    - name: Display required route lookup results
      ansible.builtin.debug:
        var: route_check.stdout_lines

    - name: Summarize compliance result per host
      ansible.builtin.debug:
        msg:
          - "=== ROUTING COMPLIANCE REPORT: {{ inventory_hostname }} ==="
          - "BGP Established neighbor present : {{ bgp_compliant }}"
          - "OSPF FULL adjacency present      : {{ ospf_compliant }}"
          - "All required routes present      : {{ route_check is not failed }}"

    - name: Fail if routing protocol compliance checks did not pass
      ansible.builtin.fail:
        msg: >
          {{ inventory_hostname }} is NON-COMPLIANT:
          BGP={{ bgp_compliant }}, OSPF={{ ospf_compliant }}.
          Review output above and investigate neighbor or route loss.
      when: not bgp_compliant or not ospf_compliant