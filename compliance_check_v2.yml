---
# routing_protocol_config.yml
# Configures OSPF process and neighbor adjacencies on Cisco IOS devices.
# Credentials sourced from Ansible Vault: ansible-vault encrypt_string '<pass>' --name 'ansible_password'
#
# Inventory example (inventory/network.yml):
# all:
#   children:
#     core_routers:
#       hosts:
#         rtr-core-01:
#           ansible_host: 192.168.1.1
#         rtr-core-02:
#           ansible_host: 192.168.1.2
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_net_user }}"
#         ansible_password: "{{ vault_net_password }}"
#         ansible_become: yes
#         ansible_become_method: enable
#         ansible_become_password: "{{ vault_enable_password }}"

- name: Configure OSPF routing protocol on IOS devices
  hosts: core_routers
  gather_facts: false

  vars:
    ospf_process_id: 1
    ospf_router_id: "{{ ansible_host }}"
    ospf_networks:
      - network: "10.0.0.0"
        wildcard: "0.0.0.255"
        area: 0
      - network: "192.168.0.0"
        wildcard: "0.0.255.255"
        area: 1
    ospf_passive_interfaces:
      - Loopback0
    ospf_dead_interval: 40
    ospf_hello_interval: 10

  tasks:
    - name: Push OSPF base configuration
      block:
        - name: Configure OSPF process and router-id
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ospf_router_id }}"
              - "auto-cost reference-bandwidth 10000"
            parents: "router ospf {{ ospf_process_id }}"
          register: ospf_base_result
          retries: 2
          delay: 5
          until: ospf_base_result is not failed

        - name: Advertise networks into OSPF
          cisco.ios.ios_config:
            lines:
              - "network {{ item.network }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_networks }}"
          register: ospf_network_result

        - name: Set passive interfaces
          cisco.ios.ios_config:
            lines:
              - "passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
          loop: "{{ ospf_passive_interfaces }}"

        - name: Tune OSPF hello/dead timers on active interfaces
          cisco.ios.ios_config:
            lines:
              - "ip ospf hello-interval {{ ospf_hello_interval }}"
              - "ip ospf dead-interval {{ ospf_dead_interval }}"
            parents: "interface {{ item }}"
          loop: "{{ ospf_active_interfaces | default([]) }}"
          when: ospf_active_interfaces is defined

      rescue:
        - name: Log OSPF configuration failure
          ansible.builtin.debug:
            msg: "OSPF configuration failed on {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('unknown error') }}"

        - name: Abort play for this host on unrecoverable error
          ansible.builtin.fail:
            msg: "Halting OSPF config on {{ inventory_hostname }} after rescue."

    - name: Verify OSPF neighbors came up
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip ospf
      register: ospf_verify
      retries: 3
      delay: 10
      until: "'FULL' in ospf_verify.stdout[0] or ospf_verify.stdout[0] == ''"

    - name: Display OSPF neighbor state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} OSPF neighbors:\n{{ ospf_verify.stdout[0] }}"

    - name: Fail if no FULL adjacencies found and neighbors were expected
      ansible.builtin.fail:
        msg: "No FULL OSPF adjacencies on {{ inventory_hostname }}"
      when:
        - ospf_require_neighbors | default(false)
        - "'FULL' not in ospf_verify.stdout[0]