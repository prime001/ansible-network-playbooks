---
# routing_security_compliance.yml
#
# Verifies routing protocol security posture across IOS routers:
#   - BGP peer MD5 authentication configured on all neighbors
#   - BGP maximum-prefix limits enforced
#   - BGP soft-reconfiguration inbound enabled
#   - OSPF area authentication configured
#   - OSPF passive-interface default set (minimize attack surface)
#
# Scope: complements existing compliance_check.yml (generic CIS/hardening).
#        This playbook focuses exclusively on routing protocol security —
#        not covered by interface, NTP, syslog, SNMP, user, ACL, banner,
#        config-backup, or the existing compliance check playbooks.
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.1.0.1
#   rtr-core-02  ansible_host=10.1.0.2
#
#   [edge_routers]
#   rtr-edge-01  ansible_host=10.2.0.1
#
#   [routers:children]
#   core_routers
#   edge_routers
#
#   [routers:vars]
#   ansible_user={{ vault_net_username }}           # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}       # ansible-vault encrypted
#   ansible_network_os=ios
#   ansible_become=true
#   ansible_become_method=enable
#   ansible_become_password={{ vault_net_enable }}  # ansible-vault encrypted

- name: Routing Protocol Security Compliance Check
  hosts: routers
  gather_facts: false

  vars:
    compliance_issues: []

  tasks:
    - name: Collect BGP running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | section router bgp
      register: bgp_cfg
      retries: 2
      delay: 5
      until: bgp_cfg is not failed
      ignore_errors: true

    - name: Collect OSPF running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | section router ospf
      register: ospf_cfg
      retries: 2
      delay: 5
      until: ospf_cfg is not failed
      ignore_errors: true

    - name: Collect BGP neighbor summary
      cisco.ios.ios_command:
        commands:
          - show bgp ipv4 unicast summary
      register: bgp_summary
      retries: 2
      delay: 5
      until: bgp_summary is not failed
      ignore_errors: true

    - name: Flag missing BGP MD5 peer authentication
      set_fact:
        compliance_issues: "{{ compliance_issues + ['BGP: MD5 peer authentication not configured'] }}"
      when:
        - bgp_cfg is not failed
        - "'neighbor' in bgp_cfg.stdout[0]"
        - "'password' not in bgp_cfg.stdout[0]"

    - name: Flag missing BGP maximum-prefix limits
      set_fact:
        compliance_issues: "{{ compliance_issues + ['BGP: maximum-prefix not set on all peers'] }}"
      when:
        - bgp_cfg is not failed
        - "'neighbor' in bgp_cfg.stdout[0]"
        - "'maximum-prefix' not in bgp_cfg.stdout[0]"

    - name: Flag missing BGP soft-reconfiguration inbound
      set_fact:
        compliance_issues: "{{ compliance_issues + ['BGP: soft-reconfiguration inbound not configured'] }}"
      when:
        - bgp_cfg is not failed
        - "'neighbor' in bgp_cfg.stdout[0]"
        - "'soft-reconfiguration' not in bgp_cfg.stdout[0]"

    - name: Flag missing OSPF area authentication
      set_fact:
        compliance_issues: "{{ compliance_issues + ['OSPF: area authentication not configured'] }}"
      when:
        - ospf_cfg is not failed
        - "'router ospf' in ospf_cfg.stdout[0]"
        - "'authentication' not in ospf_cfg.stdout[0]"

    - name: Flag missing OSPF passive-interface default
      set_fact:
        compliance_issues: "{{ compliance_issues + ['OSPF: passive-interface default not set'] }}"
      when:
        - ospf_cfg is not failed
        - "'router ospf' in ospf_cfg.stdout[0]"
        - "'passive-interface default' not in ospf_cfg.stdout[0]"

    - name: Display live BGP neighbor summary
      debug:
        var: bgp_summary.stdout_lines
      when:
        - bgp_summary is not failed
        - bgp_summary.stdout[0] | length > 0

    - name: Report routing security compliance result
      debug:
        msg:
          - "============================================"
          - "Host        : {{ inventory_hostname }}"
          - "Issues found: {{ compliance_issues | length }}"
          - "Details     : {{ compliance_issues if compliance_issues else ['PASS - no violations'] }}"
          - "============================================"

    - name: Fail if routing protocol security violations exist
      fail:
        msg: >-
          Routing security compliance FAILED on {{ inventory_hostname }}:
          {{ compliance_issues | join(' | ') }}
      when: compliance_issues | length > 0