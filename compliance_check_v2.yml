---
# Cisco IOS Security Hardening Compliance Check
#
# Verifies security hardening controls on IOS devices against CIS/DISA baseline:
#   - SSH v2 enforcement
#   - Password encryption service
#   - Unnecessary services disabled (finger, tcp/udp-small-servers, http)
#   - VTY timeout and transport restrictions
#   - Login delay and block-for thresholds
#
# Credentials: stored in Ansible Vault (ansible-vault encrypt_string)
#   ansible-vault create group_vars/all/vault.yml
#
# Inventory example:
#   [core_routers]
#   rtr-01 ansible_host=10.0.1.1
#   rtr-02 ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#   ansible_connection=network_cli

- name: Security Hardening Compliance Check
  hosts: core_routers
  gather_facts: false
  vars:
    compliance_checks:
      ssh_v2: "ip ssh version 2"
      service_password_encrypt: "service password-encryption"
      no_finger: "no service finger"
      no_http_server: "no ip http server"
      login_block: "login block-for"

  tasks:
    - name: Gather running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: running_config
      retries: 2
      delay: 5
      until: running_config is not failed

    - name: Check SSH version 2 enforcement
      ansible.builtin.set_fact:
        ssh_v2_compliant: "{{ 'ip ssh version 2' in running_config.stdout[0] }}"

    - name: Check password encryption service
      ansible.builtin.set_fact:
        password_encrypt_compliant: "{{ 'service password-encryption' in running_config.stdout[0] }}"

    - name: Check HTTP server disabled
      ansible.builtin.set_fact:
        http_disabled_compliant: "{{ 'no ip http server' in running_config.stdout[0] or 'ip http server' not in running_config.stdout[0] }}"

    - name: Check login block-for configured
      ansible.builtin.set_fact:
        login_block_compliant: "{{ 'login block-for' in running_config.stdout[0] }}"

    - name: Collect VTY line timeout settings
      cisco.ios.ios_command:
        commands:
          - show running-config | section line vty
      register: vty_config
      retries: 2
      delay: 5
      until: vty_config is not failed

    - name: Check VTY exec-timeout configured
      ansible.builtin.set_fact:
        vty_timeout_compliant: "{{ 'exec-timeout' in vty_config.stdout[0] }}"

    - name: Compile compliance report
      ansible.builtin.set_fact:
        compliance_report:
          device: "{{ inventory_hostname }}"
          timestamp: "{{ ansible_date_time.iso8601 | default('unknown') }}"
          checks:
            ssh_v2: "{{ ssh_v2_compliant }}"
            password_encryption: "{{ password_encrypt_compliant }}"
            http_server_disabled: "{{ http_disabled_compliant }}"
            login_block_for: "{{ login_block_compliant }}"
            vty_exec_timeout: "{{ vty_timeout_compliant }}"
          overall_pass: "{{ ssh_v2_compliant and password_encrypt_compliant and http_disabled_compliant and login_block_compliant and vty_timeout_compliant }}"

    - name: Display compliance results
      ansible.builtin.debug:
        var: compliance_report

    - name: Fail play if device is non-compliant
      ansible.builtin.fail:
        msg: "COMPLIANCE FAILURE on {{ inventory_hostname }} — review compliance_report above"
      when: not compliance_report.overall_pass
      ignore_errors: true