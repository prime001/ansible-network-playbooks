---
# routing_protocol_check.yml
#
# Verifies BGP and OSPF neighbor/adjacency health on Cisco IOS core routers.
# Detects peers not in Established/FULL state and flags stuck adjacencies.
#
# Inventory example:
#   [core_routers]
#   router1  ansible_host=10.0.1.1
#   router2  ansible_host=10.0.1.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}           # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}    # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#
# Usage:
#   ansible-playbook -i inventory/hosts routing_protocol_check.yml \
#     --vault-password-file ~/.vault_pass

- name: Routing Protocol Health Check — BGP and OSPF neighbor verification
  hosts: core_routers
  gather_facts: false

  vars:
    # Credentials from ansible-vault — never hardcode in playbooks
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_password: "{{ vault_enable_password }}"
    ospf_stuck_states: "INIT|EXSTART|EXCHANGE|LOADING"

  tasks:

    - name: Check BGP neighbor summary
      block:

        - name: Gather BGP summary from device
          cisco.ios.ios_command:
            commands:
              - show bgp summary
          register: bgp_summary
          retries: 2
          delay: 5
          until: bgp_summary is not failed

        - name: Flag BGP peers not in Established state
          ansible.builtin.assert:
            that:
              - "'Established' in bgp_summary.stdout[0]"
            fail_msg: "No BGP peers in Established state on {{ inventory_hostname }}"
            success_msg: "BGP neighbors verified on {{ inventory_hostname }}"
          ignore_errors: true

        - name: Display BGP summary
          ansible.builtin.debug:
            var: bgp_summary.stdout_lines[0]

      rescue:

        - name: Record BGP check failure
          ansible.builtin.debug:
            msg: >
              BGP check failed on {{ inventory_hostname }} — device may not run BGP
              or the command timed out after retries.

    - name: Check OSPF neighbor states
      block:

        - name: Gather OSPF neighbor details
          cisco.ios.ios_command:
            commands:
              - show ip ospf neighbor detail
          register: ospf_output
          retries: 2
          delay: 5
          until: ospf_output is not failed

        - name: Identify stuck OSPF adjacencies
          ansible.builtin.set_fact:
            ospf_stuck: "{{ ospf_output.stdout[0] | regex_findall('State:\\s+(' + ospf_stuck_states + ')') }}"

        - name: Alert on stuck OSPF adjacencies
          ansible.builtin.debug:
            msg: "ALERT: Stuck OSPF adjacency states detected on {{ inventory_hostname }}: {{ ospf_stuck }}"
          when: ospf_stuck | length > 0

        - name: Verify at least one OSPF neighbor is FULL
          ansible.builtin.assert:
            that:
              - "'FULL' in ospf_output.stdout[0]"
            fail_msg: "No OSPF neighbors in FULL state on {{ inventory_hostname }}"
            success_msg: "OSPF FULL adjacency confirmed on {{ inventory_hostname }}"
          ignore_errors: true
          failed_when: false

        - name: Display OSPF neighbor output
          ansible.builtin.debug:
            var: ospf_output.stdout_lines[0]

      rescue:

        - name: Record OSPF check failure
          ansible.builtin.debug:
            msg: >
              OSPF check failed on {{ inventory_hostname }} — device may not run OSPF
              or the command timed out after retries.

    - name: Routing protocol health summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "BGP data collected  : {{ bgp_summary is defined and (bgp_summary.failed is not defined or not bgp_summary.failed) }}"
          - "OSPF data collected : {{ ospf_output is defined and (ospf_output.failed is not defined or not ospf_output.failed) }}"
          - "Stuck OSPF states   : {{ ospf_stuck | default([]) }}