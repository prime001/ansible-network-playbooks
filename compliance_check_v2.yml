---
# routing_protocol_compliance.yml
#
# Audits routing protocol security posture on Cisco IOS routers:
#   - OSPF MD5 authentication on all active interfaces
#   - BGP neighbor password (MD5) enforcement
#   - Redistribution locked behind route-maps (no naked redistribute)
#
# Credentials: ansible-vault encrypted vars — see group_vars/network/vault.yml
# Usage:
#   ansible-playbook routing_protocol_compliance.yml \
#     -i inventory/network.ini --ask-vault-pass
#
# Inventory example (inventory/network.ini):
# [core_routers]
# rtr-core-01  ansible_host=10.0.1.1
# rtr-core-02  ansible_host=10.0.1.2
#
# [core_routers:vars]
# ansible_network_os=ios
# ansible_connection=network_cli
# ansible_user="{{ vault_net_user }}"
# ansible_password="{{ vault_net_password }}"
# ansible_become=yes
# ansible_become_method=enable
# ansible_become_password="{{ vault_net_enable }}"

- name: Routing Protocol Compliance Audit
  hosts: core_routers
  gather_facts: false

  vars:
    compliance_fail: false

  tasks:
    - name: Collect routing protocol data
      block:
        - name: Fetch OSPF interface auth state
          cisco.ios.ios_command:
            commands:
              - show ip ospf interface | include Authentication|Line
          register: ospf_auth_raw
          retries: 3
          delay: 5
          failed_when: >
            ospf_auth_raw.failed is defined and ospf_auth_raw.failed

        - name: Fetch BGP neighbor config
          cisco.ios.ios_command:
            commands:
              - show running-config | section ^router bgp
          register: bgp_config_raw
          retries: 3
          delay: 5
          failed_when: false

        - name: Fetch redistribution statements
          cisco.ios.ios_command:
            commands:
              - show running-config | include redistribute
          register: redist_raw
          retries: 3
          delay: 5
          failed_when: false

      rescue:
        - name: Log collection failure and abort host
          ansible.builtin.debug:
            msg: >
              [{{ inventory_hostname }}] Data collection failed — skipping
              compliance checks. Verify connectivity and credentials.
        - ansible.builtin.meta: end_host

    - name: Assert OSPF interfaces use MD5 authentication
      ansible.builtin.assert:
        that:
          - >
            ospf_auth_raw.stdout[0] | length == 0 or
            'Message digest' in ospf_auth_raw.stdout[0]
        success_msg: "PASS [{{ inventory_hostname }}]: OSPF MD5 authentication present"
        fail_msg: "FAIL [{{ inventory_hostname }}]: OSPF interface(s) missing MD5 auth"
      register: ospf_check
      ignore_errors: true

    - name: Assert BGP neighbors have MD5 password configured
      ansible.builtin.assert:
        that:
          - >
            bgp_config_raw.stdout[0] | length == 0 or
            'password' in bgp_config_raw.stdout[0]
        success_msg: "PASS [{{ inventory_hostname }}]: BGP neighbor passwords configured"
        fail_msg: "FAIL [{{ inventory_hostname }}]: BGP neighbor(s) missing MD5 password"
      register: bgp_check
      ignore_errors: true

    - name: Assert redistribution is guarded by route-maps
      ansible.builtin.assert:
        that:
          - >
            redist_raw.stdout[0] | length == 0 or
            'route-map' in redist_raw.stdout[0]
        success_msg: "PASS [{{ inventory_hostname }}]: All redistribution uses route-map guards"
        fail_msg: "FAIL [{{ inventory_hostname }}]: Unconstrained redistribution detected"
      register: redist_check
      ignore_errors: true

    - name: Display compliance summary
      ansible.builtin.debug:
        msg:
          - "=== Routing Protocol Compliance: {{ inventory_hostname }} ==="
          - "OSPF Auth : {{ 'PASS' if not ospf_check.failed else 'FAIL' }}"
          - "BGP Passwd: {{ 'PASS' if not bgp_check.failed else 'FAIL' }}"
          - "Redist Guard: {{ 'PASS' if not redist_check.failed else 'FAIL' }}"

    - name: Fail play if any control failed
      ansible.builtin.fail:
        msg: >
          Routing protocol compliance FAILED on {{ inventory_hostname }}.
          Review task output above and remediate before next audit window.
      when: ospf_check.failed or bgp_check.failed or redist_check.failed
