---
# ospf_config.yml
#
# Configures OSPF process ID, router-id, network advertisements, passive
# interfaces, and area 0 MD5 authentication on Cisco IOS routers.
#
# Prerequisites: ansible-galaxy collection install cisco.ios
# Credentials: store secrets in ansible-vault — see vault_net_* vars below
#
# Inventory example:
#   [core_routers]
#   r1  ansible_host=10.10.10.1
#   r2  ansible_host=10.10.10.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_password }}
#
# Usage: ansible-playbook ospf_config.yml -i inventory/network.yml --ask-vault-pass

- name: Configure OSPF Routing Protocol on Core Routers
  hosts: core_routers
  gather_facts: false
  vars:
    # ansible-vault encrypt_string 'admin' --name 'vault_net_user'
    ospf_process_id: 1
    ospf_reference_bandwidth: 10000
    ospf_area0_auth: true
    ospf_networks:
      - { prefix: "10.0.0.0",    wildcard: "0.0.255.255", area: 0 }
      - { prefix: "192.168.0.0", wildcard: "0.0.255.255", area: 1 }
    ospf_passive_interfaces:
      - GigabitEthernet0/2
      - Loopback0

  tasks:
    - name: Capture pre-change OSPF state
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip route ospf
      register: pre_change_state
      retries: 2
      delay: 5

    - name: Display pre-change OSPF neighbors and routes
      ansible.builtin.debug:
        msg: "{{ pre_change_state.stdout_lines }}"

    - name: Deploy OSPF configuration
      block:
        - name: Set OSPF global parameters
          cisco.ios.ios_config:
            lines:
              - "router-id {{ ansible_host }}"
              - "auto-cost reference-bandwidth {{ ospf_reference_bandwidth }}"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed

        - name: Advertise networks into OSPF areas
          cisco.ios.ios_config:
            lines:
              - "network {{ item.prefix }} {{ item.wildcard }} area {{ item.area }}"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed
          loop: "{{ ospf_networks }}"

        - name: Suppress OSPF hellos on stub interfaces
          cisco.ios.ios_config:
            lines:
              - "passive-interface {{ item }}"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed
          loop: "{{ ospf_passive_interfaces }}"

        - name: Enable MD5 authentication on backbone area
          cisco.ios.ios_config:
            lines:
              - "area 0 authentication message-digest"
            parents: "router ospf {{ ospf_process_id }}"
            save_when: changed
          when: ospf_area0_auth | bool

        - name: Verify OSPF process is active
          cisco.ios.ios_command:
            commands:
              - "show ip ospf | include Router ID"
          register: ospf_verify
          failed_when: "'Router ID' not in ospf_verify.stdout[0]"
          retries: 3
          delay: 10

      rescue:
        - name: Log OSPF deployment failure
          ansible.builtin.debug:
            msg: >
              OSPF configuration failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see device logs') }}

        - name: Halt play for this host
          ansible.builtin.fail:
            msg: "OSPF deployment failed on {{ inventory_hostname }} — manual review required"

    - name: Capture post-change OSPF state
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
          - show ip ospf interface brief
      register: post_change_state

    - name: Display post-change OSPF summary
      ansible.builtin.debug:
        msg:
          - "Device     : {{ inventory_hostname }}"
          - "Neighbors  : {{ post_change_state.stdout_lines[0] }}"
          - "Interfaces : {{ post_change_state.stdout_lines[1] }}"
