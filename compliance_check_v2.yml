---
# vlan_provisioning.yml
# Provisions VLANs on Cisco IOS/IOS-XE access and distribution switches,
# adds them to trunk interfaces, and verifies the VLAN database state.
# Credentials stored in Ansible Vault — see group_vars/all/vault.yml
#
# Inventory example:
#   [access_switches]
#   sw-access-01  ansible_host=10.0.1.11  ansible_network_os=ios
#   sw-access-02  ansible_host=10.0.1.12  ansible_network_os=ios
#
#   [distribution_switches]
#   sw-dist-01  ansible_host=10.0.1.1  ansible_network_os=ios
#
#   [switches:children]
#   access_switches
#   distribution_switches
#
# Run: ansible-playbook vlan_provisioning.yml -i inventory/switches.yml --ask-vault-pass

- name: Provision VLANs and verify trunk membership on Cisco IOS switches
  hosts: switches
  gather_facts: false
  connection: network_cli

  vars:
    ansible_user: "{{ vault_switch_user }}"
    ansible_password: "{{ vault_switch_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_enable_password }}"

    vlans_to_provision:
      - { vlan_id: 100, name: "CORP_DATA" }
      - { vlan_id: 200, name: "CORP_VOICE" }
      - { vlan_id: 300, name: "MGMT" }
      - { vlan_id: 400, name: "GUEST_WIFI" }

    trunk_interfaces:
      - GigabitEthernet0/1
      - GigabitEthernet0/2

  tasks:
    - name: Provision VLANs and validate trunk state
      block:
        - name: Configure VLAN database entries
          cisco.ios.ios_vlans:
            config:
              - vlan_id: "{{ item.vlan_id }}"
                name: "{{ item.name }}"
                state: active
            state: merged
          loop: "{{ vlans_to_provision }}"
          register: vlan_config_result
          retries: 2
          delay: 5
          until: vlan_config_result is not failed

        - name: Allow provisioned VLANs on trunk interfaces
          cisco.ios.ios_l2_interfaces:
            config:
              - name: "{{ item }}"
                trunk:
                  allowed_vlans: "{{ vlans_to_provision | map(attribute='vlan_id') | join(',') }}"
            state: merged
          loop: "{{ trunk_interfaces }}"

        - name: Collect VLAN database and trunk state for verification
          cisco.ios.ios_command:
            commands:
              - show vlan brief
              - show interfaces trunk
          register: vlan_verification
          failed_when:
            - vlan_verification.stdout[0] is not search("active")

      rescue:
        - name: Gather diagnostic state after failure
          cisco.ios.ios_command:
            commands:
              - show vlan brief
              - show version | include Version
          register: rescue_diag
          ignore_errors: true

        - name: Log provisioning failure details
          ansible.builtin.debug:
            msg:
              - "VLAN provisioning FAILED on {{ inventory_hostname }}"
              - "VLAN state at time of failure:"
              - "{{ rescue_diag.stdout[0] | default('output unavailable') }}"

        - name: Raise failure to stop further execution
          ansible.builtin.fail:
            msg: >
              VLAN provisioning failed on {{ inventory_hostname }}.
              Review rescue output above before retrying.

    - name: Report final VLAN database state
      ansible.builtin.debug:
        msg:
          - "=== VLAN Database: {{ inventory_hostname }} ==="
          - "{{ vlan_verification.stdout[0] }}"

    - name: Report trunk interface membership
      ansible.builtin.debug:
        msg:
          - "=== Active Trunks: {{ inventory_hostname }} ==="
          - "{{ vlan_verification.stdout[1] }}