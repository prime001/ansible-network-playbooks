---
# vlan_compliance_check.yml
#
# Audits VLAN policy compliance on Cisco IOS/IOS-XE access and distribution
# switches. Verifies required VLANs exist with expected names, the management
# SVI is operational, and trunk ports are not carrying unintended VLANs.
#
# Credentials are stored in Ansible Vault — decrypt at runtime:
#   ansible-playbook vlan_compliance_check.yml --ask-vault-pass
#   ansible-playbook vlan_compliance_check.yml --vault-password-file ~/.vault_pass
#
# Inventory example (inventory/hosts.yml):
# ---
# all:
#   children:
#     switches:
#       hosts:
#         sw-access-01:
#           ansible_host: 10.0.1.11
#         sw-dist-01:
#           ansible_host: 10.0.1.1
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_net_user }}"
#         ansible_password: "{{ vault_net_pass }}"
#         ansible_become: true
#         ansible_become_method: enable
#         ansible_become_pass: "{{ vault_enable_pass }}"

- name: VLAN Compliance Audit — Cisco IOS/IOS-XE
  hosts: switches
  gather_facts: false

  vars:
    required_vlans:
      - { id: "10", name: "MGMT" }
      - { id: "20", name: "SERVERS" }
      - { id: "30", name: "USERS" }
      - { id: "40", name: "VOICE" }
      - { id: "99", name: "NATIVE" }
    management_vlan: "10"
    unauthorized_vlans: ["1002", "1003", "1004", "1005"]

  tasks:
    - name: Collect VLAN and SVI state
      block:
        - name: Gather VLAN database and management SVI
          cisco.ios.ios_command:
            commands:
              - show vlan brief
              - "show interfaces vlan {{ management_vlan }}"
              - show interfaces trunk
          register: vlan_data
          retries: 2
          delay: 5
          until: vlan_data is not failed

      rescue:
        - name: Flag collection failure for this host
          ansible.builtin.set_fact:
            collection_failed: true

        - name: Warn on unreachable device
          ansible.builtin.debug:
            msg: "WARNING: Could not collect VLAN data from {{ inventory_hostname }} — skipping compliance checks"

    - name: Assert required VLANs are present
      ansible.builtin.assert:
        that:
          - "item.id in vlan_data.stdout[0]"
          - "item.name in vlan_data.stdout[0]"
        fail_msg: "FAIL [{{ inventory_hostname }}] VLAN {{ item.id }} ({{ item.name }}) missing or misnamed"
        success_msg: "PASS [{{ inventory_hostname }}] VLAN {{ item.id }} ({{ item.name }}) present"
      loop: "{{ required_vlans }}"
      when: collection_failed is not defined
      ignore_errors: true
      register: vlan_presence_results

    - name: Assert management SVI is line-protocol up
      ansible.builtin.assert:
        that:
          - "'line protocol is up' in vlan_data.stdout[1]"
        fail_msg: "FAIL [{{ inventory_hostname }}] Management SVI vlan{{ management_vlan }} is down"
        success_msg: "PASS [{{ inventory_hostname }}] Management SVI vlan{{ management_vlan }} is up"
      when: collection_failed is not defined
      ignore_errors: true
      register: svi_result

    - name: Assert legacy/default VLANs absent from trunk allowed list
      ansible.builtin.assert:
        that:
          - "item not in vlan_data.stdout[2]"
        fail_msg: "FAIL [{{ inventory_hostname }}] Unauthorized VLAN {{ item }} found in trunk output"
        success_msg: "PASS [{{ inventory_hostname }}] Unauthorized VLAN {{ item }} not active on trunks"
      loop: "{{ unauthorized_vlans }}"
      when: collection_failed is not defined
      ignore_errors: true
      register: trunk_results

    - name: Print per-device compliance summary
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "VLAN Compliance Report — {{ inventory_hostname }}"
          - "========================================="
          - "Required VLANs : {{ vlan_presence_results.results | selectattr('failed','equalto',false) | list | length }} passed / {{ vlan_presence_results.results | selectattr('failed','equalto',true) | list | length }} failed"
          - "Management SVI : {{ 'PASS' if not svi_result.failed | default(false) else 'FAIL' }}"
          - "Trunk hygiene  : {{ trunk_results.results | selectattr('failed','equalto',false) | list | length }} passed / {{ trunk_results.results | selectattr('failed','equalto',true) | list | length }} failed"
          - "Overall        : {{ 'NON-COMPLIANT' if (vlan_presence_results.results | selectattr('failed','equalto',true) | list | length > 0) or (svi_result.failed | default(false)) or (trunk_results.results | selectattr('failed','equalto',true) | list | length > 0) else 'COMPLIANT' }}"
      when: collection_failed is not defined

    - name: Dump raw VLAN table when failures detected
      ansible.builtin.debug:
        var: vlan_data.stdout_lines[0]
      when:
        - collection_failed is not defined
        - vlan_presence_results.results | selectattr('failed','equalto',true) | list | length > 0