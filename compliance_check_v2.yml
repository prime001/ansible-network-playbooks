---
# bgp_compliance.yml
# Verifies BGP neighbor state compliance on Cisco IOS/IOS-XE routers.
# Checks that all configured peers are Established, prefix counts meet
# defined minimums, and flags any non-compliant sessions for remediation.
#
# Credentials stored in Ansible Vault — encrypt with:
#   ansible-vault encrypt_string --vault-id prod@~/.vault-pass 'VALUE' --name 'vault_net_pass'
# Required vault vars: vault_net_user, vault_net_pass, vault_enable_pass
#
# Example inventory (inventory/hosts.yml):
# ---
# all:
#   children:
#     core_routers:
#       hosts:
#         core-rtr-01:
#           ansible_host: 10.0.1.1
#         core-rtr-02:
#           ansible_host: 10.0.1.2
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         bgp_min_neighbors: 2
#         bgp_min_prefixes: 50

- name: BGP Neighbor State Compliance Check
  hosts: core_routers
  gather_facts: false
  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_pass }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ vault_enable_pass }}"
    bgp_min_neighbors: "{{ bgp_min_neighbors | default(1) }}"
    bgp_min_prefixes: "{{ bgp_min_prefixes | default(0) }}"

  tasks:
    - name: Collect BGP summary and neighbor detail
      block:
        - name: Run BGP IPv4 unicast summary
          cisco.ios.ios_command:
            commands:
              - show bgp ipv4 unicast summary
          register: bgp_summary
          retries: 3
          delay: 10
          until: bgp_summary is not failed

        - name: Run BGP neighbor prefix detail
          cisco.ios.ios_command:
            commands:
              - show bgp ipv4 unicast neighbors | include BGP neighbor|Prefixes Current|BGP state
          register: bgp_neighbors
          retries: 2
          delay: 5
          until: bgp_neighbors is not failed

        - name: Parse non-established session states
          ansible.builtin.set_fact:
            non_established: >-
              {{ bgp_summary.stdout[0]
                 | regex_findall('(?m)^(\d{1,3}(?:\.\d{1,3}){3})\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+(Idle|Active|Connect|OpenSent|OpenConfirm)')
              }}
            established_count: >-
              {{ bgp_summary.stdout[0]
                 | regex_findall('(?m)^\d{1,3}(?:\.\d{1,3}){3}.+\d+\s+\d+$')
                 | length
              }}

        - name: Display raw BGP summary
          ansible.builtin.debug:
            msg: "{{ bgp_summary.stdout[0].splitlines() }}"

        - name: Display BGP neighbor prefix detail
          ansible.builtin.debug:
            msg: "{{ bgp_neighbors.stdout[0].splitlines() }}"

        - name: Assert minimum established neighbor count
          ansible.builtin.assert:
            that:
              - established_count | int >= bgp_min_neighbors | int
            fail_msg: >-
              FAIL {{ inventory_hostname }}: only {{ established_count }} Established
              neighbor(s); expected >= {{ bgp_min_neighbors }}
            success_msg: >-
              PASS {{ inventory_hostname }}: {{ established_count }} Established
              neighbor(s) meets minimum of {{ bgp_min_neighbors }}

        - name: Assert no non-established sessions exist
          ansible.builtin.assert:
            that:
              - non_established | length == 0
            fail_msg: >-
              FAIL {{ inventory_hostname }}: non-Established BGP sessions detected:
              {{ non_established | map(attribute=0) | list | join(', ') }}
            success_msg: "PASS {{ inventory_hostname }}: all BGP sessions are Established"

      rescue:
        - name: Log collection or assertion failure
          ansible.builtin.debug:
            msg: >-
              ERROR on {{ inventory_hostname }}: {{ ansible_failed_task.name }}
              — {{ ansible_failed_result.msg | default(ansible_failed_result.stdout_lines | default(['no detail']) | last) }}

        - name: Fail the play for this host
          ansible.builtin.fail:
            msg: "BGP compliance check did not pass for {{ inventory_hostname }}