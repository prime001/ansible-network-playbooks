---
# Cisco IOS SSH and AAA Hardening Compliance Check
#
# Validates SSH v2-only transport, AAA new-model, password encryption,
# idle session timeouts, and management-plane attack-surface reduction.
# Complements compliance_check.yml (NTP/syslog/ACL/banner/SNMP checks).
#
# Inventory example:
#   [core_routers]
#   rtr-core-01  ansible_host=10.0.0.1
#   rtr-core-02  ansible_host=10.0.0.2
#
#   [core_routers:vars]
#   ansible_network_os=ios
#   ansible_connection=network_cli
#   ansible_user={{ vault_net_user }}             # see group_vars/all/vault.yml
#   ansible_password={{ vault_net_password }}
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_become_password={{ vault_enable_secret }}

- name: IOS SSH and AAA Hardening Compliance Check
  hosts: core_routers
  gather_facts: false

  tasks:
    - name: Collect SSH version and AAA/service configuration
      block:
        - name: Run compliance data collection commands
          cisco.ios.ios_command:
            commands:
              - show ip ssh
              - show running-config | include ^(aaa new-model|service password-encryption|service tcp-small|service udp-small)
              - show running-config | section ^line vty
          register: compliance_data
          retries: 2
          delay: 5
          until: compliance_data is not failed

      rescue:
        - name: Report data collection failure
          ansible.builtin.debug:
            msg: "Cannot collect compliance data from {{ inventory_hostname }}: {{ ansible_failed_result.msg }}"

        - name: Abort compliance checks for unreachable host
          ansible.builtin.fail:
            msg: "Halting checks for {{ inventory_hostname }} — collection failed."

    - name: Assert SSH version 2 is enforced
      ansible.builtin.assert:
        that: "'version 2' in compliance_data.stdout[0]"
        fail_msg: "[FAIL] {{ inventory_hostname }}: SSH v2 not enforced — downgrade attack risk."
        success_msg: "[PASS] {{ inventory_hostname }}: SSH version 2 confirmed."
      register: chk_ssh_v2
      ignore_errors: true

    - name: Assert AAA new-model is enabled
      ansible.builtin.assert:
        that: "'aaa new-model' in compliance_data.stdout[1]"
        fail_msg: "[FAIL] {{ inventory_hostname }}: AAA new-model absent — legacy auth active."
        success_msg: "[PASS] {{ inventory_hostname }}: AAA new-model enabled."
      register: chk_aaa
      ignore_errors: true

    - name: Assert service password-encryption is active
      ansible.builtin.assert:
        that: "'service password-encryption' in compliance_data.stdout[1]"
        fail_msg: "[FAIL] {{ inventory_hostname }}: Passwords stored in cleartext — enable service password-encryption."
        success_msg: "[PASS] {{ inventory_hostname }}: Password encryption active."
      register: chk_pwd_enc
      ignore_errors: true

    - name: Assert tcp-small-servers and udp-small-servers are disabled
      ansible.builtin.assert:
        that:
          - "'service tcp-small-servers' not in compliance_data.stdout[1]"
          - "'service udp-small-servers' not in compliance_data.stdout[1]"
        fail_msg: "[FAIL] {{ inventory_hostname }}: Minor TCP/UDP services must be explicitly disabled."
        success_msg: "[PASS] {{ inventory_hostname }}: Minor TCP/UDP services not running."
      register: chk_small_svc
      ignore_errors: true

    - name: Assert VTY lines enforce exec-timeout
      ansible.builtin.assert:
        that: "'exec-timeout' in compliance_data.stdout[2]"
        fail_msg: "[FAIL] {{ inventory_hostname }}: No exec-timeout on VTY lines — idle session exposure."
        success_msg: "[PASS] {{ inventory_hostname }}: VTY exec-timeout configured."
      register: chk_vty_timeout
      ignore_errors: true

    - name: Build per-host compliance report
      ansible.builtin.set_fact:
        compliance_report:
          host: "{{ inventory_hostname }}"
          checks:
            ssh_v2:         "{{ 'PASS' if not chk_ssh_v2.failed      else 'FAIL' }}"
            aaa_new_model:  "{{ 'PASS' if not chk_aaa.failed         else 'FAIL' }}"
            pwd_encryption: "{{ 'PASS' if not chk_pwd_enc.failed     else 'FAIL' }}"
            minor_services: "{{ 'PASS' if not chk_small_svc.failed   else 'FAIL' }}"
            vty_timeout:    "{{ 'PASS' if not chk_vty_timeout.failed else 'FAIL' }}"

    - name: Display compliance report
      ansible.builtin.debug:
        var: compliance_report

    - name: Fail play if any control failed
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }} has compliance violations — review report above."
      when: >
        chk_ssh_v2.failed or chk_aaa.failed or
        chk_pwd_enc.failed or chk_small_svc.failed or
        chk_vty_timeout.failed