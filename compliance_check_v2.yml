---
# Ansible Playbook: Network Device Routing Protocol Validation
# Purpose: Validate OSPF and BGP neighbor health, verify routing table integrity,
#          and ensure critical routes are reachable across managed network devices
# Portfolio Use: Demonstrates network validation, multi-vendor support, error handling
#
# Inventory Example (inventory/devices.yml):
#   [cisco_ios]
#   router1 ansible_host=10.0.1.1 device_type=cisco_ios
#   router2 ansible_host=10.0.1.2 device_type=cisco_ios
#   
#   [cisco_iosxr]
#   xr_router ansible_host=10.0.2.1 device_type=cisco_iosxr
#   
#   [all:vars]
#   ansible_connection=network_cli
#   ansible_network_os=ios  # or iosxr, nxos, junos based on device
#   ansible_user={{ vault_network_user }}
#   ansible_password={{ vault_network_password }}

- name: Network Device Routing Protocol Compliance Validation
  hosts: all
  gather_facts: no
  vars:
    min_ospf_neighbors: 2
    min_bgp_neighbors: 1
    validation_retries: 3
    retry_delay: 5

  tasks:
    - name: Retrieve OSPF neighbor status
      ios_command:
        commands:
          - "show ip ospf neighbor"
      register: ospf_output
      retries: "{{ validation_retries }}"
      delay: "{{ retry_delay }}"
      failed_when: false
      changed_when: false

    - name: Count OSPF neighbors in FULL state
      set_fact:
        ospf_full_count: "{{ ospf_output.stdout[0] | regex_findall('FULL') | length }}"
      when: ospf_output.rc == 0

    - name: Validate OSPF neighbor count meets minimum threshold
      assert:
        that:
          - ospf_full_count | int >= min_ospf_neighbors
        fail_msg: "OSPF: Found {{ ospf_full_count }} FULL neighbors, minimum required: {{ min_ospf_neighbors }}"
        success_msg: "OSPF neighbor validation passed with {{ ospf_full_count }} FULL neighbors"
      when: ospf_output.rc == 0
      rescue:
        - name: Alert on OSPF validation failure
          debug:
            msg: "WARNING: {{ inventory_hostname }} OSPF neighbor count below threshold"

    - name: Retrieve BGP neighbor summary
      ios_command:
        commands:
          - "show ip bgp summary"
      register: bgp_output
      retries: "{{ validation_retries }}"
      delay: "{{ retry_delay }}"
      failed_when: false
      changed_when: false

    - name: Count BGP established neighbors
      set_fact:
        bgp_established_count: "{{ bgp_output.stdout[0] | regex_findall('Established') | length }}"
      when: bgp_output.rc == 0

    - name: Validate BGP neighbor establishment threshold
      assert:
        that:
          - bgp_established_count | int >= min_bgp_neighbors
        fail_msg: "BGP: Found {{ bgp_established_count }} established neighbors, minimum required: {{ min_bgp_neighbors }}"
        success_msg: "BGP neighbor validation passed with {{ bgp_established_count }} established neighbors"
      when: bgp_output.rc == 0
      rescue:
        - name: Alert on BGP validation failure
          debug:
            msg: "WARNING: {{ inventory_hostname }} BGP neighbor count below threshold"

    - name: Retrieve routing table summary
      ios_command:
        commands:
          - "show ip route summary"
      register: route_output
      retries: "{{ validation_retries }}"
      delay: "{{ retry_delay }}"
      failed_when: false
      changed_when: false

    - name: Display routing validation report
      debug:
        msg: |
          ========================================
          Device Routing Validation Report
          Device: {{ inventory_hostname }}
          OSPF FULL Neighbors: {{ ospf_full_count | default('N/A') }}
          BGP Established Neighbors: {{ bgp_established_count | default('N/A') }}
          Route Retrieval Status: {{ route_output.rc == 0 | ternary('SUCCESS', 'FAILED') }}
          Overall Status: {{ (ospf_full_count | default(0) | int >= min_ospf_neighbors and bgp_established_count | default(0) | int >= min_bgp_neighbors) | ternary('HEALTHY', 'DEGRADED') }}
          ========================================

    - name: Archive validation results to local report
      copy:
        content: |
          Device: {{ inventory_hostname }}
          OSPF_Full_Neighbors: {{ ospf_full_count | default('0') }}
          BGP_Established_Neighbors: {{ bgp_established_count | default('0') }}
          Validation_Status: {{ (ospf_full_count | default(0) | int >= min_ospf_neighbors) | ternary('PASS', 'FAIL') }}
        dest: "/tmp/routing_validation_{{ inventory_hostname }}.log"
      delegate_to: localhost
      become: no
