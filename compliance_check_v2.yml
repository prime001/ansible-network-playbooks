---
# ssh_crypto_compliance.yml
#
# Audits SSH version enforcement and RSA host-key strength on Cisco IOS devices
# against CIS IOS Benchmark v4.1 controls:
#   - 1.4.1  SSH protocol version 2 only
#   - 1.4.2  RSA host key >= 2048 bits
#   - 1.4.3  VTY lines restrict transport to SSH
#
# Credentials sourced from Ansible Vault:
#   ansible-vault create group_vars/network_devices/vault.yml
#   vault contents:
#     vault_ansible_user: netadmin
#     vault_ansible_password: <secret>
#     vault_ansible_become_password: <enable_secret>
#
# Inventory example (inventory/hosts.yml):
# ---
# all:
#   children:
#     network_devices:
#       hosts:
#         core-sw-01:
#           ansible_host: 192.168.1.1
#         dist-rtr-01:
#           ansible_host: 192.168.1.254
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_ansible_user }}"
#         ansible_password: "{{ vault_ansible_password }}"
#         ansible_become: true
#         ansible_become_method: enable
#         ansible_become_password: "{{ vault_ansible_become_password }}"
#
# Usage:
#   ansible-playbook ssh_crypto_compliance.yml -i inventory/hosts.yml --ask-vault-pass

- name: SSH and Crypto Key Hardening Compliance Audit
  hosts: network_devices
  gather_facts: false
  vars:
    min_rsa_bits: 2048
    audit_failures: []

  tasks:
    - name: Collect SSH and crypto posture
      block:
        - name: Run SSH and crypto show commands
          cisco.ios.ios_command:
            commands:
              - show ip ssh
              - show crypto key mypubkey rsa
              - show running-config | section line vty
          register: audit_output
          retries: 2
          delay: 5
          until: audit_output is not failed

        - name: Flag SSH version 1 or SSH disabled
          ansible.builtin.set_fact:
            audit_failures: "{{ audit_failures + ['SSH not restricted to version 2 (CIS 1.4.1)'] }}"
          when: "'version 2' not in audit_output.stdout[0] | lower"

        - name: Extract RSA key size from crypto output
          ansible.builtin.set_fact:
            rsa_key_size: "{{ audit_output.stdout[1] | regex_search('(\\d{3,4}) bit', '\\1') | first | int }}"
          when: audit_output.stdout[1] | regex_search('\\d{3,4} bit')

        - name: Flag insufficient RSA key length
          ansible.builtin.set_fact:
            audit_failures: "{{ audit_failures + ['RSA key ' + rsa_key_size | string + ' bits < ' + min_rsa_bits | string + ' required (CIS 1.4.2)'] }}"
          when:
            - rsa_key_size is defined
            - rsa_key_size | int < min_rsa_bits

        - name: Flag missing RSA host key
          ansible.builtin.set_fact:
            audit_failures: "{{ audit_failures + ['No RSA host key detected — run: crypto key generate rsa modulus 2048 (CIS 1.4.2)'] }}"
          when: not audit_output.stdout[1] | regex_search('\\d{3,4} bit')

        - name: Flag VTY transport not restricted to SSH
          ansible.builtin.set_fact:
            audit_failures: "{{ audit_failures + ['VTY transport input not limited to ssh (CIS 1.4.3)'] }}"
          when: "'transport input ssh' not in audit_output.stdout[2]"

      rescue:
        - name: Mark device unreachable in audit results
          ansible.builtin.set_fact:
            audit_failures: "{{ audit_failures + ['COLLECTION ERROR — verify connectivity and credentials'] }}"

        - name: Log collection failure
          ansible.builtin.debug:
            msg: "Could not collect data from {{ inventory_hostname }} — skipping crypto checks"

    - name: Display raw command output
      ansible.builtin.debug:
        var: audit_output.stdout_lines
      when: audit_output is defined and audit_output is not failed

    - name: Print per-device compliance result
      ansible.builtin.debug:
        msg: >-
          [{{ inventory_hostname }}] SSH/Crypto Compliance:
          {{ 'PASS' if audit_failures | length == 0 else 'FAIL — ' + audit_failures | join(' | ') }}

    - name: Fail play when violations detected
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }}: {{ audit_failures | length }} violation(s) — {{ audit_failures | join(', ') }}"
      when: audit_failures | length > 0