---
# 025_bgp_neighbor_check.yml
#
# BGP Neighbor State Verification
# Validates BGP peer adjacencies across IOS, IOS-XR, and NX-OS devices.
# Reports sessions not in ESTABLISHED state and fails the play if any
# critical peers are down.
#
# Inventory example:
#   [bgp_routers]
#   core-rtr-01  ansible_host=10.0.1.1  ansible_network_os=ios
#   core-rtr-02  ansible_host=10.0.1.2  ansible_network_os=iosxr
#   spine-sw-01  ansible_host=10.0.2.1  ansible_network_os=nxos
#
#   [bgp_routers:vars]
#   ansible_user={{ vault_net_user }}          # ansible-vault encrypted
#   ansible_password={{ vault_net_password }}   # ansible-vault encrypted
#   ansible_become=yes
#   ansible_become_method=enable
#   ansible_connection=network_cli
#
# Usage:
#   ansible-playbook -i inventory/prod.ini 025_bgp_neighbor_check.yml \
#     --vault-password-file ~/.vault_pass \
#     --limit core_routers

- name: BGP Neighbor State Verification
  hosts: bgp_routers
  gather_facts: false
  vars:
    # Minimum acceptable peers per device — alert if established count drops below
    min_established_peers: 1
    bgp_check_retries: 3
    bgp_check_delay: 10

  tasks:
    - name: Query BGP summary — IOS
      cisco.ios.ios_command:
        commands: show bgp all summary
      register: bgp_summary_ios
      retries: "{{ bgp_check_retries }}"
      delay: "{{ bgp_check_delay }}"
      until: bgp_summary_ios is not failed
      when: ansible_network_os == "ios"
      ignore_errors: false

    - name: Query BGP summary — IOS-XR
      cisco.iosxr.iosxr_command:
        commands: show bgp all all summary
      register: bgp_summary_iosxr
      retries: "{{ bgp_check_retries }}"
      delay: "{{ bgp_check_delay }}"
      until: bgp_summary_iosxr is not failed
      when: ansible_network_os == "iosxr"

    - name: Query BGP summary — NX-OS
      cisco.nxos.nxos_command:
        commands: show bgp all summary
      register: bgp_summary_nxos
      retries: "{{ bgp_check_retries }}"
      delay: "{{ bgp_check_delay }}"
      until: bgp_summary_nxos is not failed
      when: ansible_network_os == "nxos"

    - name: Consolidate BGP output into single fact
      ansible.builtin.set_fact:
        bgp_raw_output: >-
          {{
            (bgp_summary_ios.stdout | default(['']))[0]
            if ansible_network_os == 'ios'
            else (bgp_summary_iosxr.stdout | default(['']))[0]
            if ansible_network_os == 'iosxr'
            else (bgp_summary_nxos.stdout | default(['']))[0]
          }}

    - name: Check for non-established BGP sessions
      block:
        - name: Flag peers not in Established/ESTAB state
          ansible.builtin.set_fact:
            non_established_lines: >-
              {{
                bgp_raw_output.splitlines()
                | select('match', '^\d{1,3}(\.\d{1,3}){3}')
                | reject('search', ' [0-9]+\s*$')
                | list
              }}

        - name: Count established sessions
          ansible.builtin.set_fact:
            established_count: >-
              {{
                bgp_raw_output.splitlines()
                | select('match', '^\d{1,3}(\.\d{1,3}){3}')
                | select('search', ' [0-9]+\s*$')
                | list
                | length
              }}

        - name: Display BGP peer summary
          ansible.builtin.debug:
            msg:
              - "Host          : {{ inventory_hostname }}"
              - "OS            : {{ ansible_network_os }}"
              - "Established   : {{ established_count }}"
              - "Problem peers : {{ non_established_lines | length }}"
              - "Detail        : {{ non_established_lines if non_established_lines else ['All peers established'] }}"

        - name: Fail if established peer count is below threshold
          ansible.builtin.fail:
            msg: >
              COMPLIANCE FAIL — {{ inventory_hostname }} has only {{ established_count }}
              established BGP session(s); minimum required is {{ min_established_peers }}.
              Non-established peers: {{ non_established_lines }}
          failed_when: established_count | int < min_established_peers | int

      rescue:
        - name: Record compliance failure for reporting
          ansible.builtin.debug:
            msg: "BGP compliance check FAILED on {{ inventory_hostname }} — see above for details."

        - name: Re-raise failure so play outcome reflects the error
          ansible.builtin.fail:
            msg: "BGP neighbor check failed on {{ inventory_hostname }}."