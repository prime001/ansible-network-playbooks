---
# BGP Session Compliance Check
# Validates BGP peer state, MD5 authentication, and outbound route-map policy
# on IOS/IOS-XE routers. Designed to run as a scheduled compliance gate before
# maintenance windows or as part of a daily audit cron job.
#
# Inventory example (inventory/routers.yml):
#   all:
#     children:
#       routers:
#         hosts:
#           core-rtr-01:
#             ansible_host: 10.0.0.1
#             ansible_network_os: ios
#             bgp_local_as: 65001
#             bgp_expected_neighbors:
#               - peer_ip: 10.0.0.2
#                 peer_as: 65002
#               - peer_ip: 10.0.0.3
#                 peer_as: 65003
#           core-rtr-02:
#             ansible_host: 10.0.0.2
#             ansible_network_os: ios
#             bgp_local_as: 65001
#             bgp_expected_neighbors:
#               - peer_ip: 10.0.0.1
#                 peer_as: 65001
#         vars:
#           ansible_connection: network_cli
#           ansible_user: "{{ vault_net_user }}"       # group_vars/all/vault.yml
#           ansible_password: "{{ vault_net_password }}"
#           ansible_become: true
#           ansible_become_method: enable
#           ansible_become_pass: "{{ vault_enable_pass }}"

- name: BGP Session Compliance Check
  hosts: routers
  gather_facts: false
  vars:
    # Credentials sourced from Ansible Vault — never hardcode
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_become_pass: "{{ vault_enable_pass }}"
    compliance_passed: true

  tasks:
    - name: Retrieve BGP summary with retry on transient SSH failure
      cisco.ios.ios_command:
        commands:
          - show bgp ipv4 unicast summary
      register: bgp_summary
      retries: 3
      delay: 10
      until: not bgp_summary.failed
      changed_when: false

    - name: Display BGP summary for audit record
      ansible.builtin.debug:
        var: bgp_summary.stdout_lines

    - name: Run per-neighbor compliance checks
      block:
        - name: Query each expected BGP neighbor
          cisco.ios.ios_command:
            commands:
              - "show bgp neighbors {{ item.peer_ip }}"
          loop: "{{ bgp_expected_neighbors }}"
          register: bgp_neighbor_detail
          changed_when: false

        - name: Assert session is Established for each neighbor
          ansible.builtin.assert:
            that:
              - "'BGP state = Established' in item.stdout[0]"
            fail_msg: >-
              [FAIL] {{ inventory_hostname }}: neighbor {{ item.item.peer_ip }}
              (AS {{ item.item.peer_as }}) is not in Established state.
            success_msg: >-
              [PASS] {{ inventory_hostname }}: neighbor {{ item.item.peer_ip }} Established.
          loop: "{{ bgp_neighbor_detail.results }}"
          loop_control:
            label: "{{ item.item.peer_ip }}"

        - name: Assert MD5 authentication is configured per neighbor
          ansible.builtin.assert:
            that:
              - "'password' in item.stdout[0]"
            fail_msg: >-
              [FAIL] {{ inventory_hostname }}: neighbor {{ item.item.peer_ip }}
              is missing MD5 authentication — session vulnerable to spoofing.
            success_msg: >-
              [PASS] {{ inventory_hostname }}: neighbor {{ item.item.peer_ip }}
              has MD5 authentication configured.
          loop: "{{ bgp_neighbor_detail.results }}"
          loop_control:
            label: "{{ item.item.peer_ip }}"

        - name: Assert outbound route-map policy is applied per neighbor
          ansible.builtin.assert:
            that:
              - "'Route map for outgoing' in item.stdout[0]"
            fail_msg: >-
              [FAIL] {{ inventory_hostname }}: neighbor {{ item.item.peer_ip }}
              has no outbound route-map — unfiltered prefix advertisement risk.
            success_msg: >-
              [PASS] {{ inventory_hostname }}: neighbor {{ item.item.peer_ip }}
              has outbound route-map applied.
          loop: "{{ bgp_neighbor_detail.results }}"
          loop_control:
            label: "{{ item.item.peer_ip }}"

      rescue:
        - name: Mark host as non-compliant
          ansible.builtin.set_fact:
            compliance_passed: false

        - name: Report compliance failure details
          ansible.builtin.debug:
            msg: >-
              COMPLIANCE FAILURE on {{ inventory_hostname }}:
              One or more BGP checks failed. Verify peer state, MD5 auth,
              and outbound route-map policy before the next maintenance window.

    - name: Emit final compliance status per host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} BGP compliance result:
          {{ 'PASSED' if compliance_passed else 'FAILED — remediation required' }}