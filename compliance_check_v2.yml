---
# BGP Neighbor Status Verification and Health Check Playbook
# Purpose: Verify BGP neighbor connectivity, session stability, and route exchange across multi-vendor devices
# Supports: Cisco IOS, IOS-XE, NX-OS, Arista EOS
# Inventory Example:
# [bgp_routers]
# router1 ansible_host=10.0.0.1 ansible_network_os=ios
# router2 ansible_host=10.0.0.2 ansible_network_os=nxos
# spine1 ansible_host=10.0.0.3 ansible_network_os=eos

- name: BGP Neighbor Status Verification and Health Check
  hosts: bgp_routers
  gather_facts: no
  vars:
    # Device credentials - reference ansible-vault in production
    # ansible_user: !vault |
    # ansible_password: !vault |
    ansible_become: yes
    ansible_become_method: enable
    max_retries: 3
    retry_delay: 2

  tasks:
    - name: Gather BGP summary from IOS/IOS-XE devices
      ios_command:
        commands:
          - "show ip bgp summary"
          - "show ip bgp neighbors | include State"
          - "show ip route bgp | include B"
      register: bgp_ios
      when: ansible_network_os in ['ios', 'iosxe']
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      until: bgp_ios is not failed

    - name: Gather BGP summary from NX-OS devices
      nxos_command:
        commands:
          - "show bgp all summary"
          - "show bgp all neighbors | include State"
          - "show ip route bgp"
      register: bgp_nxos
      when: ansible_network_os == 'nxos'
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      until: bgp_nxos is not failed

    - name: Gather BGP summary from Arista EOS devices
      eos_command:
        commands:
          - "show ip bgp summary"
          - "show ip bgp neighbors | include State"
          - "show ip route bgp"
      register: bgp_eos
      when: ansible_network_os == 'eos'
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"
      until: bgp_eos is not failed

    - name: Consolidate BGP data
      set_fact:
        bgp_summary: "{{ bgp_ios if ansible_network_os in ['ios', 'iosxe'] else (bgp_nxos if ansible_network_os == 'nxos' else bgp_eos) }}"

    - name: Display BGP status
      debug:
        msg:
          - "=== BGP Status: {{ inventory_hostname }} ==="
          - "Platform: {{ ansible_network_os | upper }}"
          - "BGP Summary:"
          - "{{ bgp_summary.stdout[0] | default('No data') }}"
          - "\nNeighbor States:"
          - "{{ bgp_summary.stdout[1] | default('No neighbors') }}"
          - "\nBGP Routes:"
          - "{{ bgp_summary.stdout[2] | default('No routes') }}"

    - name: Check for BGP neighbor failures
      fail:
        msg: "BGP neighbor down detected on {{ inventory_hostname }}"
      when: "'Down' in bgp_summary.stdout | join('\n') or 'Idle' in bgp_summary.stdout | join('\n')"

    - name: Generate BGP health report
      copy:
        content: |
          BGP Neighbor Health Report
          Device: {{ inventory_hostname }}
          OS: {{ ansible_network_os }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          
          --- BGP SUMMARY ---
          {{ bgp_summary.stdout[0] }}
          
          --- NEIGHBOR STATUS ---
          {{ bgp_summary.stdout[1] }}
          
          --- ROUTE COUNT ---
          {{ bgp_summary.stdout[2] }}
        dest: "bgp_reports/{{ inventory_hostname }}_bgp_health.txt"
      delegate_to: localhost
      changed_when: false

  rescue:
    - name: Log BGP gathering failure
      debug:
        msg: "Failed to gather BGP data from {{ inventory_hostname }}: {{ ansible_failed_result.msg | default('Unknown error') }}"

    - name: Continue on error
      set_fact:
        bgp_check_failed: true

- name: Generate BGP Verification Summary
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Summarize BGP verification
      debug:
        msg:
          - "BGP Neighbor verification completed"
          - "Status reports saved to bgp_reports/ directory"
          - "Review each device report for neighbor status and route counts