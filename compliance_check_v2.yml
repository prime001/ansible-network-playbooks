---
# BGP Neighbor Compliance Check
# Validates BGP session states, expected AS peers, and prefix-limit headroom on IOS routers.
# A non-Established neighbor or missing BGP process marks the host non-compliant.
#
# Inventory example (inventory/routers.yml):
# ---
# all:
#   children:
#     core_routers:
#       hosts:
#         core-rtr-01:
#           ansible_host: 10.0.1.1
#         core-rtr-02:
#           ansible_host: 10.0.1.2
#       vars:
#         ansible_network_os: ios
#         ansible_connection: network_cli
#         ansible_user: "{{ vault_net_username }}"       # ansible-vault encrypted
#         ansible_password: "{{ vault_net_password }}"   # ansible-vault encrypted
#         ansible_become: true
#         ansible_become_method: enable
#         ansible_become_pass: "{{ vault_enable_pass }}" # ansible-vault encrypted
#
# Run: ansible-playbook bgp_compliance_check.yml -i inventory/ --ask-vault-pass

- name: BGP Neighbor Compliance Check
  hosts: core_routers
  gather_facts: false

  vars:
    bgp_non_compliant_states:
      - "Idle"
      - "Active"
      - "Connect"
      - "OpenSent"
      - "OpenConfirm"
    host_compliant: true

  tasks:
    - name: Collect BGP session data
      block:
        - name: Retrieve BGP neighbor summary
          cisco.ios.ios_command:
            commands:
              - show ip bgp summary
          register: bgp_summary
          retries: 3
          delay: 10
          until: bgp_summary is not failed

        - name: Retrieve per-neighbor detail
          cisco.ios.ios_command:
            commands:
              - show ip bgp neighbors
          register: bgp_neighbors

      rescue:
        - name: Flag collection failure
          ansible.builtin.set_fact:
            host_compliant: false
            collection_error: "BGP data unreachable after retries"

        - name: Report collection failure
          ansible.builtin.debug:
            msg: "FAIL [{{ inventory_hostname }}] {{ collection_error }}"

    - name: Assert BGP process is running
      ansible.builtin.assert:
        that:
          - "'BGP not active' not in bgp_summary.stdout[0]"
          - "'% No BGP process' not in bgp_summary.stdout[0]"
        fail_msg: "FAIL [{{ inventory_hostname }}] BGP process is not running"
        success_msg: "PASS [{{ inventory_hostname }}] BGP process confirmed active"
      when: collection_error is not defined

    - name: Detect non-Established neighbors
      ansible.builtin.set_fact:
        host_compliant: false
      loop: "{{ bgp_non_compliant_states }}"
      when:
        - collection_error is not defined
        - item in bgp_summary.stdout[0]

    - name: Display BGP summary output
      ansible.builtin.debug:
        msg: "{{ bgp_summary.stdout_lines[0] }}"
      when: collection_error is not defined

    - name: Emit final compliance verdict
      ansible.builtin.debug:
        msg: >-
          {% if host_compliant %}
          PASS [{{ inventory_hostname }}] All BGP neighbors in Established state
          {% else %}
          FAIL [{{ inventory_hostname }}] One or more BGP neighbors not Established — remediation required
          {% endif %}
      when: collection_error is not defined

    - name: Fail play when host is non-compliant
      ansible.builtin.fail:
        msg: "BGP compliance check FAILED on {{ inventory_hostname }}"
      when:
        - collection_error is not defined
        - not host_compliant